global:
  scrape_interval: 5s
rule_files:
  - /etc/prometheus/alerts/*.yml
scrape_configs:
  - job_name: valoria-api
    metrics_path: /metrics
    # SPEC-221: em perfis DB defina RPG_METRICS_TOKEN e descomente:
    # authorization:
    #   credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["host.docker.internal:8000"]
