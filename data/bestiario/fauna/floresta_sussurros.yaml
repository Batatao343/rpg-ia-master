# SPEC-370 R1 (lote 3) — bloco de fauna da Floresta dos Sussurros: 25 fichas da SPEC-349 + legado
# `valoria` da região. Mesmo contrato da SPEC-360 §3.2; compilado em data/world/fauna.json por
# scripts/fauna/build.py. Sinal é vestígio, nunca a criatura: quem nomeia é o encontro.
# E18: 2 `imediato` no hub (Sombra Deitada e Abafador de Candeias).
# Revisão de fauna: handoffs/SPEC-370-independent-review.md (lote 3; revisor ≠ autor).
regiao: floresta_sussurros
criaturas:
  # ============================== CORPOS REESCRITOS ==============================
  mon_lixado_da_fronteira:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [fs_fronteira_xylos]
      permanencia: [8, 11]
      reage:
        - {quando: "clima:neblina", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Um fio de poeira cinza e fina no chão de folhas, contínuo como o de saco furado, que volta sempre ao mesmo trecho."
      resto: "Uma couraça de couro com a marca de dois tocos apertados no peito, e no lugar deles o couro virado pó."
      som: "Um chiado seco, de areia escorrendo, que acompanha passos arrastados entre os troncos."
      cheiro: "Pó de pedra e osso moído, seco, como de oficina de quem lapida mármore."
      marca: "Num tronco da borda seca, a casca alisada numa curva macia do lado esquerdo, como se algo a tivesse gastado ao passar."
      aproximacao: "Um homem gasto de um lado só, ombro e costelas terminando numa curva lisa de pó cinza, estende dois tocos sem dedos para o seu escudo."
      rumor: "um lenhador conta que depois da névoa da borda o machado do irmão virou poeira na mão dele"
    contra_jogo: "Manter distância ou largar o escudo antes que vire pó; depois de alguns agarrões os tocos chegam aos punhos e ele não segura mais nada."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_abafador_de_candeias:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [floresta_sussurros]
      permanencia: [7, 10]
    sinais:
      antecedencia: imediato
      rastro: "Riscos fundos de unha descendo um tronco de cabeça para baixo, que acabam na altura de um homem em pé."
      resto: "Uma lanterna de viagem esmagada contra algo macio, o vidro inteiro, o pavio sufocado em fiapos pretos."
      som: null
      cheiro: "Pavio abafado e feltro morno, como de casaco que alguém usou para apagar uma vela."
      marca: "Em volta do lugar de uma fogueira, os troncos lisos de cima a baixo, sem musgo, de tanto algo subir e descer neles."
      aproximacao: "A sua chama apaga de repente contra um peito de feltro preto, e um rosto liso sem olhos, de orelhas em concha, está colado ao seu."
      rumor: "os carvoeiros da floresta acendem fogo só no chão aberto, e com duas tochas, nunca uma"
    contra_jogo: "Lutar com a luz no chão, longe de quem combate, ou com duas luzes; reacender logo devolve a mira, e sem luz para seguir ele se guia pelo ouvido."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_fechado_de_escapulas:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [floresta_sussurros]
      permanencia: [9, 12]
    sinais:
      antecedencia: cedo
      rastro: "Pegadas pesadas de alguém de braços curtos que anda até um ferido e para de frente para ele, sempre o mesmo passo."
      resto: "Uma lâmina partida contra algo liso e branco, a ponta lascada em leque, caída junto a um ferido que sobreviveu."
      som: "Um estalo grave de duas placas se encontrando, como portas de armário fechando de uma vez."
      cheiro: "Osso limpo e músculo exposto, um cheiro de açougue lavado."
      marca: "Entre as raízes, uma depressão rasa do tamanho de um homem agachado, cercada de musgo raspado em arco."
      aproximacao: "Entre as raízes, uma pedra clara se abre em duas placas de osso, e entre elas um homem de antebraços grossos se ergue diante do ferido."
      rumor: "um caçador diz que mirou num bicho ferido e a flecha bateu numa pedra que antes não estava ali"
    contra_jogo: "Esperar que ele abra para bater e golpear o músculo entre as placas; ou ir primeiro, pelo lado, em quem ele protege, antes que ele chegue lá."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_virado_do_avesso:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [floresta_sussurros]
      permanencia: [7, 10]
      foge_de: [mon_dedos_de_colheita]
    sinais:
      antecedencia: cedo
      rastro: "Pegadas de pés sem unha, molhadas de vermelho, que andam sem rumo e deixam cada folha pisada grudenta."
      resto: "Uma bolsa de colhedor aberta e vazia, com pó vermelho espalhado e marcas de dedos em carne viva no couro."
      som: "Um gemido baixo a cada passo, sempre igual, como de quem pisa numa ferida a cada vez."
      cheiro: "Pó de sonho doce misturado a gemido de febre, um cheiro de enfermaria de viciados."
      marca: "Num tronco, uma mancha rosada na altura de um ombro, como se alguém em carne viva tivesse se encostado ali para descansar."
      aproximacao: "Gemendo, vem um corpo com o músculo por fora, vermelho e úmido, as pálpebras viradas para trás e os tendões brancos à vista."
      rumor: "uma colhedora jura que viu um colega comer da mancha escura e, no dia seguinte, ele estava com a carne para fora"
    contra_jogo: "Bater uma vez por rodada, forte, ou deixá-lo uma rodada sem golpe para que se acalme; fogo e frio nos nervos à flor o fazem encolher e perder a rodada."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_calado_das_guelras:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [floresta_sussurros, fs_fronteira_xylos]
      permanencia: [6, 9]
    sinais:
      antecedencia: cedo
      rastro: "Calcanhares duros de pés descalços, três ou quatro, que correm juntos direto para onde alguém parou para recuperar o fôlego."
      resto: "Um viajante caído de joelhos, como quem ficou sem ar, com marcas de unhas duras de várias mãos nas costas."
      som: "Um silêncio de bando, sem passo, e só um ofegar molhado de fendas abrindo e fechando."
      cheiro: "Pele seca de boca nenhuma e um ar úmido de peixe fora d'água."
      marca: "Na beira da trilha, uma pedra de beber onde ninguém bebe, só as bordas marcadas de pescoço encostado de lado."
      aproximacao: "Sem nenhum som, três magros de boca selada correm para quem arfa mais, e no pescoço deles se abrem fendas de bordas vermelhas."
      rumor: "os guias da floresta mandam respirar devagar nas subidas: dizem que lá tem quem escute o cansaço"
    contra_jogo: "Não deixar ninguém chegar ao fim do Fôlego quando eles estão perto, ou pôr o mais cansado atrás de quem aguenta; as fendas do pescoço são moles, e um golpe ali os derruba."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  # ============================== BESTAS DA ENTROPIA ==============================
  enemy_aranha_lobo:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [floresta_sussurros]
      permanencia: [6, 9]
      foge_de: [mon_vespa_coveira, mon_picanco_de_espinheiro]
    sinais:
      antecedencia: cedo
      rastro: "Marcas de pouso afastadas na terra fofa, de dez em dez passos, cada uma com dois furinhos de antena na frente."
      resto: "Uma perna de grilo enorme, branca e translúcida, arrancada e largada num oco de raiz."
      som: "Um tique de mola soltando, depois outro do lado oposto, e um cri-cri grave no oco da madeira."
      cheiro: "Raiz podre e quitina mole, um bafo frio que sai dos ocos como de adega esquecida."
      marca: "Na boca de um oco de raiz, a terra fina toda riscada por antenas compridas, como quem varreu com pincel."
      aproximacao: "Das raízes salta um bicho branco do tamanho de um cão, translúcido, sem olhos, e as mandíbulas de poda já fecham perto de você."
      rumor: "os lenhadores encostam as costas num tronco antes de descansar, para não serem mordidos de trás"
    contra_jogo: "Ficar de costas para um tronco ou para outro do grupo; um corte nas antenas e ele salta às cegas, para qualquer lado."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  enemy_urso_coruja_mutante:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer]
      territorio: [fs_fronteira_xylos]
      permanencia: [8, 11]
      foge_de: [mon_onca_vazada]
    sinais:
      antecedencia: cedo
      rastro: "Pegadas de três dedos grossos, maiores que de homem, com um furo estreito e reto ao lado de cada uma, como de adaga fincada."
      resto: "Um viajante chutado de cima para baixo, com um único furo largo de unha atravessando a couraça."
      som: "Um ronco grave e oco, de garganta de ave grande, e o baque de pés pesados que saltam."
      cheiro: "Pena dura molhada e terra pisada, como de galinheiro de bicho enorme."
      marca: "Num tronco da borda, a casca rasgada em riscos verticais à altura de um chute, um sobre o outro."
      aproximacao: "Uma ave do tamanho de um homem, de penas pretas como crina e osso cobrindo os olhos, salta e chuta com uma unha de adaga."
      rumor: "os batedores da borda ficam parados quando ouvem o ronco, e quem corre é quem volta mancando"
    contra_jogo: "Ficar parado quando ela está perto e deixar outro se mexer; ela não vê, e o elmo pesado a desequilibra quando erra o chute."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_ent_dormindo:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [floresta_sussurros]
      permanencia: [10, 12]
    sinais:
      antecedencia: cedo
      rastro: "Um caminho reto e antigo atravessando a mata densa, de árvores empurradas para os lados, como se algo grande passasse por ali há eras."
      resto: "Um caçador achado apertado contra um tronco, a couraça amassada por três garras curvas, como num abraço."
      som: "Uma respiração lenta e funda de bicho muito grande, tão espaçada que parece parar."
      cheiro: "Bolor de pelo antigo e folha podre, como de tapete velho esquecido no mato."
      marca: "Numa árvore grossa do caminho, a casca gasta lisa até a altura de um cavalo, como encosto de quem dorme em pé."
      aproximacao: "Encostado a uma árvore, um bicho maior que um boi, de pelo cinza-esverdeado cheio de folhas, abre três garras do tamanho de um braço sem abrir os olhos."
      rumor: "os velhos dizem que na floresta há um caminho de antes das árvores, e que ainda tem quem o use"
    contra_jogo: "Rodear o caminho, em silêncio; ele é lento e não persegue. Quem foi puxado se solta cortando os tendões dos dedos, por baixo das garras."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_morcego_rasteiro:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [floresta_sussurros]
      permanencia: [6, 9]
      presas: [mon_mariposa_sussurro]
      foge_de: [mon_serpente_raiz]
    sinais:
      antecedencia: cedo
      rastro: "Na terra úmida, marcas de punhos dobrados e de pés de unha curva, em bando, que sobem pelos troncos."
      resto: "Asas de mariposa grandes, ainda com desenhos, cortadas por dentes finos e largadas embaixo de um oco alto."
      som: "Estalos de língua miúdos e incessantes, que se juntam num tique-tique de muitos e vêm na direção do barulho."
      cheiro: "Guano azedo e couro fino de asa, um cheiro de forro de telhado velho."
      marca: "Ao pé de um oco alto, um monte de guano escuro e pedacinhos de asa, numa camada que range sob a bota."
      aproximacao: "Pelo tronco descem bichos do tamanho de gatos, de conchas rosadas enormes dobradas nas costas, e um deles gruda em você estalando alto."
      rumor: "os caçadores da floresta enrolam as fivelas em pano: dizem que lá dentro o metal batendo chama coisa"
    contra_jogo: "Arrancar e matar o que está grudado antes que o resto chegue; ou lutar em silêncio, sem metal batendo, e ele não acha quem marcar."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_besouro_do_estalo:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [floresta_sussurros, fs_fronteira_xylos]
      permanencia: [6, 9]
      foge_de: [mon_lagarta_de_visgo]
    sinais:
      antecedencia: cedo
      rastro: "No chão de folhas, círculos úmidos e escaldados, do tamanho de uma roda, deixados onde não havia fogo."
      resto: "Uma bota com o couro cozido e enrugado em volta do tornozelo, largada no meio de um anel de folhas murchas."
      som: "Um estouro seco como porta batida, e muito depois, no mesmo lugar, um chiado de água jogada em brasa."
      cheiro: "Vapor ácido e folha cozida, um cheiro de panela de ferver couro."
      marca: "Em vários troncos baixos, manchas pardas de queimadura de vapor espirradas de baixo para cima."
      aproximacao: "Um bicho preto de cabeça vermelha do tamanho de um cão pequeno vira o traseiro para você, e o estouro vem antes do jato."
      rumor: "um colhedor diz que na floresta é preciso sair de onde se ouviu o estouro, e não de onde veio o vapor"
    contra_jogo: "Sair do chão marcado assim que ouvir o estalo; virá-lo de costas expõe o ventre mole, e as bolsas se esgotam depois de alguns disparos."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_onca_vazada:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer]
      territorio: [fs_fronteira_xylos]
      permanencia: [7, 10]
      presas: [enemy_urso_coruja_mutante]
      foge_de: [mon_olho_de_petala]
    sinais:
      antecedencia: imediato
      rastro: "Pegadas de felino grande que somem nos trechos de luz e sombra, como se o bicho ficasse leve onde a luz cai em pedaços."
      resto: "Uma ave grande de pescoço quebrado por uma mordida só, arrastada para debaixo de um arbusto."
      som: null
      cheiro: "Pelo de gato grande e sangue fresco, um almíscar quente que o vento não leva."
      marca: "Na terra de baixo das copas, manchas de luz que não batem com os buracos das folhas lá em cima."
      aproximacao: "A sombra manchada salta: um felino grande de pelo furado de lado a lado, e por um dos furos você vê o coração dela batendo."
      rumor: "os batedores da borda dizem que onde a luz cai em pedaços a sombra também caça"
    contra_jogo: "Luz inteira, sem manchas, de fogo alto ou clareira; e o coração fica à vista num dos furos do flanco."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_lagarta_de_visgo:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [floresta_sussurros]
      permanencia: [7, 10]
      presas: [mon_besouro_do_estalo]
      foge_de: [mon_picanco_de_espinheiro]
      reage:
        - {quando: "clima:chuva", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Debaixo das folhas mortas, um túnel raso e úmido, com marcas de patinhas grossas a cada palmo."
      resto: "Dois caçadores colados ombro a ombro por uma cola branca e dura, e mordidas de dois ganchos nas pernas."
      som: "Um esguicho fino e úmido, como de seringa apertada, e o estalar da cola secando."
      cheiro: "Cola de peixe e folha molhada, um cheiro grudento de oficina de encadernador."
      marca: "Entre dois troncos próximos, fios brancos endurecidos em leque, colando um ao outro na altura das pernas."
      aproximacao: "Das folhas ergue a cabeça um verme aveludado e cinza-azulado, e de dois tubos da cabeça sai um leque de cola branca."
      rumor: "os lenhadores andam espaçados no mato baixo: dizem que lá dentro quem anda junto fica junto"
    contra_jogo: "Não andar ombro a ombro perto das folhas; fogo ou água quente amolecem a cola, e ela demora a refazer a reserva depois do primeiro leque."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_toldo_das_clareiras:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde]
      territorio: [floresta_sussurros]
      permanencia: [3, 4]
      presas: [mon_bugio_invertido]
    sinais:
      antecedencia: cedo
      rastro: null
      resto: "No centro de um espaço aberto, uma mochila e um chapéu caídos lado a lado, e a terra amassada num círculo largo, sem pegada saindo."
      som: "Um bater surdo e enorme de pele no ar, como de vela de navio caindo sobre um convés."
      cheiro: "Couro de asa morno e musgo de copa, um cheiro de sótão fechado no alto das árvores."
      marca: "Nos galhos das bordas de um espaço aberto, a casca arrancada em sulcos curvos de unhas compridas, em volta de todo o círculo."
      aproximacao: "O céu do espaço aberto cai: uma pele escura do tamanho de uma vela de navio desce inteira sobre você, e uma cabeça pequena de dentes em pente morde."
      rumor: "os guias dizem que na floresta não se atravessa espaço aberto pelo meio, por mais que pareça a saída"
    contra_jogo: "Não atravessar clareira pelo centro; a membrana é fina, quem cortar por dentro abre caminho para os outros, e as bordas presas aos galhos são o ponto fraco."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_vespa_coveira:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      estacoes: {verao: 1.3, inverno: 0.5}
      territorio: [floresta_sussurros, fs_fronteira_xylos]
      permanencia: [7, 10]
      presas: [enemy_aranha_lobo]
      reage:
        - {quando: "carcaca_recente", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Um arrasto leve e reto no chão de folhas, como de corpo puxado pelo tornozelo, que termina num buraco recém-fechado."
      resto: "Um grilo branco do tamanho de um cão, imóvel e vivo, com um furo de ferrão no pescoço, deitado junto a uma cova aberta."
      som: "Um zumbido grave, de asa grande, que passa baixo entre os troncos e não tem pressa."
      cheiro: "Terra cavada de fresco e veneno amargo, como de raiz de mandioca brava."
      marca: "No chão da floresta, montes de terra fofa enfileirados, cada um do tamanho de um corpo, e um furo no topo."
      aproximacao: "Entre os troncos voa baixo um inseto de ferrão do tamanho de um cão de caça, de asas cor de ferrugem, e as antenas batem no seu sangue."
      rumor: "um caçador diz que achou o companheiro enterrado vivo, mole, e com uma coisa crescendo dentro"
    contra_jogo: "Proteger quem está sangrando e ir nela quando arrasta, que é quando voa baixo e devagar; as asas rasgam fácil."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_bugio_invertido:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer]
      territorio: [floresta_sussurros]
      permanencia: [7, 10]
      foge_de: [mon_toldo_das_clareiras]
    sinais:
      antecedencia: cedo
      rastro: null
      resto: "Um viajante caído de costas na frente de uma trilha, quebrado como quem despencou de muito alto, sem árvore acima dele."
      som: "Um farfalhar de bando na copa, de baixo para cima, e uma garganta que incha sem soltar o uivo."
      cheiro: "Pelo ruivo e fruta mastigada, um cheiro de macaco que vem do alto."
      marca: "Na face de baixo dos galhos grossos, tufos de pelo ruivo presos de pé, e frutas roídas grudadas por baixo, sem cair."
      aproximacao: "Da face de baixo de um galho desce um braço ruivo e comprido, agarra o seu colarinho e solta, e você cai para cima."
      rumor: "os guias põem o mais forte no fim da fila na floresta: dizem que é por lá que somem os viajantes"
    contra_jogo: "Andar junto, sem ninguém sozinho no fim da fila; um golpe na cauda o faz largar o galho, e ele mesmo cai para cima, para longe da luta."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  # ======================== HUMANOS QUE PAGARAM O PREÇO ========================
  mon_dedos_de_colheita:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [floresta_sussurros]
      permanencia: [7, 10]
      suprime: [mon_virado_do_avesso]
      reage:
        - {quando: "pressao:fome", efeito: mais}
    sinais:
      antecedencia: cedo
