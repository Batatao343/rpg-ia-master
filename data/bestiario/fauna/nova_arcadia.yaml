# SPEC-360 R1 — bloco de fauna de Nova Arcádia: 27 fichas da SPEC-349 + legado `valoria` da região.
# Fonte única de ecologia, sinais e contra-jogo para o runtime (compilado em data/world/fauna.json
# por scripts/fauna/build.py). Sinal é vestígio, nunca a criatura: quem nomeia é o encontro (R5).
# Revisão de fauna: handoffs/SPEC-360-fauna-review-nova_arcadia.md (revisor ≠ autor).
regiao: nova_arcadia
criaturas:
  # ============================== CORPOS REESCRITOS ==============================
  mon_arame_vivo:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      estacoes: {outono: 1.3, primavera: 1.2, verao: 0.7}
      territorio: [na_anel_lama]
      permanencia: [3, 5]
      presas: [enemy_rato_peste_anel_lama]
      reage:
        - {quando: "clima:chuva", efeito: mais}
        - {quando: "pressao:praga", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Dois sulcos finos e paralelos riscam a lama da viela, como se alguém arrastasse fio de cerca."
      resto: "Num vão de porta, um trapo duro de sangue seco, preso num laço de fio enferrujado."
      som: "Um rangido de metal velho vem da viela ao lado, ritmado como passos que não têm pressa."
      cheiro: "Ferrugem molhada e, por baixo, o adocicado de ferida que não fecha."
      marca: null
      aproximacao: "Da chuva sai um homem dobrado ao contrário, as costas eriçadas de fios que riscam a lama atrás dele."
      rumor: "uma lavadeira jura que ouviu metal rangendo atrás da casa dela a noite inteira"
    contra_jogo: "Manter distância e cortar o arame antes que feche; sem contato, não drena nada e cai depressa."
    tramas: []
    autor: opus
    revisao: pendente

  mon_fole_de_costela:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [na_anel_ferro]
      permanencia: [4, 6]
      reage:
        - {quando: "pressao:praga", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: null
      resto: "Uma mancha de fuligem em leque no muro, ainda morna, como se alguém tivesse tossido brasa."
      som: "Um chiado longo de ar entrando e saindo, e no fim dois apitos finos, como nariz entupido."
      cheiro: "Fuligem quente e pano molhado de suor, mais forte do que a fumaça normal da rua."
      marca: "Num poste, um lenço de operário encharcado e preto, amarrado na altura do rosto."
      aproximacao: "Na fumaça mais densa, um operário de peito aberto em leque infla devagar, e o ar em volta esquenta."
      rumor: "um foguista diz que tem um colega que ainda bate o ponto e não respira mais pelo nariz"
    contra_jogo: "Fechar a distância pelo lado e golpear o fole quando ele infla; esvaziado, não sopra."
    tramas: []
    autor: opus
    revisao: pendente

  mon_rosario_de_vertebras:
    fonte: ficha
    ecologia:
      horario: [Noite, Amanhecer]
      territorio: [na_anel_lama]
      permanencia: [3, 6]
      presas: [enemy_rato_peste_anel_lama]
      reage:
        - {quando: "clima:chuva", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Na margem do canal, uma faixa de lodo amassada em ondas regulares, sem pegada nenhuma."
      resto: "Uma farpa de osso cinza, curva como espinho, cravada num tronco boiando."
      som: "Estalos secos debaixo d'água, um atrás do outro, como contas batendo num cordão."
      cheiro: null
      marca: "Um rato morto na margem com uma só mordida funda, e uma lasca branca ainda presa na ferida."
      aproximacao: "A água do canal se ergue em gomos: uma corrente de juntas cinzentas, com um crânio de dentes dobrados na ponta."
      rumor: "um barqueiro conta que algo mordeu a perna do filho na margem e a ferida ainda puxa para o rio"
    contra_jogo: "Arrancar a farpa (gastar a ação) ou sair da água, onde ele é lento e as vértebras expõem as juntas."
    tramas: []
    autor: opus
    revisao: pendente

  mon_fila_de_grilhoes:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [na_anel_ferro]
      permanencia: [5, 8]
    sinais:
      antecedencia: cedo
      rastro: "Um arrasto largo e desencontrado no pó do pátio, de muitos pés que não pisam juntos."
      resto: "Um rolo de contrato rasgado e pisado, enfiado num elo partido de corrente."
      som: "Corrente arrastando no pátio e, de vez em quando, várias vozes sussurrando a mesma palavra."
      cheiro: null
      marca: "No portão do pátio, a tinta das marcas de dívida foi raspada por dentro, à altura do pescoço."
      aproximacao: "Do fundo do pátio vem uma fileira de troncos soldados pelos ombros, e todas as cabeças viram juntas para você."
      rumor: "um escrivão do Mercado jura que ninguém tira papel do pátio dos fundos desde que os acorrentados pararam de andar"
    contra_jogo: "Quebrar um elo (as juntas entre dois corpos são o ponto fraco) e lutar de longe; ela não larga o pátio."
    tramas: []
    autor: opus
    revisao: pendente

  mon_relicario_de_osso:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [na_anel_lama]
      permanencia: [5, 8]
    sinais:
      antecedencia: cedo
      rastro: null
      resto: "Lascas leitosas, finas como agulha, cravadas na madeira de um banco boiando na água escura."
      som: "Estalos agudos de algo esfriando, vindos de dentro da nave alagada, sempre que a água bate."
      cheiro: "Água parada com gosto de pedra molhada e, por cima, cera de vela velha."
      marca: "Uma mão humana presa num cristal turvo, de veios cor de lodo, encostada no degrau da entrada."
      aproximacao: "No altar alagado, um monte de mãos, pés e costelas presos em cristal leitoso abre uma mão de muitos dedos."
      rumor: "os da parte alta dizem que quem corre na nave alagada leva uma lasca no corpo e não sai mais"
    contra_jogo: "Atravessar a nave devagar, pela borda seca, e quebrar a mão do alto; ele não foge nem se vira."
    tramas: []
    autor: opus
    revisao: pendente

  mon_sangrado_da_clinica:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [na_anel_ferro]
      permanencia: [2, 4]
      presas: [mon_cao_rebite]
      reage:
        - {quando: "pressao:praga", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Marcas de joelhos e mãos no alto do muro, longe uma da outra demais para um passo de gente."
      resto: "Um cão de rua estirado e branco, sem uma gota de sangue, com cortes finos em fileira no lombo."
      som: "Estalos secos de juntas no telhado, e uma voz baixa que pede desculpa a ninguém."
      cheiro: "Cheiro de carne seca ao sol e de bandagem velha, sem nada de sangue."
      marca: "Uma lanceta de barbeiro esquecida na soleira, limpa demais, e fileiras de cortes riscados na porta."
      aproximacao: "Um homem branco como papel cai do muro num salto, a pele aberta em centenas de cortes que não sangram."
      rumor: "um vizinho da Rua das Chaminés diz que um paciente que saiu curado volta toda noite pedindo desculpa"
    contra_jogo: "Feri-lo toda rodada, mesmo de raspão; sem o fôlego dos cortes fechados, é um homem seco de pernas trêmulas."
    tramas: []
    autor: opus
    revisao: pendente

  enemy_sentinela_ferro:
    fonte: ficha
    ecologia:
      horario: [Noite, Amanhecer]
      territorio: [na_anel_dourado]
      permanencia: [4, 7]
    sinais:
      antecedencia: cedo
      rastro: "Riscos finos subindo a parede lisa do corredor, em pares, até sumir no teto."
      resto: "Uma libré de criado, rasgada em tiras retas como corte de vidro, dobrada num canto."
      som: null
      cheiro: "Um cheiro mineral, de pedra suada, que não combina com a cera dos salões."
      marca: "Na parede escura, uma mancha morna no formato de um corpo encostado, que some quando a mão chega perto."
      aproximacao: "Um vulto da cor da parede se desprende dela, a pele de placas negras que não refletem a tocha."
      rumor: "uma criada do Palácio jura que um colega que limpava os andares de baixo ainda passa por ela sem ser visto"
    contra_jogo: "Golpes de impacto, não de lâmina, e de longe; vidro negro racha com pancada, e sem o calor de um corpo perto ele não sabe para onde descer."
    tramas: []
    autor: opus
    revisao: pendente

  enemy_elemental_fogo_poluido:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      estacoes: {inverno: 1.3, verao: 0.8}
      territorio: [na_anel_ferro]
      permanencia: [3, 5]
    sinais:
      antecedencia: cedo
      rastro: "Pegadas fundas e chamuscadas no barro do pátio, cada uma com uma crosta preta no fundo."
      resto: "Uma placa de escória do tamanho de uma telha, partida, com carne cozida grudada por dentro."
      som: "Um borbulhar grosso, de panela na brasa, vindo de um canto onde não há panela."
      cheiro: "Enxofre amarelo e carne fervida, um bafo que pesa no estômago."
      marca: "Na boca de uma fornalha apagada, a marca de um corpo grande deitado no metal, ainda quente."
      aproximacao: "Da boca da fornalha se levanta um homem maior que a porta, com placas negras soltando vapor e os punhos fundidos num bloco."
      rumor: "um mestre de turno manda deixar esfriar o que sai da panela de gusa e vender a sucata depois"
    contra_jogo: "Recuar e deixá-lo esfriar, longe das fornalhas, até ele parar; ou golpear forte logo depois que ele parte a crosta, quando a carne está à mostra."
    tramas: []
    autor: opus
    revisao: pendente

  # ============================== BESTAS DA ENTROPIA ==============================
  mon_lencol_de_chamine:
    fonte: ficha
    ecologia:
      horario: [Noite, Amanhecer]
      estacoes: {inverno: 1.5, verao: 0.6}
      territorio: [na_anel_ferro]
      permanencia: [2, 4]
      presas: [mon_rato_caldeira]
      foge_de: [mon_gralha_de_crematorio]
      reage:
        - {quando: "clima:chuva", efeito: menos}
    sinais:
      antecedencia: cedo
      rastro: "Uma faixa larga de pó varrido no telhado, com centenas de furinhos de patas dos dois lados."
      resto: "Um rato encolhido e assado por inteiro, sem marca de dente, ao pé de um cano de fumaça."
      som: "Um farfalhar de muitas patinhas por cima das telhas, como chuva seca andando."
      cheiro: "Cheiro de casca de inseto queimada, azedo e oleoso."
      marca: "Telhas rachadas em círculo, pretas por fora e alaranjadas por dentro, como se algo quente tivesse deitado ali."
      aproximacao: "Do alto do cano desce uma placa preta e lustrosa do tamanho de uma colcha, e as bordas levantam mostrando brasa."
      rumor: "uma vendedora de carvão diz que acordou com algo quente e pesado em cima do cobertor e não era o gato"
    contra_jogo: "Matar de longe ou empurrar para junto dos outros inimigos antes que estoure; perto de fogo aceso ele recua."
    tramas: []
    autor: opus
    revisao: pendente

  mon_traca_do_sino_mudo:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [na_anel_ferro]
      permanencia: [3, 5]
      foge_de: [mon_gralha_de_crematorio]
    sinais:
      antecedencia: cedo
      rastro: null
      resto: "Asas cinza-estanho, duras como lata, caídas aos montes debaixo de uma torre, partidas em quatro."
      som: "O badalo da torre balança e não sai som nenhum; em volta, até os passos ficam abafados."
      cheiro: null
      marca: "No bronze do badalo, centenas de arranhões finos em anel, como se algo se pendurasse ali."
      aproximacao: "Uma nuvem de asas rígidas desce zumbindo em tons diferentes, e o mundo em volta fica sem som."
      rumor: "os sineiros juram que puxaram a corda a manhã toda e ninguém na rua ouviu uma só badalada"
    contra_jogo: "Luz e fogo; sem som para comer, elas voam para a próxima torre, e fumaça as derruba do badalo."
    tramas: []
    autor: opus
    revisao: pendente

  mon_gralha_de_crematorio:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde]
      estacoes: {inverno: 1.2}
      territorio: [na_anel_ferro, na_anel_lama]
      permanencia: [2, 4]
      presas: [mon_traca_do_sino_mudo, mon_lencol_de_chamine]
      reage:
        - {quando: carcaca_recente, efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Pegadas de três dedos finos no pó, sem peso nenhum, que terminam do nada, sem sinal de voo."
      resto: "Escamas de cinza prensada espalhadas no beiral, que se desfazem quando se encosta o dedo."
      som: null
      cheiro: "Cheiro de forno de enterro, osso calcinado e pano queimado."
      marca: "Um anel e um frasco caídos na rua, cobertos de cinza, como se tivessem sido largados no ar."
      aproximacao: "Um pássaro do tamanho de um gato pousa sem som no beiral, bico de osso branco e olhos de carvão apagado."
      rumor: "um carregador conta que a cinza dos fornos levou o anel da mão dele e devolveu cinza no lugar"
    contra_jogo: "Matá-la antes de ela sair do alcance ou não preparar nada enquanto ela ronda; ferida, se desfaz e devolve."
    tramas: []
    autor: opus
    revisao: pendente

  mon_porca_da_queda:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite]
      territorio: [na_anel_lama]
      permanencia: [3, 6]
      presas: [enemy_rato_peste_anel_lama]
      reage:
        - {quando: carcaca_recente, efeito: mais}
        - {quando: "pressao:fome", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Quatro buracos fundos no chão firme, largos como balde, e entre eles o barro afundado como se tivesse cedido."
      resto: "Uma poça seca com o molde de um corpo enorme deitado e dentes de toda espécie largados na borda."
      som: "Um grunhido grave, longo, e logo depois o barulho de terra cedendo."
      cheiro: "Lama azeda e vômito velho, um fedor doce de beco de viciado."
      marca: null
      aproximacao: "Um corpo do tamanho de um boi, de lama endurecida sobre pernas curtas, vem em linha reta e o chão afunda à frente dele."
      rumor: "no Beco dizem que onde ela deita o chão não volta mais, e que viciado que dorme ali acorda pesado"
    contra_jogo: "Atacar de longe e nunca de frente; ela não vira depressa e o flanco de lama racha onde já secou."
    tramas: []
    autor: opus
    revisao: pendente

  mon_centopeia_da_torre_invertida:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite]
      territorio: [na_anel_ferro]
      permanencia: [3, 6]
      presas: [mon_cavadeira_de_unhas, mon_rato_caldeira]
    sinais:
      antecedencia: cedo
      rastro: "Duas fileiras de furos na pedra da parede, subindo até o teto e continuando por ele."
      resto: "Uma casca de quitina cor de pedra molhada, longa como um homem, presa de cabeça para baixo no forro."
      som: "Um tique-tique de muitas pontas na pedra, por cima da cabeça, que para quando você prende o fôlego."
      cheiro: null
      marca: "Um corte limpo em tesoura no braço de um morto, e do corte em diante pegadas que sobem a parede."
      aproximacao: "Pelo teto desce, ao contrário, um corpo comprido de quitina com mandíbulas em tesoura, e os poros da cabeça se abrem para o seu fôlego."
      rumor: "um preso solto do Oubliette jura que lá embaixo aprendeu a respirar baixo, porque algo escuta do teto"
    contra_jogo: "Lutar em sala de teto baixo ou encostado a uma parede; sem o poço, ela perde o lado de cima e vira um bicho comprido."
    tramas: []
    autor: opus
    revisao: pendente

  enemy_horror_esgoto:
    fonte: ficha
    ecologia:
      horario: [Noite, Amanhecer]
      territorio: [na_anel_lama, na_anel_ferro]
      permanencia: [3, 6]
      presas: [enemy_rato_peste_anel_lama, mon_cavadeira_de_unhas]
      reage:
        - {quando: carcaca_recente, efeito: mais}
        - {quando: "clima:chuva", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Um rastro largo de lodo escuro saindo de um ralo, com cacos de vidro e lascas de osso grudados."
      resto: "A grade do bueiro arrancada e entortada, com um pedaço de carroça entalado nela."
      som: "Um gorgolejar fundo debaixo da rua, alto demais para ser só água, e o ranger de metal sendo puxado."
      cheiro: "O fedor de tudo que os três anéis jogam fora, quente e subindo pelas grades."
      marca: null
      aproximacao: "Do ralo sobe uma massa do tamanho de uma carroça, ossos, escória e vidro presos num lodo que se mexe."
      rumor: "o vigia da madrugada diz que a grade do bueiro amanheceu arrancada e a carroça do lixo sumiu"
    contra_jogo: "Não deixar nada caído perto dela e golpear os braços de osso, que são o que a mantém erguida; sem eles, só rasteja."
    tramas: []
    autor: opus
    revisao: pendente

  enemy_polvo_esgoto:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite]
      estacoes: {primavera: 1.4, outono: 1.2, verao: 0.6}
      territorio: [na_anel_lama]
      permanencia: [2, 3]
      presas: [enemy_rato_peste_anel_lama]
      reage:
        - {quando: "clima:chuva", efeito: mais}
        - {quando: "clima:limpo", efeito: menos}
    sinais:
      antecedencia: imediato
      rastro: "Um risco de água parda no ar entre dois barracos, que pinga num rastro reto sem chão por baixo."
      resto: "Roupa nos fios, de manhã, coberta de lodo de canal até o alto, onde a água não chega."
      som: "Um borbulhar abafado à altura da cabeça, como alguém afogando dentro de um balde."
      cheiro: "Cheiro de canal parado e peixe vivo, forte demais longe da água."
      marca: null
      aproximacao: "Da chuva vem nadando pelo ar um bolsão de água parda, e dentro dele uma cabeça larga de músculo sem pele estende barbilhões."
      rumor: "uma mãe do Anel conta que o marido bêbado voltou para casa encharcado numa noite de chuva, e só de um lado"
    contra_jogo: "Rasgar a água, não o peixe; um golpe pesado no bolsão o derruba no chão seco, onde ele se debate sem ar e não agarra ninguém."
    tramas: []
    autor: opus
    revisao: pendente

  enemy_gargula_ferro:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite]
      estacoes: {primavera: 1.3, inverno: 0.6}
      territorio: [na_anel_dourado]
      permanencia: [4, 7]
      presas: [mon_traca_do_sino_mudo]
    sinais:
      antecedencia: cedo
      rastro: "Marcas de ventosa num parapeito úmido, aos pares, e um salto comprido até o tanque."
      resto: "Asas de inseto boiando num tanque de flores, mordidas pela metade."
      som: "Um coaxar curto que chega meio segundo antes de qualquer barulho no terraço."
      cheiro: "Perfume de flor que não existe, doce e verde, misturado com água de tanque."
      marca: null
      aproximacao: "Na beira do tanque, um bicho liso do tamanho de um gato, de cores que mudam, já está olhando para onde você vai."
      rumor: "os guardas dos Jardins dizem que um coaxar avisa do golpe antes do braço levantar"
    contra_jogo: "Matar a rã primeiro, de perto (ela só vê o golpe, não o impede), ou atacar duas vezes na rodada; o aviso vale só para o primeiro golpe."
    tramas: []
    autor: opus
    revisao: pendente

  # ============================== COBRADOS ==============================
  mon_sorvedouro_do_codigo:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [na_anel_ferro, na_anel_lama]
      permanencia: [3, 5]
      presas: [enemy_iniciado_chama_azul]
      reage:
        - {quando: "pressao:abismo", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Pegadas de bota de farda, regulares, que param em seco de tempos em tempos e mudam de direção."
      resto: "Um amuleto de mago queimado por dentro, a pedra opaca e rachada, largado na sarjeta."
      som: "Uma voz monótona recitando artigo e parágrafo numa rua vazia."
      cheiro: "Cheiro frio de chumbo e de vidro moído, que pinica o nariz."
      marca: "Na porta de um curandeiro, uma marca de lacre preto com um número de artigo, e a fechadura vitrificada."
      aproximacao: "Um inquisidor de farda rasgada no peito vira para você os olhos brancos, e o funil cravado no esterno puxa o ar."
      rumor: "um curandeiro de esquina fechou as portas depois que um inquisidor cego passou recitando na rua dele"
    contra_jogo: "Chegar sem Entropia acumulada ou descarregá-la antes; sem o que sugar, o funil engasga e a crosta racha fácil."
    tramas: []
    autor: opus
    revisao: pendente

  mon_pavio_da_lista:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde]
      territorio: [na_anel_ferro]
      permanencia: [2, 4]
    sinais:
      antecedencia: cedo
