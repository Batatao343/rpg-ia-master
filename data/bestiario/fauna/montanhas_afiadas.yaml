# SPEC-370 R1 (lote 2) — bloco de fauna das Montanhas Afiadas: 27 fichas da SPEC-349 + legado
# `valoria` da região. Mesmo contrato da SPEC-360 §3.2; compilado em data/world/fauna.json por
# scripts/fauna/build.py. Sinal é vestígio, nunca a criatura: quem nomeia é o encontro.
# Estação do calendário (R4): enemy_wyvern_jovem com verão 1,5 (calendar.json). E18: 2 `imediato`
# no hub (Chicote de Fenda e Mão da Borda). Revisão: handoffs/SPEC-370-independent-review.md (lote 2).
regiao: montanhas_afiadas
criaturas:
  # ============================== CORPOS REESCRITOS ==============================
  mon_deitado_na_parede:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ma_boca]
      permanencia: [8, 11]
    sinais:
      antecedencia: imediato
      rastro: "Marcas de dedos em garra riscadas de lado na rocha, na altura de um homem, sem nenhuma pegada no chão embaixo."
      resto: "Uma mochila de explorador caída de lado, as alças esticadas para a esquerda como se ainda pendessem de alguém."
      som: null
      cheiro: "Pele roxa de hematoma antigo e mochila mofada, um cheiro de quem não muda de posição há dias."
      marca: "Numa câmara idêntica às outras, um rastro de cabelo e fios de barba presos na pedra lateral, todos caídos para o mesmo lado."
      aproximacao: "Da pedra ao seu lado se solta, como porta que abre, um homem tombado de flanco roxo e inchado, os dedos em garra."
      rumor: "um explorador jura que nas câmaras que se repetem é preciso olhar para os lados, nunca só para a frente"
    contra_jogo: "Tirá-lo da parede; derrubado no chão, o peso dele puxa para o lado errado e ele não consegue se levantar."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_geodo_da_praga:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [ma_saidas_baixas, montanhas_afiadas]
      permanencia: [7, 10]
      foge_de: [enemy_orc_saidas_baixas]
      reage:
        - {quando: "pressao:praga", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Pegadas curvadas que vão de fogueira em fogueira e, ao lado, marcas de punho apoiado no chão."
      resto: "Cascas duras de um nó partido junto às cinzas, avermelhadas por dentro, e uma pedra suja de sangue onde foram quebradas."
      som: "Um estalo seco como de noz quebrada perto do fogo, e um gemido curto logo depois."
      cheiro: "Lenha verde queimando e um azedo de ferrugem, cheiro de acampamento de quem não tem para onde ir."
      marca: "Ao redor de uma fogueira de refugiados, cacos vermelhos cortantes espalhados como vidro quebrado."
      aproximacao: "Junto ao fogo, um refugiado curvado sobre as mãos abre um punho em cavidade de cristais vermelhos e pontudos."
      rumor: "os fugidos das Saídas dizem que perto do fogo há quem fique mais perigoso a cada hora"
    contra_jogo: "Golpear o nó que está inchando antes que amadureça: partido verde, ele só sangra e não vira caco; quem o parte assim tira dele um punho."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_cauda_de_atalaia:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [montanhas_afiadas]
      permanencia: [10, 12]
      reage:
        - {quando: "clima:vendaval", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Na trilha estreita, a neve e o cascalho varridos em arcos largos que vêm de cima, sem ninguém que tenha passado."
      resto: "Um viajante caído com um vergão fundo atravessado no peito, como de chicote enorme, longe de qualquer parede alcançável."
      som: "Um ranger de osso torcido no alto e um balanço lento, como de corda pesada ao vento."
      cheiro: "Pele seca de múmia e pedra fria, que só se sente debaixo do penhasco."
      marca: "Numa ponta de rocha sobre a trilha, a pedra polida em três anéis lisos, como de corda enrolada há séculos."
      aproximacao: "Do alto pende de cabeça para baixo um morto cinzento de mãos em gancho, e um açoite branco desenrola duas voltas sobre você."
      rumor: "os guias dizem que na trilha estreita do norte quem passa olhando para cima chega, e quem olha para os pés não"
    contra_jogo: "Subir até a ponta de pedra e cortar a cauda na volta que a prende, ou passar fora da trilha, rente ao paredão."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_queimado_de_frio:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      estacoes: {inverno: 1.3, verao: 0.6}
      territorio: [montanhas_afiadas]
      permanencia: [7, 10]
      reage:
        - {quando: "clima:nevasca", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Um sulco de joelhos e cotovelos na neve, lento e paciente, que vai sempre na direção de quem acampou."
      resto: "Um viajante sentado junto ao fogo apagado, as pernas duras como pau e as mãos ainda na guarda que não ergueu."
      som: "Joelhos de gelo batendo devagar na crosta da neve, toc, toc, como quem bate numa porta pedindo para entrar."
      cheiro: "Carne gelada e líquido turvo, adocicado, de bolha de queimadura estourada."
      marca: "Na neve perto de um acampamento, gotas de líquido turvo congeladas em fila, como contas de um colar."
      aproximacao: "De joelhos na neve, um viajante de pele branca e translúcida, coberto de bolhas, estica a mão para as suas pernas."
      rumor: "os guias mandam nunca descansar sentado na subida, nem quando o corpo pede"
    contra_jogo: "Não parar perto dele e não se defender parado; quem se mexe o deixa para trás, e as bolhas estouram com fogo."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  enemy_observador_menor:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ma_boca, ma_saidas_baixas]
      permanencia: [7, 10]
      foge_de: [mon_guardiao_basalto]
    sinais:
      antecedencia: cedo
      rastro: "No fim de uma fila de pegadas de bando, um par de pés que anda de lado, sem nunca virar a ponta."
      resto: "Uma navalha de barbear e tufos de cabelo raspado deixados numa pedra, com gotas de sangue na lâmina."
      som: "Uma voz no fundo do bando avisando o golpe antes do golpe: a mão na faca, o pé que vai firmar."
      cheiro: "Colírio de ervas e lágrima velha, salgado, como de quem não fecha a vista há dias."
      marca: "Num acampamento de saqueadores, um trapo molhado usado para umedecer pálpebras, largado junto a uma tigela de água."
      aproximacao: "No fim do bando, um homem de cabeça raspada coberta de pálpebras abertas, úmidas e vermelhas, vê você de todos os lados."
      rumor: "um mercenário diz que o bando da Boca desviou de todos os golpes dele, e que alguém atrás gritava antes"
    contra_jogo: "Derrubá-lo primeiro; uma luz forte e súbita nos olhos que não fecham o cega por um instante."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  # ============================== BESTAS DA ENTROPIA ==============================
  enemy_wyvern_jovem:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      estacoes: {verao: 1.5}
      territorio: [montanhas_afiadas]
      permanencia: [7, 10]
      presas: [mon_cabra_navalha, mon_cabra_labirinto]
      reage:
        - {quando: "clima:vendaval", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "No paredão, um contorno de lagarto grande desenhado pela poeira que não pousou, como sombra de algo que se soltou."
      resto: "Uma cabra das encostas cortada em linha reta na altura do peito, as duas metades caídas na trilha."
      som: "Um estalo de vela que se abre de uma vez, e um zunido rasante que passa e sobe."
      cheiro: "Couro de réptil e vento cortante, um cheiro de rocha lavada por tempestade."
      marca: "Numa saliência do paredão, escamas cor de ardósia raspadas na pedra e riscos finos como de foice afiada na rocha."
      aproximacao: "Do paredão se solta um lagarto do tamanho de um cavalo magro e abre um arco de lâminas de osso de três metros."
      rumor: "os carregadores das trilhas altas atravessam os trechos de paredão de joelhos no verão, e não por cansaço"
    contra_jogo: "Abaixar-se ou deitar na trilha quando ele abre o leque; pousado, depois da passada, é um lagarto lento."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  enemy_minotauro_esqueleto:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ma_boca, ma_forja_profunda]
      permanencia: [9, 12]
    sinais:
      antecedencia: cedo
      rastro: "Ao longo dos trilhos dos Anões, cascos largos que pisam sempre entre os dormentes, como quem conhece o caminho de cor."
      resto: "Um vagonete de mina amassado na frente por um golpe chato e largo, fora dos trilhos."
      som: "Um mugido baixo e perdido no escuro, e o ferro dos trilhos vibrando sob alguma coisa pesada."
      cheiro: "Couro pálido de bicho que nunca viu sol e ferro de trilho molhado."
      marca: "No teto das galerias de transporte, duas faixas lisas raspadas na pedra, da largura de uma cabeça de boi."
      aproximacao: "Pelos trilhos vem um boi branco de veias azuis e olhos leitosos, a ferragem saindo do couro do pescoço, de cabeça baixa."
      rumor: "um mineiro diz que nos trilhos velhos dos Anões ainda passa carga, e que é melhor não estar no caminho"
    contra_jogo: "Sair do trilho e lutar de lado, porque ele sente o ferro e não a pessoa; arrancar um trilho ou travá-lo com pedra o deixa parado."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  enemy_mimico_bau:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ma_forja_profunda]
      permanencia: [9, 12]
      presas: [mon_bexiga_de_respiro]
    sinais:
      antecedencia: cedo
      rastro: "Seis patas grossas marcadas na escória do chão, entre um arrasto de ferro pesado que deixa uma linha de brasa apagando."
      resto: "Uma pele fina e translúcida murcha no chão da forja, rasgada por uma pinça, com fios rosados ainda pendurados."
      som: "Um chiado de brasa sacudida e o tinido de ferro fundido batendo em bigorna, sem martelo nenhum."
      cheiro: "Escória quente e carne de marisco cozida, como de caranguejo assado na brasa."
      marca: "Junto às bigornas apagadas, um círculo de pedra avermelhada e quente onde algo grande se encostou e esperou."
      aproximacao: "Da fumaça da forja sai um vasilhame de ferro rubro do tamanho de uma banheira, sobre seis patas, com duas pinças desiguais na borda."
      rumor: "os ferreiros que restam dizem que uma das panelas grandes da forja anda sozinha à noite"
    contra_jogo: "Afastá-lo das bigornas e golpeá-lo de longe ou com haste, sem ficar ao lado dele; frio, o caldeirão escurece e o ventre preso ao fundo fica sem defesa."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  enemy_basilisco_caverna:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ma_boca]
      permanencia: [9, 12]
      presas: [mon_ladrao_de_lume, mon_saltao_de_galeria]
    sinais:
      antecedencia: cedo
      rastro: "Uma faixa larga de gosma endurecida no chão, cheia de ferramentas e lanternas anãs presas de cabo para fora."
      resto: "Uma espada de viajante cravada numa crosta de pedra branca, sem o dono, e a mão de couro da luva ainda no cabo."
      som: "Um gotejar constante do teto e, por baixo dele, um arrasto úmido e muito lento."
      cheiro: "Cal molhada e lodo mineral, como de poço de pedra calcária."
      marca: "Nas câmaras de gotejo, as pedras cônicas do chão raspadas na base, numa trilha baixa e lisa que vai de uma a outra."
      aproximacao: "Uma das pedras cônicas da câmara anda, e por baixo dela um pé branco e largo coberto de gosma vem até você."
      rumor: "um saqueador diz que deixou a melhor lâmina dele na Boca, presa em pedra, e que a mão quase foi junto"
    contra_jogo: "Golpear com pancada ou com haste, nunca com lâmina; a casca é pedra, mas o pé branco é mole e cede ao porrete."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  enemy_morcego_vampiro:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [montanhas_afiadas, ma_saidas_baixas]
      permanencia: [6, 9]
      presas: [mon_cabra_navalha]
      reage:
        - {quando: "clima:vendaval", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: null
      resto: "Uma cabra caída no fundo do precipício, a cabeça envolta por uma marca redonda de sucção sobre os olhos."
      som: "Um bater de pano no vento, como de bandeira solta, que passa rente às bordas da trilha."
      cheiro: "Couro fino de bicho e neve suja, que o vento traz de repente e leva."
      marca: "Na beira da trilha, um cachecol de pano preso na pedra e, perto, marcas de mãozinhas de três dedos no gelo."
      aproximacao: "Do vento desce um trapo comprido cor de neve suja, com mãozinhas nas bordas, e uma boca redonda se fecha sobre os seus olhos."
      rumor: "os guias amarram os clientes em corda nos trechos de vento, e dizem que não é por causa do vento"
    contra_jogo: "Ficar parado e deixar um companheiro arrancá-lo pela ponta sem cabeça; andar amarrado em corda tira o risco da queda; fogo o faz soltar na hora."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_bexiga_de_respiro:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ma_forja_profunda, ma_boca]
      permanencia: [6, 9]
      foge_de: [enemy_mimico_bau]
    sinais:
      antecedencia: cedo
      rastro: null
      resto: "Um mineiro sentado contra a pedra com o rosto e os braços riscados de vergões finos, os músculos moles demais para se erguer."
      som: "Um latejar abafado no ar quente, como coração pequeno batendo dentro de um saco."
      cheiro: "Ar quente de forja com um fundo de urtiga queimada, que arde nos olhos."
      marca: "Na boca de uma ventilação dos Anões, fios rosados finos como linha presos na grade, ainda pegajosos."
      aproximacao: "No ar quente sobre a sua cabeça flutua uma bolsa translúcida com um coração batendo dentro, arrastando fios de três metros."
      rumor: "um mineiro diz que embaixo das ventilações da forja é preciso andar de capuz, mesmo no calor"
    contra_jogo: "Furá-la de longe, que ela murcha e cai; não passar por baixo dos fios; esfriar o ar do respiro a faz descer."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_saltao_de_galeria:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ma_boca]
      permanencia: [7, 10]
      foge_de: [enemy_basilisco_caverna]
    sinais:
      antecedencia: cedo
      rastro: "No pó do chão, riscos finos e compridos arrastados, como de linhas de pesca puxadas devagar."
      resto: "Um explorador derrubado de bruços, com marcas de muitas patinhas espinhosas agarradas nas costas."
      som: "Um cricrilar grave vindo de cima, de muitos ao mesmo tempo, que para quando alguém pisa forte."
      cheiro: "Casca de inseto úmida e mofo de teto, um cheiro de porão de grãos."
      marca: "No teto das passagens de cima, cascas rosadas e vazias de muda presas de cabeça para baixo, em bando."
      aproximacao: "Do teto caem grilos rosados do tamanho de cães grandes, as antenas arrastando, e o primeiro já se agarra nas suas costas."
      rumor: "os mineiros da Boca andam leves e devagar pelas passagens altas, e nunca dizem por quê"
    contra_jogo: "Sacudir ou queimar os que estão agarrados antes do terceiro; andar devagar e leve, longe das antenas que pendem, não os acorda."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_rolador_de_escarpa:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer]
      territorio: [montanhas_afiadas, ma_saidas_baixas]
      permanencia: [7, 10]
      foge_de: [mon_chicote_de_fenda]
    sinais:
      antecedencia: cedo
      rastro: "Na encosta de cascalho, uma vala reta e funda que desce até a trilha e sobe de novo, de novo e de novo."
      resto: "Uma perneira de couro talhada em vários cortes paralelos, como se tivesse passado numa grade de pederneiras."
      som: "Um rolar de pedra solta encosta abaixo, que não para no fim: volta a subir em passinhos."
      cheiro: "Pó de cascalho e formigueiro revirado, ácido e seco."
      marca: "Nas frestas da encosta, formigueiros de pedra abertos a focinho e lambidos até o fundo."
      aproximacao: "Encosta abaixo rola uma bola de placas de osso abertas em gume, e vem direto contra as suas pernas."
      rumor: "os carregadores das trilhas dizem que pedra que cai duas vezes do mesmo lugar não é pedra"
    contra_jogo: "Sair da linha da encosta ou subir acima dele; desenrolado e de barriga para cima, é mole."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_chicote_de_fenda:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [montanhas_afiadas]
      permanencia: [8, 11]
      presas: [mon_cabra_navalha, mon_rolador_de_escarpa]
    sinais:
      antecedencia: imediato
      rastro: "Dois traços finos e compridos na neve da trilha, que saem da rocha e voltam para ela, como de varetas tateando."
      resto: "Uma cabra puxada pela metade para dentro de uma rachadura estreita, só as patas de trás para fora."
      som: null
      cheiro: "Quitina velha e carne guardada na pedra, um cheiro azedo de despensa sem ar."
      marca: "Numa rachadura vertical da rocha, lascas de casca parda presas nas bordas e espinhos quebrados no chão abaixo."
      aproximacao: "Da rocha saem de uma vez dois braços cheios de espinhos, e algo chato como tábua se desdobra da rachadura atrás deles."
      rumor: "um guia diz que nas trilhas do alto se anda longe da rocha, por mais que o abismo assuste"
    contra_jogo: "Cortar os chicotes quando tocarem, ou passar longe da parede; fora da fenda, achatado, ele vira de costas com uma pancada."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_ladrao_de_lume:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ma_boca, ma_saidas_baixas]
      permanencia: [6, 9]
      foge_de: [enemy_basilisco_caverna]
    sinais:
      antecedencia: cedo
      rastro: "Marcas de mãos de dedos grossos no teto e nas paredes, seguindo de longe o caminho de um grupo."
      resto: "Uma lanterna anã quebrada no escuro, longe do acampamento, com marcas de abraço amassando o metal."
      som: "Um choramingo baixo no escuro, como de bicho que sente dor e não para de se aproximar."
      cheiro: "Pele rosada e úmida e óleo de lanterna derramado, cheiro de quarto de doente com lamparina."
      marca: "Num canto alto e escuro, uma pilha de tochas, potes de Brasa e lanternas roubadas, todas apagadas e abraçadas."
      aproximacao: "Do teto desce devagar um bicho pelado do tamanho de um gato, de olhos enormes e úmidos, os braços longos indo para a sua luz."
      rumor: "um saqueador da Boca diz que perdeu três lanternas numa noite e que o escuro chorava toda vez"
    contra_jogo: "Guardar a luz no corpo, não no chão, e cobri-la de repente; no escuro súbito ele larga tudo e se encolhe."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  # ======================== HUMANOS QUE PAGARAM O PREÇO ========================
  enemy_troll_ponte:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ma_saidas_baixas]
      permanencia: [10, 12]
      suprime: [mon_goblin_eco]
    sinais:
      antecedencia: cedo
