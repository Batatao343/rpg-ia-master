# SPEC-370 R1 (lote 3) — bloco de fauna do Deserto de Zhur: 26 fichas da SPEC-349 + legado `valoria`
# da região. Mesmo contrato da SPEC-360 §3.2; compilado em data/world/fauna.json por
# scripts/fauna/build.py. Sinal é vestígio, nunca a criatura: quem nomeia é o encontro.
# Estação do calendário (R4): enemy_verme_areia_jovem verão 1,5; enemy_escorpiao_cristal verão 1,3.
# E18: 2 `imediato` no hub (Verme de Vidro e Caçador Sem Calor).
# Revisão de fauna: handoffs/SPEC-370-independent-review.md (lote 3; revisor ≠ autor).
regiao: deserto_zhur
criaturas:
  # ============================== CORPOS REESCRITOS ==============================
  mon_andarilho_de_duas_idades:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [deserto_zhur]
      permanencia: [8, 11]
    sinais:
      antecedencia: cedo
      rastro: "Um sulco de braço comprido arrastado no chão vidrado e, ao lado, pegadas pequenas de pé de criança, do mesmo corpo."
      resto: "Um viajante deitado entre as dobras do chão, de cabelo branco e mãos de velho, que ontem era moço segundo os papéis que levava."
      som: "Um arrasto seco de unhas compridas no chão duro e uma voz de criança cantarolando baixo, no mesmo fôlego."
      cheiro: "Pele velha de pergaminho e leite de bebê azedo, os dois juntos."
      marca: "Nas dobras do chão vidrado, marcas de mão pequena e macia apertadas com força nas bordas, como de quem segurou para não cair."
      aproximacao: "Arrastando-se num braço de velho que vai até o chão, vem um corpo de metade criança, e a mão pequena se estende para a sua."
      rumor: "um caravaneiro diz que perdeu dez anos numa noite no deserto e que o filho ganhou de volta os dele"
    contra_jogo: "Cortar a mão pequena, que é a que segura; o braço velho bate forte e devagar, e sem a mão de criança ele não toma nada."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_esfolado_da_tempestade:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [deserto_zhur]
      permanencia: [7, 10]
      reage:
        - {quando: "clima:vendaval", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Pegadas que saem de dentro do vento cortante, onde nada anda, e seguem direto para o cheiro de uma caravana."
      resto: "Um alforje de couro raspado até a trama, e a malha de ferro por baixo dele lixada em fios brilhantes."
      som: "Um chiado de lixa grossa raspando couro, e o tilintar de cacos finos batendo uns nos outros."
      cheiro: "Músculo exposto ao vento quente e um pó de caco que arranha a garganta."
      marca: "Num poste de caravana, a madeira lixada de um lado só, com lascas finas e brilhantes cravadas todas na mesma direção."
      aproximacao: "Do vento sai um homem sem pele, de músculo vermelho e seco, as costas cobertas de lascas deitadas como escamas, e abre os braços."
      rumor: "os caravaneiros dizem que tem gente que vive dentro do vento de navalhas, e que sai quando sente cheiro de comida"
    contra_jogo: "As lascas só cortam num sentido; golpear de baixo para cima, contra elas, quebra as escamas sem se cortar. Óleo nas costas faz os cacos escorregarem."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_provador_da_borda:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [dz_borda_do_vazio]
      permanencia: [9, 12]
    sinais:
      antecedencia: cedo
      rastro: "Marcas de cócoras à beira da queda, de quem fica muito tempo agachado, e um rastro de saliva cinza secando no chão."
      resto: "Um viajante calado com a garganta rasgada até o queixo, como se alguém tivesse provado antes de comer."
      som: "Um estalar úmido de língua no vento, e um silêncio que parece escutar cada passo que você dá."
      cheiro: "Saliva espessa e um gosto metálico no ar, como se o vento tivesse sabor."
      marca: "Na beira da queda, papilas grossas e cinzentas grudadas nas pedras, como pele de língua arrancada pelo vento."
      aproximacao: "De cócoras na beira da queda, um homem de mandíbula partida em duas pinças estica para você uma língua do tamanho de um braço."
      rumor: "os da beira sul dizem que lá o som tem gosto, e que há quem saiba o que você vai fazer pelo sabor"
    contra_jogo: "Calar o próprio corpo; quem fica parado, ou luta coberto pelo barulho de outro, não tem gosto. A língua é mole e é por ela que se começa."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_peito_de_geodo:
    fonte: ficha
    ecologia:
      horario: [Tarde, Anoitecer, Noite]
      territorio: [deserto_zhur, dz_borda_do_vazio]
      permanencia: [8, 11]
      foge_de: [mon_costurado_de_lentes]
    sinais:
      antecedencia: cedo
      rastro: "Pegadas curvadas e pesadas que levam a um afloramento violeta e ficam ali, viradas para o poente."
      resto: "Uma lanterna de saqueador cravada de pontas violeta, como se um feixe de pregos tivesse saído do escuro."
      som: "Um estalo de pedra rachando ao meio, e um zunido de pontas voando como flechas curtas."
      cheiro: "Pedra quebrada fresca e um ar ozonado, de cristal que pulsa."
      marca: "Encostado num afloramento violeta, o desenho de costas humanas marcado no pó, e o cristal crescido para dentro dele."
      aproximacao: "Um saqueador curvado abre as costelas com as duas mãos, como portas, e do tórax forrado de cristais violeta sai a luz."
      rumor: "um saqueador acordou com um amigo crescido em pedra violeta por dentro, e agora dorme de pé"
    contra_jogo: "Depois do disparo o peito fica vazio e o coração à mostra; é a hora de chegar perto. Quem fica de lado, fora da boca do peito, não leva as pontas."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_fervente_de_ferrugem:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde]
      territorio: [deserto_zhur]
      permanencia: [6, 9]
      foge_de: [mon_cacador_sem_calor]
      reage:
        - {quando: "pressao:praga", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Pegadas de trabalhador arrastando os pés no sol do meio-dia, e entre elas contas escuras de metal caídas na areia."
      resto: "Uma picareta de cavar largada no sol, o cabo manchado de sangue que secou em grãos duros."
      som: "Um chiado de chaleira no peito de alguém, rápido, e o estalo de bolhas que estouram."
      cheiro: "Sangue fervido e óxido, metálico, que deixa gosto de moeda na boca."
      marca: "Na escavação dos saqueadores, uma pá de cavar enfiada no chão quente com o cabo preto de mãos que suaram ferro."
      aproximacao: "Do sol do meio-dia corre um homem de veias saltadas como cordas cor de tijolo, os dentes pretos, e abre os braços para abraçar."
      rumor: "os saqueadores levam doentes para cavar no sol, e dizem que os doentes não reclamam do calor"
    contra_jogo: "Não deixar que chegue; de longe é só um homem doente e curto de fôlego. Quem o derruba antes do abraço fica com um cadáver morno."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  enemy_mumia_de_po:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [deserto_zhur]
      permanencia: [9, 12]
      suprime: [mon_maos_de_cinzel]
    sinais:
      antecedencia: cedo
      rastro: "Pegadas lentas e pesadas que saem de uma câmara enterrada e seguem a trilha de um saqueador, dias depois dele."
      resto: "Um saqueador morto no acampamento, de mãos vazias, e a peça que ele levou da câmara já não está lá."
      som: "Um ranger de madeira seca sob peso, e passos que não aceleram nem param, noite após noite."
      cheiro: "Madeira de sândalo velho e resina de embalsamar, um cheiro de templo fechado."
      marca: "Na porta de uma câmara do rei engolido, duas marcas de varais arrastados para fora e uma coleira de cobre rompida no chão."
      aproximacao: "Curvado sob um peso que não está ali, um servo de pele seca e escura vem até você, os varais de madeira crescendo dos ombros."
      rumor: "um saqueador diz que vendeu a taça de um rei engolido em três cidades, e que o servo dele passou nas três"
    contra_jogo: "Largar o que foi tirado; ele para, pega e volta para baixo. Os varais dos ombros são o ponto fraco, e madeira seca quebra."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  # ============================== BESTAS DA ENTROPIA ==============================
  mon_varano_vidrado:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      estacoes: {verao: 1.2}
      territorio: [deserto_zhur]
      permanencia: [7, 10]
      presas: [mon_saltador_de_palafita]
      foge_de: [enemy_devorador_sol_zhur]
      reage:
        - {quando: "clima:limpo", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Um arrasto largo de barriga e cauda, como de duas carroças em fila, com pegadas de garras abertas dos lados."
      resto: "Um bicho saltador do deserto mordido ao meio, a ferida queimada como se tivessem posto ferro em brasa."
      som: "Um sibilo longo e úmido, e a saliva fervendo na areia quente com chiado de frigideira."
      cheiro: "Couro de réptil assado e saliva ácida, um cheiro de churrasco estragado."
      marca: "Na areia quente, a forma de um corpo enorme deitado ao sol, a areia fundida em crosta lisa onde ele se esquentou."
      aproximacao: "Sai do sol um lagarto do comprimento de duas carroças, de dorso branco de calor e rachado nos ombros, babando saliva que ferve."
      rumor: "os caçadores do deserto só caçam ao amanhecer, quando o bicho grande ainda está frio"
    contra_jogo: "Lutar com ele ao amanhecer ou na sombra; água fria nas costas quentes trinca o vidro. As rachaduras dos ombros são carne."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_tatu_de_navalha:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer]
      territorio: [deserto_zhur]
      permanencia: [6, 9]
      foge_de: [enemy_escorpiao_cristal]
      reage:
        - {quando: "clima:vendaval", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Sulcos retos de bolas rolando duna abaixo, a favor do vento, e no pé da duna marcas de garras chatas subindo de novo."
      resto: "Uma perneira de caravaneiro cortada em fatias paralelas, como se tivesse passado por um moinho de cacos."
      som: "Um rolar chocalhado e tilintante descendo a duna, de várias coisas ao mesmo tempo."
      cheiro: "Terra cavada e formigueiro aberto, um cheiro seco de toca de bicho."
      marca: "No pé de uma duna, formigueiros cavados a garra e cascas em cinta trocadas, cheias de cacos cravados."
      aproximacao: "Do alto da duna rolam bolas de casco em cintas eriçadas de cacos, a favor do vento, direto para as suas pernas."
      rumor: "os caravaneiros dizem que no deserto não se para no pé da duna quando o vento sopra de cima"
    contra_jogo: "Aberto, a barriga é mole; quem sai do caminho da rolada e espera ele se abrir no pé da duna o mata com um golpe."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_lambedor_de_halito:
    fonte: ficha
    ecologia:
      horario: [Noite, Amanhecer]
      territorio: [deserto_zhur]
      permanencia: [6, 9]
      foge_de: [mon_cavador_de_funil]
    sinais:
      antecedencia: cedo
      rastro: "Marcas finas de pernas compridas subindo a duna à noite, e no topo um ponto onde a areia está úmida."
      resto: "Um viajante acordado de madrugada roxo e sem ar, com uma marca redonda e mole em volta da boca."
      som: "Um sugar leve e úmido no silêncio do acampamento, e um tique de pernas finas no tecido da tenda."
      cheiro: "Bafo velho de quem dorme e umidade de orvalho, estranho no seco do deserto."
      marca: "No acampamento de madrugada, as bordas dos cobertores marcadas por dezenas de patinhas finas, todas indo para as cabeças."
      aproximacao: "Sobre o peito de quem dorme, um besouro de pernas finas e costas de calombos pretos encaixa uma tromba mole na boca dele."
      rumor: "os caravaneiros dormem com um pano molhado no rosto, e não é por causa do calor"
    contra_jogo: "Pano molhado na boca ou prender a respiração tira o rumo deles; pesados de água, ficam lentos e estouram com um tapa."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_lastreiro_da_cratera:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [deserto_zhur]
      permanencia: [7, 10]
      presas: [mon_hiena_sol]
    sinais:
      antecedencia: cedo
      rastro: "Um risco fino arrastado na areia, de pedra pendurada que roça o chão, que vai e volta sem pegada nenhuma."
      resto: "Uma pedra redonda e lisa caída sobre um corpo esmagado, e nenhuma encosta de onde ela possa ter vindo."
      som: "Um ranger de pedra raspando areia e, muito acima, um sopro de ar saindo de algo enorme."
      cheiro: "Pó fino de estrela e tripa crua, um cheiro de couro de odre ao sol."
      marca: "Na areia em volta de um acampamento, buracos redondos do tamanho de uma cabeça, como de pedra largada do alto, sem pedra dentro."
      aproximacao: "Uma pedra cai do céu ao seu lado, presa a uma tripa grossa que já puxa para cima, para uma bexiga do tamanho de uma tenda."
      rumor: "os caravaneiros ensinam a nunca acampar debaixo de estrela que não pisca"
    contra_jogo: "Furar a bexiga de longe; ou cortar a tripa do lastro, e ele sobe e não volta. Não acampar debaixo de estrela que não pisca."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_cavador_de_funil:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [deserto_zhur]
      permanencia: [9, 12]
      presas: [mon_lambedor_de_halito, mon_escaravelho_vidro]
    sinais:
      antecedencia: cedo
      rastro: "Na duna fofa, um rastro de quem escorregou para o centro de um buraco e não deixou marca de subida."
      resto: "Cascas de besouro chupadas e vazias jogadas para fora de um buraco, numa pilha em volta da borda."
      som: "Um chiar de areia escorrendo em cone, e um estalo de duas foices de casca fechando lá embaixo."
      cheiro: "Areia revirada e casca de inseto seca, um cheiro de cova fresca."
      marca: "No meio da duna, uma cova em cone de paredes lisas e escorregadias, perfeita demais para ser do vento."
      aproximacao: "A borda da cova cede sob o seu pé, a areia corre para o centro, e lá embaixo duas foices curvas abrem para você."
      rumor: "os guias das dunas dizem que cova perfeita no deserto não se pisa, nem para olhar o fundo"
    contra_jogo: "Não pisar a borda; de cima, com lança ou corda, as mandíbulas não alcançam. Areia molhada não escorre."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  mon_saltador_de_palafita:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [deserto_zhur]
      permanencia: [6, 9]
      foge_de: [mon_varano_vidrado, mon_hiena_sol]
    sinais:
      antecedencia: cedo
      rastro: "Pares de furinhos na areia a dez passos uns dos outros, como de alguém pulando em pernas de pau."
      resto: "Varetas finas e translúcidas quebradas na areia, com um osso escuro dentro de cada uma."
      som: "Um grito fino e agudo de bicho pequeno, e logo um bando de pulos leves vindo de todos os lados."
      cheiro: "Calo queimado de pé e capim seco roído, um cheiro de ninho no calor."
      marca: "No chão perto de um acampamento, canelas de bota mordidas em muitos pontos, todas na mesma altura."
      aproximacao: "Pulando dez passos de cada vez, chega um bando de bichos de orelhas enormes sobre pernas finas e translúcidas, e mordem as canelas."
      rumor: "os carregadores enfaixam as canelas no deserto: dizem que lá os bichos pequenos mordem baixo"
    contra_jogo: "Calar primeiro o que grita; as varetas quebram com qualquer pancada, e um saltador sem perna só morde o chão."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  enemy_verme_areia_jovem:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      estacoes: {verao: 1.5}
      territorio: [deserto_zhur]
      permanencia: [7, 10]
      presas: [mon_tatu_de_navalha]
    sinais:
      antecedencia: imediato
      rastro: "Uma faixa reta de chão liso e brilhante, recém-fundido, que atravessa a duna e some de repente para baixo."
      resto: "Uma bota sozinha em pé no meio da duna, e em volta dela o chão derretido em anéis, ainda quente."
      som: "Um guincho de atrito subindo por baixo dos pés, agudo como roda sem graxa, que chega tarde."
      cheiro: "Pedra fundida e calor de forno, um cheiro de oficina de vidreiro."
      marca: null
      aproximacao: "O chão sob você se abre em três abas de dentes brilhantes virados para dentro, e um corpo de anéis polidos sobe."
      rumor: "os caravaneiros dizem que no verão não se anda no deserto, se para, e se espera o guincho passar"
    contra_jogo: "Ficar parado, porque ele sente o peso que anda; pedra ou vidro sólido não o deixam subir, e o rastro de vidro novo mostra onde está."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  enemy_djinn_menor:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [dz_borda_do_vazio, deserto_zhur]
      permanencia: [7, 10]
      reage:
        - {quando: "clima:vendaval", efeito: mais}
        - {quando: "clima:limpo", efeito: menos}
    sinais:
      antecedencia: cedo
      rastro: "Riscos rentes ao topo das dunas, como de pano arrastado pelo vento, e a areia do alto da duna faltando."
      resto: "Uma tenda furada de cima em dezenas de pontos, como se uma chuva de grãos de pedra tivesse caído com força de funda."
      som: "Um bater de pele esticada no vento, como de vela solta, e uma rajada de grãos batendo em lona."
      cheiro: "Pó de grão moído no papo e um azedo de couro esticado ao sol."
      marca: "Nas pedras altas perto da borda sul, tiras de pele fina e escura rasgadas presas nas pontas, balançando ao vento."
      aproximacao: "No vento sobe uma pele escura esticada entre varetas de osso, enche o papo rente à duna, e cospe uma rajada sobre você."
      rumor: "os caravaneiros esperam o vento parar antes de atravessar perto da borda sul, nem que esperem o dia todo"
    contra_jogo: "Esperar o vento parar ou lutar abrigado dele, porque sem vento ela não sobe. Furar a pele entre as costelas a derruba."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  enemy_aranha_de_cristal:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [dz_borda_do_vazio]
      permanencia: [3, 4]
    sinais:
      antecedencia: cedo
      rastro: null
      resto: "Um pedaço da beirada da queda partido e caído, e na pedra que ficou, marcas de dedos largos e chatos como remos."
      som: "Um bater surdo e pesado na pedra por baixo da beirada, como de punhos enormes testando o chão."
      cheiro: "Calo grosso de pele e pedra úmida de paredão, que sobe da queda."
      marca: "Na beirada sul, unhas grossas como telhas cravadas na pedra e quebradas, e rachaduras novas em leque."
      aproximacao: "Da queda sobem duas mãos enormes de dedos chatos, em braços compridos como mastros, e agarram a beirada onde você está."
      rumor: "os Devoradores nunca olham por cima da beirada sul, e dizem que é por respeito"
    contra_jogo: "Longe da beirada ele só tem os braços, e cada cotovelo é uma junta que se quebra; cortar os dedos é cortar o que segura. Silêncio perto da borda o deixa parado."
    tramas: []
    autor: opus-370-lote3
    revisor_fauna: pendente
    revisao: pendente

  # ======================== HUMANOS QUE PAGARAM O PREÇO ========================
  mon_costurado_de_lentes:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [deserto_zhur]
      permanencia: [8, 11]
      suprime: [mon_peito_de_geodo]
    sinais:
      antecedencia: cedo
      rastro: "Marcas de mãos calejadas subindo um cristal alto ao anoitecer, e nenhuma descendo até de manhã."
