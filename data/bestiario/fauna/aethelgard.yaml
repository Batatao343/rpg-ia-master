# SPEC-370 R1 (lote 2) — bloco de fauna de Aethelgard: 25 fichas da SPEC-349 + legado `valoria`
# da região. Mesmo contrato da SPEC-360 §3.2; compilado em data/world/fauna.json por
# scripts/fauna/build.py. Sinal é vestígio, nunca a criatura: quem nomeia é o encontro.
# Revisão de fauna: handoffs/SPEC-370-independent-review.md (lote 2; revisor ≠ autor).
regiao: aethelgard
criaturas:
  # ============================== CORPOS REESCRITOS ==============================
  mon_doador_inacabado:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ae_ruinas_submersas, ae_camara_seca]
      permanencia: [8, 11]
    sinais:
      antecedencia: cedo
      rastro: "Dois sulcos finos e secos no limo do chão, como de feixes arrastados, que saem de uma câmara e voltam para a porta."
      resto: "Uma sandália élfica largada no degrau com o tornozelo de quem a usava marcado de dedos compridos, ainda frio."
      som: "Um arrasto leve e paciente, e um suspiro de boca aberta que não termina de soltar o ar."
      cheiro: "Pele seca de pergaminho molhado e um fundo metálico de recipiente vazio."
      marca: "Na porta de uma câmara de contenção, a lista dos voluntários gravada na pedra, e um nome sem a data do fim."
      aproximacao: "Pelo chão vem um elfo de pernas que são só tendões, a pele fina como papel, e veias turvas no peito acendem quando ele chega perto."
      rumor: "um pescador da margem diz que lá embaixo ainda há quem se ofereça, e que a oferta não acabou"
    contra_jogo: "Não deixá-lo agarrar; manter distância, ou matá-lo enquanto as veias ainda estão apagadas."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_dentado_de_eras:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ae_ruinas_submersas]
      permanencia: [8, 11]
    sinais:
      antecedencia: cedo
      rastro: "No lodo da galeria, pegadas curvadas para a frente, de quem carrega a cabeça como um peso, que vão de um barulho ao outro."
      resto: "Uma armadura de mergulho mordida até rasgar a placa, e no couro de baixo, só arranhões."
      som: "Um bater miúdo e constante de dentes uns nos outros, e um murmúrio em línguas que ninguém fala mais."
      cheiro: "Gengiva inflamada e água velha, como de boca de afogado aberta."
      marca: "No chão da galeria, dentes soltos de todos os tipos, de leite, de peixe e de bicho sem nome, caídos em fila."
      aproximacao: "Curvado sob uma cabeça enorme, vem um mergulhador de mandíbula estufada de dentes que descem pelo pescoço em placas."
      rumor: "os mergulhadores velhos dizem que quem desce fundo demais volta falando com a boca de outros"
    contra_jogo: "Lutar sem contar com a armadura, ou gastar uma ação para arrancar os dentes cravados; atacar pelos lados, onde a cabeça pesada demora a virar."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_avesso_de_oghma:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ae_ruinas_submersas]
      permanencia: [7, 10]
    sinais:
      antecedencia: cedo
      rastro: "Marcas de mãos e pés virados ao contrário no lodo, em bando, que correm para os pontos onde alguém respirou."
      resto: "Um mergulhador com a perna presa entre costelas partidas de outra coisa, os ossos fechados como dedos sobre a canela."
      som: "Estalos secos e rápidos, como de muitos dedos de osso se fechando de uma vez, e um piscar úmido."
      cheiro: "Carne de dentro para fora, crua e quente, que a água fria não leva."
      marca: "Nas galerias que descem, rachaduras novas nas paredes de dentro para fora, como se a pedra tivesse sido empurrada."
      aproximacao: "De barriga para cima e cabeça pendurada, um corpo aberto em gaiola de ossos corre para você e se joga por baixo da sua perna."
      rumor: "os guias de mergulho não descem as galerias do fundo: dizem que lá a água empurra por dentro"
    contra_jogo: "Não deixar que ele chegue por baixo, chutando-o de lado; preso, quebrar uma costela da gaiola solta o membro."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_fervido_da_corrente:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ae_ruinas_submersas, aethelgard]
      permanencia: [9, 12]
    sinais:
      antecedencia: cedo
      rastro: null
      resto: "Um peixe cozido boiando de barriga para cima no meio de uma galeria fria, e a água em volta ainda morna."
      som: "Um borbulhar constante de panela, que fica mais forte quando alguém se aproxima pelo corredor."
      cheiro: "Cinza quente molhada e couro cozido, cheiro de chaleira esquecida no fogo."
      marca: "Na parede de um corredor submerso, uma mancha de lodo cozido e branco, na altura de um homem encostado."
      aproximacao: "No corredor, um mago de pele esticada e brilhante como couro molhado espera, e o brilho baço sai dos olhos e da boca."
      rumor: "os mergulhadores dizem que há corredor no fundo onde a água escalda sozinha, e que não é fonte"
    contra_jogo: "Feri-lo pouco e matá-lo de uma vez, com um golpe grande, ou atraí-lo para fora da água, onde o calor se perde no ar."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  enemy_esqueleto_mago:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer, Noite]
      territorio: [ae_camara_seca, ae_ruinas_submersas]
      permanencia: [9, 12]
    sinais:
      antecedencia: cedo
      rastro: "Pegadas secas de sandália que vão de uma lamparina acesa a outra, sempre parando de frente para a luz."
      resto: "Um saqueador caído com um corte reto e cauterizado atravessando o peito, como feito por um raio de sol."
      som: "Um murmúrio de fórmula recitada no ritmo exato, sem voz, e um zumbido fino quando a luz entra."
      cheiro: "Pó de vidro e ar parado de biblioteca, um cheiro seco de câmara fechada há séculos."
      marca: "Nas paredes das câmaras secas, riscos de luz queimados em leque, partidos como os de um prisma."
      aproximacao: "Um estudioso de túnica do conselho, de olhos leitosos, com prismas de seis faces furando os braços e a espinha, ergue os braços para a sua lamparina."
      rumor: "um saqueador diz que nas câmaras secas é melhor andar no escuro: lá a luz volta afiada"
    contra_jogo: "Apagar ou tapar a luz, ou pôr-se atrás de pedra quando os prismas acendem; no escuro, ele só tem as mãos."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  enemy_fantasma:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [aethelgard, ae_ruinas_submersas]
      permanencia: [7, 10]
      presas: [mon_bigua_de_vidro]
      foge_de: [mon_afogado_de_aethelgard]
    sinais:
      antecedencia: imediato
      rastro: null
      resto: "Um pescador puxado do raso para o fundo, só a rede ficou na margem, molhada e rasgada por dedos de membrana."
      som: null
      cheiro: "Água limpa e fria demais, com um fundo leve de lodo escuro que não devia estar ali."
      marca: "Na água cristalina da borda, uma ossada de peixe grande desenhada no fundo, e no lugar dela, no dia seguinte, nada."
      aproximacao: "Na água clara da borda nada de lado uma ossada humana, um coração escuro batendo nas costelas, e os braços já se abrem."
      rumor: "os pescadores da margem não entram na água limpa, só na turva, e riem de quem pergunta"
    contra_jogo: "Turvar a água ou tirá-lo dela; turvo ou fora da água ele fica opaco e lento. Mirar o coração escuro."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  enemy_golem_carne:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [aethelgard]
      permanencia: [10, 12]
    sinais:
      antecedencia: cedo
      rastro: "No cais da margem, uma marca de algo dobrado arrastado para dentro de um caixote, e as ripas de volta no lugar."
      resto: "Um carregador caído ao lado de um caixote aberto, dobrado ao meio para trás, como se o tivessem embalado."
      som: "Um ranger de juntas quebradas se dobrando para dentro, e o estalo de ripas pregadas cedendo."
      cheiro: "Corda alcatroada e afogado velho, um cheiro de porão de navio de contrabando."
      marca: "Na margem, uma pilha de caixotes de embarque pregados que ninguém veio buscar, um deles com a tampa empurrada de dentro."
      aproximacao: "De dentro de um caixote se desdobra um corpo costurado com corda, de quatro braços em ângulo e duas cabeças tombadas."
      rumor: "um contrabandista da margem jura que vendeu um caixote vivo e que o comprador nunca veio buscá-lo"
    contra_jogo: "Não tocar nos caixotes, ou atraí-lo para longe da margem antes de abri-los; cortar os pontos de corda solta um braço."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  # ============================== BESTAS DA ENTROPIA ==============================
  mon_cacao_de_lastro:
    fonte: ficha
    ecologia:
      horario: [Tarde, Anoitecer, Noite]
      territorio: [aethelgard]
      permanencia: [3, 4]
      presas: [mon_ourico_de_lajedo]
      reage:
        - {quando: "carcaca_recente", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "No fundo raso da borda, uma faixa larga sem nenhuma pedra solta, varrida como chão de casa."
      resto: "Pedras esculpidas das ruínas caídas no raso, lisas e babadas, com marcas de dentes dobrados para trás."
      som: "Um baque surdo de algo enorme batendo de volta na água, e ondas que chegam à margem sem vento."
      cheiro: "Sal de mar dentro do lago doce, e couro de peixe grande, áspero e gordo."
      marca: "Num barco de pesca da borda, o fundo arranhado de fora como por uma lixa do tamanho de um cavalo."
      aproximacao: "Do fundo raso sobe uma cabeça chata e larga como a de um barco, as fileiras de dentes dobradas para trás, e a barriga cheia de pedras raspa a lama."
      rumor: "os pescadores dizem que no lago há bicho de mar, e que se o virem pular é para remar para longe"
    contra_jogo: "Escolher quando abrir a barriga; no fundo ele morde, no ar ele cai. Quem está num barco o prefere no fundo, quem está na água o quer no ar."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_bigua_de_vidro:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde]
      territorio: [aethelgard]
      permanencia: [6, 9]
      presas: [mon_camarao_faxineiro]
    sinais:
      antecedencia: cedo
      rastro: null
      resto: "Uma lasca turva e cortante, fina como pena, presa na borda de um barco e tingida de sangue de quem a pegou."
      som: "Um tilintar de cacos que se sacodem ao vento, e o baque seco de algo pesado mergulhando como pedra."
      cheiro: "Peixe pescado agora e penas molhadas, com um fundo frio de cristal."
      marca: "Nas estacas e arcos que despontam da água, manchas brancas de ave e cacos foscos espalhados embaixo."
      aproximacao: "De uma estaca mergulha uma ave preta de pescoço comprido, as asas cobertas de penas de cristal que cortam o ar."
      rumor: "os nadadores da margem cobrem a cabeça quando o bando sai das estacas para pescar"
    contra_jogo: "Arma de arremesso, ou esperar o mergulho e golpear quando ela está na água; molhada e pesada de vidro, demora a levantar."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_aranha_de_bolha:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ae_ruinas_submersas]
      permanencia: [8, 11]
      presas: [mon_camarao_faxineiro]
    sinais:
      antecedencia: imediato
      rastro: "Fios brancos esticados de arco em arco nos corredores submersos, tensos, que vibram quando alguém nada perto."
      resto: "Um mergulhador enrolado em seda até os joelhos, preso de cabeça para cima num canto onde ainda há ar."
      som: null
      cheiro: "Ar velho preso debaixo d'água, abafado como de quarto fechado no fundo do lago."
      marca: "Entre dois arcos afundados, um volume prateado de seda do tamanho de um quarto, inchado de ar."
      aproximacao: "Os fios em volta das suas pernas se fecham, e de dentro do volume prateado desce uma coisa marrom do tamanho de um homem."
      rumor: "um mergulhador conta que achou ar no fundo do lago, e que o ar tinha dono"
    contra_jogo: "Cortar os fios antes de ir até ela; quem foi puxado deve furar o sino, porque sem ar dentro ela perde a casa e solta."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_lesma_de_penacho:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ae_ruinas_submersas]
      permanencia: [7, 10]
      foge_de: [mon_quimera_cristal]
    sinais:
      antecedencia: cedo
      rastro: "Um rastro que brilha nas paredes das câmaras, fino e úmido, que vai direto até onde há lascas acesas."
      resto: "Uma bolsa de mergulhador comida por dentro, os cristais roubados e o couro brilhando de baba."
      som: "Um chupar baixo e úmido na pedra, quase nada, que para quando alguém prepara magia."
      cheiro: "Maresia doce e Éter, um cheiro de raio que caiu dentro da água."
      marca: "Nas paredes onde havia cristal, faixas raspadas até a pedra e listras de cor que mudam devagar."
      aproximacao: "Na parede, um bicho mole e lustroso do tamanho de um gato ergue um tufo de dedos carnudos que brilham na ponta."
      rumor: "um mago de margem jura que perdeu um feitiço inteiro para um bicho que não chegava ao joelho dele"
    contra_jogo: "Abrir a luta com aço e deixar a magia para depois, ou gastar nela um feitiço fraco primeiro; com o penacho cheio, não a toque de mão. Sal faz o penacho murchar."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_ourico_de_lajedo:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [aethelgard, ae_ruinas_submersas]
      permanencia: [9, 12]
      foge_de: [mon_cacao_de_lastro]
    sinais:
      antecedencia: cedo
      rastro: "Nas lajes rasas, riscos de raspar em estrela de cinco pontas, de quem come a pedra devagar."
      resto: "Uma bota de couro furada por um espinho cor de ferrugem que cresceu lá dentro até atravessar a sola."
      som: "Um raspar miúdo de dentes na pedra debaixo d'água, de centenas ao mesmo tempo."
      cheiro: "Sal de mar e alga raspada, estranho no lago doce."
      marca: "Num degrau submerso das ruínas, um tapete escuro de espinhos soltos que ainda estão crescendo, cada dia mais compridos."
      aproximacao: "A laje sob o seu pé está coberta de bolas escuras de espinhos ocos, e uma delas dispara pela água."
      rumor: "os mergulhadores dizem que nos degraus rasos se pisa devagar e de bota, ou se volta mancando para sempre"
    contra_jogo: "Matá-lo logo, antes que a laje feche, ou lutar parado; quem tem de atravessar vai calçado e devagar, porque ele sente o tremor do passo."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_cupinzeiro_de_vidro:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ae_camara_seca]
      permanencia: [10, 12]
    sinais:
      antecedencia: cedo
      rastro: "Trilhas miúdas e brancas no pó das câmaras, que vão dos cristais apagados até um mesmo canto."
      resto: "Um cristal de contenção roído até a base, oco, cheio de grãos turvos cuspidos um a um."
      som: "Um estalar fino e incessante, como de areia caindo em telha quente, que vem de dentro de algo."
      cheiro: "Pó de cristal e bicho branco de colônia, um cheiro de formigueiro aquecido."
      marca: "Num corredor seco, uma parede baixa e bolhosa de material turvo que não estava ali, ainda pegajosa nas bordas."
      aproximacao: "Num canto da câmara ergue-se um monte turvo da altura de um homem, e de todas as bocas dele saem cupins de cabeça grande."
      rumor: "um saqueador diz que nas câmaras secas as paredes crescem quando se briga perto delas"
    contra_jogo: "Quebrar o monte até a rainha, ou levar a luta para longe do ninho; as paredes são de vidro e cedem a pancada, não a lâmina."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_camarao_faxineiro:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [ae_ruinas_submersas]
      permanencia: [7, 10]
      foge_de: [mon_bigua_de_vidro, mon_aranha_de_bolha]
    sinais:
      antecedencia: cedo
      rastro: null
      resto: "Uma ferida de morto fechada por uma pele nova, grossa e clara, que não é de gente."
      som: "Um crepitar baixo na água, como de mil pinças miúdas trabalhando juntas."
      cheiro: "Carne podre limpa e quitina fresca, um cheiro de peixaria lavada."
      marca: "Num morto da patrulha caído no fundo, as bordas das feridas raspadas limpas e, em volta, cascas finas de muda listradas de vermelho."
      aproximacao: "Uma nuvem de bichinhos claros listrados de vermelho desce sobre a ferida do morto, e o corte começa a fechar."
      rumor: "os pescadores dizem que os mortos do lago não apodrecem porque têm quem cuide deles"
    contra_jogo: "Espantar o enxame primeiro, com luz forte, fogo ou rede fina, ou ferir os Afogados longe dele; sem a nuvem, os Afogados não fecham."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  mon_quimera_cristal:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer]
      territorio: [aethelgard, ae_ruinas_submersas]
      permanencia: [7, 10]
      presas: [mon_lesma_de_penacho]
    sinais:
      antecedencia: cedo
      rastro: "Marcas de patas de membrana larga no lodo da margem, em família, que somem na água de uma vez."
      resto: "Um mergulhador que ficou para trás do grupo, achado do outro lado da galeria, com uma mordida que quebrou o osso."
      som: "Um assobio agudo de bicho d'água, respondido por outros, e o zunido de algo atravessando a água rápido demais."
      cheiro: "Pelo oleoso molhado e peixe meio comido, um cheiro de toca de beira de rio."
      marca: "Numa pedra da margem, restos de bichos moles roídos e fios finos e turvos partidos, como bigodes quebrados."
      aproximacao: "Da água sai de repente, rápida demais, uma lontra enorme de pelo escuro e bigodes turvos e duros, com a mancha clara na garganta."
      rumor: "os guias de mergulho mandam nunca ficar para trás nas galerias, nem para ver o que brilhou"
    contra_jogo: "Ficar junto, sem deixar ninguém para trás, e lutar longe das Correntes; quebrar os bigodes de cristal a deixa sem saber onde a Corrente está."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: opus-370-revisor-lote2
    revisao: aprovada

  # ======================== HUMANOS QUE PAGARAM O PREÇO ========================
  mon_peito_de_sino:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [aethelgard, ae_ruinas_submersas]
      permanencia: [8, 11]
      suprime: [mon_mergulhadores_saqueadores]
    sinais:
      antecedencia: cedo
      rastro: "Na margem, pegadas pesadas de pés curtos que entram na água e não voltam por horas."
      resto: "Um saqueador rival achado no fundo de uma rota funda, afogado com os braços de alguém ainda marcados na cintura."
      som: "Um fôlego enorme puxado na margem, longo como fole de forja, e depois silêncio na água."
      cheiro: "Couro de mergulho e fôlego velho, um bafo morno de pulmão grande demais."
      marca: "Numa rota funda das ruínas, as cordas-guia de outros mergulhadores cortadas e uma só deixada inteira."
      aproximacao: "Da água sobe um mergulhador de tórax inchado como barril, rachado no couro, e os braços curtos já buscam a sua cintura."
      rumor: "os mergulhadores dizem que há rota no fundo que é de um homem só, e que ele espera lá embaixo"
