# SPEC-370 R1 (lote 1) — bloco de fauna do Pântano da Melancolia: 22 fichas da SPEC-359 + legado
# `valoria` da região. Mesmo contrato da SPEC-360 §3.2; compilado em data/world/fauna.json por
# scripts/fauna/build.py. Sinal é vestígio, nunca a criatura: quem nomeia é o encontro.
# Revisão de fauna: handoffs/SPEC-370-independent-review.md (lote 1; revisor ≠ autor).
regiao: pantano_melancolia
criaturas:
  # ============================== CORPOS REESCRITOS ==============================
  mon_estaqueiro_afogado:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [pm_cripta_afogada]
      permanencia: [9, 12]
      reage:
        - {quando: "clima:chuva", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Na lama da descida, furos redondos e fundos, todos do mesmo tamanho, em linha reta até a porta."
      resto: "Lascas de madeira escura boiando na entrada, gastas numa ponta só, como de pau fincado muitas vezes."
      som: "Lá dentro, uma batida surda e paciente na lama, depois silêncio, depois outra, um palmo adiante."
      cheiro: "Sebo de vela frio misturado a água parada, gorduroso no fundo da garganta."
      marca: "Uma tira de couro arrebentada no degrau, ainda com o formato de um pulso e pedaços de pele branca e granulosa."
      aproximacao: "Atrás de uma fileira de paus fincados até o peito, um vulto de rosto branco como cera ergue mais um e o enterra."
      rumor: "um saqueador jura que lá embaixo os mortos ficam em fila, virados para a porta, como quem espera visita"
    contra_jogo: "Arrancar as estacas da fileira, uma por vez, ou derrubá-lo primeiro; sem a fileira, os de trás ficam ao alcance."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_romeiro_de_ambar:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [pantano_melancolia]
      permanencia: [7, 10]
      reage:
        - {quando: "pressao:praga", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Pingos grossos e endurecidos na trilha, cor de chá forte, em fila até a lona das tendas."
      resto: "Uma bota presa ao chão numa poça de resina dura, com o pé de alguém ainda dentro, mosquitos presos em volta."
      som: "Um estalido seco de crosta rachando a cada passo, e logo um chiado baixo de coisa se fechando."
      cheiro: "Chá de ervas fervido demais e, por baixo, ferro, como de ferida que verte em vez de sangrar."
      marca: null
      aproximacao: "Entre as tendas, um homem coberto de placas translúcidas cor de mel vem escorrendo, e a carne viva brilha por baixo."
      rumor: "uma vendedora de chá diz que tem freguês de vinte anos que já não paga, só aparece"
    contra_jogo: "Pancada quebra o âmbar, nos pés e nele; fogo amolece a resina, e as placas dele escorrem antes das de quem ficou preso."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_banhado_do_centro:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [pm_profundezas]
      permanencia: [8, 11]
      suprime: [mon_casaco_de_sanguessugas]
      reage:
        - {quando: "pressao:guerra", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Pegadas enormes de pé descalço na lama, cada uma cercada de uma auréola negra que não se mistura à água."
      resto: "Uma espada de saqueador largada no raso, a lâmina comida de ferrugem até o meio, mas o cabo novo."
      som: "Uma respiração lenta e molhada de velho, e um gotejar constante que não vem de cima."
      cheiro: "Sangue velho e ferro molhado, forte como dentro de um açougue fechado."
      marca: "Nos elmos afundados de uma mesma fileira, marcas de dedos pretos, como se alguém os contasse todo dia."
      aproximacao: "Da lama sobe um velho imenso de veias pretas, suando um caldo escuro que escorre pelo peito e pinga das mãos."
      rumor: "um saqueador velho diz que há um trecho do fundo onde a lâmina apodrece na mão antes do primeiro golpe"
    contra_jogo: "Feri-lo com o que não enferruja (pedra, osso, pau, fogo) ou trocar de arma a cada golpe; quem insiste na mesma lâmina acaba batendo com ferrugem."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  enemy_zumbi_blindado:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [pantano_melancolia]
      permanencia: [7, 10]
      reage:
        - {quando: "clima:chuva", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Um sulco largo e raso na turfa, sem marca de pé nem de mão, que dobra e volta como um saco arrastado."
      resto: "Um cordão de amuleto partido na beira da trilha, com um tufo de cabelo ruivo e duro ainda enrolado nele."
      som: "Um rangido de couro velho dobrando, como sela pisada, vindo de perto do chão."
      cheiro: "Cheiro azedo de curtume e de terra encharcada, que gruda na roupa."
      marca: "Na turfa, o molde achatado de um corpo deitado de costas, com o fundo ainda morno."
      aproximacao: "Rente ao chão, uma figura de couro escuro e brilhante se desdobra de uma vez, sem um osso que a segure."
      rumor: "um coveiro dos Corvos conta que a turfa devolveu um corpo que eles já tinham enterrado duas vezes"
    contra_jogo: "Pancada, não lâmina; sem ossos que o sustentem, depois de amassado ele não se levanta."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  # ============================== BESTAS DA ENTROPIA ==============================
  mon_castor_de_estacas:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [pantano_melancolia]
      permanencia: [8, 11]
      foge_de: [mon_borda_que_anda]
      reage:
        - {quando: "clima:chuva", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Um caminho alisado na lama entre a água e o capim, largo como uma pá, com raspas de madeira tratada."
      resto: "Um marco dos druidas roído até virar ponta de lápis, a fita da medição boiando solta ao lado."
      som: "Um estalo chapado na água, forte como um tapa em mesa, e depois o ranger de madeira sendo puxada."
      cheiro: "Piche e madeira molhada roída de fresco, com um fundo de toca."
      marca: "Uma represa de paus e ossos atravessada no canal, e a água parada acima dela, mais alta que a do Pântano."
      aproximacao: "Na represa, um bicho do tamanho de um bezerro, eriçado de lascas, arreganha duas lâminas laranja na boca."
      rumor: "um druida reclama que a borda medida na segunda amanheceu dez passos mais perto da estrada"
    contra_jogo: "Derrubar uma estaca da represa a desfaz; ele larga tudo para consertar, e é aí que fica de costas."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_patinador_de_oleo:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [pantano_melancolia, pm_profundezas]
      permanencia: [6, 9]
      presas: [mon_mosquito_eter]
      reage:
        - {quando: "clima:vendaval", efeito: menos}
        - {quando: "clima:chuva", efeito: menos}
    sinais:
      antecedencia: cedo
      rastro: "Na superfície parada da água, seis covinhas em leque que somem e reaparecem mais longe, sem onda nenhuma."
      resto: "Uma rã boiando de barriga para cima, murcha como odre vazio, com um furo fino no lombo."
      som: "Um tique-tique leve e rápido sobre a água, como de varetas tocando um tambor esticado."
      cheiro: null
      marca: "Na beira da água, cascas finas de pernas compridas como junco, largadas numa muda."
      aproximacao: "Sobre a água lisa vem um inseto do tamanho de um antebraço, apoiado em pernas tão abertas que cobrem uma carroça."
      rumor: "um coletor diz que nas águas paradas é melhor bater na superfície antes de encher o cantil"
    contra_jogo: "Agitar a água; a película quebrada não o segura, e ele cai e se debate como qualquer inseto molhado."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_cagado_de_geada:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      estacoes: {inverno: 1.2, verao: 0.8}
      territorio: [pm_profundezas]
      permanencia: [9, 12]
      presas: [mon_sanguessuga_braco]
    sinais:
      antecedencia: cedo
      rastro: "Riscos largos de garra na lama da beira, de pá em pá, que terminam numa pedra que não estava ali."
      resto: "Uma luva de couro presa num gelo salobro na beira da água, com os dedos ainda dentro."
      som: "Um estalo curto como de armadilha fechando, e depois o tilintar de agulhas de gelo caindo na água."
      cheiro: "Um cheiro limpo e salgado de frio, estranho no meio do lodo quente."
      marca: "Uma crosta branca que não derrete nos degraus da beira, mesmo ao sol do meio-dia."
      aproximacao: "A pedra da beira levanta uma cabeça grande demais, de bico em gancho, e o hálito dela embranquece a água."
      rumor: "os do fundo dizem que no verão há um buraco d'água onde a beira amanhece com gelo"
    contra_jogo: "Calor. Fogo perto da cabeça o faz soltar e recolher; e nunca se debruçar no poço que ele guarda pela frente."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_fundeiro_da_poca:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [pm_profundezas, pm_cripta_afogada]
      permanencia: [7, 10]
      presas: [mon_patinador_de_oleo]
      reage:
        - {quando: "clima:neblina", efeito: menos}
    sinais:
      antecedencia: imediato
      rastro: null
      resto: "Um saqueador caído de costas na margem rasa, o peito afundado por um golpe redondo, a roupa encharcada."
      som: "Um gorgolejo cheio, de garganta enchendo, e logo um estalo de chicote contra a água."
      cheiro: "Escama velha e lodo revolvido, como se o fundo tivesse subido à tona."
      marca: "Na pedra da margem, círculos de água seca, um por cima do outro, na altura do peito de um homem."
      aproximacao: "A água da beira estufa, um tubo de lábios de chifre aponta para fora, e o jato sai duro como pedra."
      rumor: "um coletor perdeu o irmão na beira da água funda: diz que a água mesmo o derrubou"
    contra_jogo: "Sair da linha da poça; ele só cospe para cima e para a frente, e de lado, na margem rasa, não alcança nem enxerga."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_tritao_de_sobra:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [pm_profundezas]
      permanencia: [9, 12]
      presas: [mon_arraia_de_lodo]
      reage:
        - {quando: "carcaca_recente", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Na lama do raso, marcas de pata em número que não fecha: cinco, sete, uma comprida entre duas curtas."
      resto: "Um toco rosado e mole, do tamanho de um dedo, largado na beira como coisa que brotou e caiu."
      som: "Um esmagar úmido debaixo da água e, de vez em quando, bolhas que sobem em fila desencontrada."
      cheiro: "Muco de bicho d'água, adocicado e grosso, como de rã guardada num balde."
      marca: "Uma franja de guelra vermelha presa num galho afundado, ainda pulsando de leve."
      aproximacao: "Do fundo sobe um bicho liso do tamanho de um boi, de franjas vermelhas na nuca e patas demais, todas desencontradas."
      rumor: "um saqueador diz que cortou a perna de um bicho do fundo e, dois dias depois, o bicho tinha três"
    contra_jogo: "Fogo e pancada, não lâmina; e acabar rápido, porque cada corte sem queimar é mais uma pata."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_musaranho_de_dente_vermelho:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [pantano_melancolia]
      permanencia: [6, 8]
      presas: [mon_sanguessuga_braco, mon_mosquito_eter]
      reage:
        - {quando: "pressao:fome", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Uma trilha miúda e frenética no capim, que vai e volta sem rumo, cheia de pelo cinza solto."
      resto: "Um rabo comprido e pelado, roído até a metade, e o resto do bicho nenhum."
      som: "Um mastigar sem pausa, rápido como o tique de um relógio, vindo do capim alto."
      cheiro: null
      marca: "Rãs mordidas uma vez cada, em fila na margem, nenhuma comida inteira, a ferida enferrujada."
      aproximacao: "Do capim salta um bicho magro do tamanho de um cão, focinho tremendo, a boca rubra de ferro mastigando o ar."
      rumor: "uma menina da borda diz que um bicho comeu as sanguessugas do balde do pai, e o balde também"
    contra_jogo: "Mantê-lo longe por uma ou duas rodadas; sem morder, ele se gasta sozinho."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_borda_que_anda:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite]
      territorio: [pantano_melancolia]
      permanencia: [3, 4]
      reage:
        - {quando: "clima:neblina", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "O chão firme da trilha cedeu numa faixa larga, de um dia para o outro, e a água já brota dele."
      resto: "Uma fita de medição dos druidas presa num tijolo de turfa, longe de qualquer marco."
      som: "Um gemido grave e longo do chão, como de barranco cedendo, e o ranger de madeira contra madeira."
      cheiro: "Ferro e fungo, forte e quente, como de terra revirada sobre carne."
      marca: "O barranco da beira tem uma fileira de paus enterrados na crista, um por ano, e ontem não tinha."
      aproximacao: "O barranco se levanta sobre colunas de lodo, a crista eriçada de paus fitados, e o chão firme afunda sob ele."
      rumor: "o irmão Ceslo jura que mediu o barranco na segunda e na terça ele estava mais perto da estrada"
    contra_jogo: "Lutar de costas para a terra seca e mirar as estacas da crista; cada estaca arrancada é um ano que ela perde, e ela recua para buscá-lo."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  # ======================== HUMANOS QUE PAGARAM O PREÇO ========================
  mon_podador_do_ciclo:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde]
      territorio: [pantano_melancolia]
      permanencia: [7, 10]
      suprime: [mon_jardineiro_de_tumores]
      reage:
        - {quando: "pressao:praga", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Galhos e raízes cortados rente na trilha, em bisel limpo, todos no ponto exato onde começavam a apodrecer."
      resto: "Um crescimento de carne e musgo partido ao meio na lama, a raiz ainda se mexendo, e nenhuma pegada de luta."
      som: "Um assobio curto de lâmina no ar, e depois um baque macio, como de fruta podre caindo."
      cheiro: "Seiva verde cortada de fresco e, por cima, o cheiro limpo de osso serrado."
      marca: "Num tronco, os sinais de proteção dos druidas riscados com uma ponta curva que não é faca nem foice."
      aproximacao: "Um velho cinzento de antebraços curvos como podões de osso olha para você e procura, com calma, onde está a parte podre."
      rumor: "um ferido que fugiu da beira diz que o velho que o achou só queria lhe cortar a perna, e era educado"
    contra_jogo: "Enfrentá-lo sem Ferimento aberto, ou deixar a Carta melhor para depois do corte; contra quem está inteiro, ele não acha o que podar e só corta raso."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_jardineiro_de_tumores:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [pantano_melancolia, pm_profundezas]
      permanencia: [7, 10]
      foge_de: [mon_podador_do_ciclo]
      reage:
        - {quando: "pressao:praga", efeito: mais}
        - {quando: "clima:miasma", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Pegadas fundas e curvas para a frente, de quem anda carregando peso nas costas, e terra revolvida a cada dez passos."
      resto: "Um canteiro aberto na lama em sulcos regulares, com caroços de carne pulsando, plantados em fileira."
      som: "Uma respiração em coro, de várias coisas inspirando junto, vinda de trás das moitas."
      cheiro: "Terra adubada e carne quente, como esterco misturado a sangue."
      marca: "Uma pá de cabo curto fincada na trilha, o cabo manchado de verde e o ferro de vermelho."
      aproximacao: "Curvado sob um canteiro de caroços que incham no ritmo da respiração dele, um homem de braços magros se ergue da lama."
      rumor: "um caçador da borda achou um pé de couve brotando de um corte que ele mesmo levou na perna"
    contra_jogo: "Matá-lo de longe, sem lhe dar ferida para semear; e quem sair ferido procura um druida do Ciclo antes de dormir."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_mula_de_lagrimas:
    fonte: ficha
    ecologia:
      horario: [Noite, Amanhecer]
      territorio: [pantano_melancolia]
      permanencia: [6, 8]
      foge_de: [mon_casaco_de_sanguessugas, mon_regaco_da_margem]
    sinais:
      antecedencia: cedo
      rastro: "Pegadas de pernas abertas, viradas para fora, e entre elas gotas de água que brilham azul por um instante."
      resto: "Um saco de couro vazio, rasgado com os dentes, e cascas de pão duro mastigadas e cuspidas."
      som: "Um choro baixo e regular, sem soluço, de quem já cansou de chorar e continua."
      cheiro: "Ferro molhado e suor de febre, ácido como de quem não bebe há dias."
      marca: "Uma luz azul-pálida, fraca, que passa entre as moitas na direção dos portões e some de repente."
      aproximacao: "Um homem magro de barriga inchada e translúcida, cheia de gotas azuis que brilham, para de chorar e olha para você."
      rumor: "um guarda do portão diz que tem contrabandista que passa de mãos vazias e barriga acesa"
    contra_jogo: "Matá-lo de longe, ou deixá-lo fugir; ele foge quando pode, e a carga vai embora com ele."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_casaco_de_sanguessugas:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer, Noite]
      territorio: [pm_profundezas]
      permanencia: [7, 10]
      suprime: [mon_mula_de_lagrimas]
      reage:
        - {quando: "carcaca_recente", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Uma trilha de quem andou na água funda até o peito e voltou sem pressa, com gotas escuras pingando do raso."
      resto: "Um saqueador rival estirado na beira, branco de não ter mais sangue, coberto de marcas redondas de ventosa."
      som: "Um estalo molhado, como de boca soltando uma garrafa, e um suspiro de alívio que não é de gente."
      cheiro: "Lodo quente e couro de bicho vivo, como de dentro de uma barrica de iscas."
      marca: "Um trecho de espólio cercado por armaduras empilhadas, com um aviso riscado: aqui é meu."
      aproximacao: "Da água funda sai um homem de pele branca, o peito e os ombros cobertos de bichos negros que incham e murcham."
      rumor: "os do fundo dizem que há um saqueador que não sai da água fria, e não fica triste, nem com frio, nem com nada"
    contra_jogo: "Arrancar a sanguessuga na hora, mesmo custando a ação; fogo no casaco solta todas de uma vez, e ele passa a sentir o que não sentia."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_turno_vencido:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [pantano_melancolia]
      permanencia: [9, 12]
      suprime: [enemy_druida_renegado]
    sinais:
      antecedencia: cedo
      rastro: "Pés descalços que pisam a lama com força, parados de tempos em tempos, como de quem escuta pela sola."
      resto: "Uma tigela de argila cinza, molhada e recém-mexida, deixada no pilar de um posto vazio."
      som: "Um raspar seco, de unha em casca de barro, e uma reza murmurada que pula as mesmas palavras."
      cheiro: "Argila úmida e cal, como de oficina de oleiro deixada de portas abertas."
      marca: "Na porta do posto, uma lista de rendições de duas semanas, e o último nome riscado e reescrito muitas vezes."
