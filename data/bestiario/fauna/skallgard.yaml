# SPEC-370 R1 (lote 1) — bloco de fauna de Skallgard: 23 fichas da SPEC-349 + legado `valoria` da
# região. Mesmo contrato da SPEC-360 §3.2; compilado em data/world/fauna.json por
# scripts/fauna/build.py. Sinal é vestígio, nunca a criatura: quem nomeia é o encontro.
# Estação do calendário (R4): enemy_lobo_invernal e enemy_yeti com inverno 1,5 (calendar.json).
# Revisão de fauna: handoffs/SPEC-370-independent-review.md (lote 1; revisor ≠ autor).
regiao: skallgard
criaturas:
  # ============================== CORPOS REESCRITOS ==============================
  mon_parado_do_sopro:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [skallgard]
      permanencia: [8, 11]
      reage:
        - {quando: "clima:vendaval", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Pegadas desiguais na neve, uma firme e outra arrastada, que andam em círculo e voltam sempre ao mesmo ponto."
      resto: "Uma luva de caçador caída na neve, quente por dentro de um lado só, e congelada dura do outro."
      som: "Um passo e um arrasto, um passo e um arrasto, sem pressa nenhuma, e nenhuma respiração junto."
      cheiro: "Sangue fresco no meio do frio seco, como de corte recém-aberto, sem ferido nenhum à vista."
      marca: "Num ponto do caminho a geada não pousa: um retângulo de neve mole, do tamanho de um homem deitado de lado."
      aproximacao: "Um caçador de braço erguido no fim de um golpe vem arrastando a perna, a ferida do antebraço vermelha como de agora."
      rumor: "um velho caçador diz que viu o companheiro morto há trinta anos voltando da tundra, e mais moço que ele"
    contra_jogo: "Ficar fora do arco do braço erguido e bater pelo lado vivo, que é lento e velho; o braço parado não gira para trás."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_levantado_de_rubi:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [skallgard]
      permanencia: [8, 11]
      reage:
        - {quando: "carcaca_recente", efeito: mais}
        - {quando: "pressao:abismo", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Pegadas cinzentas que pingam: cada passo deixa uma poça de água derretida, e em volta dela pingentes de gelo novo."
      resto: "Um corpo que estava enterrado na neve, de costelas abertas para fora como porta arrombada, sem nada dentro."
      som: "Um gotejar ritmado no meio da nevasca, como de telhado em degelo, onde não há telhado nenhum."
      cheiro: "Pedra quente e sangue velho, um cheiro de forja apagada no meio do frio."
      marca: "Na neve, um círculo derretido até a terra, do tamanho de uma roda de carroça, com bordas vermelhas."
      aproximacao: "Um morto de carne cinzenta e mandíbula solta vem até você, e do peito aberto brota uma flor de cristal vermelho que pulsa."
      rumor: "os da Parede dos Mortos dizem que um nome riscado lá voltou a andar com uma brasa no peito"
    contra_jogo: "Quebrar o rubi antes de derrubar os outros; um golpe pesado no peito aberto basta, e derrubado o Levantado primeiro, quem cai fica no chão."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_queimado_de_breu:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [sk_farol_chama_negra]
      permanencia: [7, 10]
      reage:
        - {quando: "clima:nevasca", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Pegadas de bota que vão de uma tocha apagada à seguinte, sempre em linha reta, sem desviar de nada."
      resto: "Uma lanterna de viagem fria e intacta, o pavio inteiro e seco, como se a chama tivesse simplesmente desistido."
      som: null
      cheiro: "Pavio apagado e fuligem fria, sem calor nenhum, como de lampião que nunca foi aceso."
      marca: "No caminho para a torre, um trecho de neve que não brilha nem à lua, fosco como pano preto estendido."
      aproximacao: "Um caçador de rosto e mãos foscos como fuligem vira para a sua luz dois discos pretos e largos no lugar dos olhos."
      rumor: "as vigias do Ermo contam que as tochas da estrada apagam uma a uma, de fora para dentro"
    contra_jogo: "Apagar as luzes antes que ele chegue e lutar no escuro, de perto; com uma só luz acesa ele bate uma vez só."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_parelha_carmesim:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [skallgard]
      permanencia: [7, 10]
      reage:
        - {quando: "clima:nevasca", efeito: mais}
        - {quando: "carcaca_recente", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Dois sulcos de esqui de trenó, retos e fundos, e entre eles pegadas de cães que pisam sem dobrar a perna."
      resto: "Um trenó virado na neve, as rédeas presas a um pedaço de osso de ombro, e nenhum dono por perto."
      som: "Um galope duro e compassado, de muitas patas que batem juntas como pau, e nenhum latido."
      cheiro: "Couro de arreio congelado e carne crua, frio e metálico."
      marca: "Na rota antiga das caçadas, a neve está batida numa faixa estreita, como se alguém passasse todos os dias."
      aproximacao: "Seis cães de boca aberta e sem língua vêm atrelados a um trenó vazio, os arreios afundados na carne vermelha."
      rumor: "uma viúva do clã ouve à noite o trenó do marido passando na porta, e ele nunca para"
    contra_jogo: "Sair da rota e cortar o tirante do cão da frente, que guia os outros; sem guia, a parelha gira em volta do trenó."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_desfiado_da_aurora:
    fonte: ficha
    ecologia:
      horario: [Noite]
      territorio: [skallgard, sk_farol_chama_negra]
      permanencia: [6, 9]
      reage:
        - {quando: "clima:limpo", efeito: mais}
        - {quando: "pressao:abismo", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Um sulco na neve feito por um tronco arrastado nos braços, sem pegada de pé nenhuma, e fiapos verdes acesos nas bordas."
      resto: "Uma tira de pele que ainda brilha verde, presa num arbusto, queimando a neve em volta sem calor."
      som: "Um arrastar lento de cotovelos na neve dura e um chiado fino, como de vela que se desfaz."
      cheiro: "Ar de tempestade, limpo e cortante, com um fundo de carne chamuscada."
      marca: "Num rochedo, manchas verdes que brilham no escuro, na altura de quem se arrasta, como mãos espalmadas."
      aproximacao: "Um homem sem pernas se arrasta nos braços, a carne acesa em faixas verdes, e arranca do ombro uma tira que brilha."
      rumor: "um menino do clã jura que viu um homem se desfazendo em luz no meio da tundra, procurando alguma coisa"
    contra_jogo: "Apagar a tira rolando na neve; e chegar perto, porque ele se arrasta devagar e não tem com que fugir."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_jotun_cinza:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [skallgard, sk_fortaleza_vorr]
      permanencia: [8, 11]
      suprime: [mon_andas_de_caribu]
    sinais:
      antecedencia: cedo
      rastro: "Pegadas do tamanho de um escudo, afundadas até o joelho na neve, com marcas de tala de osso dos dois lados."
      resto: "Uma tala de osso grosso partida em duas, com correias de couro cru rebentadas e manchadas de sangue."
      som: "Um chiado curto de peito apertado, repetido, e o estalar de correias encolhendo no frio."
      cheiro: "Couro cru encharcado e osso de bicho grande, com um fundo de ferida aberta."
      marca: "Num portal do clã, o umbral foi alargado a machado, e a madeira nova ainda está clara."
      aproximacao: "Um homem de quatro metros, de osso rompendo a pele em cristas brancas e talas amarradas nos membros, ergue os dois braços."
      rumor: "um ferreiro do clã reclama que cada ano tem de fazer talas maiores para o mesmo caçador"
    contra_jogo: "Cortar as correias das talas nos joelhos; sem elas, ele se fere a cada golpe e cansa sozinho."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  # ============================== BESTAS DA ENTROPIA ==============================
  mon_ermitao_de_elmo:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      estacoes: {primavera: 1.3, inverno: 0.7}
      territorio: [skallgard]
      permanencia: [8, 11]
      presas: [enemy_lobo_invernal]
    sinais:
      antecedencia: cedo
      rastro: "Rastros miúdos de seis pernas que descem da encosta em bando e param junto às fendas onde sai vapor."
      resto: "Uma pulseira de couro presa num pulso decepado, apertado por uma tenaz de ferro amassado."
      som: "Um rangido de ferro velho abrindo e fechando, várias vezes, como viseira enferrujada."
      cheiro: "Ferrugem molhada de degelo e carne branca, mole, de bicho que mora em concha."
      marca: "Na encosta do degelo, peças de armadura antiga espalhadas, e todas as de cabeça viradas de boca para baixo."
      aproximacao: "Uma peça de ferro de guerra amassada anda sobre seis pernas brancas, e pelas fendas da viseira saem duas garras grossas."
      rumor: "um garimpeiro de ferro velho diz que na encosta do degelo não se pega armadura pela abertura"
    contra_jogo: "Bater no elmo com coisa pesada antes que ele suba pelo braço; um golpe na crista amassa a viseira e ela não fecha mais."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_carrapato_de_mamute:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [skallgard]
      permanencia: [6, 9]
      presas: [enemy_yeti]
      reage:
        - {quando: "carcaca_recente", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Uma fila de furinhos em gancho na neve, de oito em oito, que vai de um bicho grande a outro."
      resto: "Uma casca parda e rachada, do tamanho de um gato, estourada e vazia, num anel de sangue escuro."
      som: "Um estalo úmido de bolha estourando e depois o raspar de muitos ganchinhos no gelo."
      cheiro: "Sangue grosso de bicho grande e pelo sujo, um cheiro de manada passada."
      marca: "Num pedaço de carne pendurado para secar, dois furos redondos, um em cada ponta, e a carne sem cor entre eles."
      aproximacao: "Do pelo de uma carcaça salta um bicho pardo do tamanho de um gato, com uma boca de dentes em cada ponta do corpo."
      rumor: "os caçadores lavam a carne com neve e fogo antes de levá-la à Sala Fria, e ninguém pergunta por quê duas vezes"
    contra_jogo: "Arrancá-lo antes de inchar; se já inchou, matá-lo no caminho, porque cheio ele estoura com um golpe só."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_lagarta_sete_invernos:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde]
      estacoes: {inverno: 0.6, verao: 1.3}
      territorio: [skallgard, sk_fortaleza_vorr]
      permanencia: [9, 12]
      foge_de: [mon_verme_do_gelo]
    sinais:
      antecedencia: cedo
      rastro: "Um caminho largo de líquen raspado até a pedra, com marcas de muitas patas curtas em pares e um sulco arrastado no fim."
      resto: "Um anel de pele preta e pelada, duro como pedra, caído na neve, do tamanho de um barril."
      som: "Um triturar paciente de líquen e osso, e de vez em quando um estalo de gelo rachando sobre algo grande."
      cheiro: "Líquen esmagado e pelo molhado, com o cheiro seco de coisa morta que não apodrece."
      marca: "No campo de líquen, um tronco peludo deitado e coberto de geada, onde ontem não havia árvore nenhuma."
      aproximacao: "O tronco peludo coberto de geada racha de cima a baixo, e uma cabeça em placa dura com mandíbulas se ergue para você."
      rumor: "um pastor diz que tropeçou num tronco congelado no pasto de líquen, e o tronco tinha patas"
    contra_jogo: "Esperar o degelo para bater, ou usar fogo enquanto ela está congelada; nunca ficar colado nela na rodada em que degela."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_mandriao_dois_bicos:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer]
      territorio: [sk_fortaleza_vorr]
      permanencia: [7, 10]
      presas: [enemy_lobo_invernal, mon_corvo_gelo]
      reage:
        - {quando: "carcaca_recente", efeito: mais}
    sinais:
      antecedencia: imediato
      rastro: null
      resto: "Uma presa ferida por outro caçador, tomada na metade, com um par de cortes de tesoura na nuca."
      som: "Um grito rouco de ave, em duas notas ao mesmo tempo, que ecoa nos degraus altos da Fortaleza."
      cheiro: null
      marca: "Num degrau da escadaria, um ninho de penas pardas e duras sobre um monte de ossinhos cortados limpo."
      aproximacao: "Do alto da escadaria desce uma ave parda de asas abertas como braços, a cabeça girando, a boca rachada em duas tesouras."
      rumor: "os guardas de Vorr não deixam ferido nenhum subir a escadaria a céu aberto"
    contra_jogo: "Não sangrar à vista dele; derrubar primeiro quem fere, e o Mandrião fica rodando no alto sem descer."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  enemy_lobo_invernal:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      estacoes: {inverno: 1.5}
      territorio: [skallgard]
      permanencia: [6, 9]
      reage:
        - {quando: "carcaca_recente", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Saltos marcados na neve de dez em dez passos, cada pouso uma pequena cratera cercada de pó azul."
      resto: "Um couro de rena roído por dentro, com mil mordidinhas e um pó azul grudado nas bordas."
      som: "Um estalo seco de mola soltando, depois outro mais longe, e outro, como gravetos quebrando em fila."
      cheiro: "Carne azeda de degelo e um cheiro mineral de pó, como de giz molhado."
      marca: "Junto às saídas de vapor, a neve está toda azulada e se mexe devagar, como se fervilhasse."
      aproximacao: "Da neve azulada salta um bicho mole do tamanho de um cão pequeno, a barriga aberta mostrando as tripas, por cima de quem está na frente."
      rumor: "as crianças das bordas aprendem cedo a não brincar no pó azul perto das saídas de vapor"
    contra_jogo: "Pisar a forquilha quando ela trava para saltar; no chão, sem a mola, é mole e lenta."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  enemy_yeti:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer]
      estacoes: {inverno: 1.5}
      territorio: [skallgard]
      permanencia: [7, 10]
      foge_de: [mon_urso_tita]
    sinais:
      antecedencia: cedo
      rastro: "Cascos largos que derretem a neve onde pisam, deixando poças em fila que congelam de novo atrás."
      resto: "Um tufo de pelo ruivo e duro preso numa pedra, e embaixo uma mancha de gordura laranja que ainda amolece a neve."
      som: "Um bufo grosso e longo, e o chiar de neve derretendo, como água jogada em brasa."
      cheiro: "Sebo quente e pelo de bicho de pasto, gordo e acolhedor no meio do frio."
      marca: "No campo de líquen, faixas de neve derretida até o chão, largas como um carro de boi, cortando o branco."
      aproximacao: "Um bisão de cabeça baixa e enorme vem de lado, e a bolsa de gordura sobre os ombros brilha laranja por dentro."
      rumor: "um caçador diz que passou a noite na tundra encostado num bicho quente, e acordou com a pele queimada"
    contra_jogo: "Furar a corcova de longe e deixá-lo cansar; quem está colado nele quando ela fura se queima."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  # ======================== HUMANOS QUE PAGARAM O PREÇO ========================
  mon_montaria_cravada:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer]
      territorio: [skallgard, sk_farol_chama_negra]
      permanencia: [7, 10]
      presas: [enemy_yeti]
    sinais:
      antecedencia: cedo
      rastro: "Pegadas enormes de urso, fundas demais para o tamanho, como de quem leva peso nas costas que não desce nunca."
      resto: "Um gancho de osso enfiado na neve, a ponta escura de sangue velho, como se tivesse sido arrancado de alguém."
      som: "Um rosnado de bicho e, no mesmo fôlego, a voz de um homem, os dois parando ao mesmo tempo."
      cheiro: "Pelo de urso molhado e suor de cavaleiro, misturados num só cheiro de bicho."
      marca: "Num pinheiro, arranhões de urso na altura de um homem montado, e acima deles riscos de arpão."
      aproximacao: "Um urso branco-azulado de presas para fora vem com um cavaleiro sem pernas fundido ao lombo, e o arpão aponta para você."
      rumor: "uma mulher do clã diz que o marido não desmonta há anos e que o urso já atende pelo nome dele"
    contra_jogo: "Derrubar o cavaleiro primeiro, de longe ou subindo pelo flanco; sem ele, o urso bate a esmo e se cansa."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_ferreiro_chama_fria:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [skallgard]
      permanencia: [9, 12]
    sinais:
      antecedencia: cedo
      rastro: null
      resto: "Uma espada deixada na porta da oficina, azulada e quebradiça, que se parte ao primeiro toque."
      som: "Um martelar fino em bigorna, e entre as batidas um crepitar estranho, como de gelo rachando no fogo."
      cheiro: "Metal gelado e geada, sem cheiro de carvão nenhum, onde devia haver forja."
      marca: "Na entrada da forja, fogos azuis miúdos dançando rente ao chão, e a geada subindo pelos batentes."
      aproximacao: "Um homem pequeno de cabeça grande e mãos pretas e azuis, de dedos com veios de metal, estende a mão para a sua arma."
      rumor: "um caçador diz que entrou armado na forja e saiu sem a mão poder largar o cabo"
    contra_jogo: "Quem foi pego aquece a mão numa chama, a sua ou a de um companheiro; e ele não larga a Fornalha: atraído para longe dela, as chamas dos pulsos se apagam."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_lascador_morno:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [skallgard]
      permanencia: [7, 10]
      foge_de: [mon_caldeira_de_peito]
      reage:
        - {quando: "pressao:abismo", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Pegadas que vão até um afloramento vermelho e voltam pesadas, e ao lado delas tiras secas de pele caídas."
      resto: "Um alforje rasgado com lascas vermelhas espalhadas, e cada lasca ainda conserva o calor de uma mão."
      som: "Um gemido curto de gente vindo de dentro da pedra, cada vez que alguém bate uma lasca na outra."
      cheiro: "Carne viva exposta ao vento e um gosto de moeda na boca, que não sai mesmo depois de cuspir."
      marca: "No afloramento de cristal vermelho, buracos lascados a mão, sem marca de ferramenta, e sangue seco nas bordas."
      aproximacao: "Um garimpeiro de braços em carne viva e mãos de cristal vermelho conta sem som, e ergue uma lasca para atirar."
      rumor: "um tecnológico jura que comprou no escuro uma lasca vermelha que chora quando a guardam no bolso"
    contra_jogo: "Chegar perto; de perto ele não atira, e as mãos de cristal racham num golpe."
    tramas: []
    autor: opus-370-lote1
    revisor_fauna: pendente
    revisao: pendente

  mon_escuta_do_sinal:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [sk_salao_do_jarl, skallgard]
      permanencia: [8, 11]
    sinais:
      antecedencia: cedo
      rastro: "Uma marca de corpo deitado de bruços na neve, com dois furos redondos onde a cabeça encostou no chão."
      resto: "Uma chave grande de latão caída na neve, com sangue numa ponta e cabelo grudado."
      som: "Um zumbido grave que vem de baixo dos pés, corre pela neve e some longe, como resposta."
      cheiro: "Latão polido e o azedo de parafuso enferrujando no osso, cheiro de oficina e de enfermaria juntos."
      marca: "Na beira do gelo, cornetas de latão enfiadas de boca para baixo, em fila, como quem planta ouvidos."
