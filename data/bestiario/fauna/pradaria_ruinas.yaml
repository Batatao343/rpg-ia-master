# SPEC-370 R1 (lote 2) — bloco de fauna da Pradaria das Ruínas: 22 fichas da SPEC-349 + legado
# `valoria` da região (inclui enemy_assassino_cinzeu, SPEC-360 §9). Mesmo contrato da SPEC-360
# §3.2; compilado em data/world/fauna.json por scripts/fauna/build.py. Sinal é vestígio, nunca a
# criatura: quem nomeia é o encontro. Revisão: handoffs/SPEC-370-independent-review.md (lote 2).
regiao: pradaria_ruinas
criaturas:
  # ============================== CORPOS REESCRITOS ==============================
  mon_vertedor_de_areia:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [pr_ruinas_assombradas, pr_vaelorn]
      permanencia: [6, 8]
      reage:
        - {quando: "clima:vendaval", efeito: menos}
    sinais:
      antecedencia: cedo
      rastro: "Pegadas compridas e apressadas entre as lajes, cada uma mais rasa que a anterior, ladeadas por montinhos de pó cinza."
      resto: "Um casco de pele violeta murcho e oco largado num degrau, rachado como louça, com quatro dedos longos na mão."
      som: "Um chiado fino e contínuo, como de ampulheta virada, que corre de uma rua para a outra."
      cheiro: "Pó seco de tumba e um perfume élfico muito velho, de óleo que virou poeira."
      marca: "Numa parede das ruínas, trilhas de pó cinza escorridas do alto, como se alguém tivesse encostado ali e se esvaziado um pouco."
      aproximacao: "Um elfo alto de pele violeta rachada vem correndo de olhos leitosos, e das fendas do peito escorre um fio cinza sem parar."
      rumor: "os guias de Vaelorn dizem que nas ruínas há quem corra como se o dia fosse acabar, e para eles acaba"
    contra_jogo: "Aguentar em vez de trocar golpes; quem se fecha na defesa e o faz correr atrás sobrevive até a areia acabar."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: pendente
    revisao: pendente

  mon_vidrado_do_morro:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde]
      territorio: [pradaria_ruinas]
      permanencia: [9, 12]
      reage:
        - {quando: "clima:limpo", efeito: mais}
        - {quando: "clima:nublado", efeito: menos}
    sinais:
      antecedencia: cedo
      rastro: "Na encosta queimada, um sulco largo e liso de algo pesado que gira no lugar, sem dar passo para longe do topo."
      resto: "Um viajante caído de bruços na subida, com as mãos sobre os olhos e um golpe só na nuca."
      som: "Um ranger vítreo e lento, como garrafa sendo torcida, vindo do alto da encosta."
      cheiro: "Terra cozida e vidro quente ao sol, um cheiro de forno de vidreiro aberto."
      marca: "Nas pedras da subida, clarões de luz que dançam sem nuvem nem água por perto, sempre virados para quem vem."
      aproximacao: "No topo, um soldado fechado numa crosta verde de garrafa gira o tronco, e o sol do peito dele cega você."
      rumor: "os pastores não sobem a encosta queimada ao meio-dia: dizem que lá em cima o sol tem dono"
    contra_jogo: "Chegar com o sol nas costas, ou lutar à noite e em dia nublado; sem o reflexo, é só uma casca pesada e lenta."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: pendente
    revisao: pendente

  mon_costas_de_alicerce:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [pr_ruinas_assombradas]
      permanencia: [9, 12]
    sinais:
      antecedencia: cedo
      rastro: "Um arrasto largo e chato no pó do porão, entre duas marcas de palma rachada, como de quem carrega uma porta deitada."
      resto: "Uma laje de fundação faltando no chão de um porão, com a borda partida e manchas roxas nas quinas."
      som: "Pedra raspando pedra devagar, e uma respiração presa, de quem carrega peso demais e não pode largar."
      cheiro: "Pó de argamassa e pele inflamada, um cheiro de ferida que não respira."
      marca: "Nas passagens baixas, os relevos élficos das paredes gastos numa faixa só, na altura de um corpo de quatro."
      aproximacao: "Rente ao chão vem uma laje esculpida com braços enormes por baixo, e debaixo da borda dois olhos espiam você."
      rumor: "um saqueador velho nunca dorme encostado em pedra de ruína, e mostra a espinha calejada para explicar"
    contra_jogo: "Rachar a laje com pancada ou ir por trás, na costura de carne entre a pedra e a espinha, onde ela não protege."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: pendente
    revisao: pendente

  mon_vestido_de_gafanhotos:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      estacoes: {verao: 1.4, inverno: 0.4}
      territorio: [pradaria_ruinas]
      permanencia: [7, 10]
      reage:
        - {quando: "pressao:fome", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Um campo roído até o talo numa faixa que segue devagar, e no meio dela pegadas de bota de lavrador."
      resto: "Um espantalho derrubado, a palha toda comida, e cascas de bronze vazias presas no pano."
      som: "Um zumbido grosso e abafado, como de colmeia dentro de um saco, que anda no ritmo de um homem."
      cheiro: "Capim mastigado e carne crua, verde e vermelho ao mesmo tempo, como de pasto depois de abate."
      marca: "Numa cerca do campo, um rasto de asas finas grudadas na madeira, todas na altura dos ombros de alguém."
      aproximacao: "Um lavrador coberto de cascas de bronze em camadas anda até você, e só a boca e os olhos aparecem por baixo do enxame."
      rumor: "uma viúva da pradaria diz que o marido voltou do campo na praga, e que ela não abriu a porta"
    contra_jogo: "Fogo ou fumaça no corpo caído antes que o enxame levante; derrubá-lo longe dos outros também serve."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: pendente
    revisao: pendente

  mon_fucador_da_semente:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [pradaria_ruinas, pr_ruinas_assombradas]
      permanencia: [7, 10]
      presas: [mon_lagarto_de_mudas]
      reage:
        - {quando: "carcaca_recente", efeito: mais}
        - {quando: "pressao:praga", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Terra fuçada em sulcos fundos que levam a um círculo de mato morto, e de lá saem tufos de pelo solto."
      resto: "Um couro de bicho rasgado por presas, e a ferida já preta e mole, apodrecendo mais do que devia em um dia."
      som: "Um grunhido grave e rouco, e o rasgar de raízes arrancadas do chão a focinhadas."
      cheiro: "Podre seco, como de carne curada que estragou por dentro, forte perto do chão."
      marca: "No meio do mato verde, um círculo de capim morto do tamanho de um porco deitado, ainda morno."
      aproximacao: "Um javali de presas tortas e amarelas vem bufando, e no flanco dele se abre um buraco preto que não sangra."
      rumor: "um caçador da pradaria diz que um corte de presa pequeno lhe custou a perna, depois que o bicho já tinha ido"
    contra_jogo: "Limpar a ferida cedo e não deixar que ele acerte duas vezes; fogo no capim seco à volta o faz desviar."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: pendente
    revisao: pendente

  enemy_esqueleto_legiao_antiga:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [pradaria_ruinas, pr_ruinas_assombradas]
      permanencia: [8, 11]
      reage:
        - {quando: "clima:vendaval", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Passos curtos e tortos no mato, dados aos trancos na direção do vento, que param de repente e esperam."
      resto: "Uma lâmina enferrujada largada na trilha, o cabo ainda apertado por dedos de osso amarrados com raízes."
      som: "Um farfalhar alto de palha que enche com a rajada, e um tilintar de ferro velho que para quando o vento cai."
      cheiro: "Feno seco e ferrugem, cheiro de celeiro onde se guarda arreio velho."
      marca: "No mato, um formato de homem deitado onde a erva cresceu mais alta e mais verde que em volta."
      aproximacao: "Com a rajada, um morto de ferro enferrujado se ergue do mato, erva saindo das órbitas e da boca, e dá o passo."
      rumor: "os nômades dizem que na pradaria o vento ainda recruta, e que quem dorme no mato acorda em fila"
    contra_jogo: "Bater entre as rajadas, quando ele está parado, e recuar quando o capim das costas enche; fogo no capim seco o derruba de vez."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: pendente
    revisao: pendente

  # ============================== BESTAS DA ENTROPIA ==============================
  mon_nadador_de_pedra:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [pr_ruinas_assombradas]
      permanencia: [8, 11]
    sinais:
      antecedencia: imediato
      rastro: null
      resto: "Um saqueador caído de lado num pátio, a perna presa até o joelho numa laje inteira, sem rachadura nenhuma."
      som: "Um ronco surdo vindo de dentro da parede, que corre por baixo dos pés e some."
      cheiro: "Poeira úmida de alicerce e pele rosada, um cheiro de leitão recém-nascido."
      marca: "Num muro das ruínas, a superfície ondulada como água parada, em anéis, onde ontem era lisa."
      aproximacao: "O chão do pátio ondula como lagoa e de uma parede ao lado sai um bicho rosado e cego de focinho em placa."
      rumor: "os saqueadores das ruínas pisam no mato, nunca nas lajes, e não explicam por quê"
    contra_jogo: "Ficar fora das lajes e paredes, no capim e na terra solta, onde ele não nada; quieto, ele não sente onde você está."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: pendente
    revisao: pendente

  mon_cobra_de_legua:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [pradaria_ruinas]
      permanencia: [8, 11]
      presas: [mon_fucador_da_semente]
    sinais:
      antecedencia: imediato
      rastro: "Um caminho de mato deitado ao longo de uma rua antiga, largo como uma coxa, que não acaba por mais que se siga."
      resto: "Um javali inteiro achatado no meio do mato, as costelas quebradas em anéis, um ao lado do outro."
      som: "Um sussurro longo e constante de escamas no mato, que não muda de lugar e não termina."
      cheiro: null
      marca: "Na beira de uma rua das cidades mortas, as pedras do calçamento polidas numa faixa só, de tanto algo se arrastar."
      aproximacao: "Do mato sai uma volta grossa e cinza que se fecha na sua perna, e logo outra volta vem atrás, e mais outra."
      rumor: "um nômade conta que seguiu um rastro de escama da manhã até a tarde e voltou sem ver o fim"
    contra_jogo: "Cortar a cabeça e não as voltas; sair do aperto cedo, antes da segunda volta, custa muito menos que depois."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: pendente
    revisao: pendente

  mon_rodante_de_espinhos:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [pradaria_ruinas]
      permanencia: [6, 9]
      presas: [mon_gafanhoto_runa]
      reage:
        - {quando: "clima:vendaval", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Uma trilha de mato amassado em linha reta, morro acima e contra o vento, sem pegada nenhuma."
      resto: "Um cantil furado em dezenas de buraquinhos, largado onde alguém o deixou cair fazendo barulho."
      som: "Um rolar seco e ritmado no mato, como de cesto de vime descendo ladeira, só que subindo."
      cheiro: "Feno pisado e osso velho, cheiro de ninho de bicho pequeno."
      marca: "No mato, uma bola de palha e lascas brancas presas, que se desfaz ao toque, deixada para trás como casca."
      aproximacao: "Uma bola de pontas de osso cheia de palha e ossinhos rola direto para quem fez barulho, contra o vento."
      rumor: "as crianças da pradaria aprendem a ficar caladas quando algo rola no mato, e os adultos também"
    contra_jogo: "Ficar quieto e firme uma rodada, defendendo, e deixar que ele role para o barulho de outro; parado, ele é um bicho pequeno de barriga mole."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: pendente
    revisao: pendente

  mon_pernalta_das_colunas:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde]
      territorio: [pr_ruinas_assombradas]
      permanencia: [8, 11]
      presas: [mon_lagarto_de_mudas, mon_besouro_de_alavanca]
    sinais:
      antecedencia: imediato
      rastro: "Dois furinhos fundos no chão, a quatro passos um do outro, e nada mais em volta, como marcas de estaca."
      resto: "Um lagarto pregado no chão por um furo reto e limpo, de cima para baixo, sem marca de dente."
      som: null
      cheiro: "Pena seca e lodo de beira de lago, estranho no meio das ruínas sem água."
      marca: "Entre as ruínas partidas, um monte de cascas de bicho e penas cinzas caídas ao pé de um mesmo ponto, como embaixo de poleiro."
      aproximacao: "Uma das hastes cinzentas entre as ruínas se mexe, e do alto, a quatro metros, um bico reto como lança desce em você."
      rumor: "um guia das ruínas conta as hastes de pé entre os escombros toda manhã, e diz que o número muda"
    contra_jogo: "Ir direto às pernas, que quebram fácil, em vez de tentar alcançar o corpo lá em cima."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: pendente
    revisao: pendente

  mon_lagarto_de_mudas:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde]
      territorio: [pr_ruinas_assombradas, pradaria_ruinas]
      permanencia: [6, 9]
      presas: [mon_gafanhoto_runa]
      foge_de: [mon_pernalta_das_colunas, mon_fucador_da_semente]
      reage:
        - {quando: "clima:limpo", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Riscos finos de unha subindo uma parede ao sol, e no pé dela gotas de umidade rosada."
      resto: "Uma pele inteira e transparente, com olhos, dedos e língua, ainda mexendo a boca devagar no chão."
      som: "Um estalo úmido de pele descolando, e um raspar rápido de unhas que sobe e some."
      cheiro: "Carne viva limpa e úmida, como de bicho esfolado agora mesmo."
      marca: "No alto de um muro quente, várias películas secas presas na pedra, cada uma do tamanho de um homem, com dedos e olhos."
      aproximacao: "Um bicho rosado e em carne viva, do tamanho de um homem, sobe a parede, e uma pele vazia dele vem andando até você."
      rumor: "um menino de Vaelorn trouxe para casa uma pele transparente de bicho, e ela mordeu o cachorro"
    contra_jogo: "Ignorar as cascas e encurralá-lo contra o chão; sem parede para subir, ele não tem tempo de largar outra."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: pendente
    revisao: pendente

  mon_besouro_de_alavanca:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer]
      territorio: [pradaria_ruinas, pr_ruinas_assombradas]
      permanencia: [7, 10]
      foge_de: [mon_pernalta_das_colunas]
    sinais:
      antecedencia: cedo
      rastro: "Pegadas de seis patas com esporão cravadas fundo no chão, sempre ao lado de uma laje virada."
      resto: "Uma tampa de túmulo erguida e escorada de lado, o que morava embaixo comido, e o túmulo vazio."
      som: "Um estalo de pedra sendo forçada, um rangido de casca dura e o baque de uma laje caindo de lado."
      cheiro: "Terra de baixo de pedra, fria e cheia de bicho, cheiro de minhoca e de mofo."
      marca: "Numa rua das cidades mortas, as lajes do calçamento viradas uma a uma, como páginas, numa fila."
      aproximacao: "Um bicho de casca preta do tamanho de um cão enfia um corno chato como pé de cabra na junta da sua armadura."
      rumor: "um soldado diz que voltou das ruínas com a placa do peito arrancada da junta, e que não foi golpe"
    contra_jogo: "Gastar a vez para encaixar a placa antes que o segundo besouro chegue, ou virá-lo de costas, que a barriga é mole."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: pendente
    revisao: pendente

  # ======================== HUMANOS QUE PAGARAM O PREÇO ========================
  mon_carregador_de_ganchos:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [pradaria_ruinas]
      permanencia: [7, 10]
      suprime: [mon_leitor_de_cativos]
    sinais:
      antecedencia: cedo
      rastro: "Um arrasto curto e violento no mato, de alguém puxado de lado de uma vez, que termina no meio de muitas botas."
      resto: "Um elo de corrente partido e um farrapo de camisa preso num ferro curvo de açougue, largado na trilha."
      som: "Correntes tilintando em muitas alturas ao mesmo tempo, e o zunido curto de uma delas sendo lançada."
      cheiro: "Ferro e couro velho, com um fundo de carne de açougue e tinta de tatuagem."
      marca: "Num poste da estrada, a marca de Groth pintada e, embaixo, riscos de ferro como de anzol arrastado."
      aproximacao: "Um Cinzéu curvado sob dezenas de ferros cravados na pele, cada um com sua corrente, gira um deles acima da cabeça."
      rumor: "um mercador diz que, quando um viajante se afasta da caravana, os de Groth já sabem antes dele"
    contra_jogo: "Ficar perto dele e longe dos outros, ou de costas para um muro; puxado para o lugar onde já está, o tranco não faz nada."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: pendente
    revisao: pendente

  mon_leitor_de_cativos:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer, Noite]
      territorio: [pradaria_ruinas]
      permanencia: [7, 10]
      foge_de: [enemy_capturador_groth]
    sinais:
      antecedencia: cedo
      rastro: "Pegadas de Vrel em bando que se afastam todas ao mesmo tempo para o mesmo lado, e uma fila parada mais atrás."
      resto: "Um prisioneiro morto sentado contra uma pedra, com marcas finas de pinça dos dois lados da cabeça."
      som: "Um estalar miúdo de palpos, como unha em casca de noz, e silêncio total do bando em volta."
      cheiro: "Um azedo de inseto grande e de líquido escuro, como de casca de besouro esmagada."
      marca: "Num acampamento abandonado, um banco de prisioneiros com os lugares marcados a giz, e uma só delas riscada."
      aproximacao: "Atrás dos Vrel, um de cabeça rachada e abdômen translúcido abre um par de palpos compridos e vira as antenas para você."
      rumor: "um soldado diz que os Vrel desviaram do golpe dele antes que ele mesmo soubesse que ia dar"
    contra_jogo: "Matá-lo primeiro, ou trocar de plano depois do presságio; o que ele leu é a jogada que você ia fazer, não a que você faz."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: pendente
    revisao: pendente

  mon_profanador_cravejado:
    fonte: ficha
    ecologia:
      horario: [Anoitecer, Noite, Amanhecer]
      territorio: [pr_ruinas_assombradas, pr_vaelorn]
      permanencia: [7, 10]
      foge_de: [mon_desfiado_de_vaelorn]
    sinais:
      antecedencia: cedo
      rastro: "Terra fresca revolvida de sepultura em sepultura, e entre elas uma trilha de quem anda de peito estufado."
      resto: "Uma sepultura élfica aberta e limpa de joias, e a pá largada ao lado com o cabo gasto de mão."
      som: "O raspar de pá na terra dura, e um tilintar fosco de metal batendo em metal a cada movimento."
      cheiro: "Terra de túmulo e metal azinhavrado, como de moeda tirada de um morto."
      marca: "Num túmulo saqueado, um anel élfico caído com um pedaço de pele escura e dura ainda grudado por dentro."
      aproximacao: "Da terra sai um homem de peito tomado de broches e pedras, a pele em volta delas dura e escura, e ergue a pá."
      rumor: "um joalheiro de Vaelorn recusa peça de sepultura: diz que já viu o dono vir buscá-la grudada no corpo"
    contra_jogo: "Arrancar as relíquias em vez de golpear a pele dura; cada peça tirada o deixa mais mole e paga a luta."
    tramas: []
    autor: opus-370-lote2
    revisor_fauna: pendente
    revisao: pendente

  mon_cauda_emendada:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer]
      territorio: [pr_solvhen, pradaria_ruinas]
      permanencia: [6, 9]
      foge_de: [mon_arqueiro_de_tendao]
    sinais:
      antecedencia: cedo
      rastro: "Um varrido raso e largo no mato baixo, na altura dos tornozelos, e um furo fundo a cada três metros, de salto."
      resto: "Um pino de osso caído na estrada, com um anel de couro cru ainda preso, como de emenda que soltou."
      som: "Um assobio baixo de coisa comprida varrendo o mato, e um baque seco de alguém caindo."
      cheiro: "Couro cru mal curtido e osso limado, um cheiro de oficina de amuleto."
      marca: "Numa vala da estrada, várias pessoas derrubadas na mesma direção, todas com o tornozelo roxo."
