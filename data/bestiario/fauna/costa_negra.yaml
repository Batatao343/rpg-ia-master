    autor: opus-370-lote4
    revisor_fauna: opus-370-revisor-lote4
    revisao: aprovada

  mon_raspadeira_de_barbatana:
    fonte: ficha
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [costa_negra]
      permanencia: [6, 9]
    sinais:
      antecedencia: cedo
      rastro: "Marcas de quatro pontas raspando pedra, que seguem a trilha de um coletor carregado."
      resto: "Uma lâmina boa riscada de cima a baixo até perder o fio, e franjas córneas presas no gume."
      som: "Um raspar de pente grosso em metal, insistente, e um correr leve para longe."
      cheiro: "Corno velho e maresia, um cheiro de baú de pescador de baleia."
      marca: "No acampamento dos coletores, as melhores peças achadas riscadas e foscas, as ruins intactas."
      aproximacao: "Um bicho do tamanho de um cão, feito de placas franjadas, anda na ponta delas até o que você tem de mais bonito."
      rumor: "um coletor diz que o melhor achado da vida dele virou sucata na mesma noite"
    contra_jogo: "Gastar a ação afiando cedo, ou pisá-la antes que chegue à arma; é frágil e foge na primeira pancada."
    tramas: []
    autor: opus-370-lote4
    revisor_fauna: opus-370-revisor-lote4
    revisao: aprovada

  mon_rancor_de_pincas:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [costa_negra]
      permanencia: [10, 12]
      reage:
        - {quando: "pressao:guerra", efeito: mais}
    sinais:
      antecedencia: cedo
      rastro: "Pegadas de pernas de tamanhos diferentes em volta de uma ossada, que andam em todas as direções."
      resto: "Um coletor preso por garras fechadas só do lado em que bateu, como se a pancada tivesse virado contra ele."
      som: "Um estalar de garras fechando em sequência, só de um lado, e depois silêncio."
      cheiro: "Casca velha de bicho do mar e lodo de guerra antiga, um cheiro de campo de batalha seco."
      marca: "Sobre uma ossada disputada, carapaças vazias empilhadas e seladas por uma crosta escura."
      aproximacao: "Sobre a ossada, um monte de carapaças de garras abertas para todos os lados não se mexe, até alguém bater."
      rumor: "os Caranguejeiros não se aproximam de uma das ossadas da costa, e nem os coletores"
    contra_jogo: "Dividir os golpes entre vários atacantes, para que nenhum acumule o rancor, ou não atacá-lo: ele não persegue."
    tramas: []
    autor: opus-370-lote4
    revisor_fauna: opus-370-revisor-lote4
    revisao: aprovada

  # ============================== LEGADO (valoria) ==============================
  mon_baleia_ossario:
    fonte: legado
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer]
      territorio: [costa_negra]
      permanencia: [7, 10]
      foge_de: [mon_o_que_come_nas_praias]
    sinais:
      antecedencia: cedo
      rastro: "Um sulco largo sob a areia e os ossos, que sobe à superfície quando a água recua de repente."
      resto: "Ossos de leviatã antigo revirados e quebrados, como se algo jovem tivesse nadado através deles."
      som: "Um canto grave e curto debaixo da areia, como de bicho grande chamando a mãe."
      cheiro: "Areia molhada e gordura nova de bicho grande do mar, um cheiro de praia depois de encalhe."
      marca: "Na praia, um recuo súbito da água deixando a areia lisa e funda em linha, sem onda nenhuma."
      aproximacao: "A areia entre as ossadas estufa e sobe um bicho jovem de costelas à mostra, batendo uma cauda de ossos."
      rumor: "os Osshari dizem que quando a água recua sem motivo algo novo está nadando nos ossos velhos"
    contra_jogo: "Não esperar que recue: ele avança no mais próximo, se protege com o rosário de ossos e empurra a linha; bater forte e não ficar onde ele joga."
    tramas: []
    autor: opus-370-lote4
    revisor_fauna: opus-370-revisor-lote4
    revisao: aprovada

  mon_caranguejo_mare:
    fonte: legado
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [costa_negra, cn_o_trono]
      permanencia: [6, 9]
      presas: [mon_saltador_de_poca]
      foge_de: [mon_rancor_de_pincas, mon_estrela_de_alavanca]
    sinais:
      antecedencia: cedo
      rastro: "Marcas de muitas patas de lado entrando e saindo das órbitas de um crânio enorme."
      resto: "Um osso grosso cortado limpo por uma garra, e pedaços de carapaça de briga espalhados."
      som: "Um clicar de garras batendo umas nas outras, em desafio, que fica mais alto quando alguém se aproxima."
      cheiro: "Lodo de crânio velho e restos de peixe guardados, um cheiro de despensa úmida."
      marca: "Nas órbitas dos crânios grandes, montes de restos de peixe e ossinhos, guardados como despensa."
      aproximacao: "De dentro de um crânio enorme sai um bicho de casca do tamanho de um cão, e ergue garras que cortam osso."
      rumor: "os coletores dizem que cada crânio da costa tem dono, e que o dono tem garras"
    contra_jogo: "Não ficar ferido nem isolado à vista: ele persegue o mais fraco com fúria e corta fundo; recua quando a briga vira risco."
    tramas: []
    autor: opus-370-lote4
    revisor_fauna: opus-370-revisor-lote4
    revisao: aprovada

