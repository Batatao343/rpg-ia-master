      som: "Um zumbido de broca em pedra, fino e agudo, que faz doer os dentes."
      cheiro: "Pó calcário moído e cal, um cheiro de serraria de pedra."
      marca: "Numa ossada titânica, a superfície toda cheia de furos de broca, como queijo duro."
      aproximacao: "De um furo na ossada sai um bicho vestido de lascas brancas de leviatã antigo, e a broca da boca gira para você."
      rumor: "um coletor diz que as ossadas da costa estão ocas por dentro, e que algo mora no oco"
    contra_jogo: "Não ficar ferido nem isolado à vista: ele persegue o mais fraco e o zumbido dele fere de perto; recua quando a caçada vira risco."
    tramas: []
    autor: opus-370-lote4
    revisor_fauna: opus-370-revisor-lote4
    revisao: aprovada

  mon_gaivota_ladra:
    fonte: legado
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer]
      territorio: [costa_negra]
      permanencia: [6, 9]
