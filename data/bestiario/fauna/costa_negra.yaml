    revisor_fauna: opus-370-revisor-lote4
    revisao: aprovada

  mon_o_que_come_nas_praias:
    fonte: legado
    ecologia:
      horario: [Noite, Amanhecer]
      territorio: [costa_negra]
      permanencia: [2, 3]
      presas: [mon_baleia_ossario]
    sinais:
      antecedencia: cedo
      rastro: "Um arrasto enorme de algo sem forma, da água até os ossos e de volta, que apaga as pegadas de tudo."
      resto: "Corpos deixados pela maré comidos de baixo para cima numa noite, sobrando só os pés na areia."
      som: "Um sugar de maré que puxa areia, longo e grave, debaixo das docas, sem onda nenhuma."
      cheiro: "Mar profundo e carne inteira apodrecendo, forte, que o vento noturno traz das docas."
      marca: "Sob as docas, as estacas comidas até a metade e cobertas de um muco que brilha no escuro."
      aproximacao: "Debaixo das docas, a água se ergue numa bocarra do tamanho de um barco, e um tentáculo de ressaca vem em você."
      rumor: "os Osshari sabem o que vive sob as docas da costa, e quando alguém pergunta, só mudam de assunto"
    contra_jogo: "Proteger o curador e o conjurador, que ela busca primeiro, e guardar a melhor defesa para o golpe de mestre; à beira da morte, ela recua."
    tramas: []
    autor: opus-370-lote4
    revisor_fauna: opus-370-revisor-lote4
    revisao: aprovada

  mon_saqueador_marfim:
    fonte: legado
    ecologia:
      horario: [Manhã, Tarde, Anoitecer]
      territorio: [cn_o_trono, costa_negra]
      permanencia: [6, 9]
      foge_de: [mon_esfolado_de_sal, mon_caldeireiro_de_oleo]
    sinais:
      antecedencia: cedo
      rastro: "Pegadas de bota que seguem um caminho gravado numa presa, contando passos entre as ossadas."
      resto: "Uma presa de leviatã com um mapa entalhado, largada quebrada ao lado de um buraco cavado."
      som: "Um murmúrio de quem conta passos baixinho, e o raspar de um arpão serrilhado na pedra."
      cheiro: "Presa raspada e suor de cobiça, um cheiro de oficina de entalhador."
      marca: "Num crânio enorme, marcas de arpão serrilhado e números riscados, como de quem conferiu um mapa."
      aproximacao: "Com uma presa entalhada numa mão e um arpão serrilhado na outra, um caçador de tesouro ergue os olhos do mapa para você."
      rumor: "um Osshari jura que nunca vendeu mapa nenhum, e que mesmo assim tem gente seguindo os da família dele"
    contra_jogo: "Derrubar quem marca o alvo e ficar junto: ele concentra no mais ferido, rouba calor para se defender e, cercado e ferido, recua."
    tramas: []
    autor: opus-370-lote4
    revisor_fauna: opus-370-revisor-lote4
    revisao: aprovada

