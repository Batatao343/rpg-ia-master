    autor: opus-370-lote4
    revisor_fauna: opus-370-revisor-lote4
    revisao: aprovada

  mon_gancho_de_esfola:
    fonte: ficha
    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [costa_negra, cn_o_trono]
      permanencia: [8, 11]
    sinais:
      antecedencia: cedo
      rastro: "Riscos de ferro curvo no alto das ossadas, de seis em seis, que seguem quem trabalha embaixo."
      resto: "Um coletor com um ferro curvo enferrujado cravado no ombro, a corda de tendão pendendo cortada."
      som: "Um tinido de ferro em osso lá em cima e, às vezes, uma corda que desce zunindo."
      cheiro: "Gordura de leviatã rançosa e couro em tiras, um cheiro de rampa de corte de baleia ao vento."
      marca: "No alto de uma ossada, fitas de pele balançando presas num nó de couro, frescas demais."
      aproximacao: "No alto, seis ferros curvos de esfolar andam sobre as ossadas, e um deles desce numa corda de tendão para você."
      rumor: "os esfoladores velhos da costa dizem que os ferros deles sumiram de noite e que hoje andam sozinhos"
    contra_jogo: "Cortar a corda de tendão, que é fina e está ao alcance, antes de escolher entre se rasgar e ficar parado."
