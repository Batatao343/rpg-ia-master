      cheiro: "Pena salgada e excremento de ave, forte e ácido, que o vento leva pelas ossadas."
      marca: "No alto das ossadas, manchas brancas de excremento e restos de comida roubada espalhados."
      aproximacao: "De asas abertas largas demais, uma ave de bico de osso mergulha sobre o que você carrega."
      rumor: "os coletores dizem que basta bater o pé com força para a ave grande da costa ir embora"
    contra_jogo: "Não persegui-la: ela só ataca com vantagem ou pelas costas e foge ao primeiro ferimento; um golpe firme encerra a briga."
