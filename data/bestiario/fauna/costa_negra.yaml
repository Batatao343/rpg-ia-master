    sinais:
      antecedencia: cedo
      rastro: "Na água rasa entre as ossadas, uma barbatana que corta a superfície em linha reta, e some."
      resto: "Um elefante-marinho jovem na praia, arrancado pela metade por uma mordida de bordas lisas."
      som: "Um bater de cauda forte na água rasa e o estalo de madeira grossa raspando osso."
      cheiro: "Sangue na água e couro grosso de bicho do mar, um cheiro que chega antes da onda."
      marca: "Nos ossos submersos, raspões largos e lisos, como de quilha de barco passando sempre no mesmo lugar."
      aproximacao: "Na água rasa entre as ossadas surge uma barbatana, e um peixe enorme de couro duro como quilha vem no que sangra."
      rumor: "os coletores saem da água assim que alguém se corta, sem esperar para saber se foi fundo"
    contra_jogo: "Não sangrar à vista: ele persegue o mais ferido e corte entra pouco no couro; pancada, e ele recua quando a caçada vira risco."
