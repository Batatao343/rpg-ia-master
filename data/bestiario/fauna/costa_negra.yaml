    ecologia:
      horario: [Amanhecer, Manhã, Tarde, Anoitecer, Noite]
      territorio: [costa_negra]
      permanencia: [7, 10]
      presas: [mon_touro_de_banha, mon_andarilho_de_cracas, mon_bruxa_de_carcaca]
