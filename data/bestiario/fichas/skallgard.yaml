# SPEC-349 (esteira) — Ficha de identidade da onda Skallgard e o Ermo Branco.
# Fonte única da identidade de cada criatura (R5). Codex, doc de arte e `appearance` do
# bestiário são GERADOS daqui por scripts/bestiario/gerar_docs.py; os números (Etapa 5) não.
# Eixos antes da prosa (R8): o tabuleiro `vagas:` passou em U2/U3/U12 antes de qualquer texto.
# Refs de lore: linhas da lore pós-SPEC-348 (checkout principal), mesma convenção das ondas 1 e 2.
# Segredos fora do público: a ligação Farol → Rede (secrets.txt:79-90) e o paradeiro da Landship
# que falta (secrets.txt:368-373) não aparecem como fato em nenhum campo público desta ficha.
