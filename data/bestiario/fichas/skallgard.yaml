paleta: >-
  **Skallgard e o Ermo Branco** — noite de seis meses sobre tundra e gelo azul-sujo; uma cidade de
  túneis aquecidos com bocas de vapor e janelas laranja; aurora verde-tóxica num ritmo regular demais;
  afloramentos vermelho-escuro de Cristal-Sanguíneo, mornos na neve; ruínas de escala gigante na
  Fortaleza de Vorr; perto do Farol, uma luz preta e fosca que come as outras. Luz e paleta:
  branco-sujo e azul-gelo, verde da aurora nos reflexos, laranja de fornalha nos túneis,
  vermelho-sangue seco do cristal, e o preto sem brilho da anti-luz.
