criaturas:
  # ======================= CORPOS REESCRITOS (Reescritos) =======================
  - id: mon_doador_inacabado
    vaga: 1
    nome: Doador Inacabado
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: eter
      detalhe: null
      refs: ["lore_nova/timeline_completa.txt:126", "lore_nova/timeline_completa.txt:118"]
    anatomia:
      plano_corporal: bipede_curvado
      material: eter_cristalizado
      escala: humana
      locomocao: rasteja
      percepcao: calor
      texto: >-
        Um Elfo que entrou numa câmara de cristal como voluntário e não terminou de ser consumido
        quando a contenção caiu. Da cintura para baixo quase não sobrou carne: as pernas são dois
        feixes de tendões secos que ele arrasta. No peito e nos braços a pele ficou fina como papel
        molhado, e por baixo dela, onde havia músculo, correm veias de cristal turvo, vazias, que
        brilham fraco quando ele se aproxima de um corpo quente. A boca fica sempre aberta, e os
        dedos, compridos de magreza, procuram pele.
    silhueta: "Um vulto magro que se arrasta pelos cotovelos, com linhas de luz fraca correndo por dentro do peito."
    comportamento: >-
      Fica deitado nas câmaras onde caiu, voltado para a porta. Quando sente o calor de alguém,
      arrasta-se até ele e agarra o tornozelo; o que bebe corre pelas veias de cristal e as acende.
      Não foge: ainda está tentando terminar.
    papel_tatico: drenador
    arquetipo: morto_vivo_implacavel
    categoria: lacaio
    faccao: null
    mecanica_assinatura:
      carta: cri_doador_inacabado_terminar_em_ti
      frase: >-
        Bebe Vitalidade de quem segura e fecha com ela um Ferimento próprio: quanto mais bebe, mais
        as veias acendem e mais inteiro ele fica.
    contra_jogo: Não deixá-lo agarrar; manter distância, ou matá-lo enquanto as veias ainda estão apagadas.
    gancho: >-
      As câmaras da Destilação estavam cheias na noite em que a cidade caiu, e nem todos os
      voluntários tinham terminado; os que não terminaram ainda pedem o resto.
    habitat: [ae_ruinas_submersas, ae_camara_seca]
    inspiracao: []
    padrao: [ataque, reforco_proprio]
    a_cada_n: 2
    telegrafo: "{nome} encosta a boca no tornozelo que segura, e as linhas do peito começam a acender."
    description: Um voluntário élfico da Destilação que não terminou de ser consumido; arrasta-se até o calor de quem respira e bebe o que falta para se completar.
    perigo: Baixo
    lore: >-
      Nas câmaras de cristal de Aethelgard, a Destilação tirava a vida do voluntário de dentro para
      fora, e a consciência ficava até o fim. Na noite em que a contenção caiu, havia voluntários pela
      metade. Alguns ainda estão lá, nas câmaras que a água não alcançou e nas que alcançou, com o peito
      transparente e as veias de cristal vazias. Quando sentem calor, arrastam-se até ele. Os
      mergulhadores dizem que eles não estão com fome: estão tentando terminar.
    aparencia: >-
      Elfo esquálido que se arrasta pelos cotovelos, pernas reduzidas a feixes de tendões secos, pele
      do peito e dos braços fina como papel molhado sobre veias de cristal turvo que acendem em
      azul-esverdeado, boca aberta, dedos compridos.
    como_se_luta: >-
      Agarra o tornozelo e bebe; o que bebe fecha as feridas dele e acende o peito. Mantenha distância
      ou mate-o enquanto as veias ainda estão apagadas.
    related_entities: [ae_ruinas_submersas, ae_camara_seca]
    arte:
      visual: >-
        Elfo adulto esquálido, rosto de maçãs altas afundado, cabelo claro e ralo colado à cabeça,
        arrastando-se de bruços apoiado nos antebraços. Das coxas para baixo, só feixes de tendões
        secos cor de corda. Pele do tórax e dos braços translúcida e enrugada como papel molhado; por
        baixo, uma rede de veias de cristal turvo, metade apagada, metade acesa em azul-esverdeado
        fosco. Restos de uma túnica branca de voluntário.
      composicao: >-
        Chão de uma câmara de cristal da Destilação, meio alagada, com a moldura vazia de um cristal de
        contenção ao fundo; o Doador arrastando-se para o tornozelo de um mergulhador de pé, de botas e
        lanterna, enquadrado só da cintura para baixo, que dá a escala. Luz de lanterna quente contra o
        brilho frio das veias.
      evitar: Morto-vivo esfarrapado, múmia de faixas, fantasma luminoso. Não é um morto que voltou; é alguém que ainda não acabou de ser consumido.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_dentado_de_eras
    vaga: 2
    nome: Dentado de Eras
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: dragao
      detalhe: null
      refs: ["lore_nova/npcs.txt:419", "lore_nova/locations.txt:253", "lore_nova/timeline_completa.txt:342"]
    anatomia:
      plano_corporal: bipede_curvado
      material: osso
      escala: humana
      locomocao: anda
      percepcao: som
      texto: >-
        Um mergulhador que desceu fundo o bastante para ouvir as bocas do selo e voltou com elas na
        própria boca. A mandíbula deslocou-se e cresceu para a frente, e não para de dar dentes: de
        leite, de Elfo, de peixe, de bicho que ninguém nomeia, cada um de uma era, apinhados até furar o
        rosto. Os dentes desceram pelo pescoço e pelo peito em placas sobrepostas, como escamas, com a
        gengiva viva aparecendo entre elas. Anda curvado pelo peso da cabeça, e os dentes batem uns nos
        outros quando ele respira.
    silhueta: "Um homem curvado com a cabeça comprida demais para a frente, eriçada de pontas até o peito."
    comportamento: >-
      Ronda a borda do escuro sobre o selo, onde ainda ouve. Ataca o que faz barulho, de boca primeiro,
      e morde a armadura antes da carne, como quem quer chegar ao que está por baixo. Murmura em línguas
      que não são a dele.
    papel_tatico: quebra_defesa
    arquetipo: bruto
    categoria: elite
    faccao: null
    mecanica_assinatura:
      carta: cri_dentado_de_eras_dente_de_toda_era
      frase: >-
        A mordida deixa dentes de várias eras cravados na armadura: a defesa do alvo racha e não volta
        enquanto os dentes estiverem lá.
    contra_jogo: Lutar sem contar com a armadura, ou gastar uma ação para arrancar os dentes cravados; atacar pelos lados, onde a cabeça pesada demora a virar.
    gancho: >-
      Quem desce fundo em Aethelgard começa a ouvir antes de chegar perto; uns voltam com a cabeça
      cheia de vozes, este voltou com a boca cheia de dentes que não eram dele.
    habitat: [ae_ruinas_submersas]
    inspiracao: []
    padrao: [ataque, enfraquecer, ataque]
    a_cada_n: 3
    telegrafo: "Os dentes de {nome} batem todos de uma vez, num estalo comprido, e a cabeça baixa para a sua armadura."
    description: Um mergulhador que ouviu de perto as bocas do selo; a mandíbula cresceu e não para de dar dentes de todas as eras, que descem pelo pescoço em placas.
    perigo: Alto
    lore: >-
      Thessrak está selado nas câmaras mais fundas, e as bocas dele ainda falam. Os mergulhadores
      conhecem o aviso: quem começa a ouvir deve subir. Este não subiu a tempo. Voltou à borda das
      Ruínas com a mandíbula estendida e cheia de dentes que não são só de gente: de leite, de Elfo, de
      peixe, de coisa sem nome, um de cada era que as bocas lembram. Os dentes desceram pelo pescoço
      como escamas. Ele morde a armadura primeiro.
    aparencia: >-
      Homem curvado de cabeça projetada para a frente, mandíbula deslocada e alongada, apinhada de
      dentes de formas e tamanhos diferentes que furam o rosto e descem pelo pescoço e pelo peito em
      placas sobrepostas, gengiva viva entre elas, roupa de mergulho em tiras.
    como_se_luta: >-
      Morde a armadura e deixa dentes cravados nela; a defesa racha até que sejam arrancados. Ataque
      pelos lados, onde a cabeça pesada demora a virar.
    related_entities: [ae_ruinas_submersas]
    arte:
      visual: >-
        Humano adulto curvado, cabeça projetada à frente; mandíbula inferior deslocada e alongada,
        apinhada de dentes desiguais (pequenos e brancos, finos e transparentes, largos e amarelados,
        agulhas escuras) furando as bochechas; os dentes continuam pelo pescoço, ombros e peito em placas
        sobrepostas como escamas, com gengiva rosada viva entre elas. Restos de roupa de mergulho de
        couro encerado, cordas de lastro na cintura.
      composicao: >-
        Borda de um corredor élfico submerso que desce para o escuro; o Dentado de perfil mordendo a
        ombreira de ferro de um saqueador do mesmo tamanho, que recua com o arpão erguido; dentes soltos
        boiando. Luz fria de alga luminosa vinda de baixo, o resto em sombra.
      evitar: Homem-tubarão, bocarra vertical de cinema, boca com tentáculos. São dentes humanos e de bicho apinhados num rosto de gente, não uma boca nova.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_avesso_de_oghma
    vaga: 3
    nome: Avesso de Oghma
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: eter
      detalhe: null
      refs: ["lore_nova/locations.txt:246", "lore_nova/timeline_completa.txt:110"]
    anatomia:
      plano_corporal: quadrupede
      material: osso
      escala: humana
      locomocao: anda
      percepcao: respiracao
      texto: >-
        Alguém que chegou perto demais de Oghma, onde a pressão empurra de dentro para fora, e foi
        virado do avesso devagar. O esterno abriu-se e as costelas giraram para fora até formar uma
        gaiola de ossos sobre o tronco; o corpo passou a andar de barriga para cima, apoiado nas mãos e
        nos pés, com a cabeça pendurada para trás. As costelas abertas ainda têm músculo nas juntas e se
        fecham de estalo, como dedos, sobre o que entra entre elas. O rosto, de cabeça para baixo, ainda
        pisca.
    silhueta: "Um corpo de gente andando de quatro com a barriga para cima e uma gaiola de costelas abertas apontando para o alto."
    comportamento: >-
      Anda em bando pelas galerias que descem para Oghma, às vezes mais perto da superfície do que
      deveria. Corre para quem respira, rápido e desajeitado, e se joga por baixo do braço ou da perna
      de quem está na frente. Então a gaiola fecha.
    papel_tatico: controlador
    arquetipo: morto_vivo_implacavel
    categoria: lacaio
    faccao: null
    mecanica_assinatura:
      carta: cri_avesso_de_oghma_gaiola_que_fecha
      frase: >-
        Fecha a gaiola de costelas sobre o braço ou a perna de quem está na frente: com o membro preso
        entre os ossos, o alvo perde a Reação enquanto o Avesso não for solto ou morto.
    contra_jogo: Não deixar que ele chegue por baixo, chutando-o de lado; preso, quebrar uma costela da gaiola solta o membro.
    gancho: >-
      Sobre o coração de Aethelgard a água é escura e empurra de dentro para fora; o que fica tempo
      demais ali sai virado, e nem sempre sai morto.
    habitat: [ae_ruinas_submersas]
    inspiracao: []
    padrao: [mover, ataque]
    a_cada_n: 2
    telegrafo: "As costelas de {nome} se abrem até o limite, rangendo nas juntas, e ele se encolhe para o salto."
    description: Um corpo virado do avesso pela pressão perto de Oghma; anda de barriga para cima, com as costelas abertas numa gaiola que se fecha sobre o braço de quem está na frente.
    perigo: Médio
    lore: >-
      Os mergulhadores que chegaram perto de Oghma falam de uma pressão que não é a da profundidade:
      algo que empurra de dentro para fora. Quem fica ali tempo demais é virado do avesso, devagar, e
      nem sempre morre no caminho. Os Avessos sobem pelas galerias de quatro, de barriga para cima, com
      as costelas abertas sobre o tronco. Correm para quem respira e se enfiam por baixo do braço dele.
      Os mergulhadores contam de quem voltou com o antebraço quebrado em seis lugares, no formato de uma
      gaiola.
    aparencia: >-
      Corpo humano de quatro, de barriga para cima, apoiado nas mãos e nos pés, cabeça pendurada para
      trás; esterno aberto e costelas giradas para fora numa gaiola de osso sobre o tronco, com músculo
      nas juntas, pele pálida enrugada pela água.
    como_se_luta: >-
      Enfia-se por baixo de quem está na frente e fecha a gaiola de costelas sobre o braço ou a perna;
      preso, o alvo perde a Reação. Chute-o de lado antes, ou quebre uma costela para soltar.
    related_entities: [ae_ruinas_submersas]
    arte:
      visual: >-
        Corpo humano adulto em ponte invertida, andando de quatro com a barriga e o rosto para o alto,
        cabeça caída para trás de olhos abertos; esterno partido e costelas giradas para fora, curvas,
        formando uma gaiola aberta de osso branco sobre o tronco, com tendões vermelhos nas juntas de
        cada costela. Pele branco-azulada, enrugada de água, restos de calças de linho.
      composicao: >-
        Escadaria élfica submersa descendo para a água escura sobre Oghma; três Avessos subindo os
        degraus de quatro; o da frente fechou a gaiola de costelas sobre o antebraço de uma mergulhadora
        agachada no patamar, do mesmo tamanho, que puxa o braço. Luz de lanterna quente em cima, escuro
        absoluto embaixo.
      evitar: Aranha gigante, contorcionista de cinema de terror, gore com vísceras. As costelas são o desenho; osso limpo para fora, nada de entranhas espalhadas.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_fervido_da_corrente
    vaga: 4
    nome: Fervido da Corrente
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: eter
      detalhe: null
      refs: ["lore_nova/creatures.txt:1298", "lore_nova/locations.txt:261"]
    anatomia:
      plano_corporal: bipede_ereto
      material: cinza
      escala: humana
      locomocao: anda
      percepcao: calor
      texto: >-
        Um mago que atravessou uma Corrente-de-Éter atrás do poder que ela dá e se queimou por dentro. A
        pele ficou inteira, esticada e brilhante como couro molhado; por dentro não sobrou carne, só
        cinza quente e os ossos, que aparecem como sombras quando a luz bate de lado. Dos olhos, da boca
        e de baixo das unhas sai um brilho baço, e a água em volta dos ombros nunca para de soltar
        bolhas. Cada ferida que leva abre a pele, a cinza vaza, e a água em volta ferve mais.
    silhueta: "Um homem parado dentro de um rolo de vapor, com luz saindo dos olhos e da boca."
    comportamento: >-
      Fica nas galerias por onde as Correntes passam, como se esperasse a próxima. Não corre atrás de
      ninguém; segura o corredor. Quanto mais apanha, mais quente fica a água à volta dele, até
      escaldar quem estiver no mesmo corredor.
    papel_tatico: tanque_reativo
    arquetipo: guardiao
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: cri_fervido_da_corrente_agua_que_ferve
      frase: >-
        Cada Ferimento que ele leva faz a água à volta ferver mais: no fim de cada rodada, todos os que
        estão perto dele se queimam, e a queimadura cresce com as feridas dele.
    contra_jogo: Feri-lo pouco e matá-lo de uma vez, com um golpe grande, ou atraí-lo para fora da água, onde o calor se perde no ar.
    gancho: >-
      Uma Corrente-de-Éter dá a um mago poder imenso por um instante ou o queima por dentro; nas
      galerias que ela atravessa, os que se queimaram continuam de pé esperando a próxima.
    habitat: [ae_ruinas_submersas, aethelgard]
    inspiracao: []
    padrao: [defesa, ataque]
    a_cada_n: 3
    telegrafo: "A água em volta de {nome} borbulha mais forte, e o brilho dos olhos dele sobe."
    description: Um mago que atravessou uma Corrente-de-Éter e se queimou por dentro; pele inteira esticada sobre cinza fervente, e a água em volta ferve mais a cada ferida que ele leva.
    perigo: Médio
    lore: >-
      Atravessar uma Corrente-de-Éter dá a um mago um poder que ele não teria em dez anos, ou o queima
      por dentro. Aethelgard ainda atrai os que apostam. Os que perderam ficam nas galerias por onde a
      Corrente passa, de pé, com a pele intacta e nada por dentro além de cinza quente. A água ferve
      devagar em volta deles, e mais depressa quando alguém os fere. Os mergulhadores aprenderam a
      passar longe, ou a acabar com eles de uma vez.
    aparencia: >-
      Mago de pé, de túnica encharcada, pele inteira esticada e lustrosa como couro molhado, sem carne
      por baixo, ossos aparecendo como sombras; brilho baço azul-esverdeado saindo dos olhos, da boca e
      das unhas; vapor e bolhas subindo dos ombros.
    como_se_luta: >-
      Cada ferida que leva faz a água em volta ferver mais e queimar todos os que estão perto. Mate-o
      de uma vez, com um golpe grande, ou tire-o da água.
    related_entities: [ae_ruinas_submersas, aethelgard]
    arte:
      visual: >-
        Homem adulto magro, de pé, de túnica élfica de mago encharcada e escurecida; a pele do rosto e
        das mãos esticada, lisa e brilhante, quase translúcida, com as sombras do crânio e dos ossos das
        mãos visíveis por dentro; um brilho fosco azul-esverdeado vazando dos olhos, entre os lábios e
        sob as unhas; um corte no antebraço deixando escorrer cinza escura incandescente. Vapor e bolhas
        subindo em volta dos ombros.
      composicao: >-
        Galeria submersa atravessada ao fundo por uma faixa de luz líquida, a Corrente-de-Éter; o
        Fervido de pé no corredor com água pelos joelhos, três cortes no corpo vazando cinza e a água em
        volta em ebulição; dois mergulhadores do mesmo tamanho recuando do vapor. Luz fria da Corrente
        vazando por trás.
      evitar: Homem de fogo, esqueleto em chamas, demônio de lava. Não há chama; é cinza quente dentro de uma pele inteira, e vapor.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

