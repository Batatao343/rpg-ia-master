onda: 11
spec: SPEC-349
nome_regiao: Aethelgard
habitat_nome:
  aethelgard: O Lago de Aethelgard
  ae_ruinas_submersas: Ruínas Submersas
  ae_camara_seca: Câmara Seca
paleta: >-
  **Aethelgard** — lago de cratera, hoje salobro, sobre a cidade élfica que implodiu numa noite:
  arcos e corredores esculpidos sob água cristalina nas bordas, água escura sobre Oghma, cracas e
  sal onde o mar entrou pela garganta, cristais de contenção apagados nas câmaras. Luz e paleta:
  verde-garrafa e azul-ardósia da água, branco-osso da pedra élfica, cinza de sal, o azul-esverdeado
  fosco do Éter vazando de dentro das coisas; nas Ruínas, o escuro que a luz não atravessa; na
  Câmara Seca, ocre de lamparina sobre pedra suada.
