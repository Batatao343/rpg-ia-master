  - id: enemy_esqueleto_mago
    vaga: 22
    nome: Iniciado Refratado
    status: reinventada
    substitui: enemy_esqueleto_mago
    ataques: ["Feixe Partido", "Toque de Prisma"]
    acoes: ["Avança sem pressa, de braços erguidos para a luz; não foge, não se rende."]
    substitui_generico: Esqueleto Arcanista
    familia: corpo_reescrito
    origem_lore:
      fonte: eter
      detalhe: null
      refs: ["lore_nova/timeline_completa.txt:110", "lore_nova/timeline_completa.txt:120"]
    anatomia:
      plano_corporal: bipede_ereto
      material: eter_cristalizado
      escala: humana
      locomocao: anda
      percepcao: luz
      texto: >-
        Um iniciado do conselho que trabalhava ao lado dos cristais de Oghma e respirou Éter puro por
        décadas, até ele se depositar nos ossos. A medula virou cristal turvo, e o cristal cresceu para
        fora: prismas de seis faces furam a pele dos antebraços, dos ombros e da espinha, compridos como
        dedos. A carne em volta secou e encolheu. Os olhos ficaram leitosos; ele vê pela luz que entra
        nos prismas, e vira o corpo para ela como planta.
    silhueta: "Um vulto de túnica com os braços erguidos, eriçado de pontas de cristal nos braços e nas costas."
    comportamento: >-
      Patrulha as câmaras secas onde a luz das lamparinas ainda entra. Ergue os braços para qualquer
      luz e a devolve partida, num feixe que corta. Não fala; os lábios se mexem no ritmo das fórmulas
      que recitava.
    papel_tatico: artilharia
    arquetipo: morto_vivo_implacavel
    categoria: elite
    faccao: null
    mecanica_assinatura:
      carta: cri_iniciado_refratado_feixe_partido
      frase: >-
        Junta a luz da sala nos prismas por uma rodada e a solta num feixe que corta; se a luz for
        tapada antes, o feixe sai partido e fraco.
    contra_jogo: Apagar ou tapar a luz, ou pôr-se atrás de pedra quando os prismas acendem; no escuro, ele só tem as mãos.
    gancho: >-
      Os iniciados trabalhavam ao lado dos cristais de Oghma e eram o futuro do conselho; o Éter que
      respiraram ficou nos ossos deles e continuou crescendo depois que a cidade caiu.
    habitat: [ae_camara_seca, ae_ruinas_submersas]
    inspiracao: []
    padrao: [reforco_proprio, ataque]
    a_cada_n: 2
    telegrafo: "Os prismas nos braços de {nome} se viram todos para a sua lamparina e começam a clarear."
    description: Um iniciado do conselho de Aethelgard cuja medula virou cristal; prismas furam os braços e as costas e devolvem a luz da sala num feixe que corta.
    perigo: Alto
    lore: >-
      Os iniciados de Aethelgard trabalhavam no processo ao lado dos cristais de Oghma e esperavam um
      dia entrar no conselho. Respiraram Éter puro por décadas. Quando a cidade caiu, o Éter já estava
      nos ossos, e continuou crescendo: hoje fura a pele em prismas compridos nos braços e na espinha.
      Os iniciados ainda andam pelas câmaras secas, de braços para a luz, e devolvem a luz partida. No
      escuro, são só um velho magro.
    aparencia: >-
      Elfo magro e encolhido de túnica de iniciado puída, olhos leitosos, prismas de cristal turvo de
      seis faces, compridos como dedos, furando a pele dos antebraços, dos ombros e da espinha; braços
      sempre erguidos para a luz, que os prismas acendem.
    como_se_luta: >-
      Junta a luz nos prismas e a solta num feixe que corta. Tape ou apague a luz, ou fique atrás de
      pedra quando os prismas acendem; no escuro, ele só tem as mãos.
    related_entities: [ae_camara_seca, ae_ruinas_submersas, cultistas_destilacao]
    arte:
      visual: >-
        Elfo adulto de idade incerta, magro e seco, túnica comprida de iniciado em tecido fino, puída e
        manchada de água; braços erguidos à altura do rosto, palmas abertas; dos antebraços, dos ombros e
        ao longo da espinha saem prismas hexagonais de cristal turvo, compridos como dedos, com a pele
        repuxada e rachada em volta da base; olhos brancos leitosos; luz entrando nos prismas e saindo
        partida em feixes finos.
      composicao: >-
        Câmara seca de pedra élfica com uma lamparina de óleo caída no chão; o Iniciado de pé diante
        dela, braços erguidos, um feixe fino de luz partida cortando a sala em diagonal até a borda do
        escudo de madeira de um explorador agachado, do mesmo tamanho. Ocre da lamparina contra o
        azul-esverdeado dos prismas.
      evitar: Esqueleto de mago com cajado, rei-morto de coroa, cristal de videogame em neon. É gente seca com cristal turvo saindo dos ossos, e a luz é fosca.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: enemy_fantasma
    vaga: 23
    nome: Nadador Transparente
    status: reinventada
    substitui: enemy_fantasma
    ataques: ["Abraço Frio"]
    acoes: ["Some na água clara e só aparece quando já está perto; não foge, não se rende."]
    substitui_generico: Fantasma
    familia: corpo_reescrito
    origem_lore:
      fonte: eter
      detalhe: null
      refs: ["lore_nova/locations.txt:246", "lore_nova/creatures.txt:1312"]
    anatomia:
      plano_corporal: bipede_curvado
      material: carne_exposta
      escala: humana
      locomocao: nada
      percepcao: calor
      texto: >-
        Um afogado que passou tanto tempo na água escura sobre Oghma, onde o Éter muda a luz, que a
        carne perdeu a cor por inteiro. Pele, músculo e gordura ficaram claros como água: na água limpa
        da borda, o que se vê é a ossada nadando, com o coração escuro batendo devagar dentro das
        costelas. Os dedos das mãos e dos pés cresceram compridos, com membrana entre eles, e o corpo
        dobrado nada de lado, rente ao fundo. Fora da água, a carne fica opaca e cinzenta, e ele pesa.
    silhueta: "Uma ossada nadando de lado na água clara, rente ao fundo, com um ponto escuro pulsando entre as costelas."
    comportamento: >-
      Não anda nas rotas dos Afogados de patrulha nem obedece ao que os comanda: caça por conta própria
      na água rasa e cristalina das bordas, onde ninguém espera nada. Chega por baixo, abraça e puxa
      para o frio. Os pescadores o chamam de fantasma porque só se vê o osso.
    papel_tatico: emboscador
    arquetipo: morto_vivo_implacavel
    categoria: elite
    faccao: null
    mecanica_assinatura:
      carta: cri_nadador_transparente_abraco_frio
      frase: >-
        Fica invisível na água clara: o primeiro abraço vem sem aviso, e o que se lança contra ele
        antes de vê-lo erra, até ele mostrar o coração escuro.
    contra_jogo: Turvar a água ou tirá-lo dela; turvo ou fora da água ele fica opaco e lento. Mirar o coração escuro.
    gancho: >-
      Os pescadores das bordas dizem que o Lago tem fantasmas que nadam; os mergulhadores, que já
      tiraram um da água, sabem que é carne.
    habitat: [aethelgard, ae_ruinas_submersas]
    inspiracao:
      - fonte: biologia (peixe-vidro, Kryptopterus)
        referencia: "bagre de corpo transparente em que se vê o esqueleto e os órgãos"
        tomou: a carne clara como água deixando ver só a ossada e um órgão escuro
        distancia: é um afogado de Aethelgard mudado pelo Éter sobre Oghma; o peixe só deu a imagem da carne invisível
    padrao: [defesa, ataque, mover]
    a_cada_n: 3
    telegrafo: "Na água clara à sua frente, um ponto escuro bate devagar e chega mais perto: {nome} vai abraçar."
    description: Um afogado de carne clara como água; na borda cristalina do Lago parece só uma ossada nadando, e abraça por baixo.
    perigo: Alto
    lore: >-
      A água sobre Oghma muda a luz, e o que passa tempo demais nela perde a cor. Este afogado perdeu
      toda: pele, músculo e gordura ficaram claros como a água. Na borda cristalina do Lago, o que se
      vê é uma ossada nadando rente ao fundo e um coração escuro que bate devagar. Os pescadores o
      chamam de fantasma. Os mergulhadores que o tiraram da água sabem que, fora dela, é carne cinzenta e
      pesada.
    aparencia: >-
      Afogado de corpo dobrado, carne e pele transparentes como água, deixando ver a ossada e um
      coração escuro batendo entre as costelas; dedos das mãos e dos pés compridos e palmados; fora da
      água, carne opaca e cinzenta.
    como_se_luta: >-
      Na água clara é invisível, e o primeiro abraço vem sem aviso. Turve a água ou tire-o dela, e mire
      o coração escuro.
    related_entities: [aethelgard, ae_ruinas_submersas]
    arte:
      visual: >-
        Figura humana adulta nadando de lado, dobrada, quase invisível: carne transparente como
        gelatina límpida, contornos marcados só por reflexos finos; dentro, o esqueleto branco inteiro,
        nítido, e um coração escuro, vermelho-negro, entre as costelas; dedos das mãos e dos pés longos e
        finos, com membranas transparentes. Restos de um colar élfico no pescoço.
      composicao: >-
        Água rasa e cristalina da borda do Lago sobre um arco élfico submerso, vista de cima através da
        superfície: o esqueleto e o coração do Nadador deslizando rente às pedras para as pernas de um
        pescador com água pela cintura, que segura um puçá. Luz do dia filtrada, cáusticas no fundo.
      evitar: Fantasma translúcido brilhante, espectro de lençol, figura de névoa. Não brilha; é carne que ficou clara como água, e o que se vê é o esqueleto.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: enemy_golem_carne
    vaga: 24
    nome: Encomenda Costurada
    status: reinventada
    substitui: enemy_golem_carne
    ataques: ["Abraço de Caixote"]
    acoes:
      - "Fica junto dos caixotes que guarda e não sai dali; recua um passo, nunca o abandona."
      - "Ataca quem abre ou arrasta um caixote; não persegue além da margem."
    substitui_generico: Golem de Carne
    familia: corpo_reescrito
    origem_lore:
      fonte: eter
      detalhe: null
      refs: ["lore_nova/npcs.txt:64", "lore_nova/npcs.txt:70", "lore_nova/creatures.txt:1312"]
    anatomia:
      plano_corporal: composto
      material: carne_exposta
      escala: grande
      locomocao: anda
      percepcao: sangue_cheiro
      texto: >-
        Três Afogados que saqueadores da margem costuraram num corpo só, dobrado para caber num caixote
        de embarque e ser vendido a peso como bicho raro. Para caber, quebraram-lhe os joelhos e os
        cotovelos e dobraram tudo para dentro: de pé, as pernas ainda se dobram para trás e os braços,
        quatro, saem em ângulos de caixa, com as palmas viradas para fora. Os pontos de corda alcatroada
        correm pelo peito e pelos ombros, e duas cabeças tombam sobre o peito; a terceira foi cortada
        para ganhar espaço. Ripas do caixote ainda estão pregadas nas costas.
    silhueta: "Um vulto quadrado e dobrado em ângulos de caixa, com braços demais e ripas pregadas nas costas, ao lado de uma pilha de caixotes."
    comportamento: >-
      Fica na margem, junto dos caixotes que ninguém veio buscar, e às vezes se dobra de volta para
      dentro do seu. Não ataca quem passa; ataca quem abre um caixote ou tenta arrastá-lo. Abraça com os
      quatro braços e aperta, dobrando o outro como foi dobrado.
    papel_tatico: guarda_protetor
    arquetipo: guardiao
    categoria: elite
    faccao: null
    mecanica_assinatura:
      carta: cri_encomenda_costurada_lacre_quebrado
      frase: >-
        Guarda a pilha de caixotes: quem mexe num deles leva o abraço dos quatro braços com força
        dobrada; quem o enfrenta longe da pilha luta com uma coisa lenta.
    contra_jogo: Não tocar nos caixotes, ou atraí-lo para longe da margem antes de abri-los; cortar os pontos de corda solta um braço.
    gancho: >-
      Um médico do Anel de Ferro compra partes de bicho para os seus estudos e paga pelo peso; houve
      saqueadores que lhe quiseram vender três Afogados costurados como se fossem um bicho só.
    habitat: [aethelgard]
    inspiracao: []
    padrao: [defesa, defesa, ataque]
    a_cada_n: 3
    telegrafo: "{nome} põe as quatro mãos sobre os caixotes e vira as duas cabeças para quem está mais perto deles."
    description: Três Afogados costurados e dobrados por saqueadores para caber num caixote e ser vendidos como bicho raro; o Lago os pôs de pé, e eles guardam a remessa na margem.
    perigo: Alto
    lore: >-
      Um médico do Anel de Ferro compra partes de bicho para os seus estudos, e paga pelo peso. Uns
      saqueadores da margem acharam que três Afogados costurados num corpo só passariam por um bicho
      raro, e os dobraram para caber num caixote, quebrando o que não dobrava. O caixote nunca
      embarcou. O que o Lago põe de pé nos Afogados pôs de pé também este, do jeito que estava: dobrado.
      Fica junto da pilha, na margem, e não deixa ninguém abrir os outros caixotes.
    aparencia: >-
      Corpo quadrado de três Afogados costurados com corda alcatroada, dobrado em ângulos de caixa:
      joelhos que se dobram para trás, quatro braços em ângulo reto de palmas para fora, duas cabeças
      tombadas no peito, ripas de caixote pregadas nas costas.
    como_se_luta: >-
      Abraça com os quatro braços quem mexe nos caixotes que guarda e dobra o outro como foi dobrado.
      Não toque na pilha, ou atraia-o para longe dela; cortar os pontos solta um braço.
    related_entities: [aethelgard, nova_arcadia]
    arte:
      visual: >-
        Figura de uns dois metros e meio, quadrada como o caixote em que foi posta, montada com três
        corpos humanos de pele cinza-azulada enrugada de água; costuras grossas de corda alcatroada preta
        no peito e nos ombros; pernas que dobram para trás nos joelhos quebrados; quatro braços de
        comprimentos e tons diferentes saindo em ângulos retos, palmas para fora; duas cabeças de olhos
        fechados tombadas sobre o peito; três ripas de madeira pregadas nas costas, com a marca de
        remessa pintada.
      composicao: >-
        Margem do Lago com uma pilha de caixotes de madeira cintados de ferro, um deles arrombado por
        dentro; a Encomenda de pé ao lado da pilha, duas mãos sobre a tampa; um estivador com pé de
        cabra parado a três passos, uma cabeça mais baixo. Névoa leve, luz cinzenta da manhã, água
        verde-garrafa ao fundo.
      evitar: Criatura de Frankenstein com parafusos no pescoço, homem de barro, colcha de retalhos colorida, pele de cera. São afogados dobrados em forma de caixa para embarque; a leitura é o ângulo de caixote.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

