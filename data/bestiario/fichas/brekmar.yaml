paleta: >-
  **Brekmar** — o porto sem lei da costa oeste: docas de madeira pesada e pedra avançando em
  extensões tortas sobre água funda, cascos de alcatrão preto, cordame encharcado, osso de leviatã
  cor de marfim velho nas quilhas do Estaleiro, sal seco esbranquiçando tudo. Luz e paleta: preto de
  alcatrão, cinza-ardósia do mar, âmbar amarelo das lanternas de óleo que acendem a cidade à noite,
  marfim de osso, ferrugem de corrente; o rosa-dourado quente das janelas da Casa das Marés; o
  vermelho espesso da Maré Vermelha nas Docas Velhas.
