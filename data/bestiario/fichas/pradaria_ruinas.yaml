criaturas:
  # ======================= CORPOS REESCRITOS (Reescritos) =======================
  - id: mon_vertedor_de_areia
    vaga: 1
    nome: Vertedor de Areia
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: eter
      detalhe: null
      refs: ["lore_nova/races.txt:41", "lore_nova/races.txt:45", "lore_nova/creatures.txt:476"]
    anatomia:
      plano_corporal: bipede_ereto
      material: cinza
      escala: humana
      locomocao: anda
      percepcao: calor
      texto: >-
        Um Elfo alto, de pele violeta rachada como porcelana velha, que morreu na hora da ampulheta e não
        caiu. O Éter das ruínas segurou o corpo de pé, mas por dentro ele seca: das rachaduras do peito,
        dos cotovelos e da nuca escorre sem parar uma areia cinza e fina, e a pele afunda onde a areia
        sai. Os olhos ficaram leitosos; as mãos de quatro dedos longos tremem de pressa. Quanto mais vazio,
        mais leve e mais rápido ele anda, até que as pernas, ocas, dobram.
    silhueta: Um vulto alto e magro que corre curvado para a frente deixando atrás um rastro de areia que escorre dos braços.
    comportamento: >-
      Vaga pelas ruínas élficas com a pressa de quem sabe que o fim vem e corre atrás de qualquer calor
      vivo. Golpeia muitas vezes, sem guarda, como quem tenta caber tudo no tempo que sobra. Quando a
      areia acaba, desaba sozinho e não se levanta.
    papel_tatico: batedor_rapido
    arquetipo: morto_vivo_implacavel
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: cri_vertedor_de_areia_ultimos_graos
      frase: >-
        Tem rodadas contadas: ataca em rajada cada vez mais rápida enquanto a areia escorre e desaba sozinho
        quando ela acaba, sem precisar ser derrubado.
    contra_jogo: Aguentar em vez de trocar golpes; quem se fecha na defesa e o faz correr atrás sobrevive até a areia acabar.
    gancho: >-
      Os Elfos sabem que a ampulheta para sem aviso; nas ruínas onde o Éter se acumula, às vezes ela para
      e o corpo continua, e os de Vaelorn evitam olhar para quem conhecem.
    habitat: [pr_ruinas_assombradas, pr_vaelorn]
    inspiracao: []
    padrao: [ataque_multiplo, ataque]
    a_cada_n: 2
    telegrafo: "A areia escorre mais grossa dos cotovelos de {nome}, e ele se inclina para a frente."
    description: Um Elfo que morreu na hora da ampulheta e ficou de pé, de pele rachada como porcelana, de onde escorre areia cinza enquanto ele ataca cada vez mais depressa.
    perigo: Médio
    lore: >-
      Todo Elfo morre de repente, entre os sessenta e os setenta, quando a areia da ampulheta acaba. Nas
      ruínas onde o Éter se acumula, às vezes a morte vem e o corpo não cai. Fica de pé e corre, e das
      rachaduras da pele escorre uma areia cinza que ninguém sabe de onde vem. Os de Vaelorn dizem que é o
      tempo que faltava saindo de uma vez. Quem o encontra só precisa aguentar: quando a areia acaba, ele
      desaba como uma roupa vazia.
    aparencia: >-
      Elfo alto de pele violeta rachada como porcelana velha, olhos leitosos, quatro dedos longos e
      trêmulos em cada mão; das rachaduras do peito, dos cotovelos e da nuca escorre areia cinza fina, e a
      pele afunda onde ela sai.
    como_se_luta: >-
      Ataca em rajadas cada vez mais rápidas enquanto a areia escorre e desaba sozinho quando ela acaba.
      Defender e ganhar tempo vale mais do que trocar golpes com ele.
    related_entities: [pr_ruinas_assombradas, pr_vaelorn]
    arte:
      visual: >-
        Elfo adulto muito alto e magro, orelhas longas, pele violeta-pálida com rachaduras finas de
        porcelana em todo o corpo; dos cortes no peito, nos cotovelos e na nuca escorrem fios de areia
        cinza que caem como numa ampulheta; nos pontos de onde a areia saiu a pele está afundada como
        couro vazio. Olhos brancos leitosos. Vestes élficas finas, de veludo puído. Corpo inclinado para a
        frente, a meio passo de corrida.
      composicao: >-
        Rua de uma cidade élfica tomada pelo capim, paredes de pedra clara com relevos para os dedos; o
        Vertedor em primeiro plano correndo na direção de um Desenterrado com uma pá, do mesmo tamanho; atrás
        dele, um rastro de areia cinza sobre as lajes. Luz baixa de entardecer, um brilho violeta fosco de
        Éter numa fresta da parede.
      evitar: Esqueleto, múmia de faixas, fantasma translúcido, homem de areia que se desfaz no vento. É um corpo inteiro de pele rachada, que se esvazia pelas rachaduras.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_vidrado_do_morro
    vaga: 2
    nome: Vidrado do Morro
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: dragao
      detalhe: null
      refs: ["lore_nova/timeline_completa.txt:378", "lore_nova/npcs.txt:35"]
    anatomia:
      plano_corporal: bipede_ereto
      material: vidro_cristal
      escala: grande
      locomocao: anda
      percepcao: luz
      texto: >-
        Um soldado humano que estava de guarda no alto de um morro quando Malagor passou sobre a Pradaria. O
        calor fundiu a areia do morro sobre ele numa crosta grossa de vidro verde-garrafa, cheia de bolhas,
        que cobre os ombros, o peito e a cabeça como uma garrafa moldada no corpo. Por dentro do vidro se vê
        a carne escura e seca, os dentes à mostra, as mãos ainda fechadas no cabo da lança derretida. A
        crosta do peito é lisa e curva como espelho de lanterna.
    silhueta: Um soldado largo e brilhante de ombros arredondados, sem rosto, com uma lança torta grudada nas mãos.
    comportamento: >-
      Fica de pé no topo e nas encostas do morro queimado, de frente para o lugar de onde o fogo veio, e se
      volta devagar para quem sobe. Não persegue para longe do morro. Gira o tronco para pegar o sol no
      peito de vidro e o joga nos olhos de quem vem, e bate na hora em que a pessoa pisca.
    papel_tatico: tanque_reativo
    arquetipo: guardiao
    categoria: elite
    faccao: null
    mecanica_assinatura:
      carta: cri_vidrado_do_morro_sol_no_peito
      frase: >-
        Vira o peito de vidro para o sol e ofusca quem está de frente: o próximo golpe do ofuscado sai fraco
        e o dele entra cheio. À noite, sob nuvem ou de costas para o sol, o reflexo não pega.
    contra_jogo: Chegar com o sol nas costas, ou lutar à noite e em dia nublado; sem o reflexo, é só uma casca pesada e lenta.
    gancho: >-
      Ninguém voltou para enterrar quem estava no alto dos morros quando Malagor passou; os nômades contornam
      um deles, onde o capim cresce preto, e chamam os vultos verdes de garrafas.
    habitat: [pradaria_ruinas]
    inspiracao:
      - fonte: geologia (fulgurito e vidro de trinitita)
        referencia: "areia fundida em vidro por raio ou calor extremo, com bolhas e formas de raiz"
        tomou: a crosta de areia fundida em vidro verde, cheia de bolhas, moldada no que estava em cima
        distancia: só o material; a criatura, o morro e o fogo de Malagor são de Valoria
    padrao: [enfraquecer, defesa, ataque]
    a_cada_n: 3
    telegrafo: "{nome} gira o tronco de vidro para o sol, e a luz bate cheia nos seus olhos."
    description: Um soldado de guarda num morro da Pradaria com a areia fundida sobre o corpo numa crosta de vidro verde pelo fogo de Malagor, que joga o sol nos olhos de quem sobe.
    perigo: Alto
    lore: >-
      Quando Malagor passou sobre a Pradaria, havia guardas no alto de alguns morros, e ninguém voltou para
      enterrá-los. O calor fundiu a areia sobre eles, e os vultos ficaram de pé dentro do vidro, de frente
      para o lugar de onde o fogo veio. Alguns ainda se viram para quem sobe e jogam o sol do peito nos
      olhos de quem vem. Os nômades contornam o morro de dia. Os que subiram à noite contam que lá em cima
      é só uma garrafa pesada.
    aparencia: >-
      Soldado de ombros largos coberto por uma crosta grossa de vidro verde-garrafa cheia de bolhas,
      moldada no corpo como uma garrafa, com o peito liso e curvo como espelho; por dentro, carne escura e
      seca e dentes à mostra; uma lança derretida grudada nas mãos.
    como_se_luta: >-
      Joga o sol do peito de vidro nos olhos de quem está de frente e bate quando a pessoa pisca. Com o sol
      nas costas, à noite ou sob nuvem, o reflexo não pega.
    related_entities: [pradaria_ruinas]
    arte:
      visual: >-
        Figura humana de ombros largos inteiramente encapsulada numa crosta de vidro verde-garrafa turvo,
        grossa, cheia de bolhas e escorridos, com a forma arredondada de garrafa sobre a cabeça e os ombros;
        o peito liso e curvo refletindo o sol num clarão; através do vidro, um corpo escuro e seco, dentes à
        mostra, restos de cota de malha; as duas mãos fundidas a uma lança torta e derretida.
      composicao: >-
        Topo de um morro queimado na pradaria, terra preta e capim novo ralo, restos de uma paliçada
        carbonizada; o Vidrado de frente para o espectador, o sol baixo batendo no peito e espalhando um
        clarão; um cavaleiro nômade a pé, no sopé, protegendo os olhos com a mão, dá a escala. Paleta de
        verde-garrafa, ocre e preto de carvão.
      evitar: Golem de cristal, estátua de gelo, armadura brilhante de paladino, fantasma verde. É vidro de areia fundida sobre um corpo morto, turvo e cheio de bolhas.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_costas_de_alicerce
    vaga: 3
    nome: Costas de Alicerce
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/creatures.txt:527", "lore_nova/locations.txt:410"]
    anatomia:
      plano_corporal: bipede_curvado
      material: sal_mineral
      escala: grande
      locomocao: rasteja
      percepcao: vibracao
      texto: >-
        Um saqueador que dormiu num porão de ruína, encostado numa laje de fundação, e acordou com ela
        crescida nas costas. A pedra clara, esculpida em relevo élfico, tomou toda a espinha e os ombros
        como um casco de tartaruga feito de parede; entre a pedra e a carne corre uma costura de pele
        inchada e roxa. Os braços engrossaram para aguentar o peso e as mãos racharam nas palmas de tanto
        apoiar no chão. A cabeça fica baixa, debaixo da borda da laje, e só os olhos aparecem.
    silhueta: Um pedaço de parede esculpida que se arrasta sobre dois braços grossos, com uma cabeça escondida por baixo.
    comportamento: >-
      Arrasta-se pelos porões e passagens das ruínas, sempre sentindo o tremor do chão. Quando há luta, se
      põe de lado entre o golpe e os outros e deixa a laje levar a pancada. Raramente ataca; empurra com a
      borda da pedra.
    papel_tatico: guarda_protetor
    arquetipo: guardiao
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: cri_costas_de_alicerce_parede_que_anda
      frase: >-
        Põe a laje das costas na frente de um aliado e leva por ele o golpe seguinte; enquanto a laje
        estiver inteira, quem está atrás dela não é alcançado.
    contra_jogo: Rachar a laje com pancada ou ir por trás, na costura de carne entre a pedra e a espinha, onde ela não protege.
    gancho: >-
      Algumas cidades élficas foram erguidas sobre coisas que dormiam, e quem dorme encostado nos
      alicerces dessas ruínas às vezes acorda carregando um pedaço delas.
    habitat: [pr_ruinas_assombradas]
    inspiracao: []
    padrao: [defesa, mover]
    a_cada_n: 3
    telegrafo: "{nome} gira de lado e firma os braços no chão, a laje virada para você."
    description: Um saqueador que acordou com uma laje de fundação élfica crescida nas costas e se arrasta pelas ruínas pondo a pedra entre o golpe e os outros.
    perigo: Médio
    lore: >-
      Algumas cidades élficas foram erguidas sobre coisas que a terra havia coberto, e a queda das cidades
      rachou os alicerces. Quem dorme encostado numa dessas lajes às vezes acorda com ela presa nas costas,
      e na semana seguinte já não a separa da espinha. Os Desenterrados conhecem o risco e dormem de pé. Os
      que carregam a pedra não saem mais dos porões; protegem quem estiver por perto, como uma parede
      protege, sem escolher.
    aparencia: >-
      Corpo humano curvado sob uma laje de pedra clara esculpida em relevo élfico, crescida na espinha e
      nos ombros como um casco; costura de pele roxa e inchada entre a pedra e a carne; braços grossos,
      palmas rachadas, cabeça baixa sob a borda da laje.
    como_se_luta: >-
      Põe a laje entre o golpe e os aliados e leva a pancada por eles. Rachar a pedra ou atacar pela
      costura de carne, por trás, abre caminho.
    related_entities: [pr_ruinas_assombradas]
    arte:
      visual: >-
        Humano adulto curvado de quatro, as costas inteiramente cobertas por uma laje de pedra clara de um
        metro e meio, com relevos élficos de folhas e rostos gastos, fundida à espinha; nas bordas da laje,
        uma faixa de pele roxa, inchada e repuxada como cicatriz; braços muito grossos, mãos de palmas
        rachadas apoiadas no chão; só os olhos visíveis debaixo da borda da pedra.
      composicao: >-
        Porão de ruína élfica, raízes de capim descendo pelas frestas do teto, poeira no feixe de luz; a
        criatura de lado, a laje virada para um saqueador com uma tocha que tenta alcançar outro atrás dela;
        a porta baixa ao fundo dá a escala. Luz quente de tocha, sombras cinza.
      evitar: Tartaruga, golem de pedra, gárgula, estátua viva. É uma pessoa com um pedaço de parede crescido nas costas.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_vestido_de_gafanhotos
    vaga: 4
    nome: Vestido de Gafanhotos
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/creatures.txt:430", "lore_nova/creatures.txt:535"]
    anatomia:
      plano_corporal: bipede_curvado
      material: quitina
      escala: grande
      locomocao: anda
      percepcao: calor
      texto: >-
        Um lavrador que ficou caído no campo durante uma praga de Gafanhotos-de-Bronze e não foi comido
        inteiro: o enxame entrou nele e ficou. Os gafanhotos de casca de bronze se agarraram em camadas sobre
        o peito, os braços e as costas como escamas de uma armadura viva, e por baixo deles o músculo está
        exposto, roído em sulcos. As asas zumbem sob as cascas o tempo todo. O rosto é só a boca e os olhos;
        o resto está coberto de bichos que se mexem.
    silhueta: Um homem largo e curvado coberto de escamas de bronze que se mexem, com uma névoa de asas em volta dos ombros.
    comportamento: >-
      Anda devagar pelos campos que o enxame já comeu, atrás de calor, e bate com os braços cobertos de
      cascas. Quando ele cai, o enxame não morre com ele: levanta de uma vez e procura o corpo vivo mais
      perto, e se agarra nele em camadas, como se agarrou no lavrador.
    papel_tatico: bruto_de_linha
    arquetipo: bruto
    categoria: elite
    faccao: null
    mecanica_assinatura:
      carta: cri_vestido_de_gafanhotos_enxame_muda_de_corpo
      frase: >-
        Quando ele cai, o enxame se agarra ao inimigo vivo mais próximo e lhe dá a armadura de cascas: o
        aliado mais perto dele fica mais duro de ferir pelo resto da luta.
    contra_jogo: Fogo ou fumaça no corpo caído antes que o enxame levante; derrubá-lo longe dos outros também serve.
    gancho: >-
      As pragas de Gafanhotos-de-Bronze condenam vilas inteiras à fome; os nômades leem os sinais e se movem
      antes, e quem não se move às vezes fica com o enxame.
    habitat: [pradaria_ruinas]
    inspiracao: []
    padrao: [ataque, ataque_multiplo, ataque]
    a_cada_n: 3
    telegrafo: "O zumbido debaixo das cascas de {nome} sobe de tom, e o enxame se vira para quem está ao lado dele."
    description: Um lavrador que o enxame de Gafanhotos-de-Bronze não terminou de comer, coberto de gafanhotos vivos em camadas como armadura sobre o músculo roído, que passam a outro corpo quando ele cai.
    perigo: Alto
    lore: >-
      As pragas de Gafanhotos-de-Bronze vêm em ciclos e comem tudo o que é verde. Os nômades se movem antes;
      os lavradores das vilas fixas não têm para onde. De vez em quando o enxame encontra alguém caído no
      campo e não termina. Entra nele e fica, agarrado em camadas como escamas, roendo devagar o que está por
      baixo. O homem continua de pé, e anda pelos campos comidos atrás de calor. Quando enfim cai, o enxame
      levanta e procura outro corpo. Os Andarilhos queimam o caído na mesma hora, antes de qualquer outra
      coisa.
    aparencia: >-
      Homem largo e curvado coberto de gafanhotos de casca de bronze agarrados em camadas como escamas no
      peito, nos braços e nas costas, com o músculo roído em sulcos aparecendo entre eles; asas zumbindo sob
      as cascas; só a boca e os olhos livres no rosto.
    como_se_luta: >-
      Quando cai, o enxame passa ao inimigo vivo mais próximo e lhe dá a armadura de cascas. Fogo ou fumaça
      no corpo caído impedem a passagem.
    related_entities: [pradaria_ruinas]
    arte:
      visual: >-
        Humano grande e curvado, inteiramente coberto por centenas de gafanhotos de carapaça cor de bronze
        polido e esverdeado, agarrados em camadas sobrepostas como escamas de armadura; nos braços e no
        flanco, frestas onde os insetos saíram mostram músculo vermelho-escuro roído em sulcos rasos, sem
        sangue escorrendo; asas translúcidas meio abertas sob as cascas; rosto coberto de insetos, exceto a
        boca e os olhos; alguns gafanhotos levantando voo dos ombros.
      composicao: >-
        Campo de lavoura comido até a terra, talos secos e cercas de vara caídas; o Vestido de Gafanhotos
        avançando em direção a um lavrador que ergue uma tocha acesa, os dois quase da mesma altura; uma
        nuvem fina de gafanhotos no ar entre eles. Luz de entardecer amarela, poeira.
      evitar: Homem-inseto de quadrinho, demônio de moscas, cavaleiro de armadura de bronze, gore. São gafanhotos vivos agarrados sobre um corpo, e o músculo aparece só nas frestas.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_fucador_da_semente
    vaga: 5
    nome: Fuçador da Semente
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/creatures.txt:535", "lore_nova/creatures.txt:448"]
    anatomia:
      plano_corporal: quadrupede
      material: carne_exposta
      escala: grande
      locomocao: anda
      percepcao: sangue_cheiro
      texto: >-
        Um javali de presa longa que fuçou até o centro de um círculo morto da pradaria e engoliu o que
        estava enterrado lá. O flanco esquerdo se abriu num buraco preto e seco, que não sangra, por onde
        se vê a costela escurecida; a pele cai em anéis ao redor do buraco e o pelo solta em tufos. As presas
        amarelaram e cresceram tortas, e a carne do focinho apodrece e cresce de novo no mesmo dia. Onde ele
        se deita, o capim morre num círculo.
    silhueta: Um javali enorme de costas eriçadas com um buraco escuro aberto no flanco e presas curvas como ganchos.
    comportamento: >-
      Fareja sangue de longe e investe contra o ferido. Não foge da dor, porque já apodrece por dentro.
      Tudo o que ele rasga com as presas começa a apodrecer, e a ferida piora depois que ele vai embora.
    papel_tatico: drenador
    arquetipo: predador
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: cri_fucador_da_semente_presa_podre
      frase: >-
        A ferida que as presas abrem apodrece: continua tirando Vitalidade nas rodadas seguintes, e piora se
        ele acertar de novo no mesmo lugar.
    contra_jogo: Limpar a ferida cedo e não deixar que ele acerte duas vezes; fogo no capim seco à volta o faz desviar.
    gancho: >-
      Os nômades sabem que nada cresce no círculo onde a grama morreu e não deixam os animais pastarem lá;
      os javalis fuçam onde querem.
    habitat: [pradaria_ruinas, pr_ruinas_assombradas]
    inspiracao: []
    padrao: [ataque, enfraquecer]
    a_cada_n: 2
    telegrafo: "{nome} raspa o chão e o buraco do flanco solta um bafo frio e sem cheiro."
    description: Um javali de presa longa que engoliu o que estava enterrado num círculo morto da pradaria, com um buraco preto no flanco, cujas presas fazem apodrecer o que rasgam.
    perigo: Médio
    lore: >-
      Há pontos da pradaria onde a grama morre num círculo perfeito, e os nômades não deixam os animais
      pastarem ali. Os javalis de presa longa reviram o que querem. Um deles fuçou até o centro e engoliu o
      que estava enterrado, e desde então tem um buraco seco no flanco que não sangra nem fecha. Apodrece e
      cresce de novo, todo dia. O que ele rasga apodrece também, e onde ele se deita o capim morre em roda.
    aparencia: >-
      Javali enorme de presas amarelas, longas e tortas; no flanco um buraco preto e seco mostrando a
      costela escurecida; pele caindo em anéis ao redor, pelo solto em tufos, focinho de carne meio podre e
      meio nova.
    como_se_luta: >-
      Investe contra quem sangra, e a ferida que as presas abrem continua apodrecendo depois. Tratar a
      ferida cedo e não deixar que ele acerte duas vezes.
    related_entities: [pradaria_ruinas, pr_ruinas_assombradas]
    arte:
      visual: >-
        Javali selvagem do tamanho de um boi pequeno, pelo escuro e eriçado no dorso, presas amarelas longas
        e curvas para cima; no flanco esquerdo uma cavidade escura, seca e sem sangue, com as costelas
        enegrecidas visíveis, a pele ao redor descascando em anéis concêntricos; o focinho com manchas de
        carne cinza-podre ao lado de carne rosada nova. Um círculo de capim morto e cinzento ao redor das
        patas.
      composicao: >-
        Pradaria aberta, capim alto dourado, e no meio um círculo perfeito de grama morta e cinza; o Fuçador
        no centro, cabeça baixa, de frente para um pastor nômade com um bastão na borda do círculo, do mesmo
        tamanho do animal até a cernelha. Céu branco de vento, luz chapada de meio-dia.
      evitar: Javali-demônio de olhos de fogo, zumbi animal com vísceras, porco de chifres. O buraco é seco e escuro, sem gore; o horror é o apodrecer que volta.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  # ======================= BESTAS DA ENTROPIA (Bestas Tortas) =======================
  - id: mon_nadador_de_pedra
    vaga: 6
    nome: Nadador de Pedra
    status: nova
    substitui: null
    familia: besta_entropia
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/creatures.txt:430", "lore_nova/creatures.txt:527"]
    anatomia:
      plano_corporal: quadrupede
      material: carne_exposta
      escala: pequena
      locomocao: cava
      percepcao: vibracao
      texto: >-
        Um bicho do tamanho de um porco, sem pelos e sem olhos, de pele rosada e enrugada cheia de grãos de
        pedra encravados. As patas da frente são largas como pás, de garras chatas, e o focinho é uma placa
        dura de raspar. Atravessa a pedra das fundações como se ela fosse água: a parede ondula em volta
        do corpo e fecha atrás dele sem marca. Os dentes da frente são largos e planos, de moer.
    silhueta: Uma cabeça cega e enrugada saindo de uma parede que ondula em volta dela como água.
    comportamento: >-
      Vive dentro das fundações das ruínas e sente pelo tremor quem anda em cima. Mergulha na pedra, nada
      por baixo dos pés e sai de uma parede ao lado. Quando entra ou sai, o chão em volta ondula e derruba
      quem está perto.
    papel_tatico: emboscador
    arquetipo: emboscador
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: cri_nadador_de_pedra_onda_no_chao
      frase: >-
        Ao mergulhar ou sair da pedra, faz o chão ondular e empurra todos os que estão perto para fora do
        lugar; dentro da pedra, não pode ser alvejado.
    contra_jogo: Ficar fora das lajes e paredes, no capim e na terra solta, onde ele não nada; quieto, ele não sente onde você está.
    gancho: >-
      As ruínas mais antigas são pedra sobre pedra, e alguma coisa da pradaria aprendeu a viver dentro
      delas como peixe dentro do rio.
    habitat: [pr_ruinas_assombradas]
    inspiracao: []
    padrao: [mover, ataque]
    a_cada_n: 2
    telegrafo: "As lajes sob {nome} ondulam como água de poço, e a parede ao seu lado estremece."
    description: Um bicho cego de pele rosada e enrugada que nada dentro das fundações das ruínas como se a pedra fosse água e sai pela parede ao lado.
    perigo: Médio
    lore: >-
      Nas fundações das cidades caídas vive um bicho que atravessa a pedra como peixe atravessa o rio. A
      parede ondula em volta dele e fecha sem marca. É cego, sente pelo tremor de quem anda em cima e sai de
      uma parede ao lado da vítima. Os Desenterrados escutam o chão antes de entrar num porão, e cavam pela
      terra, não pela pedra, sempre que podem.
    aparencia: >-
      Bicho do tamanho de um porco, sem pelos e sem olhos, de pele rosada e enrugada com grãos de pedra
      encravados, patas da frente largas como pás, focinho em placa dura e dentes largos de moer.
    como_se_luta: >-
      Nada dentro da pedra e sai ao lado; ao entrar e sair, faz o chão ondular e derruba quem está perto.
      Na terra solta e no capim ele não nada.
    related_entities: [pr_ruinas_assombradas]
    arte:
      visual: >-
        Animal escavador do tamanho de um porco, corpo atarracado, pele nua rosada-acinzentada muito
        enrugada, com grãos de pedra e areia encravados nas dobras; sem olhos, só pele lisa onde eles
        estariam; patas dianteiras largas como pás, garras chatas; focinho em placa córnea; dentes
        incisivos largos e amarelos. Metade do corpo saindo de uma parede de pedra lavrada que ondula em
        anéis em volta dele, como água.
      composicao: >-
        Corredor de ruína élfica com paredes de pedra clara esculpida; o Nadador emergindo da parede lateral
        na altura do joelho de um saqueador que segura uma lanterna, os anéis de pedra ondulando ao redor;
        poeira suspensa. Luz de lanterna quente e sombras frias.
      evitar: Toupeira fofa, verme gigante, monstro de terra. A pedra fica sólida e esculpida, só ondula onde ele passa.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_cobra_de_legua
    vaga: 7
    nome: Cobra de Légua
    status: nova
    substitui: null
    familia: besta_entropia
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/creatures.txt:452", "lore_nova/locations.txt:381"]
    anatomia:
      plano_corporal: serpentiforme
      material: couro_tecido
      escala: enorme
      locomocao: rasteja
      percepcao: vibracao
      texto: >-
        Uma cobra cinza-esverdeada da grossura de uma coxa, de escamas gastas e chatas de tanto arrastar,
        com a cabeça larga e achatada como uma pá. O corpo não afina: tem a mesma grossura em todo o
        comprimento que se vê, e nunca se vê a cauda. Quando ela aperta uma volta, outra já vem saindo do
        capim, e mais outra. A boca sem dentes de veneno abre em ângulo de dobradiça.
    silhueta: Voltas e voltas de um corpo grosso saindo do capim alto sem que se veja onde ele acaba.
    comportamento: >-
      Fica estendida sob o capim ao longo das ruas das cidades mortas e sente o passo de quem anda nelas.
      Enlaça uma perna e vai acrescentando voltas, sem pressa, porque sempre tem mais corpo. Os nômades
      contam que já seguiram uma do começo da manhã até a tarde sem achar o fim.
    papel_tatico: controlador
    arquetipo: predador
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: cri_cobra_de_legua_mais_uma_volta
      frase: >-
        Prende e, a cada rodada que a presa continua presa, aperta mais uma volta tirada do capim; o aperto
        só cresce, nunca diminui sozinho.
    contra_jogo: Cortar a cabeça e não as voltas; sair do aperto cedo, antes da segunda volta, custa muito menos que depois.
    gancho: >-
      Os Andarilhos cortam a cabeça e não procuram o resto: um pastor que seguiu o corpo de uma pelo capim
      saiu de manhã e voltou à tarde sem ter chegado à cauda.
    habitat: [pradaria_ruinas]
    inspiracao: []
    padrao: [enfraquecer, ataque, ataque]
    a_cada_n: 3
    telegrafo: "O capim em volta de {nome} se mexe longe dali, como se mais corpo estivesse chegando."
    description: Uma cobra grossa como uma coxa, escondida no capim alto das ruas mortas, cujo corpo nunca afina e nunca acaba, e que aperta mais uma volta a cada momento.
    perigo: Médio
    lore: >-
      Há cobras de veneno na grama alta, e há esta, que não tem veneno. Tem corpo, da grossura de uma coxa,
      e ninguém nunca viu onde ele acaba. Fica estendida sob o capim das ruas das cidades mortas e enlaça a
      perna de quem pisa. Depois é só esperar, porque sempre vem mais uma volta. Os Andarilhos cortam a
      cabeça e vão embora sem procurar o resto.
    aparencia: >-
      Cobra cinza-esverdeada da grossura de uma coxa, escamas gastas e chatas, cabeça larga e achatada como
      pá, corpo da mesma grossura em todo o comprimento visível, saindo do capim em voltas sem fim.
    como_se_luta: >-
      Prende e aperta mais a cada rodada, porque sempre tem mais corpo. Soltar-se cedo e mirar a cabeça,
      não as voltas.
    related_entities: [pradaria_ruinas]
    arte:
      visual: >-
        Serpente gigante da grossura de uma coxa humana, cinza-esverdeada, escamas opacas e gastas, cabeça
        larga, chata e sem presas; o corpo tem exatamente a mesma grossura em todas as voltas visíveis, sem
        afinar; várias voltas enroladas e mais corpo saindo do capim em direções diferentes, sem cauda à
        vista.
      composicao: >-
        Rua de cidade morta tomada pelo capim, soleiras de pedra aparecendo; um viajante com uma perna presa
        por duas voltas, a cabeça da cobra na altura do peito dele; mais trechos de corpo emergindo do capim
        ao longe, até a borda do quadro. Vento deitando o capim, céu branco, luz de fim de tarde.
      evitar: Hidra, serpente marinha, cobra-demônio de olhos vermelhos, naja com capuz. Uma cobra só, sem cauda à vista, comprida demais.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

