paleta: >-
  **Pradaria das Ruínas** — planície aberta de capim alto que o vento nunca deixa parado, com
  fundações de cidades-estado Élficas e Cinzéus aflorando da grama: pedra clara esculpida em
  relevo para os dedos, paredes Cinzéu lisas cobertas de frases pretas sobre cinza, colunas
  partidas, morros queimados com areia fundida em vidro verde-garrafa. Luz e
  paleta: ocre de capim seco, cinza-pedra, verde-acinzentado, céu enorme e branco de vento; poeira
  dourada no contraluz; Éter violeta e azul-esverdeado, fosco, só nas Ruínas Assombradas.
