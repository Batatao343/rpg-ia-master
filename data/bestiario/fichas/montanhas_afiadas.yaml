        Os fios pendurados amortecem o braço que tocam: quem passa por baixo dela golpeia mais fraco até o
        formigamento passar.
    contra_jogo: Furá-la de longe, que ela murcha e cai; não passar por baixo dos fios; esfriar o ar do respiro a faz descer.
    gancho: >-
      Os respiros dos Anões ainda puxam o ar quente da Forja para cima; o que flutua nele vai até onde o
      ar vai.
    habitat: [ma_forja_profunda, ma_boca]
    inspiracao:
      - fonte: zoologia (caravela-portuguesa)
        referencia: "animal marinho de flutuador cheio de gás e tentáculos longos que queimam"
        tomou: o flutuador e os fios pendurados que queimam
        distancia: só o desenho; vive no ar quente dos respiros, não no mar, e amortece em vez de envenenar
    padrao: [enfraquecer, mover]
    a_cada_n: 2
    telegrafo: "{nome} desce um palmo no ar quente, e a cortina de fios encosta no chão."
    description: Bexiga translúcida cheia de ar quente que flutua nos respiros dos Anões, com uma cortina de fios que amortecem o braço que tocam.
    perigo: Baixo
    lore: >-
      Os Anões construíram respiros que levam o ar das câmaras fundas até a superfície, e eles ainda
      funcionam. O ar quente da Forja Profunda sobe por eles e leva junto as Bexigas: sacos de pele fina
      do tamanho de uma cabeça, cheios de ar morno, com uma coroa de olhinhos e uma cortina de fios
      pendurados. Elas se juntam onde há calor de corpo. Quem passa por baixo sente o braço formigar e
      pesar, e só percebe por quê quando vê os fios.
    aparencia: >-
      Bexiga de pele translúcida do tamanho de uma cabeça, coração e nervos rosados visíveis por dentro,
      coroa de olhos pretos miúdos na borda de baixo, dezenas de fios de carne finos de três metros
      pendurados.
    como_se_luta: >-
      Deriva no ar quente e os fios amortecem quem passa por baixo, que golpeia mais fraco. Furá-la de
      longe ou esfriar o respiro.
    related_entities: [ma_forja_profunda, ma_boca]
    arte:
      visual: >-
        Saco de pele fina e translúcida, redondo, do tamanho de uma cabeça humana, cor de leite com um
        brilho morno; por dentro, um coração pequeno e uma rede de nervos rosados; na borda de baixo, uma
        coroa de olhinhos pretos; pendurados dela, dezenas de fios finíssimos de carne rosada, longos,
        descendo três metros. Sem asas, sem boca visível.
      composicao: >-
        Poço de ventilação anão, vertical, de pedra lavrada com grade de ferro; três Bexigas paradas no ar
        quente que sobe, fios pendurados até o chão; um mineiro com capacete de couro passa por baixo e
        olha para cima, dando a escala. Luz laranja vindo de baixo, do fundo do poço.
      evitar: >-
        Água-viva de mar, olho flutuante, bolha de magia brilhante. É um bicho de carne fina cheio de ar
        morno, opaco e frágil.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_saltao_de_galeria
    vaga: 12
    nome: Saltão de Galeria
    status: nova
    substitui: null
    familia: besta_entropia
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/locations.txt:368", "lore_nova/creatures.txt:306"]
    anatomia:
      plano_corporal: hexapode_ou_mais
      material: carne_exposta
      escala: humana
      locomocao: salta
      percepcao: vibracao
      texto: >-
        Um grilo de caverna do tamanho de um cão grande, sem cor nenhuma: a carne aparece pela casca fina,
        rosada e translúcida, e dá para ver os músculos das patas de trás se armando. As antenas têm quatro
        vezes o comprimento do corpo e arrastam pelo chão, sentindo os passos. Os olhos sumiram. O corpo pesa ao contrário e cai para cima: o salto termina no teto, onde ele pousa de patas
        para o alto e fica, como se o teto fosse o chão.
    silhueta: Um bicho de pernas altas e dobradas pousado de patas no teto da galeria, com duas linhas finíssimas pendendo até o chão.
    comportamento: >-
      Vive em bando no teto das galerias de cima da Boca. As antenas pendem até o chão e sentem os passos;
      quando alguém passa, os grilos se soltam do teto, caem para baixo sobre ele e se agarram. Cada um que
      se agarra pesa mais, e com três nas costas a vítima vai ao chão.
    papel_tatico: batedor_rapido
    arquetipo: predador
    categoria: lacaio
    faccao: null
    mecanica_assinatura:
      carta: cri_saltao_de_galeria_peso_do_bando
      frase: >-
        Agarra-se no alvo e fica; cada Saltão já agarrado torna o próximo mais pesado, e com três a vítima
        cai e perde a rodada.
    contra_jogo: Sacudir ou queimar os que estão agarrados antes do terceiro; andar devagar e leve, longe das antenas que pendem, não os acorda.
    gancho: "Nas galerias da Boca há grilos que caem para cima; vivem no teto e caem em cima da gente, um por vez, até ser demais."
    habitat: [ma_boca]
    inspiracao:
      - fonte: zoologia (grilos de caverna, Rhaphidophoridae)
        referencia: "insetos de caverna sem asas, de antenas e patas traseiras enormes"
        tomou: o corpo pálido, as antenas longas e o salto
        distancia: o tamanho, o pouso de patas no teto e o bando que derruba pelo peso são do Reino
    padrao: [mover, ataque, ataque]
    a_cada_n: 2
    telegrafo: "{nome} recolhe as antenas do chão de uma vez, e o teto inteiro da galeria estala."
    description: Grilo de caverna pálido do tamanho de um cão grande que vive pousado de patas no teto; cai em bando sobre quem passa e derruba pelo peso.
    perigo: Baixo
    lore: >-
      Nas galerias de cima da Boca há grilos de caverna que pesam ao contrário: o corpo deles cai para cima, e eles vivem de patas no teto. São do tamanho de cães, cegos, com antenas que
      pendem até o chão e sentem os passos. Quando alguém passa, soltam-se e caem em cima, e se agarram.
      Um não derruba ninguém; três derrubam. Os Goblins-mineiros atravessam essas galerias devagar, de
      tocha erguida.
    aparencia: >-
      Grilo de caverna do tamanho de um cão grande pousado de patas no teto, casca fina rosada e
      translúcida mostrando os músculos, sem olhos, antenas quatro vezes o comprimento do corpo pendendo
      até o chão, patas traseiras longas dobradas.
    como_se_luta: >-
      Cai do teto e se agarra; cada um a mais pesa mais, e três derrubam a vítima. Sacudir ou queimar os
      agarrados antes do terceiro.
    related_entities: [ma_boca]
    arte:
      visual: >-
        Inseto de caverna grande, do tamanho de um cão, sem asas, casca fina rosada e translúcida com os
        músculos aparecendo; patas traseiras muito longas e dobradas; pousado de patas no teto como se
        fosse o chão; antenas finíssimas e longuíssimas pendendo até o piso; cabeça lisa sem olhos.
      composicao: >-
        Galeria anã de teto baixo com dezenas de grilos pousados no teto, as antenas pendendo como cortina
        de fios; um minerador já com dois grilos agarrados nas costas, curvado, e um terceiro caindo; outro
        minerador recua com uma tocha, dando a escala. Luz de tocha, o resto em breu.
      evitar: >-
        Gafanhoto gigante verde, aranha, barata. É pálido, cego, e o errado é estar no teto como no chão.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_rolador_de_escarpa
    vaga: 13
    nome: Rolador de Escarpa
    status: nova
    substitui: null
    familia: besta_entropia
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/locations.txt:355", "lore_nova/locations.txt:360"]
    anatomia:
      plano_corporal: quadrupede
      material: osso
      escala: humana
      locomocao: rola
      percepcao: som
      texto: >-
        Um bicho de quatro patas do tamanho de um javali, coberto de placas de osso que se sobrepõem como
        telhas, cada uma com a borda lascada e afiada como pederneira. O focinho é comprido, sem dentes,
        de comer formiga de pedra nas frestas. Quando assustado ou caçando, enrola-se numa bola com a
        cabeça e as patas para dentro e se deixa cair pela encosta de cascalho; as placas abertas cortam o
        que encontram no caminho.
    silhueta: Uma pedra redonda e eriçada descendo a encosta aos saltos, mais rápida que as outras pedras.
    comportamento: >-
      Vive nas encostas de cascalho acima das trilhas. Ouve os passos, sobe um pouco, enrola-se e desce
      a encosta como uma pedra solta, contra as pernas de quem está na trilha. Depois se desenrola
      embaixo e sobe de novo para repetir.
    papel_tatico: quebra_defesa
    arquetipo: bruto
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: cri_rolador_de_escarpa_rolagem
      frase: >-
        Desce a encosta enrolado e bate contra a guarda: escudo e postura não seguram uma pedra afiada que
        rola.
    contra_jogo: Sair da linha da encosta ou subir acima dele; desenrolado e de barriga para cima, é mole.
    gancho: >-
      Os deslizamentos das Montanhas mudam as rotas toda semana; nem toda pedra que desce caiu sozinha.
    habitat: [montanhas_afiadas, ma_saidas_baixas]
    inspiracao:
      - fonte: zoologia (pangolim e tatu-bola)
        referencia: "mamíferos de escamas ou carapaça que se enrolam em bola para se defender"
        tomou: o corpo de placas que vira bola
        distancia: só o enrolar; usar a encosta como arma e as placas afiadas como pederneira são das escarpas das Montanhas
    padrao: [mover, ataque_multiplo, defesa]
    a_cada_n: 3
    telegrafo: "{nome} some acima da trilha, e um barulho de cascalho começa a descer."
    description: Bicho de placas de osso afiadas como pederneira que se enrola em bola e desce as encostas de cascalho contra quem está na trilha.
    perigo: Médio
    lore: >-
      As encostas de cascalho das Montanhas Afiadas estão sempre descendo um pouco. Algumas pedras descem
      de propósito. O Rolador é um bicho do tamanho de um javali, coberto de placas de osso com bordas
      lascadas como pederneira, que se enrola em bola e se deixa cair na trilha, contra as pernas de quem
      passa. Depois se desenrola, sobe e desce de novo. Os guias contam as pedras que descem; quando o
      número não fecha, mandam encostar no paredão.
    aparencia: >-
      Bicho do tamanho de um javali coberto de placas de osso sobrepostas como telhas, de bordas lascadas
      e afiadas como pederneira, focinho comprido sem dentes; enrolado, é uma bola eriçada de pedra.
    como_se_luta: >-
      Desce a encosta enrolado e quebra a guarda de quem está na trilha. Sair da linha da encosta;
      desenrolado e de barriga para cima, é mole.
    related_entities: [montanhas_afiadas, ma_saidas_baixas]
    arte:
      visual: >-
        Quadrúpede atarracado do tamanho de um javali, coberto de placas de osso cinza-ardósia sobrepostas
        como telhas, cada borda lascada em fio de pederneira; focinho comprido e fino, olhos pequenos,
        patas curtas com garras de cavar. Mostrar também o bicho enrolado: uma bola eriçada de placas.
      composicao: >-
        Encosta íngreme de cascalho acima de uma trilha estreita; um Rolador enrolado descendo aos saltos,
        outro desenrolado no alto, olhando; na trilha, um viajante com escudo de madeira se encolhe,
        dando a escala. Poeira de pedra, céu frio.
      evitar: >-
        Tatu fofo de desenho, ouriço, bola de espinhos de metal, roda com bocas. As placas de pederneira de
        bordas lascadas dominam a imagem; o bicho é feio e prático.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_chicote_de_fenda
    vaga: 14
    nome: Chicote de Fenda
    status: nova
    substitui: null
    familia: besta_entropia
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/locations.txt:355", "lore_nova/daily_life.txt:224"]
    anatomia:
      plano_corporal: hexapode_ou_mais
      material: quitina
      escala: humana
      locomocao: escala_paredes
      percepcao: vibracao
      texto: >-
        Um bicho achatado como uma tábua, da largura de um homem, que mora nas fendas verticais da rocha.
        O corpo de quitina parda é tão fino que cabe numa rachadura de dois dedos. Tem oito patas: seis
        curtas para andar de lado, e duas da frente tão compridas e finas que viraram chicotes de tatear,
        de três metros. Embaixo da cabeça, um par de braços dobrados cheios de espinhos se fecha como uma
        armadilha de caçador.
    silhueta: Uma rachadura na rocha de onde saem dois fios compridos que tateiam a trilha.
    comportamento: >-
      Fica dentro da fenda, de lado, e estica os chicotes para fora, tocando a trilha devagar. Quando um
      deles toca uma perna, os braços de espinhos saem da fenda de uma vez e puxam para dentro o que
      conseguirem. Volta para a fenda ao primeiro corte.
    papel_tatico: emboscador
    arquetipo: emboscador
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: cri_chicote_de_fenda_abraco_de_espinhos
      frase: >-
        Toca primeiro com o chicote; quem foi tocado leva na rodada seguinte o bote dos braços de espinhos,
        que o puxa contra a parede, de dentro da pedra.
    contra_jogo: Cortar os chicotes quando tocarem, ou passar longe da parede; fora da fenda, achatado, ele vira de costas com uma pancada.
    gancho: >-
      Os guias Cinzéus escolhem a fenda estreita em vez da passagem larga; escolhem também em qual parede
      não encostar.
    habitat: [montanhas_afiadas]
    inspiracao:
      - fonte: zoologia (amblipígios)
        referencia: "aracnídeos achatados de patas da frente longas como antenas e braços de espinhos"
        tomou: o corpo achatado, as patas-chicote que tateiam e os braços de espinhos
        distancia: só a anatomia; o tamanho e a vida nas fendas verticais são das Montanhas; não tece teia nem se camufla na pedra
    padrao: [enfraquecer, ataque]
    a_cada_n: 2
    telegrafo: "{nome} encosta a ponta de um chicote na perna de alguém e para de mexer."
    description: Bicho achatado como uma tábua que mora nas fendas da rocha; tateia a trilha com dois chicotes de três metros e puxa com braços de espinhos.
    perigo: Médio
    lore: >-
      As Montanhas rasgaram o chão em vez de crescer dele, e as paredes das passagens são cheias de
      fendas verticais finas como uma lâmina. Em algumas mora um bicho achatado como uma tábua, que fica
      de lado lá dentro e estica para fora duas patas longas como chicotes, tateando a trilha. Quando
      toca uma perna, os braços de espinhos saem da pedra. Os guias Cinzéus não encostam nas paredes e
      cobram mais caro de quem encosta.
    aparencia: >-
      Bicho achatado da largura de um homem, quitina parda, seis patas curtas para andar de lado, duas
      patas da frente finas e longas como chicotes de três metros, e sob a cabeça dois braços dobrados
      cheios de espinhos.
    como_se_luta: >-
      Toca primeiro com o chicote e depois dá o bote com os braços de espinhos, de dentro da fenda.
      Cortar os chicotes ou passar longe da parede.
    related_entities: [montanhas_afiadas]
    arte:
      visual: >-
        Artrópode achatado, quase uma placa, da largura de um homem, quitina parda e fosca; seis patas
        curtas e abertas para os lados; duas patas dianteiras finíssimas e muito longas, segmentadas,
        estendidas como chicotes; sob a cabeça, dois braços dobrados e grossos cobertos de espinhos
        curvos, recolhidos como lâminas de canivete. Muitos olhos pequenos no alto da cabeça.
      composicao: >-
        Parede de rocha de uma passagem estreita, rachada de alto a baixo; o bicho meio dentro da fenda,
        de lado, os chicotes tocando a bota de um viajante que passa com uma mochila, dando a escala. Luz
        lateral fria, sombra funda na fenda.
      evitar: >-
        Aranha com teia, escorpião, louva-a-deus. Não tece, não pica com cauda: é chato, tateia e
        abraça de dentro da pedra.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_ladrao_de_lume
    vaga: 15
    nome: Ladrão de Lume
    status: nova
    substitui: null
    familia: besta_entropia
    origem_lore:
      fonte: eter
      detalhe: null
      refs: ["lore_nova/creatures.txt:310", "lore_nova/daily_life.txt:226"]
    anatomia:
      plano_corporal: quadrupede
      material: carne_exposta
      escala: pequena
      locomocao: escala_paredes
      percepcao: luz
      texto: >-
        Um bicho pequeno e pelado do tamanho de um gato, de pele rosada e enrugada, que vive no escuro do
        Reino. Os olhos são enormes, redondos e úmidos, maiores que a boca, e a luz dói neles; mesmo assim
        ele vai atrás dela. Os braços são longos, lentos e fortes, com mãos de dedos grossos que fecham em
        gancho e não abrem. A mordida tem uma peçonha nos dentes de baixo que amortece a carne.
    silhueta: Um bichinho de olhos enormes agarrado a uma lanterna acesa, subindo uma parede no escuro.
    comportamento: >-
      Segue os grupos pela luz, de longe, pelo teto e pelas paredes. Quando o grupo para, desce devagar e
      agarra a lanterna, o pote de Brasa ou a tocha, e sobe com ela para o escuro, abraçado à luz que
      dói. Quem vai atrás dele vai para longe do grupo.
    papel_tatico: saqueador
    arquetipo: covarde_oportunista
    categoria: lacaio
    faccao: null
    mecanica_assinatura:
      carta: cri_ladrao_de_lume_leva_a_luz
      frase: >-
        Rouba a luz do grupo e foge para o alto; sem ela, todos lutam às cegas até recuperá-la.
    contra_jogo: Guardar a luz no corpo, não no chão, e cobri-la de repente; no escuro súbito ele larga tudo e se encolhe.
    gancho: >-
      A Brasa-Profunda dá luz e calor preciosos no fundo e atrai o que mora no escuro; nem tudo que vem
      quer comer.
    habitat: [ma_boca, ma_saidas_baixas]
    inspiracao:
      - fonte: zoologia (lóris-lento)
        referencia: "primata noturno de olhos enormes, movimentos lentos e mordida venenosa"
        tomou: os olhos enormes, o agarrar lento e a mordida que amortece
        distancia: o corpo pelado, a fome de luz e o roubo das lanternas são do Reino perdido
    padrao: [mover, enfraquecer]
    a_cada_n: 3
    telegrafo: "{nome} desce do teto devagar, e os olhos dele refletem a lanterna inteira."
    description: Bicho pelado de olhos enormes que segue os grupos no escuro do Reino e foge para o alto com a lanterna, a tocha ou o pote de Brasa.
    perigo: Baixo
    lore: >-
      Os guias Cinzéus carregam Brasa-Profunda num pote de ferro, porque no fundo das Montanhas a luz e
      o calor valem mais que comida. O Ladrão de Lume sabe disso. É um bicho pelado do tamanho de um
      gato, de olhos enormes que a luz machuca, e mesmo assim vai atrás dela. Desce do teto quando o
      grupo para, agarra a lanterna com as mãos que não abrem e sobe com ela para o escuro. Quem corre
      atrás da luz corre para longe dos outros.
    aparencia: >-
      Bicho pelado do tamanho de um gato, pele rosada e enrugada, olhos enormes redondos e úmidos maiores
      que a boca, braços longos com mãos de dedos grossos fechadas em gancho, agarrado a uma lanterna.
    como_se_luta: >-
      Rouba a luz do grupo e foge para o alto, e todos lutam às cegas. Guardar a luz no corpo e cobri-la
      de repente o faz largar tudo.
    related_entities: [ma_boca, ma_saidas_baixas]
    arte:
      visual: >-
        Bicho pequeno do tamanho de um gato, sem pelo, pele rosada enrugada com manchas cinza; olhos
        redondos enormes, úmidos, que refletem a luz; braços longos e magros com mãos de dedos grossos
        fechadas em gancho; abraçado a uma lanterna de ferro acesa, encolhendo o rosto contra a luz.
      composicao: >-
        Parede alta de uma câmara do Reino; o Ladrão subindo pela pedra com a lanterna, a luz batendo de
        baixo no rosto dele; lá embaixo, no escuro, um grupo de três viajantes olha para cima, pequenos,
        dando a escala. Só a lanterna ilumina a cena.
      evitar: >-
        Macaco fofo de desenho, duende, gremlin. É um animal feio e frágil que sofre com a luz que
        carrega.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

