        Uma bexiga de pele fina e translúcida do tamanho de uma cabeça, cheia do ar quente que sobe das
        forjas, que flutua nos respiros de ventilação dos Anões. Por dentro se vê o coração pequeno
        batendo e um emaranhado de nervos rosados. Na borda de baixo há uma coroa de olhos pretos e
