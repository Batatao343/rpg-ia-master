      refs: ["lore_nova/locations.txt:370", "lore_nova/daily_life.txt:226"]
    anatomia:
      plano_corporal: bipede_curvado
      material: couro_tecido
      escala: humana
      locomocao: anda
      percepcao: luz
      texto: >-
        Um explorador que passou dias perdido nas câmaras de baixo, sentindo a coisa imensa em qualquer
        direção que olhasse. O corpo respondeu abrindo mais olhos: há olhos na linha do cabelo, atrás
        das orelhas, na nuca, no pescoço e nas costas das mãos, cada um com a sua pálpebra de pele, todos
        úmidos e vermelhos de não fechar. A cabeça foi raspada pelo próprio dono para não cobrir nenhum.
        Anda curvado, com os braços colados ao corpo, e nunca vira o pescoço.
    silhueta: Um homem curvado de cabeça raspada pontilhada de manchas claras em volta, que nunca vira o pescoço.
    comportamento: >-
      Anda com os grupos de saqueadores e Goblins que descem a Boca, sempre no fundo da fila. Vê tudo ao
      mesmo tempo e grita o que o inimigo vai fazer antes que ele faça: a mão que vai à faca, o pé que
      vai firmar. Sozinho não luta; acompanhado, o grupo dele sabe o golpe antes do golpe.
    papel_tatico: suporte
    arquetipo: conjurador
    categoria: lacaio
    faccao: null
    mecanica_assinatura:
      carta: cri_olhos_em_volta_mao_a_mostra
      frase: >-
        Vê em todas as direções e grita o que vê: enquanto ele estiver de pé, a Carta que o jogador
        preparou fica à mostra para os inimigos, que se armam contra ela.
    contra_jogo: Derrubá-lo primeiro; uma luz forte e súbita nos olhos que não fecham o cega por um instante.
    gancho: >-
      Quem volta do fundo do Reino fala de algo imenso presente em qualquer direção que se olhe; alguns
      voltaram com olhos para todas elas.
    habitat: [ma_boca, ma_saidas_baixas]
    inspiracao: []
    padrao: [enfraquecer, defesa]
    a_cada_n: 3
    telegrafo: "{nome} arregala de uma vez todos os olhos da cabeça e aponta sem virar o pescoço."
    description: Explorador que voltou do fundo do Reino com olhos abertos em volta da cabeça raspada, no pescoço e nas mãos; vê tudo e grita para os outros.
    perigo: Baixo
    lore: >-
      Quem desce longe demais na Boca passa horas no escuro com algo imenso que não ataca, presente em
      qualquer direção que se olhe. Alguns voltam sem conseguir contar o que viram. Outros voltam com o
      corpo mudado para ver: olhos abertos na linha do cabelo, na nuca, no pescoço, nas costas das
      mãos, que nunca mais fecham. Os Goblins e os saqueadores pagam bem para levar um deles no fim da
      fila. Contra um grupo que tem um Olhos em Volta, ninguém guarda um golpe em segredo.
    aparencia: >-
      Explorador humano curvado de cabeça raspada, olhos abertos na linha do cabelo, atrás das orelhas,
      na nuca, no pescoço e nas costas das mãos, cada um com pálpebra própria, úmidos e vermelhos;
      braços colados ao corpo; nunca vira o pescoço.
    como_se_luta: >-
      Fica atrás dos outros e grita o que o jogador preparou; com ele de pé, os inimigos sabem o golpe
      antes do golpe. Derrubá-lo primeiro, ou cegá-lo com luz súbita.
    related_entities: [ma_boca, ma_saidas_baixas]
    arte:
      visual: >-
        Homem adulto magro e curvado, cabeça raspada e pálida; olhos humanos verdadeiros abertos em
        lugares errados: uma fileira na linha do cabelo, dois atrás das orelhas, três na nuca, um de cada
        lado do pescoço, um nas costas de cada mão; cada um com pálpebra de pele e cílios, úmidos, com o
        branco avermelhado. Roupa de couro de explorador gasta, braços colados ao corpo.
      composicao: >-
        Fim de uma fila de saqueadores descendo uma escadaria anã escura; o Olhos em Volta por último,
        de costas para quem olha, a nuca cheia de olhos encarando o espectador; um Goblin-mineiro à
        frente dele, na altura da cintura, dá a escala. Luz de uma única lanterna lá na frente.
      evitar: >-
        Esfera flutuante de olhos, olho único gigante, raios saindo dos olhos. É um homem comum com olhos
        a mais, de pé, cansado.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  # ======================= BESTAS DA ENTROPIA (Bestas Tortas) =======================
  # ---- slot genérico reinventado: enemy_wyvern_jovem ----
  - id: enemy_wyvern_jovem
    vaga: 6
    nome: Leque de Costelas
    status: reinventada
    substitui: enemy_wyvern_jovem
    ataques: ["Fio das Costelas"]
    acoes:
      - Volta numa segunda passada sobre quem já sangra na trilha.
      - Ferido, foge: fecha o leque e cai como pedra na fenda, para longe.
      - Solta-se do paredão e passa rente à trilha com o leque aberto, na altura do peito.
    substitui_generico: Wyvern Jovem
    familia: besta_entropia
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/creatures.txt:268", "lore_nova/locations.txt:355"]
    anatomia:
      plano_corporal: alado
      material: osso
      escala: grande
      locomocao: plana_voa
      percepcao: visao
      texto: >-
        Um lagarto do tamanho de um cavalo magro, de couro cinza-ardósia, que vive colado às paredes dos
        picos. As costelas da barriga se soltaram da coluna e cresceram para fora, longas e finas, e
        entre elas a pele se esticou como a vela de um leque. Aberto, o leque passa de três metros; as
        pontas das costelas, sem pele, foram afiadas pelo vento e pela rocha até virarem lâminas de
        foice. A cabeça é pequena e chata, de olhos dourados virados para baixo.
    silhueta: Um leque cinzento aberto no céu entre dois picos, com um corpo de lagarto pendurado embaixo dele.
    comportamento: >-
      Fica colado ao paredão com o leque fechado, quase invisível na rocha. Quando vê alguém na trilha,
      solta-se, abre as costelas com um estalo e plana em linha reta rente à altura do peito, e sobe de
      novo no vento do outro lado. Não briga no chão; no chão é só um lagarto.
    papel_tatico: batedor_rapido
    arquetipo: predador
    categoria: elite
    faccao: null
    mecanica_assinatura:
      carta: cri_leque_de_costelas_passada_rente
      frase: >-
        Passa rente com o leque aberto e corta todos que estão na mesma linha da trilha, e já está do
        outro lado antes do troco.
    contra_jogo: Abaixar-se ou deitar na trilha quando ele abre o leque; pousado, depois da passada, é um lagarto lento.
    gancho: >-
      Nas passagens altas não há onde se esconder; os lagartos das paredes aprenderam a cortar na altura
      do peito de quem anda em fila.
    habitat: [montanhas_afiadas]
    inspiracao:
      - fonte: zoologia (lagartos do gênero Draco)
        referencia: "lagartos voadores do Sudeste Asiático, que planam abrindo costelas alongadas cobertas de pele"
        tomou: a vela de pele esticada entre costelas que se abrem
        distancia: só o mecanismo do planeio; o tamanho, as pontas afiadas pelo vento e a caça rente às trilhas são das Montanhas
    padrao: [mover, ataque_multiplo]
    a_cada_n: 3
    telegrafo: "{nome} se solta do paredão e abre as costelas com o estalo seco de uma vela."
    description: Lagarto dos picos cujas costelas cresceram para fora em leque de pele; plana rente às trilhas e corta com as pontas afiadas pelo vento.
    perigo: Alto
    lore: >-
      Os lagartos das paredes das Montanhas Afiadas têm a cor da rocha e ficam dias sem se mexer. Alguns
      cresceram errado: as costelas se soltaram da coluna e se abriram para fora, com pele entre elas, e
      o bicho aprendeu a cair do paredão e planar. O vento das passagens afiou as pontas das costelas.
      Eles passam rente às trilhas na altura do peito, e uma fila inteira de viajantes leva o mesmo
      corte. Os guias mandam andar abaixado quando o vento para de repente.
    aparencia: >-
      Lagarto cinza-ardósia do tamanho de um cavalo magro, costelas soltas da coluna abertas para fora em
      leque de três metros com pele esticada entre elas, pontas nuas afiadas como foice, cabeça pequena
      e chata de olhos dourados.
    como_se_luta: >-
      Passa planando rente à trilha, na altura do peito, e corta todos na mesma linha. Abaixar-se quando
      ele abre o leque; pousado, é lento.
    related_entities: [montanhas_afiadas]
    arte:
      visual: >-
        Lagarto grande, corpo esguio do tamanho de um cavalo magro, pele cinza-ardósia granulosa;
        costelas longas saindo dos flancos e abertas em leque, membrana de pele fina e translúcida entre
        elas, com veias; as pontas das costelas nuas, brancas, afiadas como lâminas curvas. Pernas curtas
        recolhidas, cauda longa de leme, cabeça pequena e chata, olhos dourados.
      composicao: >-
        Desfiladeiro entre dois picos com neve; o Leque planando em diagonal, rente a uma trilha onde três
        viajantes em fila se abaixam, o último ainda de pé, dando a escala. Céu branco-azulado, a sombra
        do leque cruzando a trilha.
      evitar: >-
        Dragão, réptil de asas de morcego, pterossauro. Não tem asas nem dedos de asa: são as costelas,
        abertas, e ele não bate nada, só plana.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

