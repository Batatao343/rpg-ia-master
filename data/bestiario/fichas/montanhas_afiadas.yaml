      escala: enorme
      locomocao: ancorada
      percepcao: vibracao
      texto: >-
        Um Orc dos bandos de Gruumsha que se deitou atravessado sobre a fenda mais estreita das Saídas
        Baixas e virou a passagem. As mãos e os pés ficaram enfiados em buracos que ele mesmo cavou nas
        duas bordas, e a pele dos punhos e dos tornozelos cresceu para dentro da pedra. As costas
        achataram em anos de gente passando por cima: a coluna endureceu reta, a pele virou um couro
        córneo grosso, liso como degrau gasto, e os ombros incharam como vigas. O rosto fica de lado,
        encostado no braço, e acompanha cada passo.
    silhueta: Um corpo enorme de bruços atravessado sobre uma fenda, com gente andando por cima das costas.
    comportamento: >-
      Não sai dali. O bando de Gruumsha cobra de quem quer atravessar, e quem paga passa por cima dele.
      Quem não paga, ou briga no caminho, sente as costas se mexerem debaixo dos pés, e a fenda é funda.
    papel_tatico: guarda_protetor
    arquetipo: predador
    categoria: elite
    faccao: bandos_orc_saidas_baixas
    mecanica_assinatura:
      carta: cri_ponte_de_ombros_sacudida
      frase: >-
        Quem luta em cima dele luta no chão que ele é: a cada sacudida, quem está nas costas pode cair na
        fenda.
    contra_jogo: Não lutar em cima dele; atravessar por outro lado, ou atacar as mãos e os pés presos nas bordas, onde a pele entrou na pedra.
    gancho: >-
      O bando de Gruumsha cobra pedágio em bens ou em sangue; na fenda mais estreita, cobra com o corpo de
      um dos seus.
    habitat: [ma_saidas_baixas]
    inspiracao: []
    padrao: [defesa, defesa, ataque]
    a_cada_n: 3
    telegrafo: "{nome} enche os ombros de ar, e as costas se arqueiam debaixo de quem está em cima."
    description: Um Orc dos bandos de Gruumsha deitado sobre a fenda mais estreita das Saídas Baixas, com mãos e pés presos na pedra; o pedágio é passar por cima dele.
    perigo: Alto
    lore: >-
      Os bandos de Gruumsha cobram pedágio nas Saídas Baixas, em bens ou em sangue. Na fenda mais
      estreita não há ponte de corda: há um Orc. Ele se deitou atravessado sobre o vão há tantos anos que
      a pele das mãos e dos pés entrou na pedra das bordas, e as costas viraram um couro liso como degrau
      gasto. Quem paga passa por cima. Quem não paga, ou começa uma briga no caminho, descobre que a
      ponte tem ombros.
    aparencia: >-
      Orc enorme de bruços atravessado sobre uma fenda, mãos e pés enfiados na pedra das bordas, pele dos
      punhos crescida para dentro da rocha, costas achatadas num couro córneo liso como degrau gasto,
      ombros como vigas, rosto de lado sobre o braço.
    como_se_luta: >-
      Quem luta em cima dele pode cair na fenda a cada sacudida. Atravessar por outro lado ou atacar as
      mãos e os pés presos nas bordas.
    related_entities: [ma_saidas_baixas, bandos_orc_saidas_baixas]
    arte:
      visual: >-
        Orc gigantesco, pele verde-acinzentada, deitado de bruços e esticado sobre uma fenda funda; mãos e
        pés afundados em buracos nas duas bordas de rocha, a pele dos punhos e tornozelos fundida à pedra;
        as costas planas, de couro grosso e córneo, gasto e liso no centro como um degrau; ombros enormes;
        o rosto virado de lado, apoiado no antebraço, olhos abertos.
      composicao: >-
        Fenda estreita e funda nas Saídas Baixas, com neve suja nas bordas; um mercador com um fardo
        atravessa andando sobre as costas do Orc, pequeno perto dele, dando a escala; dois Orcs do bando
        recebem moedas na borda. Céu cinza, fumaça de acampamento.
      evitar: >-
        Gigante de pedra, ogro de ponte com porrete, troll verde regenerando. É um Orc que virou chão, e o
        horror é estar em cima dele.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_bracos_de_tenaz
    vaga: 17
    nome: Braços de Tenaz
    status: nova
    substitui: null
    familia: humanoide_preco
    origem_lore:
      fonte: faccao
      detalhe: ultimos_anoes_reino
      refs: ["lore_nova/races.txt:111", "lore_nova/factions.txt:437", "data/world_map.json:930"]
    anatomia:
      plano_corporal: bipede_ereto
      material: ferro_ferrugem
      escala: humana
      locomocao: anda
      percepcao: calor
      texto: >-
        Um ferreiro dos Últimos Anões que ficou na Forja Profunda e parou de usar luva. O calor das bigornas
        cobrou o preço nos antebraços: a pele deles virou uma escória vitrificada, preta e vidrada como
        borra de fornalha, que segura ferro em brasa sem queimar. Dos punhos saem duas tenazes de forja
        rebitadas ao osso, curtas, na medida dos braços anões que já chegam ao chão, e vivem rubras de
        tanto ficar no fogo. O peito é um barril largo marcado de faíscas, e a barba trançada com fio de
        cobre está chamuscada até o queixo.
    silhueta: Um anão largo e quadrado de antebraços pretos e vidrados, com duas tenazes rubras no lugar das mãos, soltando fumaça.
    comportamento: >-
      Trabalha na Forja e não fala do que forja. Intruso é peça fora do lugar: fecha a tenaz na espada ou
      no escudo dele e esquenta o ferro até ninguém conseguir segurar. O que é largado no chão da Forja,
      ele recolhe.
    papel_tatico: quebra_defesa
    arquetipo: tatico
    categoria: elite
    faccao: ultimos_anoes_reino
    mecanica_assinatura:
      carta: cri_bracos_de_tenaz_ferro_que_queima_a_mao
      frase: >-
        Fecha a tenaz rubra na arma ou no escudo do alvo e o esquenta: o item fica inútil até esfriar, duas
        rodadas, ou até ser largado no chão.
    contra_jogo: Lutar com cabo de madeira e escudo de couro, que esquentam devagar; largar o item quente e pegar outro, ou molhar as tenazes, que racham com água fria.
    gancho: >-
      As bigornas da Forja Profunda estão quentes, as marcas nos martelos são anãs, e o tamanho das peças
      não é.
    habitat: [ma_forja_profunda]
    inspiracao: []
    padrao: [enfraquecer, ataque, ataque]
    a_cada_n: 3
    telegrafo: "{nome} enfia as duas tenazes nas brasas e as tira rubras, pingando escória."
    description: Ferreiro dos Últimos Anões de antebraços vitrificados pelo calor e tenazes rubras rebitadas nos punhos; esquenta a arma de quem entra na Forja até ela cair da mão.
    perigo: Alto
    lore: >-
      Alguns dos Últimos Anões do Reino ficaram na Forja Profunda, perto da Boca, onde as bigornas nunca
      esfriaram. Nenhum deles diz o que forja. Os ferreiros mais antigos pararam de usar luva, e o calor
      vitrificou a pele dos antebraços até ela segurar ferro em brasa; nos punhos rebitaram tenazes que
      nunca saem do fogo. Pelo Protocolo, intruso na Forja é peça fora do lugar. A tenaz esquenta a arma
      dele até ela cair, e o que cai na Forja fica na Forja.
    aparencia: >-
      Anão largo e quase quadrado, peito de barril marcado de faíscas, barba trançada com fio de cobre
      chamuscada, antebraços de pele preta vitrificada como escória, tenazes de forja curtas e rubras
      rebitadas nos punhos, fumegando.
    como_se_luta: >-
      Esquenta a arma ou o escudo do alvo, que fica inútil até esfriar ou ser largado. Cabo de madeira e
      couro aguentam mais; água fria racha as tenazes.
    related_entities: [ma_forja_profunda, ultimos_anoes_reino]
    arte:
      visual: >-
        Anão adulto quase quadrado, ombros mais largos que a altura, avental de couro queimado, peito largo
        coberto de pontinhos de queimadura; barba trançada com fio de cobre, chamuscada; antebraços de pele
        preta, vidrada e rachada como escória de fornalha; no lugar das mãos, tenazes de ferreiro curtas,
        rebitadas no punho, incandescentes nas pontas; fumaça subindo dos braços.
      composicao: >-
        Interior da Forja Profunda: bigornas grandes demais para anões, brasas vermelhas, peças de ferro
        enormes encostadas na parede, sem forma reconhecível; o ferreiro segurando com uma tenaz a lâmina
        de uma espada que fumega, o dono humano soltando o cabo, mais alto que ele, dando a escala. Luz
        laranja de brasa, fumaça.
      evitar: >-
        Anão de fantasia alegre de capacete com chifres, braço mecânico de engrenagens, braços esticados de
        ferro. São braços anões de tamanho normal, queimados até virarem escória.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_marco_que_aponta
    vaga: 18
    nome: Marco que Aponta
    status: nova
    substitui: null
    familia: humanoide_preco
    origem_lore:
      fonte: eter
      detalhe: null
      refs: ["lore_nova/daily_life.txt:222", "lore_nova/locations.txt:362"]
    anatomia:
      plano_corporal: bipede_ereto
      material: couro_tecido
      escala: humana
      locomocao: escala_paredes
      percepcao: eter
      texto: >-
        Um guia Cinzéu que tatuou rotas demais. As tatuagens de rota dos guias latejam sob a pele com tinta
        de Éter; nele, as rotas foram todas tatuadas no braço que aponta, e cada deslizamento mudou o
        desenho por cima do anterior. A pele do braço cicatrizou camada sobre camada até virar um cordame
        duro e alto de cicatriz cinzenta, e o braço endureceu reto, sem dobrar no cotovelo, estendido para
        a frente como um marco de estrada. Os três dedos da mão ficaram tortos de tanto apontar. A cauda,
        nua, encosta na rocha a cada passo e treme quando a pedra mexe.
    silhueta: Um guia magro de cauda no chão, com um braço duro e grosso como um galho seco estendido para a frente, sempre apontando.
    comportamento: >-
      Ainda guia. Cobra pouco, anda na frente, aponta a fenda certa e sabe o caminho melhor que qualquer
      vivo, porque o mapa dele muda com a montanha. Leva os clientes para onde o mapa manda, e o mapa já
      não manda para a saída. Em luta, aponta: quem segue o dedo dele pisa onde a pedra cede.
    papel_tatico: controlador
    arquetipo: tatico
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: "cri_marco_que_aponta_passo_errado"
      frase: >-
        Aponta o lugar certo de pisar e é mentira: quem se move na rodada seguinte vai para onde ele quer,
        e não para onde queria.
    contra_jogo: Não seguir o dedo dele e ficar parado no lugar firme; cortar o cordão de cicatriz da mão que aponta faz o mapa parar de latejar.
    gancho: >-
      Os guias Cinzéus leem as paredes com as tatuagens de rota latejando sob a pele; numa montanha que
      muda toda semana, o desenho nunca termina.
    habitat: [montanhas_afiadas]
    inspiracao: []
    padrao: [mover, enfraquecer, ataque]
    a_cada_n: 3
    telegrafo: "{nome} estende o braço de três dedos e aponta, e os cordões do mapa latejam juntos."
    description: Guia Cinzéu cujas tatuagens de rota viraram cordões de cicatriz em relevo de tanto mudar; ainda guia, e o mapa já não leva à saída.
    perigo: Médio
    lore: >-
      Os guias Cinzéus tatuam as rotas das passagens com tinta de Éter, e as tatuagens latejam sob a pele
      quando eles leem as paredes. A montanha muda a cada deslizamento, e o guia tatua por cima. Em
      alguns, as camadas viraram um cordame de cicatriz no braço que aponta, que endureceu reto, e o
      mapa passou a mudar sozinho. Esses ainda guiam, cobram pouco e conhecem cada fenda. Os clientes deles chegam a
      algum lugar; raramente ao que pagaram.
    aparencia: >-
      Guia Cinzéu magro de pele cinzenta, um braço rígido e reto estendido para a frente, coberto de um
      cordame alto de cicatriz cinzenta que lateja como um mapa em relevo, três dedos tortos apontando,
      cauda nua encostada na rocha.
    como_se_luta: >-
      Aponta o caminho errado, e quem se move vai para onde ele quer. Ficar parado no lugar firme; cortar
      o cordão da mão que aponta.
    related_entities: [montanhas_afiadas]
    arte:
      visual: >-
        Cinzéu adulto (humanoide esguio, pele cinzenta, três dedos por mão, cauda sem pelo com ponta de
        osso), capa curta de lã; o resto do corpo liso e comum, mas um braço inteiro, do ombro aos dedos,
        coberto de cordões de cicatriz em alto relevo, grossos e cruzados como trilhas e curvas de nível,
        com leve brilho frio azul-esverdeado por baixo; esse braço rígido e reto, estendido, dedo torto
        apontando.
      composicao: >-
        Bifurcação de duas passagens estreitas entre paredões; o Mapa de pé na pedra, apontando a passagem
        da esquerda; atrás dele, dois clientes com mochilas, da mesma altura, hesitam. Neve leve, luz de
        fim de dia.
      evitar: >-
        Tatuagem tribal decorativa, homem coberto de runas brilhantes, mago de pele escrita. São cicatrizes
        em relevo, grossas e feias, e o brilho é fraco e frio.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_armador_de_fosso
    vaga: 19
    nome: Armador de Fosso
    status: nova
    substitui: null
    familia: humanoide_preco
    origem_lore:
      fonte: faccao
      detalhe: goblins_mineiros
      refs: ["lore_nova/factions.txt:428", "lore_nova/creatures.txt:348"]
    anatomia:
      plano_corporal: bipede_curvado
      material: ferro_ferrugem
      escala: pequena
      locomocao: anda
      percepcao: vibracao
      texto: >-
        Um Goblin-mineiro que desarma e rearma as armadilhas dos Anões há mais tempo do que os outros
        vivem. Perdeu os dedos um a um nos mecanismos e pôs no lugar o que achou: nos tocos das duas mãos
        há ganchos, molas e pontas de picareta anãs costurados na pele com arame, enferrujados e cascudos
        de sangue velho. As orelhas grandes estão cheias de furos onde guarda pinos. Anda curvado, com o
        peso das ferragens puxando os ombros, e sente pelas solas o estalo de uma trava.
    silhueta: Um vulto pequeno e curvado com as mãos cheias de ganchos e molas, mexendo em alguma coisa no chão.
    comportamento: >-
      Anda na frente dos bandos de Goblins e prepara o terreno: arma laços, travas e lâminas de mola
      antigas nos corredores por onde o inimigo vai recuar. Em luta fica longe e solta as armadilhas uma
      a uma, puxando os arames com os ganchos.
    papel_tatico: artilharia
    arquetipo: emboscador
    categoria: lacaio
    faccao: goblins_mineiros
    mecanica_assinatura:
      carta: cri_armador_de_fosso_trava_armada
      frase: >-
        Arma uma trava anã no chão em vez de atacar; na rodada seguinte, quem se mexe na direção dele ou
        para trás dispara a armadilha.
    contra_jogo: Avançar reto e rápido sobre ele, pelo caminho que ele acabou de pisar; sem as mãos de ferragem, ele não arma mais nada.
    gancho: >-
      Os Goblins-mineiros conhecem cada armadilha que os Anões deixaram no Reino; alguns pagaram cada uma
      com um dedo.
    habitat: [ma_boca, ma_saidas_baixas]
    inspiracao: []
    padrao: [enfraquecer, enfraquecer, ataque]
    a_cada_n: 4
    telegrafo: "{nome} se agacha e mexe no chão com os ganchos, e algo estala baixinho."
    description: Goblin-mineiro que trocou os dedos perdidos nas armadilhas anãs por ganchos e molas costurados nos tocos; arma travas no caminho da luta.
    perigo: Baixo
    lore: >-
      Os Goblins-mineiros conhecem cada armadilha que os Anões deixaram no Reino, e conhecem porque
      desarmaram uma por uma. Os que fazem isso há muito tempo não têm mais dedos: nos tocos costuram com
      arame o que acharam nos mecanismos, ganchos, molas e pontas de picareta. Andam na frente dos bandos
      e preparam os corredores. Quem luta com Goblins no Reino aprende a não recuar pelo caminho de onde
      veio.
    aparencia: >-
      Goblin pequeno e curvado, ganchos, molas e pontas de picareta anãs costurados com arame nos tocos
      dos dedos das duas mãos, enferrujados e cascudos de sangue, orelhas grandes furadas cheias de pinos,
      ombros puxados pelo peso das ferragens.
    como_se_luta: >-
      Arma travas no chão e solta as armadilhas de longe; quem recua ou corre na direção dele dispara uma.
      Avançar reto pelo caminho que ele pisou.
    related_entities: [ma_boca, ma_saidas_baixas, goblins_mineiros]
    arte:
      visual: >-
        Goblin adulto pequeno e magro, pele cinza-esverdeada, curvado; as duas mãos sem dedos, com ganchos
        de ferro, molas espirais e pontas de picareta costurados nos tocos com arame, a pele inchada em
        volta; orelhas grandes furadas com pinos de metal espetados; colete de couro cheio de bolsos com
        peças. Ajoelhado, armando uma trava de mola anã no chão.
      composicao: >-
        Corredor do Reino com piso de lajes; o Armador agachado sobre uma laje levantada, arames esticados
        até as paredes; ao fundo, um anão de pedra quebrado de uma estátua antiga, e um aventureiro de
        bota parado a dois passos, muito mais alto, dá a escala. Luz de vela no chão.
      evitar: >-
        Goblin cômico de nariz grande, inventor maluco com engenhocas, gremlin. É um trabalhador mutilado,
        sério, que vive do ofício que o mutilou.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_vedado_de_piche
    vaga: 20
    nome: Vedado de Piche
    status: nova
    substitui: null
    familia: humanoide_preco
    origem_lore:
      fonte: faccao
      detalhe: bandos_orc_saidas_baixas
      refs: ["lore_nova/factions.txt:405", "lore_nova/creatures.txt:344"]
    anatomia:
      plano_corporal: bipede_ereto
      material: carne_exposta
      escala: grande
      locomocao: anda
      percepcao: sangue_cheiro
      texto: >-
        Um Orc grande do bando de Gruumsha que fechou os próprios olhos com piche quente para descer onde os
        Orcs não descem. O piche endureceu numa máscara preta e lisa do nariz à testa, colada à pele, e a
        pele em volta ficou queimada e repuxada. A boca fica sempre entreaberta, puxando o ar, e as narinas
        rasgaram de tanto farejar até a carne do focinho ficar aberta e úmida. Os braços são compridos e
        grossos, e ele anda com uma mão aberta tocando a parede e a outra no cabo do machado.
    silhueta: Um Orc enorme de cabeça erguida com uma faixa preta e lisa no lugar dos olhos, uma mão aberta tocando a parede.
    comportamento: >-
      Gruumsha manda os Vedados ao fundo quando precisa de algo de lá, porque os outros Orcs não vão.
      Farejam sangue de longe e não largam um rastro. Não se assustam com o escuro nem com o que mora
      nele, e quem tenta sumir na sombra está fazendo o que o Vedado mais gosta.
    papel_tatico: perseguidor_marca
    arquetipo: predador
    categoria: padrao
    faccao: bandos_orc_saidas_baixas
    mecanica_assinatura:
      carta: cri_vedado_de_piche_faro_de_sangue
      frase: >-
        Fareja quem sangra e não larga: o alvo ferido não consegue se esconder nem fugir dele, nem no
        escuro.
    contra_jogo: Estancar o sangue antes de fugir; fumaça forte ou o cheiro de Líquen-de-Brasa queimando deixa o faro dele perdido.
    gancho: >-
      Os Orcs das Saídas Baixas não voltam às profundezas e nunca disseram por quê; quando Gruumsha
      precisa de algo de lá, manda os que fecharam os olhos com piche.
    habitat: [ma_boca, ma_saidas_baixas]
    inspiracao: []
    padrao: [ataque, mover, ataque]
    a_cada_n: 3
    telegrafo: "{nome} vira a máscara de piche para o lado de quem sangra e puxa o ar fundo, três vezes."
    description: Orc do bando de Gruumsha que fechou os olhos com piche para descer ao Reino; fareja o sangue e não larga quem está ferido, nem no escuro.
    perigo: Médio
    lore: >-
      Os Orcs das Saídas Baixas saíram do Reino quando o Rei despertou e nunca voltaram, e não explicam
      por quê. Gruumsha às vezes precisa de algo lá de baixo. Os que ele manda derramam piche quente sobre
      os próprios olhos antes de descer: sem ver o escuro, dizem, dá para andar nele. Voltam com o focinho
      rasgado de farejar e com o que foram buscar. Quem sangra perto de um Vedado não se esconde dele em
      lugar nenhum.
    aparencia: >-
      Orc grande e de braços compridos, uma máscara preta e lisa de piche endurecido colada do nariz à
      testa no lugar dos olhos, pele queimada em volta, boca entreaberta, narinas rasgadas com o focinho
      aberto e úmido, uma mão na parede e outra no cabo de um machado.
    como_se_luta: >-
      Fareja quem sangra e persegue até o fim, sem precisar de luz. Estancar o sangue; fumaça forte
      confunde o faro.
    related_entities: [ma_boca, ma_saidas_baixas, bandos_orc_saidas_baixas]
    arte:
      visual: >-
        Orc grande e musculoso, pele verde-acinzentada cheia de cicatrizes, cabeça erguida; uma faixa de
        piche preto, liso e brilhante, endurecido do nariz à testa no lugar dos olhos, com a pele em volta
        queimada e repuxada; narinas rasgadas, focinho aberto e úmido; boca entreaberta; braços longos, uma
        mão espalmada na parede de pedra, a outra num machado de cabo curto; peles e couro como roupa.
      composicao: >-
        Galeria escura do Reino; o Vedado avança tocando a parede, o rosto virado para uma gota de sangue no
        chão à frente; ao longe, um aventureiro ferido se encolhe atrás de uma coluna, mais baixo que ele,
        dando a escala. Quase sem luz, um ponto laranja de Líquen-de-Brasa.
      evitar: >-
        Orc de fantasia genérico de presas e armadura de espinhos, vendado de pano, monge cego sábio. É um
        Orc que pagou com os olhos por coragem, sujo e decidido.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  # ======================= CRIAS DE APETITE (demônios encarnados) =======================
  - id: mon_peso_dos_vencidos
    vaga: 21
    nome: Peso dos Vencidos
    status: nova
    substitui: null
    familia: demonio_encarnado
    origem_lore:
      fonte: demonio
      detalhe: npc_vhrak
      refs: ["lore_nova/npcs.txt:226", "lore_nova/factions.txt:430"]
    anatomia:
      plano_corporal: composto
      material: carne_exposta
      escala: enorme
      locomocao: anda
      percepcao: medo_emocao
      texto: >-
        O resíduo do Ódio toma carne do que encontra nas Saídas Baixas, e o que mais há lá são mortos da
        guerra entre Orcs e Goblins. Esta cria é um Orc enorme da cintura para cima, de pele rasgada, e da
        cintura para baixo um amontoado de corpos de Goblins, braços, pernas e cabeças, costurados uns nos
        outros com tendão grosso, que servem de patas. As costuras não fecham nunca: a carne do Orc e a
        dos Goblins se repele, e onde se tocam a pele fica em carne viva. As mãos de baixo agarram e
        arranham o tronco de cima, e os punhos de cima socam para baixo.
    silhueta: Um Orc enorme montado num monte de corpos pequenos que andam por ele e se viram para socá-lo.
    comportamento: >-
      Avança pelas Saídas Baixas atrás da briga mais perto, e onde passa as rixas entre os bandos viram
      matança. Luta com o tronco de Orc e anda com os Goblins; o Orc soca para baixo com o peso de
      todos, e as mãos de baixo o carregam aonde ele quer, odiando-o.
    papel_tatico: bruto_de_linha
    arquetipo: predador_apice
    categoria: chefe
    faccao: null
    mecanica_assinatura:
      carta: "cri_peso_dos_vencidos_soco_de_cima"
      frase: >-
        O Orc soca de cima com o peso do monte inteiro: o golpe acerta um alvo e derruba quem estiver de
        pé logo ao lado dele. Cada pata de Goblin cortada tomba o monte para aquele lado; com três
        cortadas do mesmo lado, ele cai e passa a rodada seguinte se levantando, sem golpe.
    contra_jogo: >-
      Cortar as patas de Goblin sempre do mesmo lado até o monte tombar, e então bater no Orc caído;
      quem fica de frente e colado ao vizinho leva o soco e a queda.
    gancho: >-
      Orcs e Goblins se odeiam nas Saídas Baixas; o que o Ódio deixa ali costura os dois de volta num
      corpo só, e eles não se suportam dentro dele.
    habitat: [ma_saidas_baixas]
    inspiracao: []
    padrao: [ataque_multiplo, ataque, reforco_proprio, ataque]
    a_cada_n: 3
    telegrafo: >-
      O Orc de {nome} ergue os dois punhos, e todas as mãos de baixo se fincam no chão ao mesmo tempo.
    description: >-
      Cria do Ódio nas Saídas Baixas, um tronco de Orc costurado sobre um monte de Goblins mortos que
      lhe servem de patas e o carregam odiando-o.
    perigo: Extremo
    lore: >-
      Orcs e Goblins se odeiam nas Saídas Baixas, e o Ódio, onde passa, não cria nada: só aumenta o que
      já havia. O resíduo que ele deixou ali tomou carne dos mortos dessa guerra e fez uma coisa só de
      um Orc e de muitos Goblins, costurados com tendão. Dizem nos acampamentos que Orcs e Goblins já
      foram um povo só, nascido destas montanhas, e que por isso a costura pega tão fácil. A coisa anda
      atrás de briga, e os de baixo a carregam porque não conseguem largá-la.
    aparencia: >-
      Tronco de Orc enorme de pele rasgada sobre um amontoado de corpos de Goblins costurados com tendão
      grosso que servem de patas; costuras abertas em carne viva; as mãos de baixo arranhando o tronco de
      cima, os punhos de cima socando para baixo.
    como_se_luta: >-
      Soca de cima e derruba quem está ao lado do alvo. Corte as patas de um lado só: com três cortadas
      ele tomba e perde uma rodada.
    related_entities: [ma_saidas_baixas, npc_vhrak, bandos_orc_saidas_baixas, goblins_mineiros]
    arte:
      visual: >-
        Criatura enorme: da cintura para cima, um Orc musculoso de pele verde-acinzentada rasgada, rosto
        torcido de ódio; da cintura para baixo, um monte de corpos de Goblins menores, de pele mais
        escura, costurados uns nos outros com tendão grosso, os braços e pernas deles fazendo de patas.
        Costuras abertas e vermelhas onde as peles se tocam; mãos de Goblins agarrando o tronco do Orc,
        o Orc socando para baixo.
      composicao: >-
        Acampamento destruído nas Saídas Baixas, barracas de couro caídas, mastros tombados; a Costura
        avança entre dois bandos que recuam; um Orc de pé e um Goblin dão a escala, os dois menores que
        ela. Fumaça, neve suja, luz cinza.
      evitar: >-
        Centauro, quimera de partes de animais, monstro de carne de ficção científica. São Orcs e Goblins
        reconhecíveis, e o horror é que eles se odeiam dentro do mesmo corpo.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_tampao_da_camara
    vaga: 22
    nome: Tampão da Câmara
    status: nova
    substitui: null
    familia: demonio_encarnado
    origem_lore:
      fonte: demonio
      detalhe: npc_dorrhen
      refs: ["lore_nova/npcs.txt:273", "lore_nova/locations.txt:360"]
    anatomia:
      plano_corporal: composto
      material: carne_exposta
      escala: grande
      locomocao: ancorada
      percepcao: medo_emocao
      texto: >-
        Quando o teto de uma câmara começa a vir abaixo, todos correm para a mesma porta, e alguns grupos
        ficam esmagados no vão, empurrando e empurrados. O Desespero deixa resíduo ali, e o resíduo toma a
        carne dos que ficaram presos na porta. Esta cria é um tampão de corpos espremidos no vão, uns por
        cima dos outros, ombro contra costas, rosto contra joelho, apertados até não sobrar ar entre eles.
        Dezenas de braços saem para os dois lados, com as mãos inchadas e roxas de esmagamento. Quando
        respira, o tampão inteiro incha e aperta as bordas do vão.
    silhueta: Uma porta de galeria entupida de gente espremida, com braços saindo dos dois lados.
    comportamento: >-
      Aparece na porta por onde se entrou. Não persegue: incha e aperta. Os braços agarram quem chega
      perto e puxam contra o tampão, como os de trás puxavam os da frente. Quem fica preso na câmara com
      ele começa a achar que não há outra saída, e quase sempre tem razão.
    papel_tatico: controlador
    arquetipo: tatico
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: "cri_tampao_da_camara_aperto_do_vao"
      frase: >-
        Respira e aperta: a cada duas rodadas o tampão incha e esmaga todos os que estão encostados nele
        ou nas bordas do vão, e os braços puxam para junto dele quem chega perto; quem fica a dois
        passos não é alcançado.
    contra_jogo: >-
      Ficar fora do alcance dos braços e bater de longe ou com haste; cortar os braços das bordas faz
      ele escorregar do vão e parar de inchar.
    gancho: >-
      Nas câmaras do Reino onde o teto cedeu, os mortos não estão debaixo das pedras: estão na porta, todos
      juntos.
    habitat: [ma_boca]
    inspiracao: []
    padrao: [defesa, enfraquecer]
    a_cada_n: 4
    telegrafo: "{nome} incha com um gemido de muitas bocas e aperta as bordas do vão."
    description: >-
      Cria do Desespero feita dos corpos esmagados na porta quando o teto cedeu; entope a porta e esmaga
      contra as bordas quem chega perto.
    perigo: Médio
    lore: >-
      No Reino Subterrâneo os tetos ainda cedem, e quando cedem todos correm para a mesma porta. O
      Desespero, que vive procurando uma saída que sabe não existir, deixa resíduo onde um grupo inteiro
      ficou esmagado no vão, cada um empurrando o da frente. O resíduo toma a carne deles. A coisa que sai
      disso é uma porta entupida de gente, com braços para os dois lados, e ela aparece na saída por onde
      você entrou.
    aparencia: >-
      Vão de porta ou de túnel entupido de corpos humanos espremidos, ombro contra costas e rosto contra
      joelho, dezenas de braços saindo para os dois lados com mãos inchadas e roxas; o conjunto incha
      quando respira.
    como_se_luta: >-
      Incha a cada duas rodadas e esmaga quem está encostado; os braços puxam quem chega perto. Fique a
      dois passos e corte os braços das bordas.
    related_entities: [ma_boca, npc_dorrhen]
    arte:
      visual: >-
        O vão de uma porta de pedra anã completamente preenchido por corpos humanos acinzentados de poeira,
        espremidos em todas as posições, encaixados como pedras de um muro; rostos de lado, joelhos,
        costas, ombros; dezenas de braços saindo para a frente, mãos inchadas e roxas. Sem sangue à vista,
        só pó de pedra e pedaços de teto caídos.
      composicao: >-
        Câmara do Reino vista de dentro, teto rachado e pedras caídas no chão; a única porta tapada pela
        cria; dois aventureiros recuam para o centro da câmara, da altura de um terço da porta, dando a
        escala. Luz de uma tocha caída no chão.
      evitar: >-
        Muro de crânios de ossário, monstro de carne derretida, gore explícito. Os corpos estão inteiros e
        reconhecíveis; o horror é o aperto e a porta fechada.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_tesoura_de_cordada
    vaga: 23
    nome: Tesoura de Cordada
    status: nova
    substitui: null
    familia: demonio_encarnado
    origem_lore:
      fonte: demonio
      detalhe: npc_veth
      refs: ["lore_nova/npcs.txt:258", "lore_nova/locations.txt:362"]
    anatomia:
      plano_corporal: hexapode_ou_mais
      material: osso
      escala: pequena
      locomocao: escala_paredes
      percepcao: som
      texto: >-
        O resíduo da Inveja aparece onde dois grupos sobem a mesma parede e cada um torce pela queda do
        outro, e toma os ossos dos que caíram nas fendas. O corpo é curto, do tamanho de um cão: duas
        escápulas e dois maxilares articulados no centro como as lâminas de uma tesoura de tosquia aberta,
        afiados no fio. Embaixo, seis patas finas de costela cravam as pontas na pedra. Não tem cabeça nem
        olhos; as lâminas abrem e fecham sozinhas, e os ossos rangem baixo quando a corda perto vibra.
    silhueta: Uma tesoura de tosquia aberta do tamanho de um cão, presa na parede ao lado de uma corda esticada.
    comportamento: >-
      Vive nas paredes onde as cordadas sobem. Não morde gente: corta o que segura gente. Corda, alça,
      fivela, correia de escudo, a mão que segura a mão do companheiro. Some numa fenda quando é visto e
      volta quando alguém está pendurado.
    papel_tatico: saqueador
    arquetipo: covarde_oportunista
    categoria: lacaio
    faccao: null
    mecanica_assinatura:
      carta: cri_tesoura_de_cordada_corte_da_correia
      frase: >-
        Corta o que o outro tem: correia, corda e alça; a cada corte, uma proteção do jogador deixa de valer
        até ser amarrada de novo.
    contra_jogo: Não ficar pendurado; esmagá-la contra a pedra com a lâmina fechada, porque as patas de costela quebram com pancada.
    gancho: >-
      Nas paredes das Montanhas, dois grupos que sobem juntos raramente chegam juntos.
    habitat: [montanhas_afiadas]
    inspiracao: []
    padrao: [enfraquecer, mover, ataque]
    a_cada_n: 2
    telegrafo: "{nome} crava as patas ao lado da corda de quem sobe, e as lâminas se abrem com um rangido."
    description: Cria da Inveja em forma de tesoura de tosquia feita de escápulas e maxilares, sobre patas de costela; corta corda, alça e correia de quem sobe.
    perigo: Baixo
    lore: >-
      A Inveja não quer o que o outro tem: quer que o outro não tenha. Nas paredes das Montanhas, onde duas
      cordadas sobem ao mesmo tempo, ela deixa resíduo, e o resíduo toma os ossos dos que caíram nas
      fendas. A coisa parece uma tesoura de tosquia aberta, presa na pedra ao lado da corda. Não morde.
      Corta corda, alça, fivela e correia, e de preferência a de quem está pendurado. Os guias contam que
      ela some quando alguém olha e volta quando alguém precisa de ajuda.
    aparencia: >-
      Corpo curto do tamanho de um cão feito de duas escápulas e dois maxilares articulados como as
      lâminas de uma tesoura de tosquia aberta, fio afiado, sobre seis patas finas de costela cravadas na
      pedra; sem cabeça nem olhos.
    como_se_luta: >-
      Corta correias, cordas e alças, e as proteções deixam de valer. Não ficar pendurado; esmagá-la
      contra a pedra quando as lâminas fecham.
    related_entities: [montanhas_afiadas, npc_veth]
    arte:
      visual: >-
        Criatura do tamanho de um cão feita de ossos branco-amarelados: duas escápulas largas e dois
        maxilares longos articulados num pino central, abertos em X como as lâminas de uma tesoura de
        tosquia, com fio de lâmina; seis patas finas de costelas, pontudas, cravadas na rocha. Sem cabeça,
        sem olhos.
      composicao: >-
        Paredão vertical com duas cordadas subindo lado a lado; a Tesoura presa na pedra ao lado da corda de
        uma delas, as lâminas abertas sobre a corda um palmo acima da mão de um escalador; o companheiro
        abaixo dá a escala. Vento, neve fina, céu branco.
      evitar: >-
        Serpente de ossos, centopeia de vértebras, caranguejo de praia. É um par de lâminas de osso sobre
        patas finas, quieto, que quer a corda e não a carne.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_mastro_de_trofeus
    vaga: 24
    nome: Mastro de Troféus
    status: nova
    substitui: null
    familia: demonio_encarnado
    origem_lore:
      fonte: demonio
      detalhe: npc_maalrek
      refs: ["lore_nova/npcs.txt:211", "lore_nova/factions.txt:411"]
    anatomia:
      plano_corporal: composto
      material: osso
      escala: grande
      locomocao: anda
      percepcao: sangue_cheiro
      texto: >-
        Nos acampamentos das Saídas Baixas, quem trai um acordo com os Orcs vira troféu, pregado num
        mastro na boca da passagem. A Crueldade que sobra disso tomou a carne dos mastros. Esta cria é
        um feixe de ossos compridos amarrados com tendão e couro, alto como duas lanças, e ao longo dele
        estão pregados maxilares, dentes, tranças e cintos de traidores, que batem uns nos outros. Anda
        cravando a estaca da base no chão e puxando o feixe atrás dela, aos trancos, e as tiras de
        tendão de cima balançam soltas, batendo nos troféus. No alto, onde os Orcs pregavam a cabeça do
        traidor, há sempre um rosto: o de quem está sofrendo mais perto, copiado em carne.
    silhueta: Um mastro alto cheio de coisas pregadas que avança aos trancos, cravando a própria ponta no chão, com um rosto no topo.
    comportamento: >-
      Fica de pé na boca das passagens entre os mastros de verdade e só se mexe quando alguém já sangra.
      Não laça nem segura: põe-se diante do ferido, e o rosto no alto vai ficando mais nítido, igual ao
      dele, enquanto ele sofre.
    papel_tatico: drenador
    arquetipo: abissal
    categoria: elite
    faccao: null
    mecanica_assinatura:
      carta: "cri_mastro_de_trofeus_rosto_do_ferido"
      frase: >-
        No alto aparece o rosto do herói mais ferido: enquanto o rosto estiver lá, os golpes desse herói
        no Mastro saem pela metade, e cada Ferimento aberto que ele tiver deixa o Mastro mais duro
        contra os outros.
    contra_jogo: >-
      Fechar as feridas do copiado, ou tirá-lo de perto, apaga o rosto; os inteiros batem na estaca da
      base, que é o que o sustenta.
    gancho: >-
      Gruumsha respeita acordo, e quem trai vira troféu na boca da passagem; há mais mastros lá do que os
      Orcs se lembram de ter fincado.
    habitat: [ma_saidas_baixas]
    inspiracao: []
    padrao: [ataque, enfraquecer, reforco_proprio]
    a_cada_n: 3
    telegrafo: "O rosto no alto de {nome} se mexe e fica parecido com o de quem mais sangra."
    description: >-
      Cria da Crueldade nas Saídas Baixas, um mastro de troféus que avança cravando a própria estaca e
      mostra no alto o rosto do ferido, ficando mais duro quanto mais ele sofre.
    perigo: Alto
    lore: >-
      Nas Saídas Baixas, quem trai um acordo com os bandos de Gruumsha vira troféu: maxilares, tranças e
      cinto pregados num mastro na boca da passagem. A Crueldade segue o sofrimento, e ali o sofrimento
      ficou pregado. O resíduo dela tomou a carne de um dos mastros. Ele anda cravando a estaca da base
      e no topo, onde ficava a cabeça do traidor, mostra o rosto de quem está sofrendo mais perto. Os
      Orcs contam os mastros toda manhã e não gostam do número.
    aparencia: >-
      Feixe de ossos compridos amarrados com tendão e couro, alto como duas lanças, com maxilares, dentes,
      tranças e cintos pregados ao longo dele, a base afiada em estaca, tiras de tendão soltas no alto como
      laços; no topo, um rosto de carne que copia o de quem sofre mais perto.
    como_se_luta: >-
      Mostra no alto o rosto do mais ferido; os golpes desse herói saem fracos e cada ferida dele o
      endurece. Feche as feridas do copiado e deixe os inteiros baterem na estaca.
    related_entities: [ma_saidas_baixas, npc_maalrek, bandos_orc_saidas_baixas]
    arte:
      visual: >-
        Um mastro alto feito de ossos longos amarrados em feixe com tiras de couro e tendão; pregados ao
        longo dele com pregos de ferro, maxilares humanos e de Goblin, dentes, tranças de cabelo, cintos; a
        base afiada em estaca, cravada na neve; tiras de tendão soltas no alto, como laços; no topo, um rosto humano de carne, recém-feito,
        com a expressão de dor de alguém que está fora do quadro.
      composicao: >-
        Boca de passagem nas Saídas Baixas com uma fileira de mastros de troféus fincados na neve; um deles,
        o maior, inclinado sobre um viajante ferido caído; um Orc do bando, ao fundo, recua, menor que o
        mastro, dando a escala. Luz cinza, vento.
      evitar: >-
        Totem tribal de madeira entalhada, gore explícito, cabeças empaladas em close. Inquietante pela
        forma e pelo rosto que muda, sem vísceras.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_mao_da_borda
    vaga: 25
    nome: Mão da Borda
    status: nova
    substitui: null
    familia: demonio_encarnado
    origem_lore:
      fonte: demonio
      detalhe: npc_skarath
      refs: ["lore_nova/npcs.txt:333", "lore_nova/locations.txt:362"]
    anatomia:
      plano_corporal: radial
      material: couro_tecido
      escala: grande
      locomocao: escala_paredes
      percepcao: calor
      texto: >-
        Há guias que cobram a travessia inteira e largam o cliente numa borda no meio da descida, dizendo
        que voltam. A Traição se demora na confiança de quem esperou, e o resíduo toma carne do que ficou
        na borda. É um corpo chato e redondo como uma mesa de taverna, de couro cinzento e duro, que vive
        agarrado de bruços sob a beira das trilhas, com cinco braços compridos saindo do centro como raios.
        Quatro braços têm ventosas e seguram a rocha. O quinto termina numa mão humana perfeita, limpa, de
        unhas aparadas, e é essa que aparece na borda.
    silhueta: Uma mão limpa agarrada à beira do penhasco, como de alguém que está caindo.
    comportamento: >-
      Espera sob a borda das trilhas mais altas. Quando alguém passa, a mão aparece agarrada à pedra,
      tremendo. Quem segura a mão é segurado, e os outros quatro braços soltam a rocha ao mesmo tempo.
    papel_tatico: emboscador
    arquetipo: emboscador
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: cri_mao_da_borda_a_mao_que_puxa
      frase: >-
        Ataca quem ajuda: quem estende a mão ou socorre um aliado na rodada é agarrado e puxado para a
        borda.
    contra_jogo: Não segurar mão nenhuma na beira sem ver o braço; pisar na mão contra a pedra faz os braços de ventosa soltarem a rocha.
    gancho: >-
      Nas passagens há guias que cobram a travessia e largam o cliente numa borda, dizendo que voltam; a
      borda ficou com alguns desses clientes.
    habitat: [montanhas_afiadas]
    inspiracao:
      - fonte: zoologia (ofiuroides, estrelas-serpente)
        referencia: "parentes das estrelas-do-mar de braços longos e finos que saem de um disco central"
        tomou: o disco central com braços compridos
        distancia: só a planta do corpo; o tamanho, as ventosas na rocha e a mão humana de isca são das Montanhas
    padrao: [defesa, ataque]
    a_cada_n: 3
    telegrafo: "{nome} tateia a beira da trilha com a mão limpa, devagar, procurando outra mão."
    description: Cria da Traição agarrada sob a beira das trilhas, um disco de couro com braços de ventosa e uma mão humana limpa que pede ajuda sem falar.
    perigo: Médio
    lore: >-
      Nem todo guia das passagens é Cinzéu, e nem todo guia volta. Há os que cobram a travessia inteira e
      deixam o cliente numa borda no meio da descida, dizendo que vão buscar corda. A Traição gosta mais
      do instante antes do que do ato, e se demora na confiança de quem esperou. O resíduo toma carne do
      que ficou na borda e passa a morar debaixo dela. Só se vê uma mão limpa segurando a pedra. Os guias
      Cinzéus ensinam a nunca segurar uma mão na beira sem ver o braço inteiro.
    aparencia: >-
      Disco chato de couro cinzento e duro do tamanho de uma mesa, agarrado sob a borda, com cinco braços
      longos saindo do centro; quatro com ventosas na rocha, o quinto terminando numa mão humana perfeita,
      limpa, de unhas aparadas.
    como_se_luta: >-
      Agarra e puxa para a borda quem tenta ajudar alguém. Não segurar mão nenhuma sem ver o braço; pisar
      na mão contra a pedra faz os braços soltarem a rocha.
    related_entities: [montanhas_afiadas, npc_skarath]
    arte:
      visual: >-
        Criatura em forma de disco chato, couro cinzento e áspero, do tamanho de uma mesa, agarrada de
        bruços na face de rocha logo abaixo da borda de uma trilha; cinco braços longos e grossos saem do
        centro, quatro com fileiras de ventosas presas à pedra; o quinto sobe até a borda e termina numa mão
        humana perfeita, pálida e limpa, de unhas aparadas, agarrada à beira.
      composicao: >-
        Corte lateral de um penhasco: em cima, a trilha estreita com um viajante ajoelhado estendendo a mão
        para a mão na borda; embaixo, visível só para quem olha a cena, o disco e os braços. O viajante dá
        a escala. Abismo de névoa embaixo, luz fria.
      evitar: >-
        Polvo, estrela-do-mar de praia, mão fantasma solta. A mão é presa a um braço que é parte do bicho,
        e o bicho é de pedra e couro, não de mar.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_lingua_de_lima
    vaga: 26
    nome: Língua de Lima
    status: nova
    substitui: null
    familia: demonio_encarnado
    origem_lore:
      fonte: demonio
      detalhe: npc_veleth
      refs: ["lore_nova/npcs.txt:348", "lore_nova/factions.txt:443", "lore_nova/timeline_completa.txt:312"]
    anatomia:
      plano_corporal: quadrupede
      material: sal_mineral
      escala: pequena
      locomocao: escala_paredes
      percepcao: medo_emocao
      texto: >-
        Os Anões não têm palavra para a perda do Reino, e a Vergonha que não se diz deixa resíduo nas
        câmaras onde o Reino registrou em pedra a própria queda. A cria tomou carne do pó das paredes: é um
        bicho baixo de quatro patas, do tamanho de um cão, de pele áspera e cinzenta coberta por uma crosta
        de pó de pedra. A cabeça é chata e quase toda boca, e da boca sai uma língua comprida e dura como a
        lima de um ferreiro, coberta de dentes miúdos. As patas têm dedos chatos que se grudam na parede.
    silhueta: Um bicho chato colado a uma parede escrita, de cabeça encostada na pedra, raspando.
    comportamento: >-
      Lambe as paredes das câmaras de registro e apaga as inscrições letra por letra, sempre as que falam
      da queda. Quando há gente, lambe gente, e o que a pessoa tinha acabado de ganhar some com a
      lambida, como some a última linha da parede; depois ele foge para o alto da parede.
    papel_tatico: quebra_defesa
    arquetipo: tatico
    categoria: lacaio
    faccao: null
    mecanica_assinatura:
      carta: cri_lingua_de_lima_apaga_o_ultimo
      frase: >-
        Cada lambida apaga o último efeito ativo a favor do alvo, como apaga a última linha escrita na
        parede.
    contra_jogo: Pegá-lo no chão, longe da parede; a língua é dura, mas a garganta atrás dela não é.
    gancho: >-
      Durgrim Último-Martelo procura os Registros Perdidos do Reino; há quem os esteja apagando antes que
      ele chegue.
    habitat: [ma_boca, ma_forja_profunda]
    inspiracao:
      - fonte: zoologia (rádula dos caramujos)
        referencia: "a língua em fita coberta de dentes miúdos com que caramujos e lesmas raspam a comida"
        tomou: a língua que raspa como uma lima
        distancia: só a língua; o bicho de quatro patas, o pó de pedra e o apagar das inscrições são do Reino
    padrao: [enfraquecer, ataque]
    a_cada_n: 4
    telegrafo: "{nome} desenrola a língua de lima até o chão, e o raspar na pedra para."
    description: Cria da Vergonha anã que apaga, lambendo, as inscrições sobre a queda do Reino; em luta, apaga o último efeito a favor de quem lambe.
    perigo: Baixo
    lore: >-
      Os Anões registraram em pedra tudo o que fizeram no Reino, e não têm palavra para o que perderam. A
      Vergonha sussurra de dentro, e o que não se diz deixa resíduo. Nas câmaras de registro há bichos
      baixos, cinzentos de pó, que lambem as paredes com uma língua dura como lima e apagam as
      inscrições, letra por letra, sempre as que falam da queda. Durgrim Último-Martelo procura os
      Registros Perdidos. Alguém está chegando antes dele.
    aparencia: >-
      Bicho baixo de quatro patas do tamanho de um cão, pele áspera cinzenta com crosta de pó de pedra,
      cabeça chata quase toda boca, língua comprida e dura como lima de ferreiro coberta de dentes
      miúdos, dedos chatos grudados na parede.
    como_se_luta: >-
      Cada lambida apaga o último efeito a favor do alvo. Guardar o reforço para depois que ele cair;
      pegá-lo no chão, longe da parede, porque a garganta é mole.
    related_entities: [ma_boca, ma_forja_profunda, npc_veleth, ultimos_anoes_reino]
    arte:
      visual: >-
        Bicho baixo e chato de quatro patas, do tamanho de um cão médio, pele cinzenta áspera coberta de
        pó de pedra como farinha; cabeça larga e achatada quase toda boca; uma língua longa, rígida, cinza
        de ferro, com dentinhos em fileiras como uma lima de ferreiro; dedos largos colados na parede.
      composicao: >-
        Parede de câmara de registro anã coberta de inscrições em linhas retas; um trecho no meio já
        raspado e liso; o bicho colado à parede, língua estendida sobre as letras; um escriba anão com uma
        lanterna, na altura do bicho, observa de lado, dando a escala. Luz fria, pó no ar.
      evitar: >-
        Camaleão, lagarto de língua grudenta, cão demoníaco. A língua não gruda, raspa; e o bicho é de pó
        e vergonha, quieto.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_pisador_do_salao
    vaga: 27
    nome: Pisador do Salão
    status: nova
    substitui: null
    familia: demonio_encarnado
    origem_lore:
      fonte: demonio
      detalhe: npc_urath
      refs: ["lore_nova/npcs.txt:164", "lore_nova/races.txt:96", "lore_nova/races.txt:111"]
    anatomia:
      plano_corporal: quadrupede
      material: osso
      escala: enorme
      locomocao: anda
      percepcao: visao
      texto: >-
        O Reino dos Anões mediu tudo de cima para baixo, e o Orgulho deixou resíduo nas câmaras altas de
        onde os capatazes olhavam os turnos lá embaixo. A cria tomou carne dos ossos dos Anões mortos na
        queda: quatro pernas altíssimas feitas de ossos de braço anão, compridos, emendados nas juntas três
        a três, sustentam um tronco pequeno de costelas e uma cabeça de crânio largo que fica perto do teto.
        Cada perna termina num crânio anão, largo e chato, que bate no chão polido como um casco. A cabeça
        olha sempre para baixo.
    silhueta: Uma coisa de quatro pernas finas como andaimes, alta até o teto do salão, com uma cabeça pequena olhando para baixo.
    comportamento: >-
      Ocupa os salões altos do Reino e não deixa ninguém ficar acima dele. Pisa primeiro em quem caiu, em
      quem se ajoelhou, em quem está mais baixo; quem sobe numa escada ou num degrau leva o golpe mais
      forte, para descer.
    papel_tatico: guarda_protetor
    arquetipo: guardiao
    categoria: elite
    faccao: null
    mecanica_assinatura:
      carta: cri_pisador_do_salao_pisa_quem_esta_baixo
      frase: >-
        Pisa com mais força em quem está no chão ou ajoelhado, e derruba quem tenta ficar mais alto que
        ele.
    contra_jogo: Ficar de pé e colado às pernas, onde ele não alcança sem se dobrar; as emendas das pernas quebram de lado.
    gancho: >-
      O Reino dos Anões se organizava de cima para baixo; nas câmaras altas, a altura ainda manda.
    habitat: [ma_boca]
    inspiracao: []
    padrao: [ataque_multiplo, defesa]
    a_cada_n: 3
    telegrafo: "{nome} dobra uma perna de cada vez e baixa a cabeça até a altura de quem caiu."
    description: Cria do Orgulho nos salões altos do Reino, sobre quatro pernas de ossos de braço anão emendados; pisa em quem está mais baixo.
    perigo: Alto
    lore: >-
      Os Anões chegaram ao mundo dominando: em semanas tomaram a primeira cidade dos Elfos que tentaram
      dominá-los, e o Reino se organizou de cima para baixo, com capatazes nas câmaras altas olhando os
      turnos. O Orgulho, que precisa ver o outro abaixo, deixou resíduo nesses salões, e o resíduo tomou
      os ossos dos Anões mortos na queda. A coisa anda sobre quatro pernas altas como andaimes, feitas de
      ossos de braço emendados, e olha sempre para baixo. Pisa primeiro em quem está no chão.
    aparencia: >-
      Criatura alta até o teto sobre quatro pernas finas de ossos de braço anão emendados nas juntas três a
      três, cada pé um crânio anão largo batendo no chão como casco, tronco pequeno de costelas e cabeça
      de crânio largo sempre voltada para baixo.
    como_se_luta: >-
      Pisa com mais força em quem está no chão e derruba quem sobe mais alto. Ficar de pé e colado às
      pernas; as emendas quebram de lado.
    related_entities: [ma_boca, npc_urath]
    arte:
      visual: >-
        Criatura muito alta e magra: quatro pernas longuíssimas de ossos de antebraço emendados, três a
        três por junta, amarrados com tendão seco, como pernas de pau; cada pé é um crânio anão largo e
        chato apoiado no chão como um casco; no alto, um tronco pequeno de costelas e uma cabeça de crânio largo e baixo,
        sem olhos visíveis, inclinada para baixo.
      composicao: >-
        Salão alto do Reino, colunas polidas, uma galeria de capatazes no alto da parede; o Pisador ocupa
        o salão, a cabeça na altura da galeria; embaixo, um aventureiro caído no chão e outro de pé entre
        as pernas, chegando ao joelho dele, dão a escala. Luz fria vinda de cima, sombras longas para baixo.
      evitar: >-
        Aranha gigante, cavalo-esqueleto, criatura de pernas finas surrealista de quadro famoso. É feito de
        ossos de braço anão, rústico, e olha para baixo.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada
