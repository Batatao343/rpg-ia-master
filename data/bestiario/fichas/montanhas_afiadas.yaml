paleta: >-
  **Montanhas Afiadas** — picos que rasgaram o chão na Era 2, verticais demais e cortantes, neve
  permanente no alto, rocha exposta sem vegetação, trilhas da largura de dois pés e meio, cordas e
  pontes de corda sobre fendas; embaixo, o Reino perdido dos Anões: câmaras polidas e idênticas,
  trilhos, respiros de ventilação, bigornas. Luz e paleta: branco-azulado de neve e céu frio,
  cinza-ardósia, ferrugem de trilho, laranja baixo de Brasa-Profunda e Líquen-de-Brasa no escuro,
  breu de galeria; o Éter aparece só como cristal turvo nos veios.
