        Descendente dos bois de tração que os Anões usavam nos trilhos das minas e deixaram para trás
        quando perderam o Reino. Gerações no escuro tiraram o pelo e a cor: a pele é branca e grossa, de
        veias azuis, e os olhos são duas bolas leitosas sem uso. A canga de ferro dos avós ficou, e a
        carne do pescoço cresceu por cima dela, de modo que o ferro sai do couro só nas pontas. Os chifres
        gastaram de raspar o teto das galerias e viraram duas placas chatas e lisas na frente da cabeça,
        e os ombros incharam de puxar o que não existe mais.
    silhueta: Um boi branco e sem pelo, de cabeça baixa sobre um trilho, com uma barra de ferro atravessada no pescoço.
    comportamento: >-
      Percorre ainda as linhas de transporte dos Anões, de trilho em trilho, sentindo pelos cascos o
      tremor do ferro. O que estiver no trilho é carga ou obstáculo, e ele arremete de cabeça baixa.
      Fora do trilho fica parado e perdido, mugindo baixo.
    papel_tatico: bruto_de_linha
    arquetipo: morto_vivo_implacavel
    categoria: elite
    faccao: null
    mecanica_assinatura:
      carta: cri_boi_de_canga_arremetida_no_trilho
      frase: >-
        Arremete pelo trilho e leva junto tudo que está na linha; fora do trilho, perde o rumo e o
        ímpeto.
    contra_jogo: Sair do trilho e lutar de lado, porque ele sente o ferro e não a pessoa; arrancar um trilho ou travá-lo com pedra o deixa parado.
    gancho: >-
      Os Anões perderam o Reino de uma vez e não levaram os animais; os bois de tração ainda puxam pelas
      linhas que ninguém usa.
    habitat: [ma_boca, ma_forja_profunda]
    inspiracao:
      - fonte: história da mineração (pôneis de mina)
        referencia: "cavalos mantidos a vida inteira no fundo das minas de carvão, que aprendiam os trilhos no escuro"
        tomou: o animal de tração que vive e morre no subterrâneo seguindo trilhos
        distancia: só a ideia do bicho de mina; a canga crescida na carne, os chifres gastos e o ataque pelo trilho são do Reino perdido
    padrao: [ataque, ataque, mover]
    a_cada_n: 3
    telegrafo: "{nome} raspa o casco no trilho e baixa as placas da testa até o ferro."
    description: Boi de tração dos Anões deixado no Reino perdido, branco e cego, com a canga de ferro coberta pela carne do pescoço; arremete pelos trilhos.
    perigo: Alto
    lore: >-
      Quando os Anões perderam o Reino Subterrâneo, saíram com o que cabia nas costas. Os bois de tração
      das minas ficaram. Gerações no escuro tiraram deles o pelo, a cor e os olhos, e a canga de ferro
      dos avós ficou presa no pescoço dos netos, coberta de carne. Eles ainda andam pelas linhas de
      transporte do Reino, de trilho em trilho, e o que estiver no caminho vai junto. Os Goblins-mineiros
      sabem onde os trilhos passam e não dormem perto deles.
    aparencia: >-
      Boi grande, branco e sem pelo, pele grossa de veias azuis, olhos leitosos, canga de ferro coberta
      pela carne do pescoço com as pontas para fora, chifres gastos em duas placas chatas na testa,
      ombros inchados.
    como_se_luta: >-
      Arremete pelo trilho e leva tudo que está na linha. Fora do trilho, lutando de lado, ele perde o
      rumo; travar o trilho o deixa parado.
    related_entities: [ma_boca, ma_forja_profunda]
    arte:
      visual: >-
        Boi de tração grande e musculoso, inteiramente sem pelo, pele branca grossa com veias azuladas
        aparentes; olhos brancos leitosos; uma canga de ferro forjado atravessada no pescoço, a carne
        crescida por cima dela e só as pontas de ferro aparecendo; os chifres gastos até virarem duas
        placas lisas e chatas sobre a testa; ombros enormes, cascos rachados.
      composicao: >-
        Galeria anã com dois trilhos de ferro enferrujados e um carrinho de minério tombado; o Boi vem pelo
        trilho de cabeça baixa; um Goblin-mineiro pula para fora da linha, na altura do joelho do boi,
        dando a escala. Luz laranja fraca de Líquen-de-Brasa nas paredes.
      evitar: >-
        Homem com cabeça de touro, esqueleto de touro, boi infernal de olhos em chamas. É um animal de
        carga cego e velho, sem nada de humano.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  # ---- slot genérico reinventado: enemy_mimico_bau ----
  - id: enemy_mimico_bau
    vaga: 8
    nome: Morador do Caldeirão
    status: reinventada
    substitui: enemy_mimico_bau
    ataques: ["Pinça de Bigorna"]
    acoes:
      - Ferido e frio, recua para junto da bigorna e se encosta nas brasas para reaquecer o ferro.
      - Anda pela Forja com o caldeirão em brasa e encosta o ferro quente em quem se aproxima.
    substitui_generico: Mímico (Baú)
    familia: besta_entropia
    origem_lore:
      fonte: eter
      detalhe: null
      refs: ["lore_nova/creatures.txt:310", "data/world_map.json:930"]
    anatomia:
      plano_corporal: hexapode_ou_mais
      material: quitina
      escala: grande
      locomocao: anda
      percepcao: calor
      texto: >-
        Um bicho de casca mole que mora dentro de um caldeirão de forja anão de ferro fundido, do tamanho de
        uma banheira, como o ermitão da praia mora numa concha. O caldeirão está cheio de brasa e escória do
        fogão de pedra, e o ventre branco, cozido de calor, fundiu-se ao ferro do fundo: ele não sai mais
        dali nem troca de casa. Seis patas grossas de quitina vermelho-escura carregam o caldeirão rubro, e
        duas pinças desiguais saem da borda, a maior do tamanho de uma bigorna pequena. Os olhos ficam em
        hastes curtas, chamuscadas nas pontas.
    silhueta: Um caldeirão rubro de brasa andando sobre seis patas pela forja, soltando fumaça pela borda.
    comportamento: >-
      Anda pela Forja Profunda carregando o calor das bigornas no caldeirão. Se recolhe quando é atacado, e cada pancada no ferro sacode brasa para fora da borda. Longe das bigornas o caldeirão esfria e escurece; ele
      volta para junto delas, encosta nas brasas e espera o ferro avermelhar de novo.
    papel_tatico: tanque_reativo
    arquetipo: bruto
    categoria: elite
    faccao: null
    mecanica_assinatura:
      carta: cri_morador_do_caldeirao_ferro_em_brasa
      frase: "Recolhido no caldeirão, aguenta o golpe; cada golpe no ferro derrama brasa no chão em volta, e quem estiver ao lado dele na rodada seguinte se queima. Longe das bigornas a brasa acaba e a defesa cai."
    contra_jogo: "Afastá-lo das bigornas e golpeá-lo de longe ou com haste, sem ficar ao lado dele; frio, o caldeirão escurece e o ventre preso ao fundo fica sem defesa."
    gancho: >-
      As bigornas da Forja Profunda ainda estão quentes; o que vive do calor delas não pode se afastar
      muito.
    habitat: [ma_forja_profunda]
    inspiracao:
      - fonte: zoologia (caranguejo-ermitão)
        referencia: "crustáceos que protegem o abdômen mole numa concha alheia e trocam de concha quando crescem"
        tomou: o bicho que mora num objeto que não fez
        distancia: só a casa emprestada; o caldeirão em brasa, o ventre fundido ao ferro e a dependência das bigornas são da Forja
    padrao: [defesa, ataque]
    a_cada_n: 2
    telegrafo: "{nome} se encolhe dentro do caldeirão, e a borda de ferro fica rubra e começa a fumegar."
    description: Bicho de ventre mole fundido a um caldeirão de forja anão cheio de brasa; cada golpe no ferro derrama brasa em volta, e longe das bigornas ele esfria.
    perigo: Alto
    lore: >-
      A Forja Profunda, perto da Boca, tem bigornas que nunca esfriaram, e o calor delas sustenta mais
      coisas do que os Anões. Há bichos de ventre mole e seis patas de quitina que entraram nos caldeirões
      de ferro cheios de brasa e não saíram: o calor cozinhou o ventre e o colou ao fundo. Eles andam pela
      Forja carregando a brasa e, golpeados, sacodem brasa no chão em volta. Longe das bigornas, o ferro
      esfria, e eles voltam. Os ferreiros da Forja os deixam passar.
    aparencia: >-
      Caldeirão de forja anão de ferro fundido, do tamanho de uma banheira, rubro e cheio de brasa e
      escória, carregado por seis patas grossas de quitina vermelho-escura; duas pinças desiguais na
      borda, a maior do tamanho de uma bigorna pequena; olhos em hastes chamuscadas.
    como_se_luta: >-
      Recolhido, aguenta o golpe e derrama brasa no chão em volta, queimando quem fica ao lado. Longe das bigornas ele esfria e se defende pior; golpeá-lo de longe ou com haste.
    related_entities: [ma_forja_profunda]
    arte:
      visual: >-
        Grande caldeirão de ferro fundido anão com rebites e alças, a borda e o bojo avermelhados de calor,
        brasa e escória brilhando dentro, fumaça saindo; carregado por seis patas articuladas de crustáceo,
        vermelho-escuras e cascudas; duas pinças desiguais, uma enorme; olhos pretos em hastes curtas
        chamuscadas. Pelo vão da borda, o ventre branco colado ao ferro.
      composicao: >-
        Chão da Forja Profunda entre duas bigornas e um fogão de pedra; o Morador atravessa o chão
        deixando marcas de queimado; um aventureiro recua de uma poça de brasa derramada, da altura do
        caldeirão mais as patas, dando a escala. Luz laranja de brasa vinda de baixo.
      evitar: >-
        Baú com dentes e língua, objeto disfarçado que morde, caldeirão de bruxa. Não se esconde: o
        caldeirão é a casa quente dele, e o bicho é um crustáceo de verdade.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  # ---- slot genérico reinventado: enemy_basilisco_caverna ----
  - id: enemy_basilisco_caverna
    vaga: 9
    nome: Caramujo de Estalagmite
    status: reinventada
    substitui: enemy_basilisco_caverna
    ataques: ["Gosma que Endurece"]
    acoes:
      - Vai primeiro até quem ficou com a arma presa na crosta.
      - Ferido, recua para a casca de pedra e deixa a gosma escorrer pelo pé.
      - Avança devagar, coberto de gosma, e espera o golpe de lâmina.
    substitui_generico: Basilisco da Caverna
    familia: besta_entropia
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/locations.txt:368", "lore_nova/creatures.txt:268"]
    anatomia:
      plano_corporal: serpentiforme
      material: sal_mineral
      escala: grande
      locomocao: rasteja
      percepcao: vibracao
      texto: >-
        Um caramujo do tamanho de uma carroça que vive nas câmaras úmidas onde a água pinga do teto. A
        casca é uma estalagmite: camadas de pedra calcária que ele mesmo deposita, cônica, amarelada, com
        escorridos como cera de vela. O pé é largo e branco, coberto de uma gosma tão carregada de pedra
        que endurece em instantes em volta do que entra nela. Dois pares de tentáculos curtos tateiam o
        chão na frente da boca, uma fenda mole e sem dentes.
    silhueta: Uma estalagmite amarelada no chão da caverna que, de perto, está mais longe da parede do que estava.
    comportamento: >-
      Avança devagar pelas câmaras de gotejo, coberto de gosma. Quem o golpeia com lâmina enfia o ferro na
      gosma, e a gosma vira pedra em volta da arma. Ou o dono larga a arma, ou o caramujo o puxa até o pé. O rastro dele
      é cheio de ferramentas e lanternas anãs presas na pedra, de cabo para fora.
    papel_tatico: controlador
    arquetipo: predador
    categoria: elite
    faccao: null
    mecanica_assinatura:
      carta: cri_caramujo_de_estalagmite_lamina_presa
      frase: "A gosma vira pedra em volta da lâmina que o golpeia: o dono larga a arma, que fica na pedra até o fim da luta, ou é arrastado até o pé dele na rodada seguinte."
    contra_jogo: Golpear com pancada ou com haste, nunca com lâmina; a casca é pedra, mas o pé branco é mole e cede ao porrete.
    gancho: >-
      O rastro dos caramujos nas câmaras de gotejo é cheio de picaretas e lanternas anãs presas na pedra,
      de cabo para fora; ninguém voltou para buscá-las.
    habitat: [ma_boca]
    inspiracao:
      - fonte: geologia (poço petrificante de Knaresborough)
        referencia: "fonte inglesa de água tão carregada de calcário que cobre de pedra, em meses, os objetos pendurados nela"
        tomou: a água que transforma em pedra o que toca
        distancia: só a pedra que cresce; o caramujo, a casca de estalagmite e a arma presa na gosma são das câmaras do Reino
    padrao: [defesa, enfraquecer, ataque]
    a_cada_n: 3
    telegrafo: "{nome} incha o pé branco e a gosma escorre grossa, brilhando à espera do golpe."
    description: Caramujo do tamanho de uma carroça com casca de estalagmite; a gosma do pé vira pedra em volta da lâmina que o golpeia.
    perigo: Alto
    lore: >-
      Nas câmaras de gotejo do Reino Subterrâneo há estalagmites que mudam de lugar, devagar. São
      caramujos do tamanho de uma carroça que depositam a própria casca em camadas de pedra calcária, como
      a água faz no teto. A gosma do pé deles endurece em volta do que entra nela, e quem os golpeia com
      espada fica com a espada presa na pedra. O rastro deles é cheio de picaretas e lanternas anãs de
      cabo para fora. Os Goblins-mineiros os enfrentam com porrete.
    aparencia: >-
      Caramujo enorme de pé largo e branco coberto de gosma, casca em forma de estalagmite cônica
      amarelada de camadas calcárias com escorridos de cera, dois pares de tentáculos curtos, boca mole
      sem dentes, ferramentas presas na pedra do rastro.
    como_se_luta: >-
      A gosma vira pedra em volta da lâmina que o golpeia: largar a arma ou ser arrastado até ele. Usar pancada ou haste e mirar
      no pé mole.
    related_entities: [ma_boca]
    arte:
      visual: >-
        Caramujo do tamanho de uma carroça; a casca é uma estalagmite alta e cônica, amarelo-creme, em
        camadas de calcário com escorridos como cera de vela derretida; pé largo, branco e úmido de gosma
        grossa; quatro tentáculos curtos à frente; atrás, um rastro de pedra clara com picaretas e uma
        lanterna anã presas de cabo para fora.
      composicao: >-
        Câmara do Reino com o teto cheio de estalactites pingando; o caramujo entre estalagmites de verdade;
        um explorador puxa com as duas mãos uma espada presa numa crosta clara no flanco do bicho, dando a
        escala. Luz de lanterna refletida na água, tons creme, ocre e cinza.
      evitar: >-
        Lagarto de olhar que petrifica, serpente coroada, jardim de estátuas. Não há olhar nem magia: é
        pedra que cresce, depressa, de uma gosma.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  # ---- slot genérico reinventado: enemy_morcego_vampiro ----
  - id: enemy_morcego_vampiro
    vaga: 10
    nome: Lenço do Desfiladeiro
    status: reinventada
    substitui: enemy_morcego_vampiro
    ataques: ["Abraço na Cara"]
    acoes:
      - Sozinho, solta-se e vai embora com o vento.
      - Ferido, desgruda da cara e some na corrente de ar.
      - Desce na cara de quem está na beira mais estreita da trilha.
      - Dança no vento sobre a trilha até alguém olhar para cima.
    substitui_generico: Morcego Vampiro Gigante
    familia: besta_entropia
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/daily_life.txt:222", "lore_nova/locations.txt:355"]
    anatomia:
      plano_corporal: alado
      material: couro_tecido
      escala: pequena
      locomocao: plana_voa
      percepcao: respiracao
      texto: >-
        Um bicho chato e comprido como um cachecol, de couro fino da cor de neve suja, que vive no vento dos
        desfiladeiros. Não tem asas: o corpo inteiro é uma membrana com uma fileira de mãozinhas de três
        dedos ao longo das duas bordas, que se agarram em pano e em pele. A cabeça é só uma boca redonda e
        mole numa das pontas, que se encaixa sobre os olhos e o nariz da presa e a deixa cega. As mãozinhas
        das bordas puxam a cabeça para o lado do vento.
    silhueta: Um pano comprido e claro dançando no vento sobre a trilha, sem ninguém segurando.
    comportamento: >-
      Voa nas correntes dos desfiladeiros como um trapo perdido. Desce sobre o rosto de quem está na beira
      da trilha, gruda as bordas nas orelhas e no pescoço e cobre os olhos, e as mãozinhas puxam a cabeça
      para o lado do vento. Quem anda cego numa trilha de dois pés de largura cai.
    papel_tatico: emboscador
    arquetipo: covarde_oportunista
    categoria: lacaio
    faccao: null
    mecanica_assinatura:
      carta: cri_lenco_do_desfiladeiro_venda_na_beira
      frase: >-
        Cobre os olhos de quem está na trilha: quem estiver coberto e atacar ou se mover na rodada arrisca
        cair, perdendo a rodada e levando a queda; quem fica parado perde só a ação.
    contra_jogo: Ficar parado e deixar um companheiro arrancá-lo pela ponta sem cabeça; andar amarrado em corda tira o risco da queda; fogo o faz soltar na hora.
    gancho: >-
      Nas passagens, o fôlego é dinheiro e a trilha tem dois pés de largura; há bichos que vivem de quem
      cai dela.
    habitat: [montanhas_afiadas, ma_saidas_baixas]
    inspiracao:
      - fonte: bestiários de jogos de fantasia (a "capa" voadora que envolve a vítima)
        referencia: "o monstro-manto de RPG de mesa que se enrola na cabeça da vítima"
        tomou: o pano vivo que cobre o rosto
        distancia: não é arraia nem manto escuro de masmorra; é uma faixa de couro com mãos nas bordas que vive do vento das trilhas e mata pela queda, sem morder nem drenar
    padrao: [ataque, mover]
    a_cada_n: 2
    telegrafo: "{nome} baixa no vento, e as bordas se abrem como dedos sobre os olhos de quem está na beira."
    description: Bicho chato como um cachecol, de bordas cheias de mãozinhas, que desce no vento sobre os olhos de quem está na beira da trilha para que caia.
    perigo: Baixo
    lore: >-
      No alto das passagens a trilha tem dois pés de largura e o vento nunca para. Os Lenços vivem nele.
      Parecem trapos perdidos até descerem sobre o rosto de alguém na beira: as mãozinhas das bordas se
      agarram nas orelhas e no pescoço, a ponta mole cobre os olhos, e o resto puxa a cabeça para o lado
      do vento. Não mordem. Comem embaixo, depois. Os guias Cinzéus mandam quem foi coberto ficar parado e
      esperar, e quem não obedece não é visto de novo.
    aparencia: >-
      Bicho chato e comprido como um cachecol de couro fino cor de neve suja, uma fileira de mãozinhas de
      três dedos ao longo das duas bordas, uma boca redonda e mole numa das pontas; dança no vento.
    como_se_luta: >-
      Cobre os olhos de quem está na trilha, e quem ataca ou anda coberto pode cair. Ficar parado e deixar
      um companheiro arrancá-lo; corda amarrada tira o risco.
    related_entities: [montanhas_afiadas, ma_saidas_baixas]
    arte:
      visual: >-
        Criatura plana e longa como um cachecol de dois metros, couro fino e translúcido, cinza-claro como
        neve suja; ao longo das duas bordas, dezenas de mãozinhas pálidas de três dedos, abertas; numa das
        pontas, uma boca redonda, mole, como uma ventosa sem dentes. Sem olhos, sem asas, sem ossos à vista.
      composicao: >-
        Trilha de dois pés de largura num paredão sobre o vazio; o Lenço colado ao rosto de um viajante que
        tateia a parede com uma mão, as mãozinhas puxando o capuz para o lado do abismo; atrás dele, um guia
        agarra a ponta solta do bicho, dando a escala. Neve soprada, céu branco.
      evitar: >-
        Morcego, fantasma de pano, arraia voadora, manto escuro de masmorra. Não tem asas nem dentes: é uma
        faixa de couro com mãos na borda que cega e deixa o vento fazer o resto.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_bexiga_de_respiro
