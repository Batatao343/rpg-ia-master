  # ======================= CORPOS REESCRITOS (Reescritos) =======================
  - id: mon_deitado_na_parede
    vaga: 1
    nome: Deitado na Parede
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/creatures.txt:306", "lore_nova/locations.txt:370"]
    anatomia:
      plano_corporal: bipede_ereto
      material: carne_exposta
      escala: humana
      locomocao: escala_paredes
      percepcao: som
      texto: >-
        Um explorador que dormiu numa câmara onde o peso puxa de lado e acordou pertencendo a ela. O
        corpo inteiro cai para a esquerda: o cabelo, a barba e as alças da mochila pendem de lado, e o
        sangue juntou no flanco esquerdo, roxo e inchado. Os músculos do lado de baixo engrossaram como
        cabo de navio para segurar o corpo na parede; os do lado de cima secaram até a pele colar nas
        costelas. Vive tombado contra a parede, pendurado de lado como roupa num prego torto, com os dedos das mãos abertos em garra contra a pedra.
    silhueta: Um corpo tombado de lado contra a parede, como roupa pendurada num prego torto, com o cabelo, os braços e a mochila caindo para o mesmo lado.
    comportamento: >-
      Espera nas paredes das câmaras idênticas, tombado de lado, e quem entra olhando para a
      frente não o vê. Cai sobre o viajante de lado, como uma porta que se abre, e volta para a parede
      quando é ferido. No chão é lento e torto, e sabe disso.
    papel_tatico: emboscador
    arquetipo: emboscador
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: cri_deitado_na_parede_queda_de_lado
      frase: >-
        Ataca saindo da parede, pelo lado que a guarda não cobre; enquanto está na parede, quem luta
        de frente não o alcança.
    contra_jogo: Tirá-lo da parede; derrubado no chão, o peso dele puxa para o lado errado e ele não consegue se levantar.
    gancho: >-
      Os guias Cinzéus contam nos dedos as câmaras onde cair é cair para o lado; quem dorme numa delas
      acorda torto, e alguns nunca mais acham o chão.
    habitat: [ma_boca, montanhas_afiadas]
    inspiracao: []
    padrao: [mover, ataque]
    a_cada_n: 3
    telegrafo: "{nome} desce um pé da parede e inclina o corpo inteiro para o lado de quem passa."
    description: Um explorador que dormiu numa câmara de peso torto e acordou caindo para o lado; anda pelas paredes do Reino e ataca de onde ninguém olha.
    perigo: Médio
    lore: >-
      Abaixo da Boca há câmaras em que o peso não puxa para baixo, e os guias Cinzéus as contam nos
      dedos para não entrar nelas. Quem dorme numa dessas câmaras acorda pertencendo a ela. O corpo
      inteiro passa a cair para um lado: o cabelo pende de lado, o sangue junta num flanco, e os
      músculos de baixo engrossam para segurar o resto na parede. Os Deitados vivem tombados nas paredes das câmaras idênticas, como roupa pendurada de lado. No chão, coitados, não sabem ficar de pé.
    aparencia: >-
      Explorador humano tombado de lado contra uma parede, pendurado como roupa num prego torto; cabelo, barba, mochila e roupa
      pendendo de lado; flanco esquerdo roxo de sangue acumulado e músculos grossos como cabo; o lado
      de cima seco, pele colada às costelas; dedos abertos em garra contra a pedra.
    como_se_luta: >-
      Sai da parede e golpeia pelo lado que a guarda não cobre, e volta para a parede quando ferido.
      Derrubado no chão, não consegue se levantar.
    related_entities: [ma_boca, montanhas_afiadas]
    arte:
      visual: >-
        Homem adulto magro em roupa de explorador gasta, tombado de lado contra uma parede vertical, pendurado como roupa num prego torto.
        Tudo nele cai para o mesmo lado da imagem: cabelo comprido, barba, alças da mochila, a capa.
        Assimetria forte: o lado de baixo do corpo com músculos inchados e roxos de sangue acumulado, o
        de cima seco, pele colada às costelas. Dedos das mãos abertos contra a pedra, rosto calmo.
      composicao: >-
        Câmara anã polida, igual às outras em sequência ao fundo; o Deitado na parede da direita,
        horizontal para quem olha; no chão, um viajante com lanterna, de costas para ele, dá a escala
        e a tensão. Luz baixa de lanterna, sombras compridas que caem para o lado errado.
      evitar: >-
        Contorcionista de terror, aranha humana de membros quebrados, fantasma flutuando. Não flutua
        nem se dobra; está de pé, normal, só que para o lado.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_geodo_da_praga
    vaga: 2
    nome: Geodo da Praga
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: praga_ferro
      detalhe: null
      refs: ["lore_nova/timeline_completa.txt:394", "lore_nova/creatures.txt:356"]
    anatomia:
      plano_corporal: bipede_curvado
      material: vidro_cristal
      escala: humana
      locomocao: anda
      percepcao: calor
      texto: >-
        Um refugiado do Anel de Lama que atravessou as passagens com a Praga de Ferro no sangue. No frio
        do alto, o ferro do sangue não enferrujou: cristalizou. Debaixo da pele dos braços e dos punhos
        crescem nós duros do tamanho de um ovo, e perto do fogo eles incham e amadurecem. Maduro, ele
        parte o nó com os dentes ou contra uma pedra, e a pele do punho se abre numa cavidade forrada de
        cristais vermelho-escuros, pontudos e cortantes. Anda curvado sobre as mãos, com os punhos
        abertos em cacos e os dedos tortos para não se cortar.
    silhueta: Um homem curvado sobre as próprias mãos, de punhos inchados e abertos em cacos vermelhos como uma romã partida.
    comportamento: >-
      Vive nas Saídas Baixas com os outros fugidos, sempre colado a uma fogueira, porque o calor
      amadurece os nós. Quando briga, parte um nó por vez e soca com a cavidade de cristal; quanto mais
      tempo a luta dura perto do fogo, mais punhos de caco ele tem.
    papel_tatico: bruto_de_linha
    arquetipo: covarde_oportunista
    categoria: lacaio
    faccao: null
    mecanica_assinatura:
      carta: cri_geodo_da_praga_no_maduro
      frase: >-
        Perto de calor, um nó amadurece por rodada; ele parte o nó e soca com a cavidade de cristal, e o
        golpe cresce com o número de nós abertos.
    contra_jogo: "Golpear o nó que está inchando antes que amadureça: partido verde, ele só sangra e não vira caco; quem o parte assim tira dele um punho."
    gancho: >-
      Gente do Anel de Lama atravessa as Montanhas fugindo da Praga de Ferro; no frio do alto, o ferro
      do sangue não vira ferrugem, vira pedra, e o fogo a faz crescer.
    habitat: [ma_saidas_baixas, montanhas_afiadas]
    inspiracao:
      - fonte: geologia (geodos)
        referencia: "geodos e drusas, pedras ocas que, partidas, mostram uma cavidade forrada de cristais"
        tomou: o nódulo redondo que, rachado, mostra cristais por dentro
        distancia: só a forma do nódulo; a causa (a Praga de Ferro no frio), o amadurecer no fogo e o soco de caco são de Valoria
    padrao: [reforco_proprio, ataque, ataque]
    a_cada_n: 4
    telegrafo: "{nome} morde um nó do próprio punho até ele estalar, e cacos vermelhos aparecem na carne."
    description: Refugiado da Praga de Ferro em quem o ferro do sangue, no frio das passagens, virou nós de cristal; perto do fogo eles amadurecem e ele soca com os cacos.
    perigo: Baixo
    lore: >-
      A Praga de Ferro mineraliza o sangue, e em Nova Arcádia isso é ferrugem. Os doentes que fogem
      pelas Montanhas descobrem outra coisa: no frio do alto, o ferro cristaliza em nós redondos sob a
      pele dos braços, e perto do fogo os nós incham e amadurecem. Maduros, eles os partem, e o punho
      vira uma cavidade de cristal vermelho que corta como vidro de janela. Os Goblins compram os nós dos
      mortos. Os vivos não saem de perto das fogueiras, e quem os encontra ali encontra os punhos já
      abertos.
    aparencia: >-
      Homem magro e curvado em trapos de refugiado, braços cobertos de nós duros do tamanho de um ovo
      sob a pele; os punhos partidos abertos em cavidades forradas de cristais vermelho-escuros pontudos,
      como romãs; dedos tortos afastados dos cacos.
    como_se_luta: >-
      Perto do fogo, parte um nó por rodada e soca com o punho de cristal, cada vez mais forte. Tirá-lo
      do calor ou apagar a fogueira o deixa sem nós maduros.
    related_entities: [ma_saidas_baixas, montanhas_afiadas]
    arte:
      visual: >-
        Homem adulto esquelético em trapos de lã, curvado; sob a pele dos antebraços, nódulos redondos e
        duros como ovos de pedra, alguns inchados e brilhantes de calor; os dois punhos partidos, a pele
        aberta numa cavidade forrada de cristais vermelho-escuros pontudos, como geodos ou romãs
        quebradas; os dedos tortos, afastados dos cacos. Olhos fundos de febre.
      composicao: >-
        Fogueira de fugitivos nas Saídas Baixas, neve suja em volta; o Geodo agachado junto ao fogo,
        mordendo um nó do braço; um viajante de capa de pé do outro lado da fogueira, da mesma altura, dá
        a escala. Luz laranja do fogo de baixo; o vermelho dos cristais é o ponto mais quente.
      evitar: >-
        Homem de pedra inteiro, homem de lava, cristais em neon, explosão. É um doente magro que faz arma
        da própria doença.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_cauda_de_atalaia
    vaga: 3
    nome: Cauda de Atalaia
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: eter
      detalhe: null
      refs: ["lore_nova/races.txt:217", "lore_nova/races.txt:230"]
    anatomia:
      plano_corporal: bipede_ereto
      material: osso
      escala: humana
      locomocao: ancorada
      percepcao: vibracao
      texto: >-
        O corpo de um guerreiro Cinzéu morto nas passagens na guerra contra os Anões, que o frio e o
        Éter não deixaram ir embora. O tronco secou até a pele cinzenta colar nas costelas, e os três
        dedos de cada mão endureceram em ganchos. A cauda, que em vida tinha osso só na ponta, não parou
        de crescer: são séculos de osso novo, cinco metros de chicote branco e nu, enrolado três vezes
        numa ponta de rocha. Pendurado por ela de cabeça para baixo sobre a trilha, o corpo balança
        devagar no vento.
    silhueta: Um corpo pendurado de cabeça para baixo numa ponta de pedra, preso por uma corda branca e comprida que é dele.
    comportamento: >-
      Fica pendurado nos penhascos sobre as trilhas mais estreitas, imóvel por dias, como os Cinzéus
      vivos ficam. Quando alguém passa embaixo, desenrola duas voltas da cauda e açoita de cima, de um
      alcance que ninguém espera. Não desce: a cauda está presa à rocha, e ele também.
    papel_tatico: artilharia
    arquetipo: guardiao
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: cri_cauda_de_atalaia_acoite_do_alto
      frase: >-
        Açoita de cima, pendurado pela própria cauda, de uma distância que só ele alcança; quem está na
        trilha embaixo não tem como devolver o golpe.
    contra_jogo: Subir até a ponta de pedra e cortar a cauda na volta que a prende, ou passar fora da trilha, rente ao paredão.
    gancho: >-
      Os Cinzéus atravessaram as passagens dos Anões porque não recuavam quando feridos; alguns dos que
      morreram nelas ainda não recuaram.
    habitat: [montanhas_afiadas]
    inspiracao: []
    padrao: [ataque, enfraquecer, ataque]
    a_cada_n: 2
    telegrafo: "{nome} solta duas voltas da cauda e o corpo seco desce um palmo sobre a trilha."
    description: O corpo seco de um guerreiro Cinzéu da guerra das passagens, pendurado de cabeça para baixo pela cauda de osso que não parou de crescer.
    perigo: Médio
    lore: >-
      Na Era 4 os Cinzéus tomaram as passagens dos Anões porque não recuavam quando feridos. Os que
      morreram nelas ficaram no frio, e o frio e o Éter guardaram o que devia ter ido embora. A cauda,
      que nos Cinzéus vivos tem osso na ponta, continuou crescendo nos mortos por séculos. Hoje há
      corpos secos pendurados de cabeça para baixo nos penhascos sobre as trilhas, presos pela própria
      cauda a uma ponta de rocha. Os guias Cinzéus passam por baixo deles sem olhar para cima.
    aparencia: >-
      Corpo seco de Cinzéu de pele cinzenta colada às costelas, três dedos endurecidos em ganchos,
      pendurado de cabeça para baixo por uma cauda de osso nu de cinco metros enrolada numa ponta de
      rocha; balança no vento sobre a trilha.
    como_se_luta: >-
      Açoita de cima com a cauda, de um alcance que ninguém espera, e não desce. Cortar a cauda na volta
      que a prende à pedra, ou passar rente ao paredão.
    related_entities: [montanhas_afiadas]
    arte:
      visual: >-
        Cadáver seco de um Cinzéu (humanoide esguio, pele cinzenta, três dedos por mão) pendurado de
        cabeça para baixo, braços caídos com os dedos em gancho; restos de uma armadura de couro antiga.
        A cauda é um chicote longo de osso branco e nu, segmentado, que sobe cinco metros e dá três
        voltas numa ponta de rocha. Vento puxando o que sobrou da roupa.
      composicao: >-
        Penhasco vertical sobre uma trilha de dois pés de largura com neve; o corpo pende acima da
        trilha, uma volta da cauda desenrolando; embaixo, um guia com uma corda no ombro passa de cabeça
        baixa, dando a escala. Céu branco-azulado, rocha cinza-ardósia.
      evitar: >-
        Diabo de cauda pontuda, enforcado em corda, colar de vértebras solto. A cauda nasce do corpo e
        prende o corpo à rocha; é a única coisa viva nele.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_queimado_de_frio
    vaga: 4
    nome: Queimado de Frio
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/locations.txt:355", "lore_nova/locations.txt:360"]
    anatomia:
      plano_corporal: bipede_curvado
      material: cera_sebo
      escala: humana
      locomocao: rasteja
      percepcao: calor
      texto: >-
        Um viajante que a geada pegou na subida e não terminou de matar. A pele inteira ficou branca,
        cerosa e translúcida, e por baixo dela vê-se o azul das veias paradas. Bolhas grandes de líquido
        turvo cobrem as mãos, os pés, o rosto e os joelhos, e algumas pendem como uvas. Os cílios, a
        barba e os cabelos estão presos num bloco de gelo que não derrete, e só as pontas dos dedos são
        pretas. Rasteja de joelhos e cotovelos, devagar, com o corpo duro de frio.
    silhueta: Uma figura branca e cerosa de quatro na neve, com a barba presa num bloco de gelo e bolhas penduradas nas mãos.
    comportamento: >-
      Rasteja pela neve atrás de quem descansa, de quem se agacha junto ao fogo, de quem para. Não
      alcança quem anda. Quando chega, agarra as pernas de quem está parado, e o frio do corpo dele entra nas juntas da vítima até ela não conseguir erguer a guarda.
    papel_tatico: controlador
    arquetipo: morto_vivo_implacavel
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: cri_queimado_de_frio_abraco_de_quem_para
      frase: "Pune quem para: quem se defende ou espera na rodada tem as pernas agarradas e endurece de frio, e na rodada seguinte não pode jogar Carta de defesa nem de Reação; quem se move não é alcançado."
    contra_jogo: Não parar perto dele e não se defender parado; quem se mexe o deixa para trás, e as bolhas estouram com fogo.
    gancho: >-
      O clima das passagens mata quem sobe sem equipamento e quem para para descansar; com alguns, a
      geada começou o serviço e o Abismo não deixou que terminasse.
    habitat: [montanhas_afiadas]
    inspiracao:
      - fonte: medicina (geladura)
        referencia: "a geladura profunda, com pele branca e cerosa, bolhas de líquido turvo e pontas dos dedos pretas"
        tomou: a pele cerosa e as bolhas de quem foi pego pelo frio
        distancia: só o aspecto do ferimento; o que segue vivo e caça quem para é o Abismo das passagens
    padrao: [enfraquecer, ataque]
    a_cada_n: 3
    telegrafo: "{nome} se arrasta até os pés de quem está parado e estende as mãos brancas devagar."
    description: Um viajante que a geada começou a matar e não terminou; branco, ceroso e cheio de bolhas, rasteja atrás de quem para e o congela num abraço.
    perigo: Médio
    lore: >-
      Nas passagens altas o frio mata quem não tem equipamento e, mais ainda, quem para. Os guias Cinzéus
      não deixam ninguém sentar na subida. Alguns dos que sentaram não terminaram de morrer: ficaram
      brancos e cerosos, de bolhas nas mãos e no rosto e a barba presa num bloco de gelo. Esses rastejam
      pela neve atrás de quem descansa e agarram as pernas. Quem anda os deixa para trás. Quem para,
      endurece.
    aparencia: >-
      Viajante humano de quatro na neve, pele branca, cerosa e translúcida com veias azuis paradas, bolhas
      grandes de líquido turvo nas mãos, pés, rosto e joelhos, cílios e barba presos num bloco de gelo,
      só as pontas dos dedos pretas.
    como_se_luta: >-
      Agarra as pernas de quem se defende ou espera parado, e a vítima endurece de frio e não ergue a guarda na rodada seguinte. Não
      parar perto dele; fogo estoura as bolhas.
    related_entities: [montanhas_afiadas]
    arte:
      visual: >-
        Humano adulto de quatro na neve funda, restos de casaco de lã; pele inteira branca, cerosa e meio
        translúcida, veias azuladas por baixo; bolhas grandes e turvas nas mãos, nos joelhos e no rosto,
        algumas pendendo; barba, cílios e cabelo presos num bloco irregular de gelo; só as pontas dos dedos
        pretas. Olhos abertos, calmos.
      composicao: >-
        Passo alto com neve batida e um marco de pedras empilhadas; dois viajantes sentados encostados no
        marco, descansando; o Queimado rastejando na direção deles, já perto, enquanto um terceiro, de pé,
        segue andando sem ver; os viajantes dão a escala. Luz azul fria, crepúsculo.
      evitar: >-
        Homem de gelo azul brilhante, morto-vivo verde apodrecido, cadáver enfaixado, placas de carvão. É
        carne viva sob pele cerosa de frio, com bolhas, sem podridão.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

