# SPEC-349 — Ficha de identidade da onda 12: Ophidia (spec-filha a reservar pelo coordenador, D8).
# Fonte única da identidade de cada criatura (R5). Codex, doc de arte e `appearance` do
# bestiário são GERADOS daqui por scripts/bestiario/gerar_docs.py; os números (Etapa 5) não.
# Eixos antes da prosa (R8): o tabuleiro `vagas:` passou em U2/U3/U12 antes de qualquer texto.
# Refs de lore: linhas da lore da SPEC-348 (main 821d17c3), mesma convenção das ondas 1 e 2;
# só refs que também resolvem no worktree (o gate confere existência e número de linha).
# Ophidia tem um nó só (`ophidia`, perigo 4). A lore pede mistério ("o horror é não ter
# resposta", creatures.txt:1624): toda criatura é de carne e luta, mas o que se SABE dela vem de
# luneta, de segunda mão, de mapa contraditório ou de quem vende. Nenhum texto público explica o
# veneno (segredo E-14, secrets.txt); só o boato público (rumors.txt:253) e o "pagam mais por quem
# está doente", que a própria lore libera como uso sem revelar.
regiao: ophidia
onda: 12
spec: SPEC-349
nome_regiao: Ophidia
habitat_nome:
  ophidia: Arquipélago de Ophidia
paleta: >-
  **Ophidia** — arquipélago vulcânico no oceano oeste, visto do mar e de Brekmar: basalto preto
  molhado, areia vulcânica preta e quente, pedra-pomes cinza, água verde-garrafa que solta vapor
  rente perto das ilhas, mar aberto cinza-chumbo. A fumaça dos vulcões é sempre de uma cor errada:
  amarelo que não é enxofre, um vermelho que não é fogo, um magenta-esverdeado que o olho não
  consegue fixar (pintar com leve aberração cromática, nunca como neon). Luz oblíqua de fim de
  tarde vinda do oeste; à noite, só lanternas de barco.
familias_em_jogo:            # D10 — mesmos nomes das ondas 1 e 2 (story_corpos_do_abismo.md)
  corpo_reescrito: Reescrito
  besta_entropia: Besta Torta
  humanoide_preco: Cobrado
  demonio_encarnado: Cria de Apetite
