      frase: >-
        A pele curtida pela turfa é dura como couro fervido: a lâmina escorrega e o corte não abre
        Ferimento; só a pancada o amassa.
    contra_jogo: Pancada, não lâmina; sem ossos que o sustentem, depois de amassado ele não se levanta.
    gancho: >-
      A Guilda dos Corvos recolheu sete corpos que deitaram na lama da borda e não se levantaram; os que
      ninguém recolheu ficaram na turfa, e a turfa não deixa apodrecer.
    habitat: [pantano_melancolia, pm_profundezas]
    inspiracao:
      - fonte: arqueologia (corpos de turfeira)
        referencia: "Homem de Tollund e Homem de Grauballe: a turfa ácida curte a pele e dissolve os ossos"
        tomou: a pele curtida e escura, os ossos amolecidos, o cabelo ruivo de turfa
        distancia: não é sacrifício ritual nem múmia de museu; é o efeito do Pântano em quem se deitou, e ele anda e luta
    padrao: [defesa, ataque]
