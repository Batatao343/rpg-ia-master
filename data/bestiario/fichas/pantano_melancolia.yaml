    telegrafo: "{nome} se dobra sobre si mesmo como um saco e endurece as costas."
    description: Um corpo que deitou na borda do Pântano e foi curtido pela turfa, de pele dura como couro de sela e sem ossos, que rasteja atrás de quem respira.
    perigo: Baixo
    lore: >-
      A Guilda dos Corvos recolheu sete corpos na borda do Pântano, de gente que deitou na lama por
      vontade própria e não se levantou. Os que ninguém recolhe afundam na turfa, e a turfa não deixa
      apodrecer: curte a pele como couro e amolece os ossos até sumirem. Anos depois, alguns se arrastam
      atrás do fôlego de quem passa, dobrando-se como sacos. Têm a cara de quem dorme. Lâmina não os
      corta; os druidas os afastam com o cabo da pá.
    aparencia: >-
      Corpo humano de pele curtida em couro marrom-escuro brilhante como sela velha, sem ossos, dobrando
      em qualquer ponto, rosto achatado de traços apertados de quem dorme, cabelo ruivo de turfa, um
      cordão de amuleto no pescoço.
    como_se_luta: >-
      Lâmina escorrega na pele curtida e não abre Ferimento; pancada o amassa, e amassado ele não se
      levanta.
    related_entities: [pantano_melancolia, pm_profundezas]
    arte:
      visual: >-
        Corpo humano adulto de pele inteiramente curtida, marrom-escura e lustrosa como couro de sela, com
        dobras e vincos profundos; sem rigidez de ossos: tronco dobrado em ângulo impossível, braços
        moles; rosto achatado de lado, olhos fechados, expressão de sono; cabelo ralo ruivo-alaranjado;
        um cordão de amuleto de couro em volta do pescoço. Sem roupa além de um cinto de couro.
      composicao: >-
