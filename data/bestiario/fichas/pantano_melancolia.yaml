        desdobrando de dentro de um buraco de corte de turfa na direção de um cortador de turfa com uma
        pá, do mesmo tamanho; a pá erguida de cabo. Luz cinza baixa, névoa, tons de marrom e ferrugem.
      evitar: Zumbi verde apodrecido, múmia de faixas, esqueleto. Não há osso nem podridão à vista; é couro inteiro e mole.
