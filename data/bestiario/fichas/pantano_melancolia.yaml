paleta: >-
  **Pântano da Melancolia** — pradaria afundada da batalha final contra Malagor: água oleosa que
  reflete arco-íris sujo, névoa baixa que sabe a ferro e fungo, turfa escura, estacas de medição
  dos druidas, décadas de armaduras e estandartes da coalizão sob a lama. Luz e paleta: verde-oliva
  doente, cinza-lodo, névoa leitosa, pontos de Éter azul-pálido; violeta e verde-cobre da podridão
  bonita nas Profundezas; branco frio de água parada na Cripta.
