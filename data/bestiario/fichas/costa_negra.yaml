# bestiário são GERADOS daqui por scripts/bestiario/gerar_docs.py; os números (Etapa 5) não.
# Eixos antes da prosa (R8): o tabuleiro `vagas:` passou em U2/U3/U12 antes de qualquer texto.
# Refs de lore: linhas da lore da main (pós-SPEC-348), mesma convenção das ondas 1 e 2.
