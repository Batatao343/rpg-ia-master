nome_regiao: Costa Negra
habitat_nome:
  costa_negra: Cemitério de Leviatãs
  cn_o_trono: O Trono
paleta: >-
  **Costa Negra** — quilômetros de praia escura sob ossadas de leviatãs do tamanho de castelos:
  costelas em arcos de vinte metros, crânios com câmaras do tamanho de casas, vértebras que viraram
  colinas; maré baixa que deixa poças oleosas entre os ossos, névoa de Éter perto das carcaças
  velhas, Ophidia fumegando no horizonte. Luz e paleta: branco-osso queimado de sol, areia
  negra-úmida, cinza-âmbar, amarelo sujo de óleo de leviatã e banha, verde-azulado frio do Éter nos
  canais dos ossos; dentro do Trono, escuro rosado de carne velha e um pulso de luz baixa.
