nome_regiao: Selva de Xylos
habitat_nome:
  selva_xylos: Selva de Xylos
  sx_cidades_hospedeiros: Cidades nas Copas
  sx_profundezas: Profundezas de Morrakh
paleta: >-
  **Selva de Xylos** — selva de ciclo acelerado no leste, além da Floresta dos Sussurros: árvores
  gigantes com cidades suspensas nas copas, pontes de madeira e cipó tratado, plataformas de quitina,
  fungos que brilham fraco, chão ácido que incorpora o que para, fruta que amadurece e apodrece numa
  hora. Abaixo do chão, as câmaras de raízes de Morrakh, onde a luz nunca chegou. Luz e paleta: verde
  saturado e úmido, ocre de podridão doce, coral e âmbar dos fungos dos Hospedeiros, dourado filtrado
  pelas copas; nas Profundezas, preto molhado, branco de fungo morto e pulsos de luz negra.
