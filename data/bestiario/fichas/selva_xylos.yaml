        Corpo longo e baixo do tamanho de uma carroça, couro de várias cores rasgado, carne vermelha à mostra
        nas emendas. Pernas de animais diferentes saindo de todos os lados: cascos de anta, patas finas de
        veado, cascos de queixada, patas de onça, todas em plena corrida em direções diferentes. Uma cabeça
        de veado numa ponta e uma de anta na outra, ambas viradas para trás, olhos brancos de pânico.
      composicao: >-
        Trilha larga de saída da selva, chão revolvido de cascos, carcaças pisoteadas nas margens; o Tropel
        atravessando o quadro em diagonal, poeira e folhas; um Hospedeiro firme de lado, de tamanho humano,
        segurando um garimpeiro pelo braço para não correr. Luz verde e dourada, borrão nas pernas.
      evitar: Centauro, quimera de partes de leão e bode, monstro de muitas pernas de aranha. São bichos da selva costurados por medo, em pânico, não um predador.
