    description: Um corpo do tamanho de uma carroça feito dos bichos pisoteados na fuga do fundo da selva, com pernas de vários animais correndo para lados diferentes, nascido do desespero.
    perigo: Alto
    lore: >-
      A selva está recuando de alguma coisa que vem do fundo, e os bichos fogem primeiro. Nas trilhas de
      saída os que caem são pisoteados pelos que vêm atrás. O demônio do desespero passa por essas trilhas,
      e o que ele deixa toma carne dos pisoteados: um corpo só, de pernas de muitos bichos, que corre para
      todos os lados e não chega a nenhum. Quem o vê sente vontade de correr junto. Os garimpeiros que
      correram não voltaram.
    aparencia: >-
      Corpo comprido do tamanho de uma carroça, couro rasgado e carne aberta, pernas de anta, de veado, de
      queixada e de onça saindo de todos os lados em direções diferentes, uma cabeça de bicho diferente em
      cada ponta, as duas viradas para trás.
    como_se_luta: >-
