paleta: >-
  **Deserto de Zhur** — o Mar de Vidro: centenas de léguas de areia que a lua derreteu e o tempo
  não esfriou, dunas de vidro fosco, cristais que afloram como dentes, ruínas presas dentro das
  camadas. Movimento só à noite. Luz e paleta: azul-noite e prata fria de lua sobre vidro,
  âmbar-cobre de brasa no horizonte ao amanhecer, ocre de couro de lagarto, preto lustroso de
  obsidiana, violeta de Cristal-de-Urath; na Borda do Vazio, cinza sem sombra e nenhuma estrela
  abaixo da linha do chão.
