    anatomia:
      plano_corporal: alado
      material: couro_tecido
      escala: pequena
      locomocao: escala_paredes
      percepcao: som
      texto: >-
        Um morcego do tamanho de um gato que o silêncio da floresta fez ouvir demais. As orelhas
        cresceram mais que as asas: duas conchas de pele fina e rosada, cada uma do tamanho da cabeça de
        um homem, que ele carrega dobradas sobre as costas. Com esse peso não voa direito; anda no chão e
        sobe nos troncos apoiado nos punhos das asas dobradas e nos pés de unhas curvas. O focinho é
        achatado, de dentes finos e muitos.
    silhueta: Um bicho pequeno andando de quatro sobre os cotovelos, com duas orelhas enormes erguidas como velas.
    comportamento: >-
      Vivem em bando nos ocos altos e descem quando o silêncio se quebra. Estalam a língua sem parar e
      seguem o som de volta até quem fez o barulho. Mordem pouco: grudam no mais barulhento e estalam
      alto, e o resto da floresta vem atrás desse estalo.
    papel_tatico: perseguidor_marca
    arquetipo: covarde_oportunista
    categoria: lacaio
    faccao: null
    mecanica_assinatura:
      carta: cri_morcego_rasteiro_estalo_que_aponta
      frase: >-
        Gruda em quem fez mais barulho e o marca com o estalo: enquanto estiver grudado, os golpes das
        outras criaturas acham esse herói primeiro.
    contra_jogo: Arrancar e matar o que está grudado antes que o resto chegue; ou lutar em silêncio, sem metal batendo, e ele não acha quem marcar.
    gancho: >-
      A floresta alterna silêncio total e ruídos curtos e fortes; os bichos que ouvem nesse silêncio
      ouviram tanto que o corpo virou orelha.
    habitat: [floresta_sussurros]
    inspiracao:
      - fonte: zoologia (morcegos)
        referencia: "Desmodus rotundus, que anda e salta no chão apoiado nos punhos; Plecotus, de orelhas quase do tamanho do corpo"
        tomou: o andar sobre os punhos e as orelhas desproporcionais
        distancia: não bebe sangue nem voa bem; o que faz é marcar o barulhento para as outras criaturas da floresta
    padrao: [enfraquecer, mover]
    a_cada_n: 2
    telegrafo: "{nome} abre as orelhas por inteiro e para de estalar; tudo fica quieto um instante."
    description: Um morcego de orelhas maiores que as asas, que anda nos punhos, gruda no mais barulhento e estala até o resto da floresta vir.
    perigo: Baixo
    lore: >-
      A floresta passa horas em silêncio total e depois solta um ruído curto e forte, e os bichos que
      vivem nela aprenderam a ouvir esse silêncio. Os morcegos dos ocos altos ouviram tanto que as
      orelhas cresceram mais que as asas, e já não voam direito: descem os troncos de punho em punho.
      Grudam em quem fez barulho e estalam sem parar, e o que vem atrás desse estalo é pior que eles.
      Caçadores andam com o arco envolto em pano.
    aparencia: >-
      Morcego do tamanho de um gato, orelhas de pele fina rosada do tamanho de uma cabeça humana dobradas
      sobre as costas, asas pequenas dobradas usadas como patas, focinho achatado de dentes finos e
      muitos, pelo marrom curto.
    como_se_luta: >-
      Gruda em quem fez mais barulho e o marca para as outras criaturas; arrancar e matar o que está
      grudado primeiro, ou lutar sem metal batendo.
    related_entities: [floresta_sussurros]
    arte:
      visual: >-
        Morcego terrestre do tamanho de um gato, andando de quatro sobre os punhos das asas dobradas e
        os pés, como um morcego-vampiro no chão. Orelhas desproporcionais, de pele fina rosada com veias
        visíveis, cada uma do tamanho de uma cabeça humana, erguidas como velas. Focinho curto e
        achatado, boca aberta com muitos dentes finos. Pelo marrom-escuro curto, olhos minúsculos.
      composicao: >-
        Tronco escuro vertical; quatro morcegos descendo de cabeça para baixo; um deles agarrado ao ombro
        de um soldado de cota de malha que leva a mão ao pescoço; o soldado, em tamanho humano, ocupa
        metade do quadro. Luz de uma tocha caída no chão.
      evitar: Vampiro, morcego gigante voando de asas abertas, gárgula. É pequeno, anda no chão, e as orelhas são o que se vê primeiro.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_besouro_do_estalo
    vaga: 10
    nome: Besouro do Estalo
    status: nova
    substitui: null
    familia: besta_entropia
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/creatures.txt:828", "lore_nova/timeline_completa.txt:146"]
    anatomia:
      plano_corporal: hexapode_ou_mais
      material: quitina
      escala: pequena
      locomocao: anda
      percepcao: calor
      texto: >-
        Um besouro do tamanho de um cão pequeno, de carapaça preta lisa e cabeça vermelha, que guarda no
        fim do ventre duas bolsas de líquido que não se misturam. Quando ameaçado, aperta as duas numa
        câmara de casca grossa na ponta do abdômen, e a mistura ferve e sai num jato quente. Nele a ordem
        das coisas cedeu: o estouro seco, como porta batida, sai da câmara antes do jato, e o vapor só cai
        no chão onde o estouro foi ouvido um bom tempo depois, como trovão ao contrário. A ponta do ventre
        gira para mirar por baixo das patas, curtas e fortes, e a carapaça das costas é queimada de
        manchas pardas de vapor que caiu nele mesmo.
    silhueta: Um besouro preto do tamanho de um cão pequeno, de traseiro erguido e virado para a frente por baixo das patas.
    comportamento: >-
      Andam em grupos pelo chão de folhas, comendo o que o resto deixa. Quando sentem o calor de alguém
      perto, viram o traseiro e estalam, e o chão em volta de quem está ali fica marcado por um círculo
      úmido. Correm. O vapor fervente cai no círculo depois, sobre quem não saiu dele.
    papel_tatico: artilharia
    arquetipo: covarde_oportunista
    categoria: lacaio
    faccao: null
    mecanica_assinatura:
      carta: cri_besouro_do_estalo_jato_fervente
      frase: >-
        O estalo chega antes do jato e marca o chão onde os heróis estão; na rodada seguinte o vapor
        fervente cai ali, em todos os que não saíram do lugar.
    contra_jogo: Sair do chão marcado assim que ouvir o estalo; virá-lo de costas expõe o ventre mole, e as bolsas se esgotam depois de alguns disparos.
    gancho: >-
      No Abismo concentrado da floresta, até o vapor de um besouro perdeu a ordem: o estouro vem primeiro
      e a queimadura depois, e os colhedores aprenderam a correr do som, não do jato.
    habitat: [floresta_sussurros, fs_fronteira_xylos]
    inspiracao:
      - fonte: zoologia (besouro-bombardeiro)
        referencia: "Brachinus, besouro que mistura dois químicos numa câmara do abdômen e dispara um jato fervente com estalo"
        tomou: a câmara de mistura, o jato fervente com estalo e a mira por baixo das patas
        distancia: o estouro que vem antes do jato e o vapor que cai depois no chão marcado são da física torta da floresta; não há fogo nem magia
    padrao: [ataque_multiplo, mover]
    a_cada_n: 2
    telegrafo: "{nome} ergue o traseiro e vira a ponta do ventre para a frente, por baixo das patas."
    description: Um besouro do tamanho de um cão pequeno cujo estouro sai antes do jato fervente, que cai depois no chão marcado.
    perigo: Médio
    lore: >-
      Há um besouro na floresta, do tamanho de um cão pequeno, que guarda no ventre dois líquidos que,
      juntos, fervem. O jato dele saiu da ordem: primeiro vem o estouro seco de porta batida e um círculo
      úmido no chão, e só depois, quando quem estava ali já se esqueceu do susto, cai o vapor fervente no
      círculo. Os colhedores aprenderam a correr do som e não do jato. Quem leva queimadura de besouro não
      conta na taverna, porque ninguém acredita que foi besouro.
    aparencia: >-
      Besouro do tamanho de um cão pequeno, carapaça preta lisa manchada de queimaduras pardas, cabeça
      vermelha, patas curtas e fortes, ponta do ventre de casca grossa que gira para mirar por baixo das
      patas.
    como_se_luta: >-
      O estalo marca o chão, e o vapor fervente cai ali depois, em quem não saiu; correr do som. De
      costas, o ventre é mole, e as bolsas se esgotam.
    related_entities: [floresta_sussurros, fs_fronteira_xylos]
    arte:
      visual: >-
        Besouro-bombardeiro gigante do tamanho de um cão pequeno, carapaça preta brilhante com manchas
        pardas de queimado, cabeça e tórax vermelho-tijolo, patas curtas e grossas. Abdômen virado para a
        frente por baixo do corpo, a ponta da câmara ainda fumegando, sem jato.
      composicao: >-
        Chão de folhas mortas, escuro; o besouro já correndo para fora do quadro; no chão, um círculo
        úmido e escuro em volta das botas de um viajante de tamanho humano, cortado na altura do joelho;
        acima do círculo, suspensa no ar, uma nuvem de vapor branco começando a descer. Luz fria.
      evitar: Besouro de fogo mágico, escaravelho dourado, inseto blindado de guerra. O jato é vapor fervente, não chama, e a imagem mostra o vapor caindo depois do besouro ter ido embora.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

