      - "Dorme de pé no caminho antigo e puxa para o peito quem passa na frente, usando-o de escudo; ferido, não foge, só acorda mais devagar."
      - "Anda dormindo o caminho por onde pastava e engancha o que estiver na frente."
    substitui_generico: Ent que Sonha Acordado
    familia: besta_entropia
    origem_lore:
      fonte: outro
      detalhe: null
      refs: ["lore_nova/timeline_completa.txt:146", "lore_nova/creatures.txt:921"]
    anatomia:
      plano_corporal: quadrupede
      material: couro_tecido
      escala: enorme
      locomocao: anda
      percepcao: som
      texto: >-
        Um bicho de pasto da Era 0, de quando ali era pradaria, maior que um boi e de pé sobre as patas
        de trás quando quer, que dormiu quando a floresta cresceu em volta e não acordou direito desde
        então. O pelo é comprido, cinza-esverdeado de bolor, embaraçado de folhas e raízes finas que
        cresceram nele enquanto dormia. As patas da frente terminam em três garras curvas, cada uma do
        comprimento de um braço, que nunca se gastaram porque ele não cava há eras. Os olhos ficam
        fechados; a cabeça pequena pende sobre o peito largo.
    silhueta: Um monte peludo encostado num tronco, mais alto que um homem, com três foices curvas pendendo de cada braço.
    comportamento: >-
      Dorme em pé, encostado a uma árvore, no caminho por onde pastava quando ali era campo aberto. Às
      vezes anda dormindo esse caminho, devagar, e o que estiver na frente leva um gancho das garras.
      Quem cruza o caminho na frente dele é enganchado e puxado para o peito, e fica ali, apertado
      contra o pelo, entre as garras e quem vier bater nele.
    papel_tatico: guarda_protetor
    arquetipo: guardiao
    categoria: elite
    faccao: null
    mecanica_assinatura:
      carta: cri_preguica_da_pradaria_gancho_de_sono
      frase: >-
        Guarda o caminho onde dorme: quem passa à frente dele é puxado contra o peito, e enquanto estiver
        ali é escudo dele, levando os golpes que os companheiros mandarem na Preguiça.
    contra_jogo: Rodear o caminho, em silêncio; ele é lento e não persegue. Quem foi puxado se solta cortando os tendões dos dedos, por baixo das garras.
    gancho: >-
      A floresta engoliu a pradaria da Era 0 sem pedir passagem, e um dos bichos que pastavam ali
      dormiu de pé e ainda anda o caminho do campo aberto.
    habitat: [floresta_sussurros]
    inspiracao:
      - fonte: paleontologia (preguiça-gigante)
        referencia: "Megatherium, preguiça terrestre extinta das Américas, capaz de ficar de pé e de garras enormes"
        tomou: o porte, a postura de pé e as garras em gancho
        distancia: o sono de eras, o bolor e as raízes no pelo, e o caminho que ele guarda dormindo são da pradaria engolida por Thessavar
    padrao: [defesa, ataque_multiplo]
    a_cada_n: 3
    telegrafo: "{nome} solta um suspiro longo de sono e abre os braços devagar, garras para fora."
    description: Um bicho de pasto da Era 0, maior que um boi, que dorme de pé no caminho antigo e puxa para o peito, com garras de gancho, quem passa na frente.
    perigo: Alto
    lore: >-
      Antes de Thessavar, ali era pradaria, e a floresta a engoliu em semanas. Nem tudo o que pastava ali
      saiu. Há um bicho maior que um boi que dormiu de pé encostado numa árvore e nunca acordou direito:
      o pelo criou bolor e raízes, as garras cresceram por eras sem gastar. Às vezes ele anda dormindo o
      caminho por onde pastava, e o que está na frente leva um gancho. Os colhedores dizem que ele sonha
      com o campo aberto, porque anda como quem não vê árvore nenhuma. Quem passa em silêncio,
      rodeando, não o acorda.
    aparencia: >-
      Bicho de pasto enorme, maior que um boi, de pé encostado a um tronco, pelo longo cinza-esverdeado
      de bolor embaraçado de folhas e raízes finas, cabeça pequena pendendo de olhos fechados, três
      garras curvas do comprimento de um braço em cada pata da frente.
    como_se_luta: >-
      Guarda o caminho onde dorme e puxa para o peito quem passa na frente, e o puxado vira escudo
      dele; rodear o caminho. Quem foi puxado se solta cortando os tendões por baixo das garras.
    related_entities: [floresta_sussurros]
    arte:
      visual: >-
        Preguiça-gigante terrestre pré-histórica, de pé sobre as patas traseiras grossas, encostada a um
        tronco escuro, com o dobro da altura de um homem. Pelo longo e desgrenhado, cinza-esverdeado de
        bolor, com folhas secas e raízes finas crescendo entrelaçadas nele. Cabeça pequena e comprida
        pendendo sobre o peito, olhos fechados. Braços longos pendentes, cada mão com três garras curvas
        enormes, amareladas, como foices.
      composicao: >-
        Trilha antiga e reta no fundo da floresta, onde as árvores parecem ter crescido em volta de um
        caminho; a Preguiça dormindo de pé ao lado da trilha; um viajante encolhido passando rente a ela
        na ponta dos pés, com a cabeça na altura do joelho dela. Luz cinza fraca vinda de cima.
      evitar: Homem-árvore de casca com rosto, urso, gorila. É um bicho de pelo, não de madeira; as raízes só crescem no pelo, e a cara é de bicho dormindo.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_morcego_rasteiro
    vaga: 9
    nome: Morcego Rasteiro
