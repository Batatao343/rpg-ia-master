  - id: enemy_aranha_lobo
    vaga: 6
    nome: Saltão Desbotado
    status: reinventada
    substitui: enemy_aranha_lobo
    ataques: ["Salto nas Costas"]
    acoes:
      - "Salta por cima de quem está na frente e morde as costas de quem está atrás."
      - "Recua com um salto para longe logo depois da mordida, antes do revide."
      - "Tateia o ar com as antenas atrás do próximo que se mexer."
      - "Sem as antenas, salta às cegas para qualquer lado."
    substitui_generico: Aranha Lobo
    familia: besta_entropia
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/timeline_completa.txt:146", "lore_nova/creatures.txt:828"]
    anatomia:
      plano_corporal: hexapode_ou_mais
      material: quitina
      escala: pequena
      locomocao: salta
      percepcao: vibracao
      texto: >-
        Um grilo das tocas do fundo que o escuro da floresta engordou até o tamanho de um cão. Não tem
        cor: a carapaça é branca e translúcida, e por baixo se vê o ventre mole e as pernas por dentro.
        Não tem olhos. Tem duas antenas finas três vezes mais compridas que o corpo, sempre tateando o
        ar à frente, e as pernas de trás são enormes, dobradas acima das costas como dois arcos armados.
        As mandíbulas são curtas e cortam como tesoura de poda.
    silhueta: Um bicho corcunda e claro como cera, de pernas de trás dobradas mais altas que as costas e dois fios compridos à frente.
    comportamento: >-
      Vivem em bando nos ocos de raiz e saem quando sentem o ar e o chão tremerem. Não perseguem
      andando: saltam. Um salto longo até as costas de quem passa, uma mordida, outro salto para longe
      antes do revide, e já estão de antena erguida para o próximo.
    papel_tatico: batedor_rapido
    arquetipo: covarde_oportunista
    categoria: lacaio
    faccao: null
    mecanica_assinatura:
      carta: cri_saltao_desbotado_salto_nas_costas
      frase: >-
        Salta por cima da linha de frente direto nas costas de quem está atrás e salta de volta; nunca
        fica onde bateu.
    contra_jogo: Ficar de costas para um tronco ou para outro do grupo; um corte nas antenas e ele salta às cegas, para qualquer lado.
    gancho: >-
      Quando a floresta cresceu, o Abismo concentrado nela chamou de volta bichos que tinham cedido o
      espaço às raças; os que vieram das tocas engordaram no escuro sem cor nenhuma.
    habitat: [floresta_sussurros]
    inspiracao:
      - fonte: zoologia (grilos-de-caverna)
        referencia: "Rhaphidophoridae, grilos de caverna sem asas, pálidos, de antenas e pernas de salto desproporcionais"
        tomou: o corpo corcunda e descorado, as antenas longas e o salto
        distancia: tamanho de cão, cegueira total e a caça de salto nas costas são da floresta; não canta nem vive de restos
    padrao: [ataque, mover]
    a_cada_n: 3
    telegrafo: "{nome} dobra as pernas de trás até o ventre tocar o chão, e as antenas param no ar."
    description: Um grilo cego e sem cor do tamanho de um cão, de antenas longas e pernas de salto, que pula nas costas de quem passa.
    perigo: Baixo
    lore: >-
      Quando a Floresta dos Sussurros cresceu, a fauna que tinha cedido terreno às raças voltou atrás do
      escuro. Alguns bichos vieram de tocas e ocos de raiz e engordaram sem luz até o tamanho de cães,
      sem cor e sem olhos. Os colhedores os chamam de saltões. Vivem em bando e não correm atrás de
      ninguém: saltam por cima da frente, mordem as costas e saltam para longe. Quem anda na floresta
      aprende a parar de costas para um tronco.
    aparencia: >-
      Grilo do tamanho de um cão, carapaça branca translúcida sem cor que deixa ver o ventre e as pernas
      por dentro, sem olhos, antenas três vezes mais longas que o corpo, pernas de trás enormes dobradas
      acima das costas, mandíbulas curtas.
    como_se_luta: >-
      Salta por cima da frente nas costas de quem está atrás e salta de volta; ficar de costas para um
      tronco ou para outro. Sem as antenas ele salta às cegas.
    related_entities: [floresta_sussurros]
    arte:
      visual: >-
        Grilo-de-caverna gigante, corpo do tamanho de um cão médio, corcunda alta, carapaça branco-leitosa
        translúcida mostrando o ventre amarelado e as estruturas internas das pernas. Sem olhos. Duas
        antenas finíssimas, longas como uma lança, curvadas no ar. Pernas traseiras enormes, de coxas
        grossas e espinhosas, dobradas acima das costas. Mandíbulas curtas e escuras.
      composicao: >-
        Oco entre raízes, quase escuro; um saltão em pleno salto no alto do quadro, outros dois de antena
        erguida no chão; abaixo, de costas para eles, um viajante de mochila e bastão, maior que cada
        bicho. Luz única de uma lanterna no chão, que atravessa a carapaça e faz o corpo brilhar por dentro.
      evitar: Aranha, gafanhoto verde de lavoura, louva-a-deus. É claro, cego e corcunda; sem teia, sem oito patas, sem cor.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: enemy_urso_coruja_mutante
    vaga: 7
    nome: Casuar de Elmo Fundo
    status: reinventada
    substitui: enemy_urso_coruja_mutante
    ataques: ["Unha de Adaga", "Golpe de Elmo"]
    acoes:
      - "Salta e chuta de cima para baixo quem se mexeu, por cima do escudo."
      - "Ferido, abaixa a cabeça e recua com o elmo de osso na frente, sem dar as costas."
      - "Fica imóvel numa perna só, escutando o chão, até alguém pisar."
    substitui_generico: Urso-Coruja Mutante
    familia: besta_entropia
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/locations.txt:155", "lore_nova/timeline_completa.txt:198"]
    anatomia:
      plano_corporal: bipede_ereto
      material: osso
      escala: grande
      locomocao: salta
      percepcao: vibracao
      texto: >-
        Uma ave grande demais para voar, da altura de um homem, que veio do lado úmido e ficou no lado
        seco. O capacete de osso que essas aves têm no alto da cabeça cresceu para a frente e para baixo
        até cobrir os olhos inteiros, como um elmo de viseira fechada. As penas são pretas, duras e
        compridas como crina. As pernas são grossas e escamosas, e o dedo de dentro de cada pé termina
        numa unha reta do comprimento de uma adaga.
    silhueta: Uma ave alta e negra de pescoço reto e cabeça de capacete inclinada para a frente, numa perna só.
    comportamento: >-
      Fica parada na fronteira, cabeça baixa, sentindo os passos pelo chão. Quando alguém pisa perto,
      salta e chuta de cima para baixo com a unha de adaga, e salta para trás. Não enxerga o que chuta,
      e chuta tudo o que se move.
    papel_tatico: bruto_de_linha
    arquetipo: predador
    categoria: elite
    faccao: null
    mecanica_assinatura:
      carta: cri_casuar_de_elmo_fundo_unha_de_adaga
      frase: >-
        Salta e chuta por cima do escudo quem se mexeu na rodada, mesmo que seja outra criatura do lado
        dela; quem ficou parado não é chutado.
    contra_jogo: Ficar parado quando ela está perto e deixar outro se mexer; ela não vê, e o elmo pesado a desequilibra quando erra o chute.
    gancho: >-
      As criaturas de um lado da fronteira não cruzam para o outro; as poucas que cruzaram não voltaram,
      e o corpo delas mudou para o lado onde ficaram.
    habitat: [fs_fronteira_xylos]
    inspiracao:
      - fonte: zoologia (casuar)
        referencia: "Casuarius, ave sem voo das florestas tropicais, de casco ósseo na cabeça e garra interna em adaga"
        tomou: o porte, o casco da cabeça e a unha de adaga do pé
        distancia: o casco crescido sobre os olhos, a cegueira e o chute em quem se move são da fronteira; perdeu as cores e não come fruta
    padrao: [ataque, ataque_multiplo, ataque]
    a_cada_n: 3
    telegrafo: "{nome} encolhe uma perna até o peito e fica imóvel, de elmo baixo, escutando o chão."
    description: Uma ave sem voo da altura de um homem, de capacete de osso crescido sobre os olhos, que chuta com uma unha de adaga quem se move.
    perigo: Alto
    lore: >-
      Na fronteira com Xylos, as criaturas de um lado não cruzam para o outro, e ninguém sabe o que
      temem. Algumas cruzaram. As grandes aves sem voo da selva que passaram para o escuro seco não
      voltaram, e o capacete de osso que trazem na cabeça cresceu sobre os olhos até fechá-los. Ficam
      paradas, de cabeça baixa, ouvindo o chão, e chutam o que se move, de cima para baixo, com uma unha
      do tamanho de uma adaga. Quem sabe disso fica imóvel, e às vezes ela chuta o companheiro que se
      mexeu.
    aparencia: >-
      Ave sem voo da altura de um homem, penas pretas duras como crina, capacete de osso crescido para a
      frente e para baixo cobrindo os olhos como um elmo fechado, pernas grossas escamosas, uma unha reta
      de adaga em cada pé.
    como_se_luta: >-
      Chuta quem se moveu, por cima do escudo, mesmo que seja outra criatura; ficar parado quando ela
      está perto. Quando erra, o elmo pesado a desequilibra.
    related_entities: [fs_fronteira_xylos]
    arte:
      visual: >-
        Ave sem voo semelhante a um casuar, da altura de um homem, corpo coberto de penas negras longas e
        duras como crina. Pescoço nu de pele cinza-azulada apagada, sem cores vivas. O casco ósseo do
        alto da cabeça cresceu e desce sobre os olhos como uma viseira de elmo, cor de marfim rachado.
        Pernas grossas cinzentas e escamosas; em cada pé, o dedo interno com uma garra reta e longa como
        adaga.
      composicao: >-
        Fronteira: chão seco de folhas mortas de um lado, verde úmido do outro, ao fundo. A ave em pé
        numa perna, a outra encolhida, de elmo baixo; a dois passos, um caçador congelado no começo de
        um passo, da mesma altura que ela. Luz baixa e verde vinda do lado da selva.
      evitar: Urso-coruja, grifo, dinossauro, galinha gigante cômica. É uma ave sem voo de penas de crina, sem bico de coruja nem patas de urso; o perigo é o pé.
    autor: opus
