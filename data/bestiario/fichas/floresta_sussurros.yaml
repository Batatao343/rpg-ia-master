        Uma onça da selva que cruzou para a borda seca e voltou, e voltou errada. Onde deviam estar as
        rosetas do pelo há buracos: buracos redondos que atravessam o corpo de um lado ao outro, de
        bordas lisas de pele e músculo, do tamanho de uma moeda grande até o de um punho. Pelos buracos
