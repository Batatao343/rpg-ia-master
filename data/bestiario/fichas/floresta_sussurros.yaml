criaturas:
  # ======================= CORPOS REESCRITOS (Reescritos) =======================
  - id: mon_lixado_da_fronteira
    vaga: 1
    nome: Lixado da Fronteira
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: dragao
      detalhe: npc_solveth
      refs: ["lore_nova/npcs.txt:402", "lore_nova/timeline_completa.txt:198"]
    anatomia:
      plano_corporal: bipede_ereto
      material: cinza
      escala: humana
      locomocao: anda
      percepcao: calor
      texto: >-
        Um homem que estava na borda quando a névoa de Solveth passou e saiu do outro lado gasto como
        pedra de rio. O lado esquerdo do corpo foi lixado até o osso, e o osso até um pó cinza e liso
        que se segura no lugar como areia molhada; a orelha, o ombro e metade das costelas daquele
        lado terminam numa curva macia. As duas mãos não têm mais dedos: acabam em tocos de pó
        cinzento que continuam se desfazendo, e o que elas apertam se desfaz junto. Deixa um rastro
        de poeira fina por onde anda.
    silhueta: Um homem torto de perfil, como uma estátua gasta pela chuva de um lado só, com fumaça cinza escorrendo das mãos.
    comportamento: >-
      Vaga na faixa da fronteira por onde a névoa passou, sempre de volta ao mesmo trecho, atrás do
      calor de quem chega. Não morde nem golpeia: agarra. Segura o escudo, a couraça, o cabo da arma,
      e segura até aquilo virar pó entre os tocos das mãos, que ficam um pouco mais curtas a cada vez.
    papel_tatico: quebra_defesa
    arquetipo: bruto
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: cri_lixado_da_fronteira_toco_que_desfaz
      frase: >-
        Agarra a peça de defesa do herói e a desfaz no aperto: a Defesa perdida não volta nesta luta,
        mas cada agarrão também gasta as mãos dele, que apertam menos da vez seguinte.
    contra_jogo: Manter distância ou largar o escudo antes que vire pó; depois de alguns agarrões os tocos chegam aos punhos e ele não segura mais nada.
    gancho: >-
      A névoa de Solveth passa pela borda entre a floresta e a selva quando quer, e quem estava no
      caminho e não morreu ficou com o corpo gasto como pedra de rio.
    habitat: [fs_fronteira_xylos]
    inspiracao: []
    padrao: [ataque, enfraquecer, ataque]
    a_cada_n: 3
    telegrafo: "{nome} abre os tocos das mãos, e a poeira cinza começa a escorrer mais depressa."
    description: Um homem gasto até o osso de um lado pela névoa de Solveth, de mãos em tocos de pó cinza que desfazem o que seguram.
    perigo: Médio
    lore: >-
      Na borda entre a Floresta dos Sussurros e a Selva de Xylos, a névoa de Solveth passa quando
      quer, e o que ela toca vira pó. Quase sempre. Alguns viajantes que estavam no caminho saíram do
      outro lado vivos e gastos, com um lado do corpo lixado até o osso e o osso até a areia. Não
      falam e não voltam para casa; ficam na faixa da fronteira, andando de volta ao mesmo trecho.
      Agarram o que o viajante usa para se proteger e seguram até virar pó, e as mãos deles encurtam a
      cada vez. Os caçadores da fronteira contam os agarrões.
    aparencia: >-
      Homem de corpo gasto de um lado só, ombro, orelha e costelas esquerdos lixados até uma curva lisa
      de pó cinza, mãos sem dedos terminando em tocos de poeira que se desfaz, rastro de pó fino nos pés.
    como_se_luta: >-
      Agarra escudo e couraça e os desfaz no aperto; manter distância ou soltar a peça a tempo. As mãos
      se gastam a cada agarrão, e depois de alguns ele não segura mais.
    related_entities: [fs_fronteira_xylos, npc_solveth]
    arte:
      visual: >-
        Homem adulto de pé, roupas de viajante desbotadas e esfiapadas. Todo o lado esquerdo do corpo
        erodido como arenito: ombro, orelha e metade da caixa torácica reduzidos a superfícies curvas,
        lisas, cinza-claras, granulosas como pedra-pomes, com o osso aparente gasto. Antebraços
        terminando em tocos de pó cinza que se esfarelam em fiapos de poeira caindo. Olhos abertos,
        cansados.
      composicao: >-
        Faixa da fronteira: à esquerda troncos escuros e secos da floresta, à direita folhagem úmida e
        brilhante da selva, névoa baixa amarelada ao longe. O Lixado segura com os tocos a borda de um
        escudo redondo de madeira que se esfarela, diante de um soldado do mesmo tamanho que puxa o
        escudo de volta. Luz cinza lateral.
      evitar: Estátua de pedra animada, múmia, esqueleto, fantasma de névoa. É um homem vivo e gasto, não feito de pedra; a névoa não aparece no corpo, só o que ela fez.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_abafador_de_candeias
    vaga: 2
    nome: Abafador de Candeias
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/timeline_completa.txt:146", "lore_nova/creatures.txt:828"]
    anatomia:
      plano_corporal: bipede_curvado
      material: couro_tecido
      escala: humana
      locomocao: escala_paredes
      percepcao: luz
      texto: >-
        Um perdido que passou anos no escuro dos andares de baixo da floresta, até o corpo deixar de
        precisar de luz. Os olhos fecharam e a pele cresceu lisa por cima das órbitas; as orelhas
        abriram em duas conchas de pele fina do tamanho de mãos. A pele das costas, dos braços e do
        peito engrossou num feltro preto, curto e denso, que bebe a claridade como pano seco bebe água.
        Os dedos são longos, de unhas grossas, feitos para subir em tronco. Uma chama, ele sente na pele
        do rosto como quem sente sol, a vinte passos.
    silhueta: Uma mancha mais escura que o escuro colada ao tronco, descendo de cabeça para baixo com duas orelhas abertas como folhas.
    comportamento: >-
      Vive alto nos troncos e só desce quando alguém acende fogo. Desce de cabeça para baixo, sem
      barulho, e cai sobre quem carrega a luz: abraça a lanterna ou a tocha contra o peito de feltro e a
      apaga. No escuro que fica, ele ouve melhor do que qualquer um.
    papel_tatico: saqueador
    arquetipo: emboscador
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: cri_abafador_de_candeias_abraco_de_feltro
      frase: >-
        Vai sempre em quem carrega a luz do grupo e a apaga no abraço; até alguém gastar uma jogada para
        reacender, os ataques de longe do grupo não têm em quem mirar.
    contra_jogo: Lutar com a luz no chão, longe de quem combate, ou com duas luzes; reacender logo devolve a mira, e sem luz para seguir ele se guia pelo ouvido.
    gancho: >-
      A floresta fecha a luz dos andares de baixo com precisão, e quem se perde ali por anos acaba com
      um corpo que não precisa dela e não a suporta.
    habitat: [floresta_sussurros]
    inspiracao: []
    padrao: [mover, ataque, enfraquecer]
    a_cada_n: 2
    telegrafo: "{nome} vira as orelhas para a chama e desce o tronco um palmo, depois outro."
    description: Um perdido de olhos cobertos de pele e corpo de feltro preto que desce dos troncos e apaga no abraço a luz de quem a carrega.
    perigo: Médio
    lore: >-
      Os colhedores de Pó de Sonho não acendem fogo depois da primeira fileira de árvores, e ensinam
      isso antes de ensinar o caminho. Lá dentro há gente perdida há tanto tempo que o corpo desistiu da
      luz: os olhos fecharam por baixo da pele e as costas criaram um feltro preto que bebe a claridade.
      Ficam alto nos troncos. Quando alguém acende uma tocha, descem de cabeça para baixo e a abraçam
      contra o peito até ela morrer. O que vem depois acontece no escuro, e quem estava lá não sabe
      contar direito.
    aparencia: >-
      Humano magro e curvado, sem olhos, pele lisa sobre as órbitas, orelhas enormes em concha de pele
      fina, costas, braços e peito cobertos de feltro preto curto e fosco que não reflete luz, dedos
      longos de unhas grossas.
    como_se_luta: >-
      Vai sempre em quem carrega a luz e a apaga num abraço; lutar com a luz no chão, longe de quem
      combate, ou com duas. Sem luz para seguir ele se guia pelo ouvido, e quem fica parado sai do
      alcance dele.
    related_entities: [floresta_sussurros]
    arte:
      visual: >-
        Humano adulto magro e curvado, preso de cabeça para baixo a um tronco escuro pelos dedos longos
        de unhas grossas. Sem olhos: pele lisa e pálida esticada sobre as órbitas. Orelhas enormes,
        finas, translúcidas contra a luz, abertas como duas folhas. Costas, braços e peito cobertos de
        um feltro preto curto, absolutamente fosco, que parece um buraco na imagem; rosto, mãos e pés
        de pele pálida acinzentada.
      composicao: >-
        Andar baixo da floresta, quase negro. Uma colhedora ergue uma lanterna de latão, de costas para o
        tronco; acima dela, o Abafador desce de cabeça para baixo, do tamanho dela, de orelhas viradas
        para a chama. A única luz é a da lanterna, quente e pequena; o feltro do corpo não devolve
        nenhum brilho.
      evitar: Vampiro, homem-morcego, sombra viva, criatura de olhos brilhantes. Não tem olhos nem asas; é um homem de pele grossa e orelhas grandes, e o preto do corpo é pelo fosco, não névoa.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_fechado_de_escapulas
    vaga: 3
    nome: Fechado de Escápulas
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/npcs.txt:182", "lore_nova/timeline_completa.txt:146"]
    anatomia:
      plano_corporal: bipede_ereto
      material: osso
      escala: humana
      locomocao: anda
      percepcao: som
      texto: >-
        Um homem cujas omoplatas cresceram até virar duas placas de osso branco do tamanho de portas de
        armário, presas às costas por tendões grossos como cordas. Quando ele se fecha, as placas vêm
        por cima dos ombros e se encontram diante do peito e do rosto, como as duas metades de uma
        concha. Entre as placas e as costelas fica o músculo vermelho, sem pele, que puxa e solta. Os
        braços ficaram curtos e fortes, de antebraços grossos, e só trabalham com as placas abertas.
    silhueta: Um vulto de ombros altíssimos, como um armário fechado de duas portas brancas, com dois braços curtos saindo de baixo.
    comportamento: >-
      Passa os dias fechado entre as raízes, parecendo uma pedra clara. Quando há luta perto, anda até
      ficar na frente de quem está mais ferido do lado dele e se fecha ali. Só abre para bater, e abre
      pouco.
    papel_tatico: guarda_protetor
    arquetipo: guardiao
    categoria: elite
    faccao: null
    mecanica_assinatura:
      carta: cri_fechado_de_escapulas_duas_portas
      frase: >-
        Fecha as escápulas diante de outra criatura e recebe nas placas os golpes que iam para ela;
        quando abre para bater, o músculo vermelho fica exposto até a rodada seguinte.
    contra_jogo: Esperar que ele abra para bater e golpear o músculo entre as placas; ou ir primeiro, pelo lado, em quem ele protege, antes que ele chegue lá.
    gancho: >-
      A floresta foi feita para que nada seja visto, e o que vive no escuro de Thessavar tempo demais
      aprende a se fechar com o próprio corpo.
    habitat: [floresta_sussurros]
    inspiracao: []
    padrao: [defesa, ataque, defesa, reforco_proprio]
    a_cada_n: 3
    telegrafo: "{nome} trava as duas placas de osso diante do peito com um estalo de porta pesada."
    description: Um homem de omoplatas crescidas em duas placas de osso que se fecham como portas diante de quem ele protege.
    perigo: Alto
    lore: >-
      Entre as raízes do fundo há pedras claras que não são pedras. São homens fechados: as omoplatas
      cresceram até virar duas placas de osso que se juntam diante do peito, e quem vive assim aprende a
      não abrir. A floresta de Thessavar ensina isso a tudo o que fica nela tempo demais. Quando há luta
      perto, um deles caminha até ficar na frente do mais ferido e se fecha ali. Só abre para bater, e o
      que se vê na fresta é carne vermelha sem pele.
    aparencia: >-
      Homem de ombros enormes, duas omoplatas crescidas em placas de osso branco do tamanho de portas de
      armário que se fecham diante do peito e do rosto, músculo vermelho sem pele visível na fresta,
      braços curtos de antebraços grossos.
    como_se_luta: >-
      Fecha as placas na frente de outra criatura e recebe os golpes dela; quando abre para bater, o
      músculo entre as placas fica exposto. Ou ir primeiro, pelo lado, em quem ele protege.
    related_entities: [floresta_sussurros]
    arte:
      visual: >-
        Humano adulto de altura normal, de pé. Das costas saem duas placas de osso branco-amarelado,
        planas, ovais, da altura do tronco, presas por tendões vermelhos grossos; aqui entreabertas como
        portas de armário, deixando ver entre elas o peito de músculo vermelho sem pele e o rosto magro
        de olhos fundos. Braços curtos e musculosos saindo de baixo das placas, mãos grandes fechadas.
        Restos de uma camisa rasgada.
      composicao: >-
        Clareira escura entre raízes enormes; o Fechado em primeiro plano, placas entreabertas, diante de
        um Abafador caído; à frente dele, um caçador de lança, do mesmo tamanho, procura a fresta. Luz
        de tocha baixa vinda da esquerda; o branco do osso é o único claro forte.
      evitar: Tartaruga humanoide, cavaleiro de escudo, armadura de placas, asas de osso. As placas são as omoplatas dele, presas por tendão; não há metal nem casco.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_virado_do_avesso
    vaga: 4
    nome: Virado do Avesso
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: eter
      detalhe: null
      refs: ["lore_nova/timeline_completa.txt:260", "lore_nova/creatures.txt:874"]
    anatomia:
      plano_corporal: bipede_curvado
      material: carne_exposta
      escala: humana
      locomocao: anda
      percepcao: calor
      texto: >-
        Um viciado em Pó de Sonho que foi colher onde a floresta é mais escura e comeu do que colhia. O
        corpo virou do avesso devagar, como uma luva puxada: a pele enrolou para dentro e o músculo
        ficou por fora, vermelho e úmido, com os tendões brancos à vista no pescoço e nos punhos. Os
        lábios e as pálpebras viraram para trás e não fecham. Os nervos ficaram na superfície, e
        qualquer toque nele dói como ferida aberta. As unhas caíram; as pontas dos dedos são carne viva.
    silhueta: Um homem vermelho e brilhante de umidade, sem pele, com os braços já erguidos como quem espera o golpe.
    comportamento: >-
      Anda devagar e sem rumo pelo fundo da floresta, gemendo baixo a cada passo, atrás do calor de
      gente. Não começa a briga. Mas sente tudo, e cada golpe que o acerta o faz se mexer mais depressa,
      de dor.
    papel_tatico: tanque_reativo
    arquetipo: morto_vivo_implacavel
    categoria: padrao
    faccao: null
    mecanica_assinatura:
      carta: "cri_virado_do_avesso_dor_que_acelera"
      frase: >-
        Sente tudo, e a dor o acelera: cada golpe que leva lhe dá uma ação a mais na rodada seguinte,
        até três; uma rodada inteira sem levar golpe o acalma e zera a conta.
    contra_jogo: >-
      Bater uma vez por rodada, forte, ou deixá-lo uma rodada sem golpe para que se acalme; fogo e frio
      nos nervos à flor o fazem encolher e perder a rodada.
    gancho: >-
      O Pó de Sonho mostra o que está escondido, e quem come demais dele onde a floresta é mais funda
      acaba mostrando o que estava escondido dentro de si.
    habitat: [floresta_sussurros]
    inspiracao: []
    padrao: [reforco_proprio, ataque, ataque]
    a_cada_n: 2
    telegrafo: "{nome} se encolhe inteiro, e todos os tendões do pescoço saltam ao mesmo tempo."
    description: >-
      Um viciado em Pó de Sonho de corpo virado do avesso, músculo por fora e nervos à flor, que a cada
      golpe recebido fica mais rápido e mais desesperado.
    perigo: Médio
    lore: >-
      Vestra Mão-vermelha diz que há um limite seguro para colher, e que quem passa dele não volta.
      Alguns voltam, mas não inteiros. Comeram do Pó onde a floresta é mais funda, e o fungo mostrou o
      que estava escondido, como sempre faz: neles, o que estava escondido era o lado de dentro. Andam
      pelo fundo gemendo a cada passo, com o músculo por fora e os nervos na superfície. Não atacam
      primeiro, mas cada golpe que levam os faz ir mais depressa, e os colhedores aprenderam a passar
      longe.
    aparencia: >-
      Humano de corpo virado do avesso, músculo vermelho e úmido por fora, tendões brancos à vista no
      pescoço e nos punhos, lábios e pálpebras virados para trás, sem unhas, pontas dos dedos em carne
      viva, restos de pó vermelho nas mãos.
    como_se_luta: >-
      Cada golpe que leva lhe dá mais uma ação na rodada seguinte. Bata uma vez e forte, ou deixe-o se
      acalmar; fogo e frio nos nervos o fazem encolher.
    related_entities: [floresta_sussurros, npc_vestra_mao_vermelha]
    arte:
      visual: >-
        Humano adulto magro, de pé, levemente encolhido, corpo inteiro de musculatura exposta como prancha
        de anatomia, vermelho-escuro e úmido, tendões brancos e nacarados no pescoço, punhos e
        tornozelos. Lábios e pálpebras repuxados para trás mostrando dentes e olhos inteiros, sem cílios.
        Pontas dos dedos sem unhas. Manchas de pó vermelho vivo nas mãos e na boca. Braços semierguidos
        em defesa.
      composicao: >-
        Fundo da floresta, chão de folhas negras, manchas de fungo vermelho brilhando no pé das árvores.
        O Virado diante de uma colhedora de capuz que recua com uma faca curta, do mesmo tamanho. Luz
        fria de cima, rara, que faz a carne brilhar de umidade.
      evitar: Zumbi apodrecido, esfolado de filme de terror com sangue jorrando, demônio de pele vermelha. É anatomia limpa e viva, sem pele; não sangra em cascata e não tem chifres.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

  - id: mon_calado_das_guelras
    vaga: 5
    nome: Calado das Guelras
    status: nova
    substitui: null
    familia: corpo_reescrito
    origem_lore:
      fonte: abismo
      detalhe: null
      refs: ["lore_nova/locations.txt:149", "lore_nova/creatures.txt:828"]
    anatomia:
      plano_corporal: bipede_ereto
      material: carne_exposta
      escala: humana
      locomocao: anda
      percepcao: respiracao
      texto: >-
        Gente que ficou calada tempo demais na floresta, até a boca fechar sozinha: os lábios cresceram
        um para dentro do outro e a pele selou por cima, lisa, com uma cicatriz fina onde era a fenda.
        Para respirar, o pescoço abriu de cada lado três fendas compridas de bordas vermelhas, que abrem
        e fecham como guelras de peixe fora d'água. As costelas sobem e descem depressa. São magros, de
        pernas longas, e correm descalços, de calcanhar duro, sem fazer barulho.
    silhueta: Um corredor magro de cabeça lisa onde devia haver boca, com o pescoço aberto em listras que se mexem.
    comportamento: >-
      Andam em grupos de três ou quatro pela borda da floresta e pela fronteira, sem som nenhum. Sentem
      o ar que os outros soltam: o bando inteiro corre para quem arfa mais, o mais cansado, e bate nele
      junto, com as mãos de unhas duras, cada um mais forte que o anterior. Como não têm boca, não comem
      do que matam.
    papel_tatico: batedor_rapido
    arquetipo: predador
    categoria: lacaio
    faccao: null
    mecanica_assinatura:
      carta: cri_calado_das_guelras_golpe_sem_som
      frase: >-
        O bando inteiro corre para o herói com menos Fôlego sobrando, e cada Calado a mais no mesmo alvo
        bate mais forte que o anterior.
    contra_jogo: Não deixar ninguém chegar ao fim do Fôlego quando eles estão perto, ou pôr o mais cansado atrás de quem aguenta; as fendas do pescoço são moles, e um golpe ali os derruba.
    gancho: >-
      O silêncio da floresta não é falta de som, é presença que escolheu calar; quem fica tempo bastante
      dentro dele acaba calado no corpo.
    habitat: [floresta_sussurros, fs_fronteira_xylos]
    inspiracao: []
    padrao: [mover, ataque]
    a_cada_n: 2
    telegrafo: "As fendas do pescoço de {nome} abrem todas de uma vez, num assobio fino."
    description: Gente da floresta de boca selada pela pele, que respira por fendas no pescoço e corre em silêncio atrás de quem arfa.
    perigo: Baixo
    lore: >-
      Na Floresta dos Sussurros o silêncio não é falta de som, e quem fica calado tempo bastante dentro
      dele acaba calado no corpo. Os lábios crescem um para dentro do outro e a pele fecha por cima;
      para respirar, o pescoço se abre em fendas que batem como guelras. Correm em grupos pequenos pela
      borda, descalços e sem som, e vão todos juntos em quem respira mais forte, porque o mais cansado é o
      que cai primeiro. Quem caçou perto deles diz que o único aviso é um assobio fino das fendas.
    aparencia: >-
      Humanos magros e descalços de pernas longas, boca selada por pele lisa com uma cicatriz fina, três
      fendas compridas de bordas vermelhas de cada lado do pescoço, costelas à vista, unhas grossas e
      duras.
    como_se_luta: >-
      O bando inteiro vai no mais cansado, e cada um bate mais forte que o anterior; não deixar ninguém
      sem fôlego perto deles. As fendas do pescoço são moles e um golpe ali os derruba.
    related_entities: [floresta_sussurros, fs_fronteira_xylos]
    arte:
      visual: >-
        Três humanos adultos magros, pele acinzentada, descalços, roupas reduzidas a trapos. Rostos sem
        boca: a pele lisa cobre o lugar da boca, com uma cicatriz fina horizontal. Cada lado do pescoço
        com três fendas paralelas de bordas vermelhas, abertas, como guelras. Peito de costelas
        marcadas, braços longos de mãos com unhas grossas e escuras. O da frente em plena corrida,
        inclinado, com um pé no ar.
      composicao: >-
        Borda da floresta, troncos escuros e retos; os Calados correndo em fila diagonal na direção de um
        caçador ofegante de arco na mão, que ainda não se virou e tem a altura do da frente. Luz cinza
        filtrada de cima, neblina rente ao chão.
      evitar: Homem-peixe, sereia, monstro de escamas, alienígena. Não há escamas nem barbatanas; são gente magra com o pescoço aberto e a boca fechada pela pele.
    autor: opus
    revisor_unicidade: opus-spec-reviewer
    revisao: aprovada

