    description: Uma onça da fronteira cujas rosetas viraram furos que atravessam o corpo, invisível na luz manchada, com o coração à vista no flanco.
    perigo: Alto
    lore: >-
      Na fronteira entre a floresta e a selva há uma onça que cruzou e voltou. O lado seco a deixou cheia
      de furos: onde deviam estar as rosetas há buracos redondos que atravessam o corpo, e por eles passa
