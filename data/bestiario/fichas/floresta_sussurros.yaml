    comportamento: >-
      Caça na faixa da fronteira, onde a luz chega aos pedaços pelas copas. Na sombra manchada, os furos
      do corpo deixam passar a mesma luz que cai no chão, e ela some. Espera parada até a presa estar
      perto e salta no pescoço.
