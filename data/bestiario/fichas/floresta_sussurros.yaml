# Bestiário de Valoria — ficha de identidade da onda da Floresta dos Sussurros (SPEC-349, esteira §3.10).
# Fonte única da identidade de cada criatura (R5). Codex, doc de arte e `appearance` do
# bestiário são GERADOS daqui por scripts/bestiario/gerar_docs.py; os números (Etapa 5) não.
# Eixos antes da prosa (R8): o tabuleiro `vagas:` passou em U2/U3/U12 antes de qualquer texto,
# também contra as 4 fichas retro da região.
# Refs de lore: linhas da lore da SPEC-348 (main), mesma convenção das ondas 1 e 2.
regiao: floresta_sussurros
onda: 8
spec: SPEC-349
nome_regiao: Floresta dos Sussurros
habitat_nome:
  floresta_sussurros: Floresta dos Sussurros
  fs_fronteira_xylos: Fronteira com Xylos
paleta: >-
  **Floresta dos Sussurros** — floresta seca e escura de Thessavar: troncos antigos e retos que
  fecham a luz dos andares de baixo com precisão, chão de folhas mortas negras, quase nenhum céu.
  Luz e paleta: preto-verde e cinza-carvão, pouca luz fria filtrada de cima, pontos quentes só de
  tocha e lanterna, o vermelho vivo do Pó de Sonho no pé das árvores. Na Fronteira com Xylos, o seco
  encontra o úmido: metade do quadro em folhas mortas e casca preta, metade em verde molhado e
  brilhante, névoa amarelada baixa ao longe.
