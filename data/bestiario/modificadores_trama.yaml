# SPEC-361 R5 — catálogo curado de modificadores de trama (variante = base existente + modificador).
# Autor: opus (Etapa 2). Revisão independente: pendente (spec-reviewer Opus, registro na SPEC-361 §9).
#
# Uma variante NÃO é "jovem", "alfa" nem "maior" (U5 da 349): é a mesma espécie marcada pelo que
# está acontecendo na história. O modificador vem da trama (pedido do jogador + motivo de trama),
# nunca do acaso, e só muda campos categóricos; os números saem do Python.
#
# Campos:
#   gatilhos     frases (sem acento) que detectam o modificador no pedido/motivo; primeira que
#                aparece vence, desempate pela ordem deste arquivo; nunca repetidas entre itens
#   afinidades   palavras no comportamento/anatomia da base que a favorecem (R6, +1 cada)
#   familias     famílias de Valoria compatíveis (FAMILIAS_VALORIA)
#   categorias   categorias da base compatíveis
#   proibido_com eixos da base que impedem o modificador
#   efeitos      categoria_delta ∈ {0, 1} (nunca passa de elite); papel_tatico/padrao (enums) ou null;
#                contagem_min = piso do grupo no spawn
#   texto        epiteto (vai depois do nome da base), frase ({base}), telegrafo ({nome}), aparencia
#                — sem dígito, sem jargão de Cartas, sem marcador de variante no epíteto
versao: 1
modificadores:
  - id: mente_unica
    rotulo: ligados por uma mente só
    gatilhos: ["mente-colmeia", "mente colmeia", "colmeia", "uma mente so", "pensam como um", "enxame", "mente unica"]
    afinidades: [bando, enxame, ninhada, colonia, grita, chama]
    familias: [besta_entropia, demonio_encarnado, corpo_reescrito]
    categorias: [lacaio, padrao]
    proibido_com: {plano_corporal: [sessil_ancorado]}
    efeitos:
      categoria_delta: 0
      papel_tatico: controlador
      padrao: [reforco_proprio, ataque_multiplo]
      contagem_min: 3
    texto:
      epiteto: da Mente Única
      frase: "Cada {base} deste bando se move como parte de um só corpo: quando um vê a presa, todos sabem onde ela está."
      telegrafo: "{nome} congela no meio do passo, e o bando inteiro vira a cabeça para o mesmo lado."
      aparencia: "vários deles na mesma pose, espelhados, os olhos fixos no mesmo ponto"
    inspiracao:
      - fonte: Caves of Qud
        referencia: criaturas lendárias são base + mutações
        tomou: variante como base mais modificador
        distancia: o modificador vem da trama e é curado, não sorteado

  - id: praga_terminal
    rotulo: na última semana da Praga
    gatilhos: ["praga terminal", "ultimo estagio", "estado terminal", "ultima semana da praga", "podre de praga"]
    afinidades: [praga, ferrugem, ossos, veias, medula, casca]
    familias: [corpo_reescrito, besta_entropia]
    categorias: [lacaio, padrao, elite]
    proibido_com: {}
    efeitos:
      categoria_delta: 1
      papel_tatico: tanque_reativo
      padrao: [ataque, reforco_proprio, ataque]
      contagem_min: null
    texto:
      epiteto: da Última Semana
      frase: "{base} na última semana da Praga: o que a doença ainda não reescreveu está rachando para dar lugar ao que vem."
      telegrafo: "{nome} para, e a pele das costas abre em placas como reboco secando."
      aparencia: "pele rachada em placas soltas, o que está por baixo já endurecido, ferrugem escorrendo das juntas"
    inspiracao:
      - fonte: lore de Valoria
        referencia: "Benedita, a Parteira: a diferença entre doente e Reescrito é de uma semana"
        tomou: o estágio da doença como marca da história
        distancia: é a base de sempre mais perto do fim, não uma espécie nova

