      texto: Um caroço de sal branco do tamanho de um cesto, grudado no fundo da cisterna, com crosta
        que estala quando seca. Na face de cima abre uma boca larga em anel, sem dentes, forrada de carne
        úmida. Em volta da boca saem seis hastes finas de sal, cada uma com uma bolha de água salgada
        na ponta que treme quando o ar vibra. Por baixo, raízes de sal descem pela rachadura e seguram
        o corpo na pedra.
    aparencia: Crosta branca e rachada em forma de cesto, boca redonda de carne úmida ao centro e seis
      hastes finas com bolhas de água salgada nas pontas.
    arquetipo: emboscador
    arte:
      evitar: Bolha gelatinosa translúcida com olhos, lesma gigante de desenho animado, cristal azul brilhante
        de fantasia.
      visual: Criatura de sal branco e rachado no fundo de uma cisterna de pedra seca, boca circular de
        carne rosada e úmida, seis hastes finas erguidas com gotas salgadas brilhando na ponta, areia
        e vidro fosco ao redor, luz de lua entrando pela abertura.
