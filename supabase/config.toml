project_id = "rpg-ia-master-local"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = false
port = 55323

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirme seu e-mail em Valoria"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Recupere seu acesso a Valoria"
content_path = "./supabase/templates/recovery.html"

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
