name: validate
on:
  push: {branches: [main]}
  pull_request:
  schedule:
    # SPEC-225 D-B: varredura semanal do histórico completo pelo scanner de segredos.
    - cron: "23 6 * * 1"
permissions:
  contents: read
concurrency:
  # Workspace C6: PR com push novo cancela o run anterior; na main todo commit termina.
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    # Workspace C6: push/PR só de docs (docs/, handoffs/, *.md da raiz)
    # pula a suíte pesada e roda o job docs-only. Base desconhecida => suíte completa.
    runs-on: ubuntu-24.04  # pin: ubuntu-latest migra de imagem sem aviso
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_docs_only.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  docs-only:
    needs: scope
    if: github.event_name != 'schedule' && needs.scope.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04  # pin: ubuntu-latest migra de imagem sem aviso
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --extra anthropic
      - run: uv run python scripts/validate_content.py
      - run: uv run python scripts/check_md_links.py --baseline scripts/md_links_baseline.txt
      # Testes que leem documentação (catálogos, AGENTS.md, specs...) continuam rodando.
      - run: uv run pytest -q -n auto --tb=short $(python3 scripts/ci_docs_only.py --doc-tests)
        shell: bash

  test:
    needs: scope
    if: github.event_name != 'schedule' && needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04  # pin: ubuntu-latest migra de imagem sem aviso
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # A suíte cobre os builders opcionais usados pelas rotas reais:
      # DeepSeek/Groq/Qwen/MiniMax via OpenAI-compat e Anthropic no tier SMART.
      - run: uv sync --extra anthropic
      # SPEC-225 R6: sem allowlist; os 5 advisories (multidict, urllib3, langgraph-sdk) foram corrigidos no lock.
      - name: pip-audit (requirements.txt exportado do lock)
        run: uvx --from pip-audit==2.10.1 pip-audit -r requirements.txt --progress-spinner off
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/validate_content.py
      - run: uv run pytest -q -n auto --tb=short --junitxml=pytest-junit.xml 2>&1 | tee pytest-tb.log; exit "${PIPESTATUS[0]}"
        shell: bash
      # SPEC-260 R4: em falha, JUnit XML + log --tb=short para debug sem reproduzir local.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: pytest-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pytest-junit.xml
            pytest-tb.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # SPEC-225 R6: bloqueia high/critical de runtime; a árvore completa é checada em npm-audit-full.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm test
        working-directory: web
      # SPEC-284: tipagem de e2e/tests e ESLint são bloqueantes (zerados em 2026-10-19).
      - run: npm run typecheck:e2e
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web

  api-fuzz:
    # SPEC-338: fuzz da API (Schemathesis in-process, legacy + DB offline); bloqueante.
    needs: scope
    if: github.event_name != 'schedule' && needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04  # pin: ubuntu-latest migra de imagem sem aviso
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --extra anthropic --group fuzz
      - name: pip-audit (grupo fuzz)
        run: |
          uv export --only-group fuzz --no-hashes --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/fuzz-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/fuzz-requirements.txt" --progress-spinner off
      - run: RPG_API_FUZZ_REQUIRED=1 uv run pytest tests/test_api_fuzz_harness.py -p no:cacheprovider --tb=short
      - run: RPG_API_FUZZ_REQUIRED=1 uv run pytest tests/test_api_fuzz_schemathesis.py -m api_fuzz -p no:cacheprovider --tb=short --junitxml=api-fuzz-junit.xml 2>&1 | tee api-fuzz.log; exit "${PIPESTATUS[0]}"
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: api-fuzz-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            api-fuzz-junit.xml
            api-fuzz.log
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    # SPEC-225 R5: gitleaks no diff do PR/push e, semanalmente, no histórico completo.
    runs-on: ubuntu-24.04  # pin: ubuntu-latest migra de imagem sem aviso
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  npm-audit-full:
    # SPEC-225 R6 / SPEC-276: árvore completa (inclui dev) bloqueante desde a migração para Vite 8 (D-A).
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04  # pin: ubuntu-latest migra de imagem sem aviso
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=moderate
        working-directory: web
