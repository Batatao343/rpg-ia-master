name: validate
on:
  push: {branches: [main]}
  pull_request:
  schedule:
    # SPEC-225 D-B: varredura semanal do histórico completo pelo scanner de segredos.
    - cron: "23 6 * * 1"
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # A suíte cobre os builders opcionais usados pelas rotas reais:
      # DeepSeek/Groq/Qwen/MiniMax via OpenAI-compat e Anthropic no tier SMART.
      - run: uv sync --extra anthropic
      # SPEC-225 R6: sem allowlist; os 5 advisories (multidict, urllib3, langgraph-sdk) foram corrigidos no lock.
      - name: pip-audit (requirements.txt exportado do lock)
        run: uvx --from pip-audit==2.10.1 pip-audit -r requirements.txt --progress-spinner off
      - run: uv run ruff check .
      - run: uv run python scripts/validate_content.py
      - run: uv run pytest -q -n auto --tb=short --junitxml=pytest-junit.xml 2>&1 | tee pytest-tb.log; exit "${PIPESTATUS[0]}"
        shell: bash
      # SPEC-260 R4: em falha, JUnit XML + log --tb=short para debug sem reproduzir local.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: pytest-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pytest-junit.xml
            pytest-tb.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # SPEC-225 R6: bloqueia high/critical de runtime; a árvore completa é checada em npm-audit-full.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm test
        working-directory: web
      # Workspace #10: tipagem de e2e/tests e ESLint entram não bloqueantes até zerar
      # os achados existentes (25 erros de tsc, ~90 de eslint em 2026-10-19).
      - run: npm run typecheck:e2e
        working-directory: web
        continue-on-error: true
      - run: npm run lint
        working-directory: web
        continue-on-error: true
      - run: npm run build
        working-directory: web

  secret-scan:
    # SPEC-225 R5: gitleaks no diff do PR/push e, semanalmente, no histórico completo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  npm-audit-full:
    # SPEC-225 R6 / SPEC-276: árvore completa (inclui dev) bloqueante desde a migração para Vite 8 (D-A).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=moderate
        working-directory: web
