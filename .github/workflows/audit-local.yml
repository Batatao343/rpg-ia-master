name: audit-local
# Explicit/manual until the first remote run certifies provisioning and timing.
# No cloud account, provider secrets or paid model is used by this job.
on:
  workflow_dispatch:
jobs:
  infra-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --extra postgres --extra browser --extra openai --extra anthropic
      - run: uv run playwright install --with-deps chromium
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: uv run python scripts/dev_stack.py start
      - run: uv run python scripts/audit_local_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-local-results
          path: readiness_artifacts/audit/
          if-no-files-found: warn
      - run: uv run python scripts/dev_stack.py stop
        if: always()
