name: audit-local
# Certified remotely on 2026-09-26 (run 36263717580, 3m27s).
# No cloud account, provider secrets or paid model is used by this job.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  infra-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --extra browser --extra anthropic
      - run: uv run playwright install --with-deps chromium
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: uv run python scripts/dev_stack.py start
      - run: uv run python scripts/audit_local_gate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: audit-local-results
          path: readiness_artifacts/audit/
          if-no-files-found: warn
      - run: uv run python scripts/dev_stack.py stop
        if: always()
