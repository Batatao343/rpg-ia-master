name: audit-local
# Certified remotely on 2026-09-26 (run 36263717580, 3m27s).
# No cloud account, provider secrets or paid model is used by this job.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scope:
    # Workspace C6: mudança só de docs não sobe Supabase/browser (ver scripts/ci_docs_only.py).
    runs-on: ubuntu-24.04  # pin: ubuntu-latest migra de imagem sem aviso
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_docs_only.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  infra-browser:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04  # pin: ubuntu-latest migra de imagem sem aviso
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --extra browser --extra anthropic
      - run: uv run playwright install --with-deps chromium
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: uv run python scripts/dev_stack.py start
      - run: uv run python scripts/audit_local_gate.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: audit-local-results
          path: readiness_artifacts/audit/
          if-no-files-found: warn
      - run: uv run python scripts/dev_stack.py stop
        if: always()
