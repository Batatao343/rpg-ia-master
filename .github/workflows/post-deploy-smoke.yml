name: post-deploy-smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS deployment origin
        required: true
        type: string
      expected_git_sha:
        description: Expected deployed commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: post-deploy-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync
      - name: Run bounded read-only smoke
        env:
          PROD_BASE_URL: ${{ inputs.base_url }}
          EXPECTED_GIT_SHA: ${{ inputs.expected_git_sha }}
        run: >-
          uv run python scripts/post_deploy_smoke.py
          --output readiness_artifacts/post-deploy/smoke.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: post-deploy-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: readiness_artifacts/post-deploy/smoke.json
          if-no-files-found: error
