name: post-deploy-smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS deployment origin
        required: true
        type: string
      expected_git_sha:
        description: Expected deployed commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: post-deploy-smoke
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync
      - name: Run bounded read-only smoke
        env:
          PROD_BASE_URL: ${{ inputs.base_url }}
          EXPECTED_GIT_SHA: ${{ inputs.expected_git_sha }}
        run: >-
          uv run python scripts/post_deploy_smoke.py
          --output readiness_artifacts/post-deploy/smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: post-deploy-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: readiness_artifacts/post-deploy/smoke.json
          if-no-files-found: error
