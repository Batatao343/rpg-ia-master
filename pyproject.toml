[project]
name = "rpg-ia-master"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.13.1",
    "fastapi>=0.127.1",
    "google-genai>=1.53.0",
    "langchain>=1.1.2",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=3.2.0",
    "langgraph>=1.0.4",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
ollama = [
    "langchain-ollama>=0.3",
]
openai = [
    "langchain-openai>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Fase 11: contratos de LLM real ficam FORA da suíte offline default —
# rodar com: uv run pytest -m llm_contract -v -s (o -m da CLI sobrepõe)
addopts = "-q -m \"not llm_contract\""
markers = [
    "llm_contract: contrato contra provider LLM real (gasta quota; requer GOOGLE_API_KEY)",
]
