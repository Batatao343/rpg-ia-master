[project]
name = "rpg-ia-master"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0,<51",  # SPEC-194: RS256 service-account JWT (was transitive)
    "faiss-cpu>=1.13.1",
    "fastapi>=0.127.1",
    "httpx>=0.28,<1",
    "langchain-community>=0.4.1",
    "langchain-core>=1.0",
    "langchain-google-genai>=3.2.0",
    # SPEC-192: a Vercel instala só as deps core do uv.lock; hosted-supabase exige psycopg
    # e o primário DeepSeek/Groq usa langchain-openai.
    "langchain-openai>=0.3",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.0.4",
    "psycopg[binary,pool]>=3.2,<4",
    "pillow>=12.3.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
ollama = [
    "langchain-ollama>=0.3",
]
# Único provider não-OpenAI-compat da stack default (tier SMART).
anthropic = [
    "langchain-anthropic>=0.3",
]
portable = [
    "boto3>=1.40,<2",
]
browser = [
    "playwright>=1.58,<2",
]
observability = [
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9",
]
fuzz = [
    "schemathesis>=4.32,<5",
]

[tool.ruff]
target-version = "py313"
line-length = 100
# Dívida de lint anterior ao gate incremental (workspace #10): ignores por arquivo,
# gerados por scripts/dev/ruff_baseline.py. Arquivo novo recebe todas as regras.
extend = "ruff-baseline.toml"
extend-exclude = ["web", "docs", "saves*", "data/runtime", "data", "lore_nova", "faiss_*"]

[tool.ruff.format]
# (exclude de format aceita glob; ver também pyproject extend-exclude)
# Protegidos de eval: não reformatar (hashes travados).
exclude = ["evals/core/*.py", "evals/evaluators/*.py", "evals/__main__.py", "evals/datasets/**", "evals/experiments/**", "web/e2e/contracts/**", "specs/**", "handoffs/**"]

[tool.ruff.lint]
# Degrau 1: pyflakes (F), bugbear (B) e estrutura (E4/E7/E9). E501 fica fora;
# B905 (zip sem strict) entra depois com --fix. Degraus 2–3 (I, UP, ruff format)
# são commits mecânicos a fazer sem worktrees vivos — ver docs/guias/TESTES.md.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "C90", "SIM", "PERF", "C4", "PIE", "RET", "ERA", "BLE",
          "S324", "S602", "S604", "S605", "S105", "S106", "S107"]
ignore = ["E501", "B905"]
# SPEC-388 Etapa B: C90/SIM/PERF/C4/PIE/RET/ERA/BLE valem para código novo; o legado fica
# congelado em ruff-baseline.toml (só encolhe). `except Exception` novo: log + `# noqa: BLE001`
# com motivo, ou exceção específica.

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["F403", "F405", "F811", "C90", "PERF", "S"]  # teste: clareza > complexidade/perf (SPEC-388)
# SPEC-411 R4b: subconjunto S (hash/shell/segredo hardcoded) vale so para codigo de produto;
# ferramentas, evals, playtest e hooks ficam fora (lacuna consciente).
"scripts/**" = ["S"]
"evals/**" = ["S"]
"playtest/**" = ["S"]
".claude/**" = ["S"]
# Avaliadores congelados (evals/protected-paths.txt, hash travado): famílias da SPEC-388 não se
# aplicam; reescrever para o lint mudaria o avaliador. Lista exata (spec-372 incluída de antemão);
# avaliador protegido novo entra aqui — gate: tests/test_ruff_protected_exempt.py.
"evals/datasets/regression/**" = ["C90", "SIM", "PERF", "C4", "PIE", "RET", "ERA", "BLE"]
"scripts/fauna/eval.py" = ["C90", "SIM", "PERF", "C4", "PIE", "RET", "ERA", "BLE"]
"scripts/fauna/eval_tramas.py" = ["C90", "SIM", "PERF", "C4", "PIE", "RET", "ERA", "BLE"]
"scripts/bestiario/eval_geracao.py" = ["C90", "SIM", "PERF", "C4", "PIE", "RET", "ERA", "BLE"]
"services/creature_gen_eval.py" = ["C90", "SIM", "PERF", "C4", "PIE", "RET", "ERA", "BLE"]
"tests/test_spec360_eval.py" = ["C90", "SIM", "PERF", "C4", "PIE", "RET", "ERA", "BLE"]
"tests/test_spec361_eval.py" = ["C90", "SIM", "PERF", "C4", "PIE", "RET", "ERA", "BLE"]
"tests/test_spec370_eval.py" = ["C90", "SIM", "PERF", "C4", "PIE", "RET", "ERA", "BLE"]
"tests/test_spec372_eval.py" = ["C90", "SIM", "PERF", "C4", "PIE", "RET", "ERA", "BLE"]
"scripts/bestiario/arena.py" = ["C90", "SIM", "PERF", "C4", "PIE", "RET", "ERA", "BLE"]
"tests/test_spec373_artefatos.py" = ["C90", "SIM", "PERF", "C4", "PIE", "RET", "ERA", "BLE"]
# Arquivos protegidos de eval (evals/protected-paths.txt): hashes travados, não reescrever.
"evals/core/**" = ["I", "UP", "C90", "SIM", "PERF", "C4", "PIE", "RET", "ERA", "BLE"]
"evals/evaluators/**" = ["I", "UP", "C90", "SIM", "PERF", "C4", "PIE", "RET", "ERA", "BLE"]
"evals/__main__.py" = ["I", "UP", "C90", "SIM", "PERF", "C4", "PIE", "RET", "ERA", "BLE"]
# Experimentos congelados: _source() das funções entra no digest de estrutura (SPEC-217/238).
"evals/experiments/**" = ["I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Fase 11 / Fase 5: testes com LLM real ficam FORA da suíte offline default —
# rodar com: uv run pytest -m llm_contract -v -s   (contratos de shape)
#            uv run pytest -m llm_playtest -v -s    (campanhas curtas por perfil)
addopts = "-q -m \"not llm_contract and not llm_playtest and not api_fuzz\""
# pytest-timeout: nenhum teste pendura a suíte (workspace #5). Paralelo é opt-in:
# `pytest -n auto` (camada 2 / CI) — ver docs/guias/TESTES.md.
timeout = 300
markers = [
    "llm_contract: contrato contra provider LLM real (gasta quota; requer GOOGLE_API_KEY)",
    "api_fuzz: fuzz de API com Schemathesis in-process (job api-fuzz; requer --group fuzz)",
    "llm_playtest: campanha curta de playtest por perfil no LLM real (gasta quota; requer GROQ ou GOOGLE key)",
    "infra_local: integração opt-in com Postgres/Auth/Storage/pgvector locais",
    "security_local: testes opt-in de RLS, CSRF, ownership e secrets locais",
    "chaos_local: testes opt-in de kill/restart/timeouts na stack local",
    "browser_local: browser real opt-in contra servidor local",
]

[tool.vercel]
# SPEC-192: `main.py` exporta um objeto LangGraph chamado `app` — entrypoint explícito.
entrypoint = "vercel_app:app"

# SPEC-379 R1: cobertura real, semanal e sem gate (workflow coverage.yml). `source`
# explicito: "." listaria .tmp/, playtest_runs/, saves*/, project_index/ etc.
[tool.coverage.run]
branch = true
relative_files = true
source = [
    "agents", "services", "infrastructure", "workers", "playtest", "evals",
    "api", "character_creator", "combat_mechanics", "encounter_budget",
    "gamedata", "inventory", "llm_setup", "main", "mock_llm", "party", "persistence",
    "progression", "rag", "state", "vercel_app", "world_utils",
]

[tool.coverage.report]
skip_empty = true
precision = 1
