[project]
name = "rpg-ia-master"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0,<51",  # SPEC-194: RS256 service-account JWT (was transitive)
    "faiss-cpu>=1.13.1",
    "fastapi>=0.127.1",
    "httpx>=0.28,<1",
    "langchain-community>=0.4.1",
    "langchain-core>=1.0",
    "langchain-google-genai>=3.2.0",
    # SPEC-192: a Vercel instala só as deps core do uv.lock; hosted-supabase exige psycopg
    # e o primário DeepSeek/Groq usa langchain-openai.
    "langchain-openai>=0.3",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.0.4",
    "psycopg[binary,pool]>=3.2,<4",
    "pillow>=12.3.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
ollama = [
    "langchain-ollama>=0.3",
]
# Único provider não-OpenAI-compat da stack default (tier SMART).
anthropic = [
    "langchain-anthropic>=0.3",
]
portable = [
    "boto3>=1.40,<2",
]
browser = [
    "playwright>=1.58,<2",
]
observability = [
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Gate conservador inicial: erros de sintaxe, nomes indefinidos e fluxos inválidos.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Fase 11 / Fase 5: testes com LLM real ficam FORA da suíte offline default —
# rodar com: uv run pytest -m llm_contract -v -s   (contratos de shape)
#            uv run pytest -m llm_playtest -v -s    (campanhas curtas por perfil)
addopts = "-q -m \"not llm_contract and not llm_playtest\""
markers = [
    "llm_contract: contrato contra provider LLM real (gasta quota; requer GOOGLE_API_KEY)",
    "llm_playtest: campanha curta de playtest por perfil no LLM real (gasta quota; requer GROQ ou GOOGLE key)",
    "infra_local: integração opt-in com Postgres/Auth/Storage/pgvector locais",
    "security_local: testes opt-in de RLS, CSRF, ownership e secrets locais",
    "chaos_local: testes opt-in de kill/restart/timeouts na stack local",
    "browser_local: browser real opt-in contra servidor local",
]

[tool.vercel]
# SPEC-192: `main.py` exporta um objeto LangGraph chamado `app` — entrypoint explícito.
entrypoint = "vercel_app:app"
