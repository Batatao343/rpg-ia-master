apply plugin: 'com.android.application'

android {
    namespace = "dev.rpgia.valoria.staging"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "dev.rpgia.valoria.staging"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // SPEC-194: fake Store only in debug builds, only when -PplayBillingFake=true
            buildConfigField "boolean", "PLAY_BILLING_FAKE", (project.findProperty('playBillingFake') == 'true' ? 'true' : 'false')
        }
        release {
            buildConfigField "boolean", "PLAY_BILLING_FAKE", "false"

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// SPEC-194: release artifacts must never ship cleartext. Fails assemble/bundleRelease when the synced
// capacitor.config.json points at http:// or the merged release manifest enables usesCleartextTraffic.
tasks.register('checkReleaseCleartext') {
    def cfg = file('src/main/assets/capacitor.config.json')
    def merged = layout.buildDirectory.file('intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml')
    doLast {
        if (cfg.exists()) {
            def url = new groovy.json.JsonSlurper().parse(cfg)?.server?.url
            if (url != null && url.toString().toLowerCase().startsWith('http://'))
                throw new GradleException("Release build refused: capacitor.config.json server.url is cleartext (${url}). Re-run 'npx cap sync android' without CAP_BUILD=debug and with an https CAP_SERVER_URL.")
        }
        def m = merged.get().asFile
        if (m.exists() && m.text =~ /usesCleartextTraffic\s*=\s*"true"/)
            throw new GradleException('Release build refused: merged manifest has usesCleartextTraffic=true')
    }
}
afterEvaluate {
    tasks.named('checkReleaseCleartext').configure { it.dependsOn('processReleaseManifest') }
    ['assembleRelease', 'bundleRelease'].each { n -> tasks.matching { it.name == n }.configureEach { dependsOn 'checkReleaseCleartext' } }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // SPEC-194: exact pin (latest stable per developer.android.com release notes: 9.1.0, 2026-06-18)
    implementation "com.android.billingclient:billing:9.1.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
